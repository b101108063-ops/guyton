baseURL = "/guyton/"
locale = "en-us"
theme = "PaperMod"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      commentHanlder = false
  [markup.goldmark.extensions]
    headingIDs = false
  [markup.headingCrossReferences]
    enable = false
  ignoreLogs = ["warning-goldmark-raw-html"]

[frontmatter]
date = ["date", "publishDate", "lastmod"]

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首頁"
    url = "/"
    weight = 5

  [[menu.main]]
    identifier = "guyton"
    name = "Guyton 選單"
    url = "guyton/"
    weight = 10

  [[menu.main]]
    identifier = "search"
    name = "搜尋"
    url = "guyton/search/"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "index"
  isPlainText = true
