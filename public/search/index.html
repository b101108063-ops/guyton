                     data-content="IONS ON HEART FUNCTION In our discussion of membrane potentials in Chapter 5, we pointed out that potassium ions have a marked effect on membrane potentials.
In Chapter 6 we noted that calcium ions play an especially important role in activating the muscle contractile process.
Therefore, it is not surprising that the concentrations of each of these two ions in the extracellular fluids have important effects on cardiac pumping.
EFFECT OF POTASSIUM IONS Excess potassium in the extracellular fluids causes the heart to become dilated and flaccid and also slows the heart rate.
Large quantities of potassium also can block conduction of the cardiac impulse from the atria to the ventricles through the A-V bundle.
Elevation of potassium concentration to only 8 to 12 mEq/L—two to three times the normal value—can cause severe weakness of the heart, abnormal rhythm, and death.
These effects result partially from the fact that a high potassium concentration in the extracellular fluids decreases the resting membrane potential in the cardiac muscle fibers, as explained in Chapter 5.
That is, a high extracellular fluid potassium concentration partially depolarizes the cell membrane, causing the membrane potential to be less negative.
As the membrane potential decreases, the intensity of the action potential also decreases, which makes contraction of the heart progressively weaker.
EFFECT OF CALCIUM IONS Excess calcium ions cause effects almost exactly opposite to those of potassium ions, causing the heart to move toward spastic contraction.
This effect is caused by a direct effect of calcium ions to initiate the cardiac contractile process, as explained earlier in this chapter.
Conversely, deficiency of calcium ions causes cardiac weakness, similar to the effect of high potassium.
Fortunately, calcium ion levels in the blood normally are regulated within a very narrow range.
Therefore, cardiac effects of abnormal calcium concentrations are seldom of clinical concern.
EFFECT OF TEMPERATURE ON HEART FUNCTION Increased body temperature, such as that which occurs during fever, greatly increases the heart rate, sometimes to double the normal rate.
Decreased temperature greatly decreases the heart rate, which may fall to as low as a few beats per minute when a person is near death from hypothermia in the body temperature range of 60° to 70°F (15.5°–21°C).
These effects presumably result from the fact that heat increases the permeability of the cardiac muscle membrane to ions that control heart rate, resulting in acceleration of the self-excitation process.
Contractile strength of the heart often is enhanced temporarily by a moderate increase in temperature, such as that which occurs during body exercise.
But prolonged temperature elevation exhausts the metabolic systems of the heart and eventually causes weakness.
Therefore, optimal heart function depends greatly on proper control of body temperature by the control mechanisms explained in Chapter 74.
CARDIAC OUTPUT AND SYMPATHETIC/PARASYMPATHETIC STIMULATION Different degrees of sympathetic or parasympathetic stimulation affect the cardiac output curve.
Maximum sympathetic stimulation produces the highest cardiac output for any given right atrial pressure.
Normal sympathetic stimulation produces intermediate values.
Zero sympathetic stimulation (or parasympathetic stimulation) produces the lowest cardiac output curve.
INCREASING THE ARTERIAL PRESSURE LOAD (UP TO A LIMIT) DOES NOT DECREASE CARDIAC OUTPUT Note in Figure 9-16 that increasing the arterial pressure in the aorta does not decrease cardiac output until the mean arterial pressure rises above about 160 mm Hg.
In other words, during normal heart function at normal systolic arterial pressures (80–140 mm Hg), cardiac output is determined almost entirely by the ease of blood flow through the body’s tissues, which in turn controls venous return of blood to the heart.
This mechanism is the principal subject of Chapter 20.
"></div><div data-title="Cardiac Output, Venous Return, and Their Regulation" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch20_cardiac-output-venous-return-and-their-regulation/"
                     data-content="CARDIAC OUTPUT AND VENOUS RETURN Cardiac output is the quantity of blood pumped into the aorta each minute by the heart. This is also the quantity of blood that flows through the circulation. Because cardiac output is the sum of blood flow to all tissues of the body, it is one of the most important factors in cardiovascular function.
Venous return is the quantity of blood flowing from the veins into the right atrium each minute. Venous return and cardiac output must equal each other, except for a few heartbeats when blood is temporarily stored in or removed from the heart and lungs.
NORMAL VALUES FOR CARDIAC OUTPUT AT REST AND DURING ACTIVITY Cardiac output varies widely with the level of body activity. The following factors directly affect cardiac output:
The basic level of body metabolism Whether the person is exercising The person’s age The size of the body Normal Cardiac Output Values For young healthy men, resting cardiac output averages about 5.6 L/min. For women, this value is about 4.9 L/min.
With increasing age, body activity and mass of some tissues (e.g., skeletal muscle) diminish. Therefore, the average cardiac output for the resting adult is often stated to be about 5 L/min.
However, cardiac output varies considerably among healthy individuals depending on muscle mass, adiposity, physical activity, and other factors that influence metabolic rate and nutritional needs of the tissues.
Cardiac Index Cardiac output increases approximately in proportion to the surface area of the body. Therefore, cardiac output is frequently stated in terms of the cardiac index — cardiac output per square meter of body surface area.
The average person who weighs 70 kilograms has a body surface area of about 1.7 square meters. Therefore, the normal average cardiac index for adults is about 3 L/min/m².
Effect of Age on Cardiac Output Figure 20-1 shows the cardiac index at different ages:
Age Cardiac Index 10 years &gt;4 L/min/m² 80 years ~2.4 L/min/m² The cardiac index rises rapidly to a level greater than 4 L/min/m² at age 10 years, then declines to about 2.4 L/min/m² at age 80 years.
The cardiac output is regulated throughout life almost directly in proportion to overall metabolic activity. Therefore, the declining cardiac index is indicative of declining activity and/or declining muscle mass with age.
CONTROL OF CARDIAC OUTPUT BY VENOUS RETURN — FRANK-STARLING MECHANISM OF THE HEART Although heart function is obviously crucial in determining cardiac output, the various factors of the peripheral circulation that affect flow of blood into the heart from the veins — called venous return — are normally the primary controllers of cardiac output.
Frank-Starling Law of the Heart The heart has a built-in mechanism that normally allows it to pump automatically the amount of blood that flows from the veins into the right atrium. This mechanism — called the Frank-Starling law of the heart (discussed in Chapter 9) — states:
When increased quantities of blood flow into the heart, the increased volume of blood stretches the walls of the heart chambers. As a result of the stretch, the cardiac muscle contracts with increased force. This action ejects the extra blood that has entered from the systemic circulation.
Therefore, the blood that flows into the heart is automatically pumped without delay into the aorta and flows again through the circulation.
Bainbridge Reflex and Heart Rate Stretching the heart also causes an increased heart rate (discussed in Chapters 10 and 18):
Stretch of the sinus node in the wall of the right atrium has a direct effect on the rhythmicity of the node to increase the heart rate as much as 10% to 15%. The stretched right atrium initiates a nervous reflex called the Bainbridge reflex — passing first to the vasomotor center of the brain, then back to the heart by way of the sympathetic nerves and vagi — which also increases the heart rate. Under most normal unstressed conditions, cardiac output is controlled mainly by peripheral factors that determine venous return. However, if the returning blood becomes more than the heart can pump, then the heart becomes the limiting factor.
CARDIAC OUTPUT IS THE SUM OF ALL TISSUE BLOOD FLOWS The venous return to the heart is the sum of all the local blood flow through all the individual tissue segments of the peripheral circulation (Figure 20-2). Therefore, cardiac output regulation is normally the sum of all the local blood flow regulations.
Local Blood Flow Regulation The mechanisms of local blood flow regulation were discussed in Chapter 17. In most tissues, blood flow increases mainly in proportion to each tissue’s metabolism.
For example, local blood flow almost always increases when tissue oxygen consumption increases. Figure 20-3 demonstrates this for different levels of exercise — at each increasing level of work output during exercise, oxygen consumption and cardiac output increase in parallel to each other.
Cardiac Output Varies Inversely With Total Peripheral Resistance When arterial pressure is unchanged, the long-term cardiac output level varies reciprocally with changes in total peripheral vascular resistance:
When total peripheral resistance is normal (100%), cardiac output is also normal. When total peripheral resistance increases above normal, cardiac output falls. When total peripheral resistance decreases, cardiac output increases. This follows from Ohm’s law (Chapter 14): Cardiac output = Pressure / Resistance
DURING EXERCISE Strenuous exercise is one of the most stressful conditions the normal circulatory system faces. Such a large mass of skeletal muscle requires large amounts of blood flow.
The cardiac output often must increase to:
Four to five times normal in the nonathlete Six to seven times normal in the well-trained athlete SKELETAL MUSCLE BLOOD FLOW RATE During rest, skeletal muscle blood flow averages 3 to 4 ml/min/100 g of muscle.
During extreme exercise in the well-conditioned athlete, this blood flow can increase 25- to 50-fold, rising to 100 to 200 ml/min/100 g of muscle. Peak blood flows as high as 400 ml/min/100 g have been reported for thigh muscles of endurance-trained athletes.
Blood Flow During Muscle Contractions Figure 21-1 shows blood flow changes in a calf muscle during strong rhythmic exercise:
Flow increases and decreases with each muscle contraction. At the end of contractions, blood flow remains high for a few seconds, then returns to normal during the next few minutes. The cause of lower flow during the muscle contraction phase is compression of the blood vessels by the contracted muscle. During strong tetanic contraction, blood flow can be almost stopped — but this also causes rapid weakening of the contraction.
Increased Blood Flow in Muscle Capillaries During Exercise During rest, some muscle capillaries have little or no flowing blood. During strenuous exercise, all capillaries open.
This opening of dormant capillaries:
Diminishes the distance that oxygen and nutrients must diffuse Can contribute a twofold to threefold increased capillary surface area for diffusion CONTROL OF SKELETAL MUSCLE BLOOD FLOW Decreased Oxygen in Muscle Enhances Flow The large increase in muscle blood flow during skeletal muscle activity is caused mainly by chemicals released locally that act on the muscle arterioles to cause dilation.
One of the most important chemical effects is reduction of oxygen level in muscle tissues. When muscles are active, they use oxygen rapidly, decreasing oxygen concentration in tissue fluids. This causes local arteriolar vasodilation.
Adenosine may be an important vasodilator substance. However, experiments show that even large amounts of adenosine infused directly into a muscle artery cannot increase blood flow to the same extent as during intense exercise. It also cannot sustain vasodilation in skeletal muscle for more than about 2 hours.
Other Vasodilator Factors Even after muscle blood vessels become insensitive to adenosine, other vasodilator factors continue to maintain increased capillary blood flow:
Potassium ions Adenosine triphosphate (ATP) Lactic acid Carbon dioxide Nervous Control of Muscle Blood Flow In addition to local tissue vasodilator mechanisms, skeletal muscles have:
Sympathetic vasoconstrictor nerves (secrete norepinephrine) Sympathetic vasodilator nerves (in some species) When maximally activated, sympathetic vasoconstriction can decrease blood flow through resting muscles to as little as one-half to one-third normal. This is physiologically important in attenuating decreases of arterial pressure in circulatory shock and during other periods of stress.
Adrenal Medulla Contribution The adrenal medullae secrete increased amounts of:
Norepinephrine — acts on muscle vessels to cause vasoconstriction Epinephrine — often has a slight vasodilator effect (excites more beta-adrenergic receptors, which are vasodilator receptors) CIRCULATORY READJUSTMENTS DURING EXERCISE Three major effects occur during exercise essential for the circulatory system to supply blood flow to the muscles:
Sympathetic nervous system activation in many tissues Increase in arterial pressure Increase in cardiac output Effects of Sympathetic Activation At the onset of exercise, signals are transmitted from the brain:
To the muscles to cause muscle contraction Into the vasomotor center to initiate sympathetic discharge Simultaneously, parasympathetic signals to the heart are attenuated.
Three major circulatory effects result:
Heart stimulation — Heart rate and pumping strength increase due to sympathetic drive plus release from parasympathetic inhibition.
Peripheral vasoconstriction/vasodilation — Many arterioles are strongly contracted, except those in active muscles (which are vasodilated by local mechanisms). This “lends” blood supply to the muscles. Coronary and cerebral systems are spared this vasoconstrictor effect.
Venous contraction — Muscle walls of veins and other capacitative areas contract powerfully. This greatly increases the mean systemic filling pressure — one of the most important factors in promoting increased venous return and cardiac output.
Sympathetic Stimulation Increases Arterial Pressure An important effect of increased sympathetic stimulation in exercise is to increase arterial pressure. This results from:
Vasoconstriction of arterioles and small arteries in most tissues (except brain and active muscles) Increased pumping activity by the heart Great increase in mean systemic filling pressure caused mainly by venous contraction These effects together increase arterial pressure during exercise by as little as 20 mm Hg or as much as 80 mm Hg, depending on conditions.
Figure 20-1. Cardiac index at different ages.
Figure 20-2. Cardiac output equals venous return and is the sum of tissue and organ blood flows.
Figure 20-3. Effect of increasing levels of exercise on cardiac output and oxygen consumption.

"></div><div data-title="Cerebellum and Basal Ganglia Contributions to Overall Motor Control" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch57_cerebellum-and-basal-ganglia-contributions-to-overall-motor-control/"
                     data-content="—## HINDBRAIN LEVEL The hindbrain provides two major functions for general motor control of the body: (1) maintenance of axial tone of the body for the purpose of standing and (2) continuous modification of the degrees of tone in the different muscles in response to information from the vestibular apparatuses for the purpose of maintaining body equilibrium. ## MOTOR CORTEX LEVEL The motor cortex system provides most of the activating motor signals to the spinal cord. It functions partly by issuing sequential and parallel commands that set into motion various cord patterns of motor action. It can also change the intensities of the different patterns or modify their timing or other characteristics. When needed, the corticospinal system can bypass the cord patterns, replacing them with higher level patterns from the brain stem or cerebral cortex. The cortical patterns are usually complex; also, they can be “learned,” whereas cord patterns are mainly determined by heredity and are said to be “hard wired.” Associated Functions of the Cerebellum. The cerebellum functions with all levels of muscle control. It functions with the spinal cord especially to enhance the stretch reflex, so when a contracting muscle encounters an unexpectedly heavy load, a long stretch reflex signal transmitted all the way through the cerebellum and back again to the cord strongly enhances the load-resisting effect of the basic stretch reflex. At the brain stem level, the cerebellum functions to make the postural movements of the body, especially the rapid movements required by the equilibrium system, smooth and continuous and without abnormal oscillations. At the cerebral cortex level, the cerebellum operates in association with the cortex to provide many accessory motor functions, especially to provide extra motor force for turning on muscle contraction rapidly at the start of a movement. Near the end of each movement, the cerebellum turns on antagonist muscles at exactly the right time and with proper force to stop the movement at the intended point. Furthermore, almost all aspects of this turnon/turnoff patterning by the cerebellum can be learned with experience. The cerebellum functions with the cerebral cortex at still another level of motor control; it helps to program in advance muscle contractions that are required for smooth progression from a present rapid movement in one direction to the next rapid movement in another direction, with all this occurring in a fraction of a second. The neural circuit for this passes from the cerebral cortex to the large lateral zones of the cerebellar hemispheres and then back to the cerebral cortex. The cerebellum functions mainly when rapid muscle movements are required. Without the cerebellum, slow and calculated movements can still occur, but it is difficult for the corticospinal system to achieve rapid and changing intended movements to execute a particular goal or especially to progress smoothly from one rapid movement to the next. Associated Functions of the Basal Ganglia. The basal ganglia are essential to motor control in ways entirely different from those of the cerebellum. Their most important functions are (1) to help the cortex execute subconscious but learned patterns of movement and (2) to help plan multiple parallel and sequential patterns of movement that the mind puts together to accomplish a purposeful task. The types of motor patterns that require the basal ganglia include those for writing all the different letters of the alphabet, for throwing a ball, and for typing. Also, the basal ganglia are required to modify these patterns for writing small or writing very large, thus controlling dimensions of the patterns. At a still higher level of control is another combined cerebral and basal ganglia circuit, beginning in the thinking processes of the cerebrum to provide overall sequential steps of action for responding to each new situation, such as planning one’s immediate motor response to an assailant or one’s sequential response to an unexpectedly fond embrace. ## WHAT DRIVES US TO ACTION? What is it that arouses us from inactivity and sets into play our trains of movement? We are beginning to learn about the motivational systems of the brain. Basically, the brain has an older core located beneath, anterior, and lateral to the thalamus—including the hypothalamus, amygdala, hippocampus, septal region anterior to the hypothalamus and thalamus, and even old regions of the thalamus and cerebral cortex. All of these function together to initiate most motor and other functional activities of the brain. These areas are collectively called the limbic system of the brain. We discuss this system in more detail in Chapter 59. ## CEREBRAL CORTEX The functional part of the cerebral cortex is a thin layer of neurons covering the surface of all the convolutions of the cerebrum. This layer is only 2 to 5 millimeters thick, with a total area of about 25% of a square meter. The total cerebral cortex has been estimated to contain over 80 billion neurons. &gt; Figure 58-1 shows the typical histological structure of the neuronal surface of the cerebral cortex, with its successive layers of different types of neurons. Most of the neurons are of three types: (1) granular (also called stellate); (2) fusiform; and (3) pyramidal, the latter named for their characteristic pyramidal shape. The granular neurons generally have short axons and, therefore, function mainly as interneurons that transmit neural signals only short distances in the cortex. Some are excitatory, releasing mainly the excitatory neurotransmitter glutamate, whereas others are inhibitory and release mainly the inhibitory neurotransmitter gammaaminobutyric acid (GABA). The sensory areas of the cortex, as well as the association areas between sensory and motor areas, have large concentrations of these granule cells, suggesting a high degree of intracortical processing of incoming sensory signals within the sensory areas and association areas. The pyramidal and fusiform cells give rise to almost all the output fibers from the cortex. The pyramidal cells, which are larger and more numerous than the fusiform cells, are the source of the long, large nerve fibers that go all the way to the spinal cord. The pyramidal cells also give rise to most of the large subcortical association fiber bundles that pass from one major part of the brain to another. To the right in Figure 58-1 is shown the typical organization of nerve fibers within the different layers of the cerebral cortex. Note particularly the large number of horizontal fibers that extend between adjacent areas of the cortex, but note also the vertical fibers that extend to and from the cortex to lower areas of the brain and some all the way to the spinal cord or to distant regions of the cerebral cortex through long association bundles. The functions of the specific layers of the cerebral cortex are discussed in Chapters 48 and 52. By way of review, Cerebral Cortex, Intellectual Functions of the Brain, Learning, and Memory I VIb VIa V IV III II &gt; Figure 58-1. Structure of the cerebral cortex, showing the following layers: I, molecular layer; II, external granular layer; III, layer of pyramidal cells; IV, internal granular layer; V, large pyramidal cell layer; and VI, layer of fusiform or polymorphic cells. (Modified from Ranson SW, Clark SL: Anatomy of the Nervous System. Philadelphia: WB Saunders, 1959.) UNIT XI The Nervous System: C. Motor and Integrative Neurophysiology let us recall that most incoming specific sensory signals from the body terminate in cortical layer IV. Most of the output signals leave the cortex through neurons located in layers V and VI, the very large fibers to the brain stem and cord arise generally in layer V, and the tremendous numbers of fibers to the thalamus arise in layer VI. Layers I, II, and III perform most of the intracortical association functions, with especially large numbers of neurons in layers II and III making short horizontal connections with adjacent cortical areas. ## RELATIONS OF THE CEREBRAL CORTEX TO THE THALAMUS AND OTHER LOWER ## CENTERS All areas of the cerebral cortex have extensive to-andfro efferent and afferent connections with deeper structures of the brain. It is important to emphasize the relation between the cerebral cortex and the thalamus. When the thalamus is damaged along with the cortex, the loss of cerebral function is far greater than when the cortex alone is damaged, because thalamic excitation of the cortex is necessary for almost all cortical activity. Figure 58-2 shows the areas of the cerebral cortex that connect with specific parts of the thalamus. These connections act in two directions, both from the thalamus to the cortex and then from the cortex back to essentially the same area of the thalamus. Furthermore, when the thalamic connections are cut, the functions of the corresponding cortical area become almost entirely lost. Therefore, the cortex operates in close association with the thalamus and can almost be considered both anatomically and functionally a unit with the thalamus; for this reason, the thalamus and the cortex together are sometimes called the thalamocortical system. Almost all pathways from the sensory receptors and sensory organs to the cortex pass through the thalamus, with the principal exception of some sensory pathways of olfaction. FUNCTIONS OF SPECIFIC CORTICAL ## AREAS &gt; Figure 58-3 is a map of some of the functions of different cerebral cortical areas as determined from electrical stimulation of the cortex in awake patients or during neurological examination of patients after portions of their cortex had been removed. The electrically stimulated patients told their thoughts evoked by the stimulation, and sometimes they experienced movements. Occasionally they spontaneously emitted a sound or even a word or gave some other evidence of the stimulation. Putting large amounts of information together from many different sources gives a more general map, as shown in Figure 58-4. This figure shows the major primary and secondary premotor and supplementary motor areas of the cortex, as well as the major primary and secondary sensory areas for somatic sensation, vision, and hearing, all of which are discussed in earlier chapters. The primary motor areas have direct connections with specific muscles for causing discrete muscle movements. The primary sensory areas detect specific sensations—visual, auditory, or somatic— transmitted to the brain from peripheral sensory organs. The secondary areas make sense out of the signals in the primary areas. For example, the supplementary and premotor areas function along with the primary motor cortex and basal ganglia to provide “patterns” of motor activity. On the sensory side, the secondary sensory areas, located within a few centimeters of the primary areas, begin to analyze the meanings of the specific sensory signals, such as the following: (1) interpretation of the shape or texture N. dorsalis medialis Med. geniculate body indeterminate Pulvinar N. lateralis posterior Lat. geniculate body N. ventralis posterolateralis N. ventralis lateralis &gt; Figure 58-2. Areas of the cerebral cortex that connect with specific portions of the thalamus. N., Nerve. Contralateral vision Bilateral vision Elaboration of thought Supplementary motor synergies Hand skills Speech Speech Eye turning Sens. II Hearing Voluntary motor Somatosensory Speech Memory patterns &gt; Figure 58-3. Functional areas of the human cerebral cortex as determined by electrical stimulation of the cortex during neurosurgical operations and by neurological examinations of patients with destroyed cortical regions. (Modified from Penfield W, Rasmussen T: The Cerebral Cortex of Man: A Clinical Study of Localization of Function. New York: Hafner, 1968.)

                     data-content="—## BRAIN METABOLISM Like other tissues, the brain requires O2 and food nutrients to supply its metabolic needs. However, brain metabolism features special attributes that require mention. Total Brain Metabolic Rate and Metabolic Rate of Neurons. Under resting but awake conditions, brain metabolism accounts for about 15% of the total metabolism in the body, even though brain mass is only 2% of the total body mass. Therefore, under resting conditions, brain metabolism per unit mass of tissue is about 7.5 times the average metabolism in non-nervous system tissues. Most of this brain metabolism occurs in the neurons, not in the glial supportive tissues. The major need for metabolism in the neurons is to pump ions through their membranes, mainly to transport sodium and calcium ions to the outside of the neuronal membrane and potassium ions to the interior. Each time a neuron conducts an action potential, these ions move through the membranes, increasing the need for additional membrane transport to restore proper ionic concentration differences across the neuron membranes. Therefore, during high levels of brain activity, neuronal metabolism can increase as much as 100% to 150%. Special Requirement of the Brain for Oxygen—Lack of Significant Anaerobic Metabolism. Most tissues of the body can live without O2 for several minutes and some for as long as 30 minutes. During this time, the tissue cells obtain their energy through processes of anaerobic metabolism, which means release of energy by partially breaking down glucose and glycogen but without combining these with O2. This process delivers energy but at the expense of consuming tremendous amounts of glucose and glycogen. However, it does keep the tissues alive. The brain is not capable of much anaerobic metabolism after sudden reduction in O2 delivery. One of the reasons for this is the high metabolic rate of the neurons, so most neuronal activity depends on second-by-second delivery of O2 from the blood. Putting these factors together, one can understand why sudden cessation of blood flow to the brain or sudden total lack of O2 in the blood can cause unconsciousness within 5 to 10 seconds. Under Normal Conditions, Most Brain Energy Is Supplied by Glucose. Under normal conditions, almost all the energy used by the brain cells is supplied by glucose derived from the blood. As is true for O2, most of this glucose is derived minute by minute and second by second from the capillary blood, with a total of only about a 2minute supply of glucose normally stored as glycogen in the neurons at any given time. A special feature of glucose delivery to neurons is that its transport into the neurons through the cell membrane is not dependent on insulin, even though insulin is required for glucose transport into most other body cells. Therefore, in patients who have serious diabetes with essentially zero secretion of insulin, glucose still diffuses readily into the neurons, which is most fortunate in preventing loss of mental function in persons with diabetes. Yet when a diabetic patient is overtreated with insulin, the blood glucose concentration can fall to an extremely low level because the excess insulin causes almost all the glucose in the blood to be transported rapidly into the vast numbers of insulin-sensitive nonneural cells throughout the body, especially into muscle and liver cells. When this happens, not enough glucose is left in the blood to supply the neurons properly, and mental function becomes seriously deranged, leading sometimes to coma and even more often to mental imbalances and psychotic disturbances—all caused by overtreatment with insulin. Bibliography Ben Haim L, Rowitch DH: Functional diversity of astrocytes in neural circuit regulation. Nat Rev Neurosci 18:31, 2017. Butterfield DA, Halliwell B: Oxidative stress, dysfunctional glucose metabolism and Alzheimer disease. Nat Rev Neurosci 20:148, 2019. Chesler M: Regulation and modulation of pH in the brain. Physiol Rev 83:1183, 2003. Coucha M, Abdelsaid M, Ward R, et al: Impact of metabolic diseases on cerebral circulation: Structural and functional consequences. Compr Physiol 8:773, 2018. Damkier HH, Brown PD, Praetorius J: Cerebrospinal fluid secretion by the choroid plexus. Physiol Rev 93:1847, 2013. Harder DR, Rarick KR, Gebremedhin D, Cohen SS: Regulation of cerebral blood flow: response to cytochrome P450 lipid metabolites. Compr Physiol 8:801, 2018. Iadecola C: The neurovascular unit coming of age: a journey through neurovascular coupling in health and disease. Neuron 96:17, 2017. Iadecola C, Duering M, Hachinski V et al: Vascular cognitive impairment and dementia: JACC Scientific Expert Panel. J Am Coll Cardiol 73:3326, 2019. Kisler K, Nelson AR, Montagne A, Zlokovic BV: Cerebral blood flow regulation and neurovascular dysfunction in Alzheimer disease. Nat Rev Neurosci 18:419, 2017. Lun MP, Monuki ES, Lehtinen MK: Development and functions of the choroid plexus-cerebrospinal fluid system. Nat Rev Neurosci 16:445, 2015 Mattson MP, Moehl K, Ghena N, et al: Intermittent metabolic switching, neuroplasticity and brain health. Nat Rev Neurosci 19:63, 2018. Mestre H, Kostrikov S, Mehta RI, Nedergaard M: Perivascular spaces, glymphatic dysfunction, and small vessel disease. Clin Sci (Lond) 131:2257, 2017. Sweeney MD, Kisler K, Montagne A et al: The role of brain vasculature in neurodegenerative disorders. Nat Neurosci 21:1318, 2018. Sweeney MD, Zhao Z, Montagne A, et al: Blood-brain barrier: from physiology to disease and back. Physiol Rev 99:21, 2019. Tymko MM, Ainslie PN, Smith KJ: Evaluating the methods used for measuring cerebral blood flow at rest and during exercise in humans. Eur J Appl Physiol 118:1527, 2018. Verkhratsky A, Nedergaard M: Physiology of astroglia. Physiol Rev 98:239, 2018. Wardlaw JM, Smith C, Dichgans M: Small vessel disease: mechanisms and clinical implications. Lancet Neurol 18:684, 2019. The alimentary tract provides the body with a continual supply of water, electrolytes, vitamins, and nutrients, which requires the following: (1) movement of food through the alimentary tract; (2) secretion of digestive juices and digestion of the food; (3) absorption of water, various electrolytes, vitamins, and digestive products; (4) circulation of blood through the gastrointestinal organs to carry away the absorbed substances; and (5) control of all these functions by local, nervous, and hormonal systems. Figure 63-1 shows the entire alimentary tract. Each part is adapted to its specific functions— some parts to simple passage of food, such as the esophagus; others to temporary storage of food, such as the stomach; and others to digestion and absorption, such as the small intestine. In this chapter we discuss the basic principles of function in the entire alimentary tract, and in subsequent chapters the specific functions of different segments of the tract will be addressed. GENERAL PRINCIPLES OF GASTROINTESTINAL MOTILITY Physiologic Anatomy of the Gastrointestinal Wall &gt; Figure 63-2 shows a typical cross section of the intestinal wall, including the following layers from the outer surface inward: (1) the serosa, (2) a longitudinal smooth muscle layer, (3) a circular smooth muscle layer, (4) the submucosa, and (5) the mucosa. In addition, sparse bundles of smooth muscle fibers, the mucosal muscle, lie in the deeper layers of the mucosa. The motor functions of the gut are performed by the different layers of smooth muscle. The general characteristics of smooth muscle and its function are discussed in Chapter 8, which should be reviewed as a background for the following sections of this chapter. Gastrointestinal Smooth Muscle Functions as a Syncytium. The individual smooth muscle fibers in the gastrointestinal tract are 200 to 500 micrometers in length and 2 to 10 micrometers in diameter, and they are arranged in bundles of as many as 1000 parallel fibers. In the longitudinal muscle layer, the bundles extend longitudinally down the intestinal tract; in the circular muscle layer, they extend around the gut. Within each bundle, the muscle fibers are electrically connected with one another through large numbers of gap junctions that allow low-resistance movement of ions from one muscle cell to the next. Therefore, electrical signals that initiate muscle contractions can travel readily from one fiber to the next within each bundle but more rapidly along the length of the bundle than sideways. Each bundle of smooth muscle fibers is partly separated from the next by loose connective tissue; however, the muscle bundles fuse with one another at many points, so in reality each muscle layer represents a branching latticework of smooth muscle bundles. Therefore, each muscle layer functions as a syncytium; that is, when an action potential is elicited anywhere within the muscle mass, it generally travels in all directions in the muscle. The distance that it travels depends on the excitability of the muscle; sometimes it stops after only a few millimeters, and at other times it travels many centimeters or even the entire length and breadth of the intestinal tract. Also, because a few connections exist between the longitudinal and circular muscle layers, excitation of one of these layers often excites the other as well. Electrical Activity of Gastrointestinal Smooth Muscle The smooth muscle of the gastrointestinal tract is excited by almost continual slow, intrinsic electrical activity along the membranes of the muscle fibers. This activity has two basic types of electrical waves: (1) slow waves and (2) spikes, both of which are shown in Figure 63-3. In addition, the voltage of the resting membrane potential of the gastrointestinal smooth muscle can change to different levels, which can also have important effects in controlling motor activity of the gastrointestinal tract. “Slow Waves” Caused by Undulating Changes in Resting Membrane Potential. Most gastrointestinal contractions occur rhythmically, and this rhythm is determined mainly by the frequency of so-called “slow General Principles of Gastrointestinal Function—Motility, Nervous Control, and Blood Circulation UNIT XII Gastrointestinal Physiology waves” of smooth muscle membrane potential. These waves, shown in Figure 63-3, are not action potentials. Instead, they are slow, undulating changes in the resting membrane potential. Their intensity usually varies between 5 and 15 millivolts, and their frequency ranges in different parts of the human gastrointestinal tract from 3 to 12/min—about 3 in the body of the stomach, as much as 12 in the duodenum, and about 8 or 9 in the terminal ileum. Therefore, the rhythm of contraction of the body of the stomach, the duodenum, and the ileum is usually about 3/min, about 12/min, and 8 to 9/ min, respectively. The precise cause of the slow waves is not completely understood, although they appear to be caused by complex interactions among the smooth muscle cells and specialized cells, called the interstitial cells of Cajal, which are believed to act as electrical pacemakers for smooth muscle cells. These interstitial cells form a network with each other and are interposed between the smooth muscle layers, with synaptic-like contacts to smooth muscle cells. The interstitial cells of Cajal undergo cyclic changes in membrane potential due to unique ion channels that periodically open and produce inward (pacemaker) currents that may generate slow wave activity. The slow waves usually do not by themselves cause muscle contraction in most parts of the gastrointestinal tract, except perhaps in the stomach. Instead, they mainly excite the appearance of intermittent spike potentials, and the spike potentials in turn actually excite the muscle contraction. Spike Potentials. The spike potentials are true action potentials. They occur automatically when the resting membrane potential of the gastrointestinal smooth muscle becomes more positive than about −40 millivolts (the normal resting membrane potential in the smooth muscle fibers of the gut is between −50 and −60 millivolts). Note in Figure 63-3 that each time the peaks of the slow waves temporarily become more positive than −40 millivolts, spike potentials appear on these peaks. The higher the slow wave potential rises, the greater the frequency of the spike potentials, usually ranging between 1 and 10 spikes per second. The spike potentials last 10 to 40 times as long in gastrointestinal muscle as the action potentials in large nerve fibers, with each gastrointestinal spike lasting as long as 10 to 20 milliseconds. Another important difference between the action potentials of the gastrointestinal smooth muscle and those of nerve fibers is the manner in which they are Serosa Longitudinal muscle Circular muscle Submucosa Mucosa Meissner’s nerve plexus Mucosal muscle Mucosal gland Submucosal gland Mesentery Myenteric nerve plexus Epithelial lining Figure 63-2. Typical cross section of the gut. Membrane potential (millivolts) 0 0 6 12 18 Spikes Depolarization Stimulation by
Norepinephrine Sympathetics Stimulation by Stretch Acetylcholine Parasympathetics Resting Hyperpolarization Slow waves 30 36 42 48 54 Seconds Seconds &gt; Figure 63-3. Membrane potentials in intestinal smooth muscle. Note the slow waves, the spike potentials, total depolarization, and hyperpolarization, all of which occur under different physiological conditions of the intestine. Parotid gland Mouth Salivary glands Esophagus Liver Gallbladder Duodenum Ascending colon Transverse colon Stomach Pancreas Jejunum Descending colon Ileum Anus Figure 63-1. Alimentary tract. "></div><div data-title="Cerebral Cortex, Intellectual Functions of the Brain, Learning, and Memory"

                     data-content="—## OF THE BRAIN Without continuous transmission of nerve signals from the lower brain into the cerebrum, the cerebrum becomes useless. In fact, severe compression of the brain stem at the juncture between the mesencephalon and cerebrum, as sometimes results from a pineal tumor, often causes the person to enter into unremitting coma lasting for the remainder of his or her life. Nerve signals in the brain stem activate the cerebrum in two ways: (1) by directly stimulating a background level of neuronal activity in wide areas of the brain and (2) by activating neurohormonal systems that release specific facilitory or inhibitory hormone-like neurotransmitters into selected areas of the brain. CONTROL OF CEREBRAL ACTIVITY BY CONTINUOUS EXCITATORY SIGNALS ## FROM THE BRAIN STEM Reticular Excitatory Area of the Brain Stem—a Driver of Brain Activity Figure 59-1 shows a general system for controlling the activity level of the brain. The central driving component of this system is an excitatory area located in the reticular substance of the pons and mesencephalon. This area is also called the bulboreticular facilitory area. We also discuss this area in Chapter 56 because it is the same brain stem reticular area that transmits facilitory signals downward to the spinal cord to maintain tone in the antigravity muscles and to control levels of activity of the spinal cord reflexes. In addition to these downward signals, this area also sends a profusion of signals in the upward direction. Most of these signals go first to the thalamus, where they excite a different set of neurons that transmit nerve signals to all regions of the cerebral cortex, as well as to multiple subcortical areas. The signals passing through the thalamus are of two types. One type is rapidly transmitted action potentials that excite the cerebrum for only a few milliseconds. These signals originate from large neuronal cell bodies that lie throughout the brain stem reticular area. Their nerve endings release the neurotransmitter acetylcholine, which serves as an excitatory agent that lasts for only a few milliseconds before it is destroyed. The second type of excitatory signal originates from large numbers of small neurons spread throughout the brain stem reticular excitatory area. Again, most of these signals pass to the thalamus, but through small, slowly conducting fibers that synapse mainly in the intralaminar nuclei of the thalamus and in the reticular nuclei over the surface of the thalamus. From here, additional small fibers are distributed throughout the cerebral cortex. The excitatory effect caused by this system of fibers can build up progressively for many seconds to a minute or more, which suggests that its signals are especially important for controlling the longer term background excitability level of the brain. Excitation of the Reticular Excitatory Area by Peripheral Sensory Signals. The level of activity of the reticular excitatory area in the brain stem, and therefore the level of activity of the entire brain, is determined to a great extent by the number and type of sensory signals that enter the brain from the periphery. Pain signals in particular increase activity in this excitatory area and therefore strongly excite the brain to attention. The importance of sensory signals in activating the excitatory area is demonstrated by the effect of cutting the brain stem above the point where the fifth cerebral nerves enter the pons. These nerves are the highest nerves entering the brain that transmit significant numbers of The Limbic System and the Hypothalamus— Behavioral and Motivational Mechanisms of the Brain somatosensory signals into the brain. When all these input sensory signals are gone, the level of activity in the brain excitatory area diminishes abruptly, and the brain proceeds instantly to a state of greatly reduced activity, approaching a permanent state of coma. However, when the brain stem is transected below the fifth nerves, which leaves much input of sensory signals from the facial and oral regions, the coma is averted. Increased Activity of the Excitatory Area Caused by Feedback Signals Returning From the Cerebral Cortex. Not only do excitatory signals pass to the cerebral cortex from the bulboreticular excitatory area of the brain stem, but feedback signals also return from the cerebral cortex back to this same area. Therefore, any time the cerebral cortex becomes activated by brain thought processes or by motor processes, signals are sent from the cortex to the brain stem excitatory area, which in turn sends still more excitatory signals to the cortex. This process helps to maintain the level of excitation of the cerebral cortex or even to enhance it. This is a positive feedback mechanism that allows any beginning activity in the cerebral cortex to support still more activity, thus leading to an “awake” mind. The Thalamus Is a Distribution Center That Controls Activity in Specific Regions of the Cortex. As pointed out in Chapter 58, almost every area of the cerebral cortex connects with its own highly specific area in the thalamus. Therefore, electrical stimulation of a specific point in the thalamus generally activates its own specific small region of the cortex. Furthermore, signals regularly reverberate back and forth between the thalamus and the cerebral cortex, with the thalamus exciting the cortex and the cortex then re-exciting the thalamus via return fibers. Activation of these back-andforth reverberation signals has been suggested to establish long-term memories. Whether the thalamus also functions to call forth specific memories from the cortex or to activate specific thought processes is still unclear, but the thalamus does have appropriate neuronal circuitry for these purposes. A Reticular Inhibitory Area Is Located in the Lower Brain Stem Figure 59-1 shows another area that is important in controlling brain activity—the reticular inhibitory area, located medially and ventrally in the medulla. In Chapter 56, we learned that this area can inhibit the reticular facilitory area of the upper brain stem and thereby decrease activity in the superior portions of the brain. One of the mechanisms for this activity is to excite serotonergic neurons, which in turn secrete the inhibitory neurohormone serotonin at crucial points in the brain; we discuss this concept in more detail later. NEUROHORMONAL CONTROL OF BRAIN ## ACTIVITY Aside from direct control of brain activity by specific transmission of nerve signals from the lower brain areas to the cortical regions of the brain, still another physiological mechanism is often used to control brain activity. This mechanism is to secrete excitatory or inhibitory neurotransmitter hormonal agents into the substance of the brain. These neurohormones often persist for minutes or hours and thereby provide long periods of control, rather than just instantaneous activation or inhibition. Figure 59-2 shows three neurohormonal systems that have been studied in detail in the rat brain: (1) a norepinephrine system, (2) a dopamine system, and (3) a serotonin system. Norepinephrine usually functions as an excitatory hormone, whereas serotonin is usually inhibitory and dopamine is excitatory in some areas but inhibitory in others. As would be expected, these three systems have different effects on levels of excitability in different parts of the brain. The norepinephrine system spreads to virtually every area of the brain, whereas the serotonin and dopamine systems are directed much more to specific brain regions—the dopamine system mainly into the basal ganglial regions and the serotonin system more into the midline structures. Neurohormonal Systems in the Human Brain. Figure 59-3 shows the brain stem areas in the human brain for activating four neurohormonal systems, the same three discussed for the rat and one other, the acetylcholine system. Some of the specific functions of these systems are as follows. Thalamus Inhibitory area Excitatory area Fifth cranial nerve &gt; Figure 59-1 The excitatoryactivating system of the brain. Also shown is an inhibitory area in the medulla that can inhibit or depress the activating system.

                     data-content="REPLACEMENT THERAPY Blood and Plasma Transfusion If a person is in shock caused by hemorrhage, the best possible therapy is usually transfusion of whole blood.
If the shock is caused by plasma loss, the best therapy is administration of plasma.
When dehydration is the cause, administration of an appropriate electrolyte solution can correct the shock.
Whole blood is not always available, such as under battlefield conditions. Plasma can usually substitute adequately for whole blood because it increases blood volume and restores normal hemodynamics.
Plasma cannot restore a normal hematocrit, but the body can usually stand a decrease in hematocrit to about half of normal before serious consequences result. This is true if cardiac output is adequate.
Therefore, in emergency conditions, it is reasonable to use plasma in place of whole blood for treatment of hemorrhagic or most other types of hypovolemic shock.
Dextran Solution as a Plasma Substitute Sometimes plasma is unavailable. Various plasma substitutes have been developed that perform almost exactly the same hemodynamic functions as plasma. One of these substitutes is dextran solution.
The principal requirement of a truly effective plasma substitute is that it remain in the circulatory system. It must not filter through the capillary pores into the tissue spaces.
Additionally, the solution must be nontoxic. It must contain appropriate electrolytes to prevent derangement of the body’s extracellular fluid electrolytes on administration.
To remain in the circulation, the plasma substitute must contain some substance that has a large enough molecular size to exert colloid osmotic pressure. One substance developed for this purpose is dextran.
Dextran is a large polysaccharide polymer of glucose. Dextrans of appropriate molecular size do not pass through the capillary pores. Therefore, they can replace plasma proteins as colloid osmotic agents.
Few toxic reactions have been observed when using purified dextran to provide colloid osmotic pressure. Solutions containing this substance have been used as a substitute for plasma in fluid replacement therapy.
TREATMENT OF NEUROGENIC AND ANAPHYLACTIC SHOCK WITH SYMPATHOMIMETIC DRUGS A sympathomimetic drug is a drug that mimics sympathetic stimulation. These drugs include norepinephrine, epinephrine, and many long-acting drugs that have the same basic effects.
Two Types of Shock Where Sympathomimetic Drugs Are Beneficial Neurogenic shock is the first type. In this shock, the sympathetic nervous system is severely depressed. Administering a sympathomimetic drug takes the place of the diminished sympathetic actions. It can often restore full circulatory function.
Anaphylactic shock is the second type. In this shock, excess histamine plays a prominent role. Sympathomimetic drugs have a vasoconstrictor effect. This opposes the vasodilating effect of histamine. Therefore, epinephrine, norepinephrine, or other sympathomimetic drugs are often lifesaving.
Why Sympathomimetic Drugs Are Not Valuable in Hemorrhagic Shock Sympathomimetic drugs have not proved to be very valuable in hemorrhagic shock. The reason is that in this type of shock, the sympathetic nervous system is almost always maximally activated by circulatory reflexes. Much norepinephrine and epinephrine are already circulating in the blood. Therefore, sympathomimetic drugs have essentially no additional beneficial effect.
OTHER THERAPY Treatment by the Head-Down Position When the pressure falls too low in most types of shock, especially hemorrhagic and neurogenic shock, placing the patient with the head at least 12 inches lower than the feet helps. This promotes venous return and increases cardiac output.
This head-down position is the first essential step in the treatment of many types of shock.
Oxygen Therapy A major deleterious effect of most types of shock is too little delivery of oxygen to the tissues. Giving the patient oxygen to breathe can be of benefit in some cases.
However, this intervention frequently is far less beneficial than one might expect. The problem in most types of shock is not inadequate oxygenation of the blood by the lungs. It is inadequate transport of the blood after it is oxygenated.
Treatment With Glucocorticoids Glucocorticoids are adrenal cortex hormones that control glucose metabolism. They are frequently given to patients in severe shock for several reasons:
Experiments have shown empirically that glucocorticoids frequently increase the strength of the heart in the late stages of shock Glucocorticoids stabilize lysosomes in tissue cells, preventing the release of lysosomal enzymes into the cytoplasm of the cells, thus preventing deterioration from this source Glucocorticoids might aid in the metabolism of glucose by severely damaged cells CIRCULATORY ARREST A condition closely allied to circulatory shock is circulatory arrest. In this condition, all blood flow stops. This condition can occur as a result of cardiac arrest or ventricular fibrillation.
Ventricular fibrillation can usually be stopped by strong electroshock of the heart. The basic principles are described in Chapter 13.
In the case of complete cardiac arrest, a normal cardiac rhythm can sometimes be restored by immediately applying cardiopulmonary resuscitation procedures. At the same time, the patient’s lungs must be supplied with adequate quantities of ventilatory oxygen.
Effect of Circulatory Arrest on the Brain A special challenge in circulatory arrest is to prevent detrimental effects on the brain. In general, more than 5 to 8 minutes of total circulatory arrest can cause at least some degree of permanent brain damage. This occurs in more than half of patients.
Circulatory arrest for as long as 10 to 15 minutes almost always permanently destroys significant amounts of mental capacity.
Prevention of Brain Damage During Circulatory Arrest For many years, it was thought that this detrimental effect on the brain was caused by acute cerebral hypoxia during circulatory arrest.
However, experiments have shown that if blood clots are prevented from occurring in the blood vessels of the brain, this will also prevent much of the early deterioration of the brain.
In animal experiments, all the blood was removed from the animal’s blood vessels at the beginning of circulatory arrest. It was then replaced at the end of circulatory arrest. No intravascular blood clotting could occur. In this experiment, the brain was usually able to withstand up to 30 minutes of circulatory arrest without permanent brain damage.
Administration of heparin or streptokinase (to prevent blood coagulation) before cardiac arrest was shown to increase the survivability of the brain, up to two to four times longer than usual.
Summary of Shock Treatment Shock Type First-Line Treatment Key Mechanism Hemorrhagic Whole blood or plasma transfusion Restores blood volume Plasma loss Plasma or dextran solution Provides colloid osmotic pressure Neurogenic Sympathomimetic drugs Replaces depressed sympathetic tone Anaphylactic Epinephrine/norepinephrine Counteracts histamine-induced vasodilation All types Head-down position Promotes venous return Severe shock Glucocorticoids Stabilizes lysosomes, supports heart Comparison of Sympathomimetic Drug Effectiveness Shock Type Sympathomimetic Effectiveness Reason Neurogenic Highly beneficial Sympathetic system is depressed Anaphylactic Highly beneficial Counteracts histamine vasodilation Hemorrhagic Not beneficial Sympathetic system already maximally activated "></div><div data-title="Contraction of Skeletal Muscle" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch06_contraction-of-skeletal-muscle/"
                     data-content="TRANSMISSION OF IMPULSES FROM NERVE ENDINGS TO SKELETAL MUSCLE FIBERS Skeletal muscle fibers are innervated by large myelinated nerve fibers that originate from large motoneurons in the anterior horns of the spinal cord.
As discussed in Chapter 6, each nerve fiber, after entering the muscle belly, normally branches and stimulates from three to several hundred skeletal muscle fibers.
Each nerve ending makes a junction, called the neuromuscular junction, with the muscle fiber near its midpoint.
The action potential initiated in the muscle fiber by the nerve signal travels in both directions toward the muscle fiber ends.
With the exception of about 2% of the muscle fibers, there is only one such junction per muscle fiber.
PHYSIOLOGIC ANATOMY OF THE NEUROMUSCULAR JUNCTION—THE MOTOR END PLATE Figure 7-1A and B shows the neuromuscular junction from a large myelinated nerve fiber to a skeletal muscle fiber.
The nerve fiber forms a complex of branching nerve terminals that invaginate into the surface of the muscle fiber but lie outside the muscle fiber plasma membrane.
The entire structure is called the motor end plate. It is covered by one or more Schwann cells that insulate it from the surrounding fluids.
Figure 7-1C shows the junction between a single axon terminal and the muscle fiber membrane.
The invaginated membrane is called the synaptic gutter or synaptic trough, and the space between the terminal and the fiber membrane is called the synaptic space or synaptic cleft, which is 20 to 30 nanometers wide.
At the bottom of the gutter are numerous smaller folds of the muscle membrane called subneural clefts, which greatly increase the surface area at which the synaptic transmitter can act.
In the axon terminal are many mitochondria that supply adenosine triphosphate (ATP), the energy source used for synthesis of a transmitter, acetylcholine, which excites the muscle fiber membrane.
Acetylcholine is synthesized in the cytoplasm of the terminal but is absorbed rapidly into many small synaptic vesicles, about 300,000 of which are normally in the terminals of a single end plate.
In the synaptic space are large quantities of the enzyme acetylcholinesterase, which destroys acetylcholine a few milliseconds after it has been released from the synaptic vesicles.
SECRETION OF ACETYLCHOLINE BY THE NERVE TERMINALS When a nerve impulse reaches the neuromuscular junction, about 125 vesicles of acetylcholine are released from the terminals into the synaptic space.
Some of the details of this mechanism can be seen in Figure 7-2, which shows an expanded view of a synaptic space with the neural membrane above and the muscle membrane and its subneural clefts below.
On the inside surface of the neural membrane are linear dense bars, shown in cross section in Figure 7-2.
To each side of each dense bar are protein particles that penetrate the neural membrane; these are voltage-gated calcium channels.
When an action potential spreads over the terminal, these channels open and allow calcium ions to diffuse from the synaptic space to the interior of the nerve terminal.
The calcium ions, in turn, are believed to activate Ca2&#43;-calmodulin–dependent protein kinase, which, in turn, phosphorylates synapsin proteins that anchor the acetylcholine vesicles to the cytoskeleton of the presynaptic terminal.
This process frees the acetylcholine vesicles from the cytoskeleton and allows them to move to the active zone of the presynaptic neural membrane adjacent to the dense bars.
The vesicles then dock at the release sites, fuse with the neural membrane, and empty their acetylcholine into the synaptic space by the process of exocytosis.
Although some of the aforementioned details are speculative, it is known that the effective stimulus for causing acetylcholine release from the vesicles is entry of calcium ions.
Acetylcholine from the vesicles is then emptied through the neural membrane adjacent to the dense bars.
ACETYLCHOLINE OPENS ION CHANNELS ON POSTSYNAPTIC MEMBRANES Figure 7-2 also shows many small acetylcholine receptors and voltage-gated sodium channels in the muscle fiber membrane.
The acetylcholine-gated ion channels are located almost entirely near the mouths of the subneural clefts lying immediately below the dense bar areas, where the acetylcholine is emptied into the synaptic space.
The voltage-gated sodium channels also line the subneural clefts.
Each acetylcholine receptor is a protein complex that has a total molecular weight of approximately 275,000.
The fetal acetylcholine receptor complex is composed of five subunit proteins: two alpha proteins and one each of beta, delta, and gamma proteins.
In the adult, an epsilon protein substitutes for the gamma protein in this receptor complex.
These protein molecules penetrate all the way through the membrane, lying side by side in a circle to form a tubular channel, illustrated in Figure 7-3.
The channel remains constricted, as shown in part A of the figure, until two acetylcholine molecules attach respectively to the two alpha subunit proteins.
This attachment causes a conformational change that opens the channel, as shown in part B of the figure.
The acetylcholine-gated channel has a diameter of about 0.65 nanometer, which is large enough to allow the important positive ions—sodium (Na&#43;), potassium (K&#43;), and calcium (Ca2&#43;)—to move easily through the opening.
Patch clamp studies have shown that one of these channels, when opened by acetylcholine, can transmit 15,000 to 30,000 sodium ions in 1 millisecond.
Conversely, negative ions, such as chloride ions, do not pass through because of strong negative charges in the mouth of the channel that repel these negative ions.
EXCITATION-CONTRACTION COUPLING Figure 7-6 shows excitation-contraction coupling in skeletal muscle.
The top panel shows an action potential in the transverse tubule that causes a conformational change in the voltage-sensing dihydropyridine (DHP) receptors.
This opens the ryanodine (RyR) Ca2&#43; release channels in the terminal cisternae of the sarcoplasmic reticulum.
This permits Ca2&#43; to diffuse rapidly into the sarcoplasm and initiate muscle contraction.
During repolarization (bottom panel), the conformational change in the DHP receptor closes the Ca2&#43; release channels.
Ca2&#43; is transported from the sarcoplasm into the sarcoplasmic reticulum by an adenosine triphosphate–dependent calcium pump, called SERCA (sarcoplasmic reticulum Ca2&#43;-ATPase).
MALIGNANT HYPERTHERMIA Malignant hyperthermia is a condition caused by mutations in ryanodine receptors, whereby anesthetics interact with these abnormal receptors to trigger the condition.
These mutations cause unregulated passage of calcium from the sarcoplasmic reticulum into the intracellular spaces.
This causes the muscle fibers to contract excessively.
These sustained muscle contractions greatly increase metabolic rate, generating large amounts of heat.
They also cause cellular acidosis, as well as depletion of energy stores.
Symptoms Symptoms of malignant hyperthermia include:
Muscle rigidity High fever Rapid heart rate Complications Additional complications in severe cases may include:
Rapid breakdown of skeletal muscle (rhabdomyolysis) High plasma potassium level due to release of large amounts of potassium from damaged muscle cells Treatment Treatment of malignant hyperthermia generally involves:
Rapid cooling Administration of dantrolene, a drug that antagonizes ryanodine receptors Dantrolene inhibits calcium ion release from the sarcoplasmic reticulum, thereby attenuating muscle contraction.
"></div><div data-title="Dietary Balances; Regulation of Feeding; Obesity and Starvation; Vitamins and Minerals" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch72_dietary-balances-regulation-of-feeding-obesity-and-starvation-vitamins-and-mi/"
                     data-content="Regulation of Food Intake Hunger and Satiety Centers Food intake is regulated by centers in the hypothalamus.
The hypothalamic arcuate nucleus contains key neurons for appetite regulation:
Neuron Type Effect Neurotransmitters Orexigenic (NPY/AgRP) Stimulates hunger Neuropeptide Y, Agouti-related peptide Anorexigenic (POMC/CART) Promotes satiety Proopiomelanocortin, Cocaine- and amphetamine-regulated transcript Peripheral Signals The hypothalamus integrates peripheral signals related to energy stores and food intake:
Leptin:
Secreted by adipocytes (fat cells) Secretion is proportional to adipose tissue mass Inhibits NPY/AgRP neurons Stimulates POMC neurons Overall effect: reduces food intake Ghrelin:
Secreted by the stomach Levels rise before meals Stimulates NPY/AgRP neurons Increases appetite Insulin:
Secreted by pancreatic β-cells Signals satiety Inhibits food intake Glucose:
Acts as a direct metabolic signal Higher glucose levels reduce appetite Obesity and Weight Regulation Energy Balance Weight stability requires caloric intake equal to energy expenditure.
Excess energy is stored primarily as fat.
When overfed persistently, body weight increases.
When underfed, body weight decreases.
Causes of Obesity Obesity results from:
Excessive caloric intake Reduced energy expenditure Combination of both Genetic factors influence:
Basal metabolic rate Fat distribution Appetite regulation Environmental factors include:
Diet composition Physical activity levels Stress and sleep patterns Starvation and Metabolic Adaptations Early Starvation During the first few days of starvation:
Glycogen stores are depleted (provides ~24 hours of glucose) Gluconeogenesis increases (using amino acids, glycerol, lactate) Protein breakdown begins Prolonged Starvation After glycogen depletion, the body adapts:
Ketogenesis increases significantly Ketone bodies become a major energy source for the brain Protein breakdown is somewhat spared Muscle protein degradation increases to ~125 g/day Protein Sparing Carbohydrate and fat metabolism spare protein.
During starvation:
Initial protein degradation is limited Eventually, protein stores are mobilized for gluconeogenesis This leads to muscle wasting and organ dysfunction Vitamins Fat-Soluble Vitamins Vitamin A Vitamin A is essential for:
Vision (retinal pigment) Epithelial cell maintenance Immune function Deficiency causes night blindness and xerophthalmia.
Vitamin D Vitamin D functions as a hormone:
Increases calcium absorption from the intestine Promotes bone mineralization Regulates calcium and phosphorus homeostasis Deficiency causes rickets in children and osteomalacia in adults.
Vitamin E Vitamin E protects against oxidation of unsaturated fats.
In the absence of vitamin E:
Unsaturated fats in cells become diminished Cellular organelles are abnormally structured (mitochondria, lysosomes, cell membranes) Vitamin K Vitamin K is an essential cofactor for a liver enzyme.
This enzyme adds a carboxyl group to clotting factors:
Factor II (prothrombin) Factor VII (proconvertin) Factor IX Factor X Without this carboxylation, these coagulation factors are inactive.
Deficiency causes delayed blood clotting.
Vitamin K is synthesized by colonic bacteria, making dietary deficiency rare.
However, when colonic bacteria are destroyed by antibiotics, deficiency can occur rapidly.
Water-Soluble Vitamins Vitamin B Complex Vitamin Function Deficiency B₁ (Thiamine) Coenzyme in carbohydrate metabolism Beriberi (cardiovascular and neurologic symptoms) B₂ (Riboflavin) FMN, FAD cofactors Cheilosis, glossitis B₃ (Niacin) NAD⁺, NADP⁺ cofactors Pellagra (dermatitis, diarrhea, dementia) B₆ (Pyridoxine) Amino acid metabolism coenzyme Peripheral neuropathy, anemia B₁₂ (Cobalamin) Methyl transfer, DNA synthesis Pernicious anemia, neurologic damage Folic acid DNA synthesis Megaloblastic anemia, neural tube defects C (Ascorbic acid) Antioxidant, collagen synthesis Scurvy (bleeding gums, poor wound healing) Mineral Metabolism Major Minerals Mineral Daily Requirement (Men) Daily Requirement (Women) Functions Sodium 1500 mg 1500 mg Fluid balance, nerve function Potassium 3400 mg 2600 mg Nerve function, muscle contraction Chloride 2300 mg 2300 mg Fluid balance, HCl production Calcium 1000 mg 1000 mg Bone structure, muscle contraction, nerve function Phosphorus 700 mg 700 mg Bone structure, ATP, nucleic acids Magnesium 420 mg 320 mg Enzyme cofactor, muscle function Notes:
Calcium increases to 1200 mg/day after age 70 (men) and after age 51 (women) Iron decreases to 8 mg/day after age 51 Magnesium Magnesium is about one-sixth as plentiful in cells as potassium.
It is required as a catalyst for many intracellular enzymatic reactions.
Particularly important for carbohydrate metabolism.
Extracellular magnesium concentration: 1.8–2.5 mEq/L
Effects of increased extracellular magnesium:
Depresses nervous system activity Depresses skeletal muscle contraction (can be blocked by calcium) Effects of low magnesium:
Increased nervous system irritability Peripheral vasodilation Cardiac arrhythmias (especially after acute myocardial infarction) Calcium Calcium is present mainly as calcium phosphate in bone.
Effects of excess calcium ions:
Can cause the heart to stop in systole Can act as a mental depressant Effects of low calcium:
Can cause spontaneous nerve fiber discharge Results in tetany Phosphorus Phosphate is the major anion of intracellular fluid.
Phosphates combine reversibly with many coenzyme systems and compounds necessary for metabolic processes.
Important reactions involve:
Adenosine triphosphate (ATP) Adenosine diphosphate (ADP) Phosphocreatine Iron Two-thirds of body iron is in hemoglobin.
Smaller quantities are present in liver and bone marrow.
Iron-containing electron carriers (cytochromes) are in mitochondria.
These are essential for most cellular oxidation.
Iron is essential for:
Transport of oxygen to tissues Operation of oxidative systems within cells Without iron, life would cease within a few seconds.
Important Trace Elements A few elements are present in very small quantities — called trace elements.
Without any one of them, a specific deficiency syndrome develops.
The three most important are iodine, zinc, and fluorine.
Iodine The entire body contains an average of only 14 milligrams of iodine.
Iodine is essential for formation of:
Thyroxine (T₄) Triiodothyronine (T₃) These thyroid hormones maintain normal metabolic rates in all cells.
Zinc Zinc is an integral part of many enzymes.
One of the most important is carbonic anhydrase.
Carbonic anhydrase is present in high concentration in red blood cells.
It is responsible for:
Rapid combination of CO₂ with water in peripheral capillary RBCs Rapid release of CO₂ from pulmonary capillary blood into alveoli Carbonic anhydrase is also present in:
Gastrointestinal mucosa Renal tubules Epithelial cells of many glands Zinc is also a component of lactic dehydrogenase.
This enzyme is important for interconversions between pyruvic acid and lactic acid.
Finally, zinc is a component of some peptidases.
It is important for protein digestion in the GI tract.
Fluorine Fluorine does not seem to be a necessary element for metabolism.
However, a small quantity protects against dental caries (tooth decay).
Fluorine does not make teeth stronger.
It suppresses the cariogenic process.
Fluorine may be deposited in hydroxyapatite crystals of tooth enamel.
It blocks trace metals necessary for activation of bacterial enzymes that cause caries.
Fluorosis Excessive fluorine intake causes fluorosis.
Mild fluorosis: Mottled teeth
Severe fluorosis: Enlarged bones
Fluorine may combine with trace metals in metabolic enzymes, including phosphatases.
Various metabolic systems become partially inactivated.
Mottled teeth and enlarged bones may result from abnormal enzyme systems in odontoblasts and osteoblasts.
The mottled teeth, despite being highly resistant to caries, may have reduced structural strength.
"></div><div data-title="Digestion and Absorption in the Gastrointestinal Tract" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch66_digestion-and-absorption-in-the-gastrointestinal-tract/"
                     data-content="Carbohydrate Digestion Overview Carbohydrates are digested into monosaccharides for absorption.
The final monosaccharide products include glucose (&gt;80%), galactose, and fructose.
These are absorbed into portal blood via the intestinal mucosa.
Enzymatic Breakdown Salivary amylase begins starch hydrolysis in the mouth.
Pancreatic amylase continues hydrolysis in the small intestine, producing maltose and small glucose polymers.
Intestinal brush border enzymes complete digestion:
Maltase hydrolyzes maltose to two glucose molecules α-dextrinase hydrolyzes α-dextrins to glucose Sucrase hydrolyzes sucrose to glucose and fructose Lactase hydrolyzes lactose to glucose and galactose Absorption of Monosaccharides Monosaccharides are absorbed primarily by active transport and facilitated diffusion.
Glucose and galactose are absorbed via SGLT1 (sodium-glucose cotransporter 1).
Fructose is absorbed via GLUT5 (facilitated diffusion).
All monosaccharides then enter the portal circulation via GLUT2 transporters in hepatocyte membranes.
Protein Digestion Gastric Digestion Protein digestion begins in the stomach.
Pepsin is the principal gastric proteolytic enzyme, secreted as pepsinogen.
Pepsin functions optimally at pH 2.0–3.0.
HCl from parietal cells activates pepsinogen to pepsin and provides the acidic environment.
Small Intestine Digestion Pancreatic proteolytic enzymes complete protein digestion:
Trypsin cleaves peptide bonds at lysine and arginine residues Chymotrypsin cleaves peptide bonds at aromatic and large hydrophobic residues Carboxypeptidase removes amino acids from the carboxyl terminus Aminopeptidase removes amino acids from the amino terminus These enzymes are secreted as inactive zymogens (trypsinogen, chymotrypsinogen, procarboxypeptidase).
Enterokinase (from duodenal mucosa) activates trypsinogen to trypsin.
Absorption of Amino Acids Amino acids are absorbed via active transport mechanisms in the small intestine.
Multiple transport systems exist for different types of amino acids:
Neutral amino acid transporter Basic amino acid transporter Acidic amino acid transporter Proline and hydroxyproline transporter Small peptides (dipeptides and tripeptides) can be absorbed via a separate PepT1 transporter.
Peptides are then hydrolyzed intracellularly to individual amino acids.
Fat Digestion Emulsification Fat digestion requires prior emulsification by bile salts.
Bile salts are amphipathic molecules that disperse large fat droplets into smaller micelles.
Emulsification increases the surface area for enzymatic action.
Enzymatic Hydrolysis Pancreatic lipase is the primary enzyme for triglyceride digestion.
Lipase hydrolyzes triglycerides to:
Monoglycerides Free fatty acids Colipase is a cofactor that anchors lipase to the lipid-water interface.
Formation of Micelles Bile salts form micelles that solubilize monoglycerides and fatty acids.
Micelles transport these products to the intestinal brush border for absorption.
Inside the enterocyte, monoglycerides are re-esterified to triglycerides.
Transport as Chylomicrons Absorbed fatty acids are packaged into chylomicrons.
Chylomicrons enter the lymphatic vessels (lacteals).
They travel via the thoracic duct to the venous circulation.
Importantly, this pathway bypasses the liver on first pass.
Water and Electrolyte Absorption Small Intestine The small intestine absorbs approximately 8–9 liters of fluid daily.
This includes dietary intake and gastrointestinal secretions.
Water absorption follows osmotic gradients created by solute absorption.
Sodium is absorbed via multiple mechanisms:
Active transport (primary) Co-transport with glucose and amino acids Exchange with hydrogen ions Large Intestine The large intestine absorbs approximately 5–8 liters of fluid daily.
Most absorption occurs in the proximal (absorbing) colon.
The distal colon functions primarily for feces storage (storage colon).
Formation of Feces Overview About 1500 ml of chyme passes through the ileocecal valve into the large intestine each day.
Most water and electrolytes are absorbed in the colon.
Less than 100 ml of fluid is typically excreted in feces.
Electrolyte Absorption The large intestinal mucosa has high capability for active sodium absorption.
Sodium absorption creates an electrical gradient that drives chloride absorption.
Tight junctions in the large intestine are much tighter than in the small intestine.
This prevents back-diffusion of ions and allows absorption against higher concentration gradients.
Aldosterone enhances sodium transport capability when available.
Bicarbonate Secretion The large intestinal mucosa secretes HCO₃⁻.
This occurs via exchange transport with chloride absorption.
HCO₃⁻ neutralizes acidic end products of bacterial action.
Maximum Absorption Capacity The large intestine can absorb a maximum of 5–8 liters per day.
When fluid input exceeds this capacity, diarrhea results.
Cholera toxins can cause secretion of 10&#43; liters of fluid per day, leading to severe and potentially lethal diarrhea.
Bacterial Action in the Colon Normal Flora Numerous bacteria, especially colon bacilli, inhabit the large intestine.
Bacteria can digest small amounts of cellulose, providing minimal calories in humans.
This cellulose digestion is more significant in herbivorous animals.
Bacterial Products Bacterial activity produces:
Vitamins: Vitamin K, vitamin B₁₂, thiamine, riboflavin Gases: CO₂, hydrogen gas, methane (flatus) Bacterial vitamin K is clinically important because dietary intake is often insufficient for adequate blood coagulation.
Composition of Feces General Composition Component Percentage Water ~75% Solid matter ~25% Solid Matter Composition Component Percentage Dead bacteria ~30% Fat 10–20% Inorganic matter 10–20% Protein 2–3% Undigested roughage and dried digestive juices ~30% Color and Odor The brown color of feces is caused by stercobilin and urobilin (derivatives of bilirubin).
The odor results from products of bacterial action:
Indole Skatole Mercaptans Hydrogen sulfide These products vary between individuals based on colonic bacterial flora and diet.
"></div><div data-title="Diuretics and Kidney Diseases"
