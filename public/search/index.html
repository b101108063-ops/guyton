                     data-content="THE OVUM Oocyte Maturation Before Ovulation While still in the ovary, the ovum is in the primary oocyte stage.
Shortly before it is released from the ovarian follicle, its nucleus divides by meiosis and a first polar body is expelled from the nucleus of the oocyte. The primary oocyte then becomes the secondary oocyte.
In this process, each of the 23 pairs of chromosomes loses one of its partners, which becomes incorporated in a polar body that is expelled. This leaves 23 unpaired chromosomes in the secondary oocyte.
It is at this time that the ovum, which is still in the secondary oocyte stage, is ovulated into the abdominal cavity. Then, almost immediately, it enters the fimbriated end of one of the fallopian tubes.
Entry of the Ovum Into the Fallopian Tube When ovulation occurs, the ovum, along with a hundred or more attached granulosa cells that constitute the corona radiata, is expelled directly into the peritoneal cavity.
It must then enter one of the fallopian tubes (uterine tubes) to reach the cavity of the uterus.
The fimbriated ends of each fallopian tube fall naturally around the ovaries. The inner surfaces of the fimbriated tentacles are lined with ciliated epithelium. The cilia are activated by estrogen from the ovaries, which causes the cilia to beat toward the opening (ostium) of the involved fallopian tube.
One can actually see a slow fluid current flowing toward the ostium. By this means, the ovum enters one of the fallopian tubes.
Success Rate of Ovum Entry Although one might suspect that many ova fail to enter the fallopian tubes, conception studies suggest up to 98% of ova succeed in this task.
In some recorded cases, women with one ovary removed and the opposite fallopian tube removed have had several children with relative ease of conception. This demonstrates that ova can even enter the opposite fallopian tube.
FERTILIZATION OF THE OVUM Sperm Transport After the male ejaculates semen into the vagina during intercourse, a few sperm are transported within 5 to 10 minutes upward from the vagina and through the uterus and fallopian tubes to the ampullae of the fallopian tubes near the ovarian ends of the tubes.
This transport of the sperm is aided by:
Contractions of the uterus and fallopian tubes stimulated by prostaglandins in the male seminal fluid Oxytocin released from the posterior pituitary gland of the female during her orgasm Of the almost half a billion sperm deposited in the vagina, a few thousand succeed in reaching each ampulla.
Fertilization Process Fertilization of the ovum normally takes place in the ampulla of one of the fallopian tubes soon after both the sperm and the ovum enter the ampulla.
Before a sperm can enter the ovum, it must first:
Penetrate the multiple layers of granulosa cells attached to the outside of the ovum (the corona radiata) Bind to and penetrate the zona pellucida surrounding the ovum The mechanisms used by the sperm for these purposes are presented in Chapter 81.
Formation of Pronuclei Once a sperm has entered the ovum (which is still in the secondary oocyte stage of development), the oocyte divides again to form the mature ovum plus a second polar body that is expelled.
The mature ovum still carries in its nucleus (now called the female pronucleus) 23 chromosomes. One of these chromosomes is the female chromosome, known as the X chromosome.
Meanwhile, the fertilizing sperm has also changed. On entering the ovum, its head swells to form a male pronucleus.
Later, the 23 unpaired chromosomes of the male pronucleus and the 23 unpaired chromosomes of the female pronucleus align themselves. They re-form a complete complement of 46 chromosomes (23 pairs) in the fertilized ovum or zygote.
WHAT DETERMINES THE SEX OF THE FETUS? Half of the mature sperm carry in their genome an X chromosome (the female chromosome) and half carry a Y chromosome (the male chromosome).
If an X chromosome from a sperm combines with an X chromosome from an ovum, giving an XX combination, a female child will be born.
If a Y chromosome from a sperm is paired with an X chromosome from an ovum, giving an XY combination, a male child will be born.
TRANSPORT OF THE FERTILIZED OVUM IN THE FALLOPIAN TUBE After fertilization has occurred, an additional 3 to 5 days is normally required for transport of the fertilized ovum through the remainder of the fallopian tube into the cavity of the uterus.
This transport is effected mainly by a feeble fluid current in the tube resulting from epithelial secretion plus action of the ciliated epithelium that lines the tube. The cilia always beat toward the uterus. Weak contractions of the fallopian tube may also aid passage of the ovum.
Isthmus Contraction Pattern The fallopian tubes are lined with a rugged cryptoid surface that impedes passage of the ovum despite the fluid current.
The isthmus of the fallopian tube (the last 2 centimeters before the tube enters the uterus) remains spastically contracted for about the first 3 days after ovulation.
After this time, the rapidly increasing progesterone secreted by the ovarian corpus luteum first promotes increasing progesterone receptors on the fallopian tube smooth muscle cells. Then the progesterone activates the receptors, relaxing the tubules and allowing entry of the ovum into the uterus.
Purpose of Delayed Transport This delayed transport of the fertilized ovum through the fallopian tube allows several stages of cell division to occur before the dividing ovum (now called a blastocyst, with about 100 cells) enters the uterus.
During this time, the fallopian tube secretory cells produce large quantities of secretions used for nutrition of the developing blastocyst.
IMPLANTATION OF THE BLASTOCYST IN THE UTERUS After reaching the uterus, the developing blastocyst usually remains in the uterine cavity an additional 1 to 3 days before it implants in the endometrium. Implantation ordinarily occurs on about the fifth to seventh day after ovulation.
Before implantation, the blastocyst obtains its nutrition from the uterine endometrial secretions, called “uterine milk.”
Implantation Mechanism Implantation results from the action of trophoblast cells that develop over the surface of the blastocyst. These cells secrete proteolytic enzymes that digest and liquefy the adjacent cells of the uterine endometrium.
Some of the fluid and nutrients released are actively transported by the same trophoblast cells into the blastocyst. This adds more sustenance for growth.
Once implantation has taken place, the trophoblast cells and other adjacent cells (from the blastocyst and the uterine endometrium) form the placenta.
PREGNANCY AND LACTATION HORMONES Human Chorionic Gonadotropin (hCG) hCG is the earliest pregnancy marker. It is secreted by trophoblastic cells. hCG maintains the corpus luteum’s progesterone production until the placenta takes over.
Placental Hormones Hormone Function Estrogen Maintains endometrium, suppresses uterine contractions Progesterone Maintains endometrium, suppresses uterine contractions Human placental lactogen (hPL) Antagonizes maternal insulin, directs glucose to fetus MILK COMPOSITION Table 83-1 lists the approximate composition of human milk and cow’s milk.
Constituent Human Milk (%) Cow’s Milk (%) Water 88.5 87.0 Fat 3.3 3.5 Lactose 6.8 4.8 Casein 0.9 2.7 Lactalbumin and other proteins 0.4 0.7 Ash 0.2 0.7 The concentration of lactose in human milk is about 50% greater than in cow’s milk.
The concentration of protein in cow’s milk is ordinarily two or more times greater than in human milk.
Only one-third as much ash (containing calcium and other minerals) is found in human milk compared with cow’s milk.
LACTATION ENERGY AND METABOLIC DEMANDS At the height of lactation in the human mother, 1.5 liters of milk may be formed each day. With twins, even more may be produced. With this degree of lactation, great quantities of energy are drained from the mother.
Approximately 650 to 750 kilocalories per liter (or 19 to 22 kilocalories per ounce) are contained in breast milk.
The composition and caloric content of the milk depends on the mother’s diet and other factors such as the fullness of the breasts.
Metabolic Substrate Loss Large amounts of metabolic substrates are also lost from the mother:
Substance Daily Loss in Milk Fat ~50 grams Lactose ~100 grams (derived from glucose) Calcium phosphate 2-3 grams Unless the mother is drinking large quantities of milk and has an adequate intake of vitamin D, the output of calcium and phosphate by the lactating mammae will often be much greater than the intake.
To supply the needed calcium and phosphate, the parathyroid glands enlarge greatly. The bones become progressively decalcified. The mother’s bone decalcification is usually not a big problem during pregnancy, but it can become more important during lactation.
ANTIBODIES AND OTHER ANTI-INFECTIOUS AGENTS IN MILK Not only does milk provide the newborn baby with needed nutrients, but it also provides important protection against infection.
Multiple types of antibodies and other anti-infectious agents are secreted in milk along with nutrients. Several different types of white blood cells are secreted, including both neutrophils and macrophages. Some of these white blood cells are especially lethal to bacteria that could cause deadly infections in newborn babies.
Particularly important are antibodies and macrophages that destroy Escherichia coli bacteria, which can cause lethal diarrhea in newborns.
Cow’s Milk Limitations When cow’s milk is used to supply nutrition for the baby in place of mother’s milk, the protective agents in it are usually of little value. This is because they are normally destroyed within minutes in the internal environment of the human being.
FERTILIZATION AND IMPLANTATION TIMELINE Day Event 1 Fertilization in fallopian tube ampulla 2-3 Cell division to 2-8 cells 4-5 Morula stage, enters uterus 5-7 Blastocyst implants in endometrium PREGNANCY PHYSIOLOGY SUMMARY System Adaptation Endocrine hCG maintains corpus luteum; placenta takes over hormone production Cardiovascular Increased blood volume, cardiac output Respiratory Increased tidal volume, minute ventilation Renal Increased GFR, fluid retention Gastrointestinal Relaxed smooth muscle, constipation possible Metabolic Insulin resistance, increased nutrient demand "></div><div data-title="Principles of Gas Exchange; Diffusion of Oxygen and Carbon Dioxide Through the Respiratory Membrane"

                     data-content="Lungs to the Body Tissues In Chapter 40, we pointed out that gases can move from one point to another by diffusion, and that the cause of this movement is always a partial pressure difference from the first point to the next.
Thus, O2 diffuses from the alveoli into the pulmonary capillary blood because the oxygen partial pressure (Po2) in the alveoli is greater than the Po2 in the pulmonary capillary blood.
In the other tissues of the body, a higher Po2 in the capillary blood than in the tissues causes O2 to diffuse into the surrounding cells.
Conversely, when O2 is metabolized in the cells to form CO2, the intracellular CO2 partial pressure (Pco2) rises, causing CO2 to diffuse into the tissue capillaries.
After blood flows to the lungs, the CO2 diffuses out of the blood into the alveoli because the Pco2 in the pulmonary capillary blood is greater than that in the alveoli.
Thus, the transport of O2 and CO2 by the blood depends on both diffusion and the flow of blood. We now consider quantitatively the factors responsible for these effects.
Diffusion of Oxygen from the Alveoli to the Pulmonary Capillary Blood The top part of Figure 41-1 shows a pulmonary alveolus adjacent to a pulmonary capillary, demonstrating diffusion of O2 between alveolar air and pulmonary blood.
The Po2 of the gaseous O2 in the alveolus averages 104 mm Hg. The Po2 of the venous blood entering the pulmonary capillary at its arterial end averages only 40 mm Hg because a large amount of O2 was removed from this blood as it passed through the peripheral tissues.
Therefore, the initial pressure difference that causes O2 to diffuse into the pulmonary capillary is 104 − 40 mm Hg, or 64 mm Hg.
In the graph at the bottom of the figure, the curve shows the rapid rise in blood Po2 as the blood passes through the capillary. The blood Po2 rises almost to that of the alveolar air by the time the blood has moved a third of the distance through the capillary, becoming almost 104 mm Hg.
Oxygen Uptake During Exercise During strenuous exercise, a person’s body may require as much as 20 times the normal amount of oxygen. Also, because of increased cardiac output during exercise, the time that the blood remains in the pulmonary capillary may be reduced to less than one-half normal.
Yet, because of the great safety factor for diffusion of O2 through the pulmonary membrane, the blood still becomes almost saturated with O2 by the time it leaves the pulmonary capillaries. This can be explained as follows.
First, in Chapter 40, we pointed out that the diffusing capacity for O2 increases almost threefold during exercise. This results mainly from increased surface area of capillaries participating in the diffusion and also from a more nearly ideal ventilation-perfusion ratio in the upper part of the lungs.
Second, note in the curve of Figure 41-1 that under nonexercising conditions, the blood becomes almost saturated with O2 by the time it has passed through one-third of the pulmonary capillary, and little additional O2 normally enters the blood during the latter two-thirds of its transit.
That is, the blood normally stays in the lung capillaries about three times as long as needed to cause full oxygenation. Therefore, during exercise, even with a shortened time of exposure in the capillaries, the blood can still become almost fully oxygenated.
Transport of Oxygen in Arterial Blood About 98% of the blood that enters the left atrium from the lungs has just passed through the alveolar capillaries and has become oxygenated up to a Po2 of about 104 mm Hg.
Another 2% of the blood has passed from the aorta through the bronchial circulation, which supplies mainly the deep tissues of the lungs and is not exposed to lung air. This blood flow is called shunt flow, meaning that blood is shunted past the gas exchange areas.
On leaving the lungs, the Po2 of the shunt blood is approximately that of normal systemic venous blood—about 40 mm Hg. When this blood combines in the pulmonary veins with the oxygenated blood from the alveolar capillaries, this so-called venous admixture of blood causes the Po2 of the blood entering the left heart and pumped into the aorta to fall to about 95 mm Hg.
These changes in blood Po2 at different points in the circulatory system are shown in Figure 41-2.
Diffusion of Oxygen from the Peripheral Capillaries into the Tissue Fluid When the arterial blood reaches the peripheral tissues, its Po2 in the capillaries is still 95 mm Hg. Yet, as shown in Figure 41-3, the Po2 in the interstitial fluid that surrounds the tissue cells averages only 40 mm Hg.
Thus, there is a large initial pressure difference that causes O2 to diffuse rapidly from the capillary blood into the tissues—so rapidly that the capillary Po2 falls almost to equal the 40-mm Hg pressure in the interstitium.
Therefore, the Po2 of the blood leaving the tissue capillaries and entering the systemic veins is also about 40 mm Hg.
Effect of Blood Flow on Interstitial Fluid Po2 If the blood flow through a particular tissue is increased, greater quantities of O2 are transported into the tissue, and the tissue Po2 becomes correspondingly higher. This effect is shown in Figure 41-4.
Note that an increase in flow to 400% of normal increases the Po2 from 40 mm Hg (at point A in the figure) to 66 mm Hg (at point B).
However, the upper limit to which the Po2 can rise, even with maximal blood flow, is 95 mm Hg because this is the O2 pressure in the arterial blood.
Conversely, if blood flow through the tissue decreases, the tissue Po2 also decreases, as shown at point C.
Effect of Tissue Metabolism on Interstitial Fluid Po2 If the cells use more O2 for metabolism than normal, the interstitial fluid Po2 is reduced. Figure 41-4 also demonstrates this effect.
Oxygen Partial Pressures in Different Compartments Location Po2 (mm Hg) Alveoli 104 Pulmonary capillary (arterial end) 40 Pulmonary capillary (venous end) ~104 Systemic arterial blood 95 Systemic capillaries (interstitial fluid) 40 Tissue cells ~40 Safety Factor for Pulmonary Gas Exchange Condition Normal Exercise Blood transit time in pulmonary capillary 3× needed Reduced by &gt;50% O2 saturation at end of capillary ~100% ~100% Diffusing capacity increase Baseline ~3× increase Figure 41-1. Uptake of oxygen by the pulmonary capillary blood. (Data from Milhorn HT Jr, Pulley PE Jr: A theoretical study of pulmonary capillary gas exchange and venous admixture. Biophys J 8:337, 1968.)
Figure 41-2. Changes in Po2 in the pulmonary capillary blood, systemic arterial blood, and systemic capillary blood demonstrating the effect of venous admixture.
Figure 41-3. Diffusion of oxygen from a peripheral tissue capillary to the cells. (Po2 in interstitial fluid = 40 mm Hg; in tissue cells, Pco2 = 23 mm Hg.)
Figure 41-4. Effect of blood flow and rate of oxygen consumption on tissue Po2.
Key Points on Figure 41-4:
Point A: Normal blood flow and normal O2 consumption → Po2 = 40 mm Hg Point B: 4× normal blood flow, normal O2 consumption → Po2 = 66 mm Hg Point C: 1/4 normal blood flow, normal O2 consumption → Po2 falls significantly With 4× normal O2 consumption and normal blood flow, Po2 would fall much lower Upper limit of Po2 (95 mm Hg) is reached with maximal flow and minimal consumption "></div><div data-title="Propulsion and Mixing of Food in the Alimentary Tract"

                     data-content="—## DEFECATION Most of the time, the rectum is empty of feces, partly because a weak functional sphincter exists about 20 centimeters from the anus at the juncture between the sigmoid colon and the rectum. A sharp angulation is also present here that contributes additional resistance to filling of the rectum. When a mass movement forces feces into the rectum, the desire for defecation occurs immediately, including reflex contraction of the rectum and relaxation of the anal sphincters. Continual dribble of fecal matter through the anus is prevented by tonic constriction of the following: (1) an internal anal sphincter, which is a several-centimeterslong thickening of the circular smooth muscle that lies immediately inside the anus; and (2) an external anal sphincter, composed of striated voluntary muscle that both surrounds the internal sphincter and extends distal to it. The external sphincter is controlled by nerve fibers in the pudendal nerve, which is part of the somatic nervous system and therefore is under voluntary, conscious, or at least subconscious control; subconsciously, the external sphincter is usually kept continuously constricted unless conscious signals inhibit the constriction. Defecation Reflexes. Ordinarily, defecation is initiated by defecation reflexes. One of these reflexes is an intrinsic reflex mediated by the local enteric nervous system in the rectal wall. When feces enter the rectum, distention of the rectal wall initiates afferent signals that spread through the myenteric plexus to initiate peristaltic waves in the descending colon, sigmoid, and rectum, forcing feces toward the anus. As the peristaltic wave approaches the anus, the internal anal sphincter is relaxed by inhibitory signals from the myenteric plexus; if the external anal sphincter is also consciously, voluntarily relaxed at the same time, defecation occurs. Normally when the intrinsic myenteric defecation reflex is functioning by itself, it is relatively weak. To be effective in causing defecation, it usually must be fortified by another type of defecation reflex called a parasympathetic defecation reflex that involves the sacral segments of the spinal cord, shown in Figure 64-6. When the nerve endings in the rectum are stimulated, signals are transmitted first into the spinal cord and then reflexly back to the descending colon, sigmoid, rectum, and anus via parasympathetic nerve fibers in the pelvic nerves. These parasympathetic signals greatly intensify the peristaltic waves and relax the internal anal sphincter, thus converting the intrinsic myenteric defecation reflex from a weak effort into a powerful process of defecation that is sometimes Rectum External anal sphincter Internal anal sphincter Descending colon From conscious cortex Afferent nerve fibers Parasympathetic nerve fibers (pelvic nerves) Sigmoid colon Skeletal motor nerve &gt; Figure 64-6. Afferent and efferent pathways of the parasympathetic mechanism for enhancing the defecation reflex. UNIT XII Gastrointestinal Physiology effective in emptying the large bowel all the way from the splenic flexure of the colon to the anus. Defecation signals entering the spinal cord initiate other effects, such as taking a deep breath, closure of the glottis, and contraction of the abdominal wall muscles to force the fecal contents of the colon downward, and at the same time they cause the pelvic floor to relax downward and pull outward on the anal ring to evaginate the feces. When it becomes convenient for the person to defecate, the defecation reflexes can purposely be activated by taking a deep breath to move the diaphragm downward and then contracting the abdominal muscles to increase the pressure in the abdomen, thus forcing fecal contents into the rectum to cause new reflexes. Reflexes initiated in this way are almost never as effective as those that arise naturally, and thus people who too often inhibit their natural reflexes are likely to become severely constipated. In newborns and in some people with transected spinal cords, the defecation reflexes cause automatic emptying of the lower bowel at inconvenient times during the day because of lack of conscious control exercised through voluntary contraction or relaxation of the external anal sphincter. OTHER AUTONOMIC REFLEXES THAT ## AFFECT BOWEL ACTIVITY Aside from the duodenocolic, gastrocolic, gastroileal, enterogastric, and defecation reflexes that have been discussed in this chapter, several other important nervous reflexes also can affect the overall degree of bowel activity. They are the peritoneointestinal reflex, renointestinal reflex, and vesicointestinal reflex. The peritoneointestinal reflex results from irritation of the peritoneum; it strongly inhibits the excitatory enteric nerves and thereby can cause intestinal paralysis, especially in patients with peritonitis. The renointestinal and vesicointestinal reflexes inhibit intestinal activity as a result of kidney or bladder irritation, respectively. Bibliography Browning KN, Travagli RA: Central nervous system control of gastrointestinal motility and secretion and modulation of gastrointestinal functions. Compr Physiol 4:1339, 2014. Camilleri M: Physiological underpinnings of irritable bowel syndrome: neurohormonal mechanisms. J Physiol 592:2967, 2014. Farré R, Tack J: Food and symptom generation in functional gastrointestinal disorders: physiological aspects. Am J Gastroenterol 108:698, 2013. Ford AC, Lacy BE, Talley NJ: Irritable bowel syndrome. N Engl J Med 376:2566, 2017. ### Furness JB: The enteric nervous system and neurogastroenterology. Nat Rev Gastroenterol Hepatol 9:286, 2012. Gracie DJ, Hamlin PJ, Ford AC: The influence of the brain-gut axis in inflammatory bowel disease and possible implications for treatment. Lancet Gastroenterol Hepatol 4:632, 2019. Hockley JRF, Smith ESJ, Bulmer DC: Human visceral nociception: findings from translational studies in human tissue. Am J Physiol Gastrointest Liver Physiol 315: G464, 2018. Huizinga JD, Lammers WJ: Gut peristalsis is governed by a multitude of cooperating mechanisms. Am J Physiol Gastrointest Liver Physiol ## 296: G1, 2009. Kumral D, Zfass AM: Gut movements: a review of the physiology of gastrointestinal transit. Dig Dis Sci 63:2500, 2018. Lang IM, Medda BK, Shaker R: Characterization and mechanism of the esophago-esophageal contractile reflex of the striated muscle esophagus. Am J Physiol Gastrointest Liver Physiol 317: G304, 2019. Mittal RK: Regulation and dysregulation of esophageal peristalsis by the integrated function of circular and longitudinal muscle layers in health and disease. Am J Physiol Gastrointest Liver Physiol ## 311: G431, 2016. Ouyang A, Regan J, McMahon BP: Physiology of the upper segment, body, and lower segment of the esophagus. Ann N Y Acad Sci 1300:261, 2013. Sanders KM, Ward SM, Koh SD: Interstitial cells: regulators of smooth muscle function. Physiol Rev 94:859, 2014. Spencer NJ, Dinning PG, Brookes SJ, Costa M: Insights into the mechanisms underlying colonic motor patterns. J Physiol 594:4099, 2016. Szarka LA, Camilleri M: Methods for measurement of gastric motility. Am J Physiol Gastrointest Liver Physiol 296: G461, 2009. Throughout the gastrointestinal tract, secretory glands subserve two primary functions: (1) digestive enzymes are secreted in most areas of the alimentary tract, from the mouth to the distal end of the ileum; and (2) mucous glands located from the mouth to the anus provide mucus for lubrication and protection of all parts of the alimentary tract. Most digestive secretions are formed in response to the presence of food in the alimentary tract, and the quantity secreted in each segment of the tract is usually the amount needed for proper digestion. Furthermore, in some portions of the gastrointestinal tract, even the types of enzymes and other constituents of the secretions are varied in accordance with the types of food present. In this chapter we describe the different alimentary secretions, their functions, and regulation of their production. GENERAL PRINCIPLES OF ALIMENTARY ## TYPES OF ALIMENTARY TRACT GLANDS Several types of glands provide the different types of alimentary tract secretions. First, on the surface of the epithelium in most parts of the gastrointestinal tract are billions of single-cell mucous glands called simply mucous cells or sometimes goblet cells because they look like goblets. They function mainly in response to local irritation of the epithelium: They extrude mucus directly onto the epithelial surface to act as a lubricant that also protects the surfaces from excoriation and digestion. Second, many surface areas of the gastrointestinal tract are lined by pits that represent invaginations of the epithelium into the submucosa. In the small intestine, these pits, called crypts of Lieberkühn, are deep and contain specialized secretory cells. One of these cells is shown in Figure 65-1. Third, in the stomach and upper duodenum are large numbers of deep tubular glands. A typical tubular gland can be seen in Figure 65-4, which shows an acidand pepsinogen-secreting gland of the stomach (oxyntic gland). Fourth, also associated with the alimentary tract are several complex glands—the salivary glands, pancreas, and liver—that provide secretions for digestion or emulsification of food. The liver has a highly specialized structure that is discussed in Chapter 71. The salivary glands and the pancreas are compound acinous glands of the type shown in Figure 65-2. These glands lie outside the walls of the alimentary tract and, in this aspect, they differ from all other alimentary glands. They contain millions of acini lined with secreting glandular cells; these acini feed into a system of ducts that finally empty into the alimentary tract. BASIC MECHANISMS OF STIMULATION OF ## THE ALIMENTARY TRACT GLANDS Contact of Food With Gut Epithelium Activates the Enteric Nervous System and Stimulates Secretion The presence of food in a particular segment of the gastrointestinal tract usually stimulates the glands of that region and adjacent regions to secrete moderate to large quantities of juices. Part of this local effect, especially the secretion of mucus by mucous cells, results from direct contact stimulation of the surface glandular cells by the food. Secretory Functions of the Alimentary Tract Zymogen granules Ribosomes Mitochondria Nerve fiber Basement membrane Endoplasmic reticulum Golgi apparatus Secretion Capillary &gt; Figure 65-1. Typical function of a glandular cell for formation and secretion of enzymes and other secretory substances. UNIT XII Gastrointestinal Physiology In addition, local epithelial stimulation also activates the enteric nervous system of the gut wall. The types of stimuli that activate this system are (1) tactile stimulation, (2) chemical irritation, and (3) distention of the gut wall. The resulting nervous reflexes stimulate the mucous cells on the gut epithelial surface and the deep glands in the gut wall to increase their secretion. Autonomic Stimulation of Secretion Parasympathetic Stimulation Increases Alimentary Tract Glandular Secretion Rate. Stimulation of the parasympathetic nerves to the alimentary tract almost invariably increases the rates of alimentary glandular secretion. This increased secretion rate is especially true of the glands in the upper portion of the tract (innervated by the glossopharyngeal and vagus parasympathetic nerves) such as the salivary glands, esophageal glands, gastric glands, pancreas, and Brunner’s glands in the duodenum. It is also true of some glands in the distal portion of the large intestine, which are innervated by pelvic parasympathetic nerves. Secretion in the remainder of the small intestine and in the first two-thirds of the large intestine occurs mainly in response to local neural and hormonal stimuli in each segment of the gut. Sympathetic Stimulation Has a Dual Effect on Alimentary Tract Glandular Secretion Rate. Stimulation of the sympathetic nerves going to the gastrointestinal tract causes a slight to moderate increase in secretion by some of the local glands. However, sympathetic stimulation also constricts the blood vessels that supply the glands. Therefore, sympathetic stimulation can have a dual effect: (1) sympathetic stimulation alone usually slightly increases secretion, and (2) if parasympathetic or hormonal stimulation is already causing copious secretion by the glands, superimposed sympathetic stimulation usually reduces secretion, sometimes significantly, mainly because of vasoconstrictive reduction of the blood supply. Regulation of Glandular Secretion by Hormones. In the stomach and intestine, several different gastrointestinal hormones help regulate the volume and composition of the secretions. These hormones are liberated from the gastrointestinal mucosa in response to the presence of food in the lumen of the gut. The hormones are then absorbed into the blood and carried to the glands, where they stimulate secretion. This type of stimulation is particularly valuable to increase the output of gastric juice and pancreatic juice when food enters the stomach or duodenum. Chemically, the gastrointestinal hormones are polypeptides or polypeptide derivatives and will be discussed in more detail later. BASIC MECHANISM OF SECRETION BY ## GLANDULAR CELLS Secretion of Organic Substances. Although all the basic mechanisms by which glandular cells function are not known, experimental evidence points to the following principles of secretion, as shown in Figure 65-1.
The nutrient material needed for formation of the secretion must first diffuse or be actively transported by the blood in the capillaries into the base of the glandular cell. 2. Many mitochondria located inside the glandular cell near its base use oxidative energy to form adenosine triphosphate (ATP). 3. Energy from the ATP, along with appropriate substrates provided by the nutrients, is then used to synthesize the organic secretory substances; this synthesis occurs almost entirely in the endoplasmic reticulum and Golgi complex of the glandular cell. Ribosomes adherent to the reticulum are specifically responsible for formation of proteins that are secreted. 4. The secretory materials are transported through the tubules of the endoplasmic reticulum, passing in about 20 minutes all the way to the vesicles of the Golgi complex. 5. In the Golgi complex, the materials are modified, added to, concentrated, and discharged into the cytoplasm in the form of secretory vesicles, which are stored in the apical ends of the secretory cells. 6. These vesicles remain stored until nervous or hormonal control signals cause the cells to extrude the vesicular contents through the cells’surface. This action probably occurs in the following way. The hormone binds to its receptor and, through one of several possible cell signaling mechanisms, increases the cell membrane permeability to calcium ions. Calcium enters the cell and causes many of the vesicles to fuse with the apical cell membrane. The apical cell membrane then breaks open, thus emptying the vesicles to the exterior; this process is called exocytosis. Primary secretion: Ptyalin Mucus Extracellular fluid Saliva Na&#43; active absorption Cl− passive absorption K&#43; active secretion HCO3− secretion &gt; Figure 65-2. Formation and secretion of saliva by a submandibular salivary gland. "></div><div data-title="Protein Metabolism"

                     data-content="Peptide Linkages and Protein Structure Formation of Peptide Linkages In the reaction that forms a peptide linkage:
The nitrogen of the amino radical of one amino acid bonds with the carbon of the carboxyl radical of the other amino acid A hydrogen ion is released from the amino radical A hydroxyl ion is released from the carboxyl radical These two ions combine to form a molecule of water After the peptide linkage has been formed:
An amino radical remains at one end A carboxyl radical remains at the opposite end Each radical can combine with additional amino acids to form a peptide chain Some complicated protein molecules have many thousands of amino acids combined by peptide linkages.
Even the smallest protein molecule usually has more than 20 amino acids.
The average is about 400 amino acids.
Other Linkages in Protein Molecules Some protein molecules are composed of several peptide chains rather than a single chain.
These chains are bound by other linkages, often by hydrogen bonding between the CO and NH radicals of the peptides.
Many peptide chains are coiled or folded.
The successive coils or folds are held by hydrogen bonding and other forces.
Transport and Storage of Amino Acids Blood Amino Acids The normal concentration of amino acids in blood is between 35 and 65 mg/dL.
This averages about 2 mg/dL for each of the 20 amino acids.
Some amino acids are present in far greater amounts than others.
Because amino acids are relatively strong acids, they exist principally in the ionized state.
This results from the removal of one hydrogen atom from the NH₂ radical.
They account for 2 to 3 milliequivalents of negative ions in the blood.
The distribution of different amino acids depends partly on the types of proteins eaten.
Concentrations of some amino acids are regulated by selective synthesis in cells.
Fate of Absorbed Amino Acids The products of protein digestion and absorption are almost entirely amino acids.
Only rarely are polypeptides or whole protein molecules absorbed directly into blood.
Soon after a meal, blood amino acid concentration rises, but the increase is usually only a few mg/dL.
This is because:
Slow digestion and absorption: Protein digestion and absorption are extended over 2–3 hours, allowing only small quantities to be absorbed at a time.
Rapid cellular uptake: After entering blood, amino acids are absorbed within 5–10 minutes by cells throughout the body, especially the liver.
Large concentrations of amino acids almost never accumulate in blood and tissue fluids.
The turnover rate is so rapid that many grams of proteins can be carried from one part of the body to another each hour.
Active Transport of Amino Acids Amino acid molecules are too large to diffuse readily through cell membrane pores.
Significant quantities enter cells only via active transport mechanisms.
Essential and Nonessential Amino Acids Essential Amino Acids The body can synthesize most amino acids from other compounds.
However, 10 essential amino acids cannot be synthesized in sufficient quantities and must be obtained from food.
Amino Acid Notes Threonine Essential Valine Essential Tryptophan Essential Isoleucine Essential Leucine Essential Phenylalanine Essential Methionine Essential Lysine Essential Histidine Essential (in children) Arginine Essential (in children) Nonessential Amino Acids Amino Acid Notes Alanine Nonessential Glycine Nonessential Proline Nonessential Glutamine Nonessential Asparagine Nonessential Serine Nonessential Cysteine Nonessential Aspartic acid Nonessential Glutamic acid Nonessential Tyrosine Nonessential Deamination and Urea Formation Deamination of Amino Acids Deamination is the process of removing the amino group from amino acids.
Excess amino acids in cells — especially in the liver — induce activation of large quantities of aminotransferases.
These are the enzymes responsible for initiating most deamination.
After deamination, amino groups are transferred to α-ketoglutarate, forming glutamate.
The glutamate can then undergo oxidative deamination, releasing ammonia.
The cycle can be repeated again and again.
Urea Formation by the Liver The ammonia released during deamination is removed from blood almost entirely by conversion into urea.
Two molecules of ammonia (NH₃) and one molecule of carbon dioxide (CO₂) combine:
2 ( a N m H m ₃ o n &#43; i a C ) O ₂ → ( H c ₂ a N r - b C o O n - N d H i ₂ o x &#43; i d 2 e ) H ₂ ( O u r e a ) ( w a t e r ) Essentially all urea formed in the human body is synthesized in the liver.
In the absence of the liver or in persons with serious liver disease, ammonia accumulates in the blood.
This accumulation is extremely toxic, especially to the brain.
It can lead to a state called hepatic coma.
Stages of Urea Formation O r n i t C A U h i r r i t g e n ↓ r ↓ i ↓ a e u n l i ( &#43; &#43; &#43; l &#43; n A H i N e r O C ₂ n H g r O O e ₃ i n ₂ ) , n i a t &#43; − s h H e i N ₂ , n H O e ₃ ) &#43; H ₂ O ) After formation, urea diffuses from liver cells into body fluids.
It is excreted by the kidneys.
Oxidation of Deaminated Amino Acids Once amino acids have been deaminated, the resulting keto acids can be oxidized to release energy.
This oxidation usually involves two processes:
The keto acid is changed into a substance that can enter the citric acid cycle. This substance is degraded by the cycle, releasing energy similarly to acetyl-CoA from carbohydrate and lipid metabolism. The amount of ATP formed per gram of protein oxidized is slightly less than that formed per gram of glucose oxidized.
Gluconeogenesis and Ketogenesis Certain deaminated amino acids can be used by liver cells to synthesize glucose or fatty acids.
Example — Alanine:
Deaminated alanine becomes pyruvic acid Pyruvic acid can be converted into glucose, glycogen, or acetyl-CoA Acetyl-CoA can be polymerized into fatty acids Two molecules of acetyl-CoA can condense to form acetoacetic acid, one of the ketone bodies.
Definitions Process Description Gluconeogenesis Conversion of amino acids into glucose or glycogen Ketogenesis Conversion of amino acids into keto acids or fatty acids Amino Acid Conversion Capacity Outcome Number of amino acids Can be converted into glucose 18 Can be converted into fatty acids 19 Obligatory Degradation of Proteins Daily Protein Loss When a person eats no proteins, a certain proportion of body proteins is degraded into amino acids and then deaminated and oxidized.
This involves 20 to 30 grams of protein each day.
This is called the obligatory loss of proteins.
To prevent net protein loss, a minimum of 20–30 grams of protein must be ingested each day.
However, a minimum of 60–75 grams is usually recommended for safety.
Complete vs. Partial Proteins The ratios of different amino acids in dietary protein must match those in body tissues.
This is necessary for dietary protein to be fully usable for new tissue proteins.
If one essential amino acid is low in concentration, the others become unusable.
Cells synthesize either whole proteins or none at all.
The unusable amino acids are deaminated and oxidized.
Complete protein has proper amino acid ratios (e.g., eggs, meat).
Partial or incomplete protein has different ratios and is less valuable for nutrition.
Effect of Starvation Except for the 20–30 grams of obligatory degradation, the body uses carbohydrates and fats for energy when available.
After several weeks of starvation, when carbohydrates and fats are depleted, amino acids are rapidly deaminated and oxidized for energy.
Proteins then degrade rapidly — as much as 125 grams daily.
Cellular functions deteriorate precipitously.
Because carbohydrate and fat are used in preference to protein for energy, they are called protein sparers.
Hormonal Regulation of Protein Metabolism Growth Hormone Growth hormone causes tissue proteins to increase.
The precise mechanism is not fully understood, but it results mainly from:
Increased transport of amino acids through cell membranes Accelerated DNA and RNA transcription and translation for protein synthesis Decreased oxidation of tissue proteins Insulin Total lack of insulin reduces protein synthesis to almost zero.
Insulin effects:
Accelerates transport of some amino acids into cells Reduces protein degradation Increases glucose availability, reducing amino acid use for energy Glucocorticoids Glucocorticoids secreted by the adrenal cortex:
Decrease protein quantity in most tissues Increase plasma amino acid concentration Increase liver proteins and plasma proteins Increase rate of breakdown of extrahepatic proteins This makes increased quantities of amino acids available.
The liver can then synthesize hepatic cellular proteins and plasma proteins.
Testosterone Testosterone causes increased deposition of protein, especially in muscles — a 30%–50% increase in contractile proteins.
The mechanism differs from growth hormone:
Growth hormone causes tissues to continue growing almost indefinitely Testosterone causes muscles and other protein tissues to enlarge for only several months Once maximum muscle size is reached, further protein deposition ceases despite continued testosterone administration.
Estrogen Estrogen causes some deposition of protein.
The effect is much less than that of testosterone.
Thyroxine Thyroxine increases cell metabolism.
If carbohydrates and fats are insufficient for energy, thyroxine causes rapid protein degradation and uses proteins for energy.
If adequate energy sources and excess amino acids are available, thyroxine can increase protein synthesis.
In growing animals or human beings, thyroxine deficiency greatly inhibits growth due to lack of protein synthesis.
Thyroxine has little specific effect on protein metabolism but has an important general effect by increasing rates of both anabolic and catabolic protein reactions.

                     data-content="Fluid in the Pleural Cavity When the lungs expand and contract during normal breathing, they slide back and forth within the pleural cavity. To facilitate this movement, a thin layer of mucoid fluid lies between the parietal and visceral pleurae.
Figure 39-9 shows the dynamics of fluid exchange in the pleural space. The pleural membrane is a porous, mesenchymal, serous membrane through which small amounts of interstitial fluid transude continually into the pleural space.
These fluids carry tissue proteins with them, giving the pleural fluid a mucoid characteristic. This characteristic is what allows extremely easy slippage of the moving lungs.
Total Pleural Fluid Volume The total amount of fluid in each pleural cavity is normally slight—only a few milliliters. Whenever the quantity becomes more than barely enough to begin flowing in the pleural cavity, the excess fluid is pumped away by lymphatic vessels opening directly from the pleural cavity into the following:
The mediastinum The superior surface of the diaphragm The lateral surfaces of the parietal pleura Therefore, the pleural space—the space between the parietal and visceral pleurae—is called a potential space because it normally is so narrow that it is not obviously a physical space.
Negative Pressure in Pleural Fluid A negative force is always required on the outside of the lungs to keep the lungs expanded. This force is provided by negative pressure in the normal pleural space.
The basic cause of this negative pressure is pumping of fluid from the space by the lymphatics. This is also the basis of the negative pressure found in most tissue spaces of the body.
Because the normal collapse tendency of the lungs is about −4 mm Hg, the pleural fluid pressure must always be at least as negative as −4 mm Hg to keep the lungs expanded.
Actual measurements have shown that the pressure is usually about −7 mm Hg. This is a few millimeters of mercury more negative than the collapse pressure of the lungs.
Thus, the negativity of the pleural fluid pressure keeps the normal lungs pulled against the parietal pleura of the chest cavity, except for an extremely thin layer of mucoid fluid that acts as a lubricant.
Pleural Effusion — Collection of Large Amounts of Free Fluid in the Pleural Space Pleural effusion is analogous to edema fluid in the tissues and can be called edema of the pleural cavity.
The causes of the effusion are the same as the causes of edema in other tissues (discussed in Chapter 25):
Cause Mechanism Blockage of lymphatic drainage from the pleural cavity Impaired fluid removal Cardiac failure Excessively high peripheral and pulmonary capillary pressures leading to excessive transudation of fluid into the pleural cavity Greatly reduced plasma colloid osmotic pressure Allows excessive transudation of fluid Infection or inflammation of the pleural surfaces Increases permeability of the capillary membranes and allows rapid dumping of plasma proteins and fluid into the cavity Fluid Exchange Dynamics Figure 39-9. Dynamics of fluid exchange in the intrapleural space.
Figure 39-8. Rate of fluid loss into the lung tissues when the left atrial pressure (and pulmonary capillary pressure) is increased. (From Guyton AC, Lindsey AW: Effect of elevated left atrial pressure and decreased plasma protein concentration on the development of pulmonary edema. Circ Res 7:649, 1959.)
Key Points on Figure 39-8:
When left atrial pressure rises above normal (~5 mm Hg), fluid begins to accumulate in the lungs The rate of edema formation increases dramatically as left atrial pressure increases At very high left atrial pressures (35-45 mm Hg), the rate of edema formation is rapid and can lead to “dry weight of lung” being exceeded Pleural Pressure Summary Parameter Value Normal pleural pressure −7 mm Hg Lung collapse pressure −4 mm Hg Safety margin ~3 mm Hg Causes of Pleural Effusion Blocked lymphatic drainage — fluid cannot be removed Cardiac failure — increased capillary pressures cause transudation Low plasma proteins — reduced colloid osmotic pressure allows fluid to escape Inflammation/infection — increased capillary permeability dumps proteins and fluid "></div><div data-title="Pulmonary Ventilation"

                     data-content="Pulmonary Circulatory System Pulmonary Vessels The pulmonary artery extends only 5 centimeters beyond the apex of the right ventricle and then divides into right and left main branches that supply blood to the two respective lungs.
The pulmonary artery has a wall thickness one-third that of the aorta. The pulmonary arterial branches are short, and all the pulmonary arteries—even the smaller arteries and arterioles—have larger diameters than their counterpart systemic arteries.
This feature, combined with the fact that the vessels are thin and distensible, gives the pulmonary arterial tree a large compliance, averaging almost 7 ml/mm Hg. This is similar to that of the entire systemic arterial tree.
This large compliance allows the pulmonary arteries to accommodate the stroke volume output of the right ventricle.
The pulmonary veins, like the pulmonary arteries, are also short. They immediately empty their effluent blood into the left atrium.
Bronchial Vessels Blood also flows to the lungs through small bronchial arteries that originate from the systemic circulation, amounting to 1% to 2% of the total cardiac output.
This bronchial arterial blood is oxygenated blood, in contrast to the partially deoxygenated blood in the pulmonary arteries. It supplies the supporting tissues of the lungs, including the connective tissue, septa, and large and small bronchi.
After this bronchial and arterial blood passes through the supporting tissues, it empties into the pulmonary veins and enters the left atrium, rather than passing back to the right atrium.
Therefore, the flow into the left atrium and left ventricular output are about 1% to 2% greater than that of the right ventricular output.
Lymphatics Lymph vessels are present in all the supportive tissues of the lung, beginning in the connective tissue spaces that surround the terminal bronchioles, coursing to the hilum of the lung, and then mainly into the right thoracic lymph duct.
Particulate matter entering the alveoli is partly removed by these lymph vessels. Plasma protein leaking from the lung capillaries is also removed from the lung tissues, thereby helping to prevent pulmonary edema.
Pressures in the Pulmonary System Pressures in the Right Ventricle The pressure pulse curves of the right ventricle and pulmonary artery are shown in the lower portion of Figure 39-1. These curves are contrasted with the much higher aortic pressure curve shown in the upper portion of the figure.
The normal systolic pressure in the right ventricle averages about 25 mm Hg, and the diastolic pressure averages about 0 to 1 mm Hg. These values are only one-fifth those for the left ventricle.
Pressures in the Pulmonary Artery During systole, the pressure in the pulmonary artery is essentially equal to the pressure in the right ventricle, as also shown in Figure 39-1.
However, after the pulmonary valve closes at the end of systole, the ventricular pressure falls precipitously, whereas the pulmonary arterial pressure falls more slowly as blood flows through the lungs.
As shown in Figure 39-2, the systolic pulmonary arterial pressure normally averages about 25 mm Hg in the human being. The diastolic pulmonary arterial pressure is about 8 mm Hg, and the mean pulmonary arterial pressure is 15 mm Hg.
Pulmonary Capillary Pressure The mean pulmonary capillary pressure, as diagrammed in Figure 39-2, is about 7 mm Hg.
The importance of this low capillary pressure is discussed in detail later in the chapter in relation to fluid exchange functions of the pulmonary capillaries.
Left Atrial and Pulmonary Venous Pressures The mean pressure in the left atrium and major pulmonary veins averages about 2 mm Hg in the recumbent person, varying from as low as 1 mm Hg to as high as 5 mm Hg.
It usually is not feasible to measure someone’s left atrial pressure using a direct measuring device because it is difficult to pass a catheter through the heart chambers into the left atrium.
However, the left atrial pressure can be estimated with moderate accuracy by measuring the so-called pulmonary wedge pressure. This is measured by inserting a catheter first through a peripheral vein to the right atrium, then through the right side of the heart and through the pulmonary artery into one of the small branches of the pulmonary artery, and finally pushing the catheter until it wedges tightly in the small branch.
The pressure measured through the catheter, called the “wedge pressure,” is about 5 mm Hg. Because all blood flow has been stopped in the small wedged artery, and because the blood vessels extending beyond this artery make a direct connection with the pulmonary capillaries, this wedge pressure is usually only 2 to 3 mm Hg higher than the left atrial pressure.
When the left atrial pressure rises to high values, the pulmonary wedge pressure also rises. Therefore, wedge pressure measurements can be used to estimate changes in pulmonary capillary pressure and left atrial pressure in patients with congestive heart failure.
Blood Volume of the Lungs The blood volume of the lungs is about 450 ml, about 9% of the total blood volume of the entire circulatory system.
Approximately 70 ml of this pulmonary blood volume is in the pulmonary capillaries. The remainder is divided about equally between the pulmonary arteries and veins.
Lungs Serve as a Blood Reservoir Under various physiological and pathological conditions, the quantity of blood in the lungs can vary from as little as half-normal up to twice normal.
For example, when a person blows out air so hard that high pressure is built up in the lungs—such as when blowing a trumpet—as much as 250 ml of blood can be expelled from the pulmonary circulatory system into the systemic circulation.
Also, loss of blood from the systemic circulation by hemorrhage can be partly compensated for by the automatic shift of blood from the lungs into the systemic vessels.
Cardiac Pathology May Shift Blood Failure of the left side of the heart, or increased resistance to blood flow through the mitral valve as a result of mitral stenosis or mitral regurgitation, causes blood to dam up in the pulmonary circulation.
This sometimes increases the pulmonary blood volume as much as 100% and causes large increases in the pulmonary vascular pressures.
Because the volume of the systemic circulation is about nine times that of the pulmonary system, a shift of blood from one system to the other affects the pulmonary system greatly but usually has only mild systemic circulatory effects.
Blood Flow Through the Lungs and Its Distribution Blood flow through the lungs is essentially equal to the cardiac output. Therefore, the factors that control cardiac output—mainly peripheral factors, as discussed in Chapter 20—also control pulmonary blood flow.
Under most conditions, the pulmonary vessels act as distensible tubes that enlarge with increasing pressure and narrow when pressure decreases.
Pulmonary Pressure Summary Location Systolic (mm Hg) Diastolic (mm Hg) Mean (mm Hg) Right ventricle 25 0-1 — Pulmonary artery 25 8 15 Pulmonary capillary — — 7 Left atrium — — 2 Figure 39-1. Pressure pulse contours in the right ventricle, pulmonary artery, and aorta.
Figure 39-2. Pressures in the different vessels of the lungs. The red curve denotes arterial pulsations. D, Diastolic; M, mean; S, systolic.

                     data-content="Polycythemia Secondary Polycythemia Whenever the tissues become hypoxic because of too little oxygen in the breathed air—such as at high altitudes—or because of failure of oxygen delivery to the tissues, such as in cardiac failure, the blood-forming organs automatically produce large quantities of extra RBCs.
This condition is called secondary polycythemia. The RBC count commonly rises to 6 to 7 million/mm³, about 30% above normal.
Physiological Polycythemia A common type of secondary polycythemia, called physiological polycythemia, occurs in those who live at altitudes of 14,000 to 17,000 feet, where the atmospheric oxygen is very low.
The blood count is generally 6 to 7 million/mm³. This allows these people to perform reasonably high levels of continuous work, even in a rarefied atmosphere.
Polycythemia Vera (Erythremia) In addition to physiological polycythemia, a pathological condition known as polycythemia vera exists. In this condition, the RBC count may be 7 to 8 million/mm³ and the hematocrit may be 60% to 70% instead of the normal 40% to 45%.
Polycythemia vera is caused by a genetic aberration in the hemocytoblastic cells that produce the blood cells. The blast cells no longer stop producing RBCs when too many cells are already present.
This causes excess production of RBCs in the same manner that a breast tumor causes excess production of a specific type of breast cell. It usually causes excess production of white blood cells and platelets as well.
Blood Volume and Viscosity in Polycythemia Vera In polycythemia vera, not only does the hematocrit increase, but the total blood volume also increases, sometimes to almost twice normal.
As a result, the entire vascular system becomes intensely engorged. Many blood capillaries become plugged by the viscous blood.
The viscosity of the blood in polycythemia vera sometimes increases from the normal of 3 times the viscosity of water to 10 times that of water.
Effect of Polycythemia on Function of the Circulatory System Blood Flow and Venous Return Because of the greatly increased viscosity of blood in polycythemia, blood flow through the peripheral blood vessels is often very sluggish.
Increasing blood viscosity decreases the rate of venous return to the heart.
Conversely, the blood volume is greatly increased in polycythemia, which tends to increase venous return.
Actually, the cardiac output in polycythemia is not far from normal because these two factors more or less neutralize each other.
Arterial Pressure The arterial pressure is also normal in most people with polycythemia. However, in about one-third of them, the arterial pressure is elevated.
This means that the blood pressure–regulating mechanisms can usually offset the tendency for increased blood viscosity to increase peripheral resistance and, thereby, increase arterial pressure.
Beyond certain limits, however, these regulations fail, and hypertension develops.
Skin Color in Polycythemia Vera The color of the skin depends to a great extent on the quantity of blood in the skin subpapillary venous plexus.
In polycythemia vera, the quantity of blood in this plexus is greatly increased. Furthermore, because blood passes sluggishly through the skin capillaries before entering the venous plexus, a larger than normal quantity of hemoglobin is deoxygenated.
The blue color of all this deoxygenated hemoglobin masks the red color of the oxygenated hemoglobin. Therefore, a person with polycythemia vera ordinarily has a ruddy complexion, with a bluish (cyanotic) tint to the skin.
Leukocytes (White Blood Cells) The leukocytes, also called white blood cells, are the mobile units of the body’s protective system.
They are formed partially in the bone marrow (granulocytes and monocytes and a few lymphocytes) and partially in the lymph tissue (lymphocytes and plasma cells). After formation, they are transported in the blood to different parts of the body where they are needed.
The real value of WBCs is that most of them are specifically transported to areas of serious infection and inflammation, thereby providing a rapid and potent defense against infectious agents.
The granulocytes and monocytes have a special ability to “seek out and destroy” a foreign invader.
General Characteristics of Leukocytes Types of White Blood Cells Six types of WBCs are normally present in the blood:
Cell Type Characteristics Neutrophils Polymorphonuclear, granular Eosinophils Polymorphonuclear, granular Basophils Polymorphonuclear, granular Monocytes Non-granular Lymphocytes Non-granular Plasma cells Occasionally present in blood In addition, there are large numbers of platelets, which are fragments of another type of cell similar to the WBCs found in the bone marrow, the megakaryocyte.
The granulocytes and monocytes protect the body against invading organisms by ingesting them (by phagocytosis) or by releasing antimicrobial or inflammatory substances that have multiple effects aiding in destroying the offending organism.
The lymphocytes and plasma cells function mainly in connection with the immune system, as discussed in Chapter 35.
The function of platelets is specifically to activate the blood-clotting mechanism, discussed in Chapter 37.
Concentrations of Different White Blood Cells in Blood An adult human has about 7000 WBCs per microliter of blood (in comparison with 5 million red blood cells [RBCs] per microliter).
The normal percentages of the different types are approximately:
White Blood Cell Type Percentage Neutrophils 62.0% Eosinophils 2.3% Basophils 0.4% Monocytes 5.3% Lymphocytes 30.0% The number of platelets in each microliter of blood is normally between 150,000 and 450,000, averaging about 300,000.
Genesis of White Blood Cells Myelocytic and Lymphocytic Lineages Early differentiation of the multipotential hematopoietic stem cell into the different types of committed stem cells was shown in Figure 33-2 in the previous chapter.
Aside from the cells committed to form RBCs, two major lineages of WBCs are formed: the myelocytic and lymphocytic lineages.
The left side of Figure 34-1 shows the myelocytic lineage, beginning with the myeloblast. The right side shows the lymphocytic lineage, beginning with the lymphoblast.
Sites of Production The granulocytes and monocytes are formed only in the bone marrow.
Lymphocytes and plasma cells are produced mainly in the various lymphogenous tissues—especially the lymph glands, spleen, thymus, tonsils, and various pockets of lymphoid tissue elsewhere in the body, such as in the bone marrow and in Peyer’s patches underneath the epithelium in the gut wall.
Bone Marrow Storage The WBCs formed in the bone marrow are stored in the marrow until they are needed in the circulatory system. Then, when the need arises, various factors cause them to be released.
Normally, about three times as many WBCs are stored in the marrow as circulate in the entire blood. This quantity represents about a 6-day supply of these cells.
The lymphocytes are mostly stored in the various lymphoid tissues, except for a small number that are temporarily being transported in the blood.
Platelet Formation As shown in Figure 34-1, megakaryocytes are also formed in the bone marrow. These megakaryocytes fragment in the bone marrow.
The small fragments, known as platelets (or thrombocytes), then pass into the blood. They are very important in the initiation of blood clotting.
Life Span of White Blood Cells Granulocytes The life of the granulocytes after being released from the bone marrow is normally 4 to 8 hours circulating in the blood. They then spend another 4 to 5 days in tissues where they are needed.
In times of serious tissue infection, this total life span is often shortened to only a few hours because the granulocytes proceed even more rapidly to the infected area, perform their functions, and in the process, are themselves destroyed.
Monocytes The monocytes also have a short transit time—10 to 20 hours in the blood—before wandering through the capillary membranes into the tissues.
Once in the tissues, they swell to much larger sizes to become tissue macrophages. In this form, they can live for months unless destroyed while performing phagocytic functions.
These tissue macrophages are the basis of the tissue macrophage system, which provides continuing defense against infection.
Lymphocytes Lymphocytes enter the circulatory system continually, along with drainage of lymph from the lymph nodes and other lymphoid tissue.
After a few hours, they pass out of the blood back into the tissues by diapedesis or extravasation. Then, they re-enter the lymph and return to the blood again and again.
Thus, there is continual circulation of lymphocytes through the body. Lymphocytes have life spans of weeks or months, depending on the body’s need for these cells.
Platelets The platelets in the blood are replaced about once every 10 days. In other words, about 30,000 platelets are formed each day for each microliter of blood.
Neutrophils and Macrophages Defend Against Infections It is mainly the neutrophils and tissue macrophages that attack and destroy invading bacteria, viruses, and other harmful agents.
Types of Polycythemia Type Cause RBC Count Secondary Polycythemia Tissue hypoxia (high altitude, cardiac failure) 6-7 million/mm³ Physiological Polycythemia Living at high altitude (14,000-17,000 ft) 6-7 million/mm³ Polycythemia Vera Genetic aberration of hemocytoblastic cells 7-8 million/mm³ Polycythemia Vera: Key Parameters Parameter Normal Polycythemia Vera Hematocrit 40-45% 60-70% Blood viscosity (vs. water) 3× Up to 10× Total blood volume Normal Up to 2× normal Genesis of White Blood Cells (Figure 34-1) Myelocytic lineage:

                     data-content="PREVENT EDEMA Putting together all the safety factors against edema, we find the following:
The safety factor caused by low tissue compliance in the negative pressure range is about 3 mm Hg. The safety factor caused by increased lymph flow is about 7 mm Hg. The safety factor caused by washdown of proteins from the interstitial spaces is about 7 mm Hg. Therefore, the total safety factor against edema is about 17 mm Hg. This means that the capillary pressure in a peripheral tissue could theoretically rise by 17 mm Hg, approximately double the normal value, before marked edema would occur.
FLUIDS IN POTENTIAL SPACES OF THE BODY Some examples of potential spaces are:
Pleural cavity Pericardial cavity Peritoneal cavity Synovial cavities (including joint cavities and bursae) Virtually all these potential spaces have surfaces that almost touch each other. Only a thin layer of fluid is between them, and the surfaces slide over each other. To facilitate the sliding, a viscous proteinaceous fluid lubricates the surfaces.
Fluid Exchange Between Capillaries and Potential Spaces The surface membrane of a potential space usually does not offer significant resistance to the passage of fluids, electrolytes, or even proteins. These all move back and forth between the space and interstitial fluid in the surrounding tissue with relative ease.
Therefore, each potential space is in reality a large tissue space. Fluid in the capillaries adjacent to the potential space diffuses not only into the interstitial fluid but also into the potential space.
Lymphatic Vessels Drain Protein From the Potential Spaces Proteins collect in the potential spaces because of leakage out of the capillaries. This is similar to the collection of protein in the interstitial spaces throughout the body. The protein must be removed through lymphatics or other channels and must be returned to the circulation.
Each potential space is directly or indirectly connected with lymph vessels. In some cases, such as the pleural cavity and peritoneal cavity, large lymph vessels arise directly from the cavity itself.
Edema Fluid in the Potential Spaces Is Called Effusion When edema occurs in the subcutaneous tissues adjacent to the potential space, edema fluid usually collects in the potential space as well. This fluid is called effusion.
Lymph blockage or any of the multiple abnormalities that can cause excessive capillary filtration can cause effusion, the same way that interstitial edema is caused.
The abdominal cavity is especially prone to collect effusion fluid. In this case, the effusion is called ascites. In serious cases, 20 liters or more of ascitic fluid can accumulate.
The other potential spaces can become seriously swollen when generalized edema is present, including the pleural cavity, pericardial cavity, and joint spaces.
Injury or local infection in any one of the cavities often blocks the lymph drainage, causing isolated swelling in the cavity.
Normal Pressure in Potential Spaces The dynamics of fluid exchange in the pleural cavity are discussed in detail in Chapter 39. These dynamics are mainly representative of all other potential spaces as well.
The normal fluid pressure in most or all of the potential spaces in the nonedematous state is negative, similar to how pressure is negative (subatmospheric) in loose subcutaneous tissue.
Space Interstitial Fluid Hydrostatic Pressure Pleural cavity −7 to −8 mm Hg Joint spaces −3 to −5 mm Hg Pericardial cavity −5 to −6 mm Hg FLUID INTAKE AND OUTPUT ARE BALANCED DURING STEADY-STATE CONDITIONS The relative constancy of the body fluids is remarkable. There is continuous exchange of fluid and solutes with the external environment, as well as exchange within the different body compartments.
Fluid added to the body is highly variable. It must be carefully matched by an equal output of water from the body to prevent body fluid volumes from increasing or decreasing.
DAILY INTAKE OF WATER Water is added to the body by two major sources:
Ingested in form of liquids or water in food: about 2100 ml/day Synthesized in the body by oxidation of carbohydrates: about 200 ml/day These mechanisms provide a total water intake of about 2300 ml/day. However, intake of water is highly variable among different people and even within the same person on different days, depending on climate, habits, and level of physical activity.
DAILY LOSS OF BODY WATER Insensible Water Loss Some water losses cannot be precisely regulated. Humans experience continuous water loss by evaporation from the respiratory tract and diffusion through the skin. Together these account for about 700 ml/day of water loss under normal conditions. This loss is termed insensible water loss. We are not consciously aware of it, even though it occurs continually in all living people.
Insensible water loss through the skin occurs independently of sweating. It is present even in people who are born without sweat glands. The average water loss by diffusion through the skin is about 300 to 400 ml/day. This loss is minimized by the cholesterol-filled, cornified layer of the skin, which provides a barrier against excessive loss by diffusion.
When the cornified layer becomes denuded, as occurs with extensive burns, the rate of evaporation can increase as much as 10-fold, or 3 to 5 L/day. Persons with burns must be given large amounts of fluid, usually given intravenously, to balance fluid loss.
Insensible water loss through the respiratory tract normally averages about 300 to 400 ml/day. As air enters the respiratory tract, it becomes saturated with moisture to a vapor pressure of about 47 mm Hg before it is expelled.
Because the vapor pressure of the inspired air is usually less than 47 mm Hg, water is continuously lost through the lungs with respiration. In cold weather, the atmospheric vapor pressure decreases to nearly 0, causing even greater loss of water from the lungs as temperature decreases. This explains the dry feeling in the respiratory passages in cold weather.
Fluid Loss in Sweat The amount of water lost by sweating is highly variable, depending on physical activity and environmental temperature. The volume of sweat normally is about 100 ml/day.
In very hot weather or during heavy exercise, fluid loss in sweat occasionally increases to 1 to 2 L/hour. This fluid loss would rapidly deplete the body fluids if intake were not also increased, done by activating the thirst mechanism (discussed in Chapter 29).
Water Loss in Feces Only a small amount of water (100 ml/day) normally is lost in the feces. This loss can increase to several liters a day in people with severe diarrhea. Severe diarrhea can be life-threatening if not corrected within a few days.
Water Loss by the Kidneys The remaining water loss from the body occurs in the urine excreted by the kidneys. Multiple mechanisms control the rate of urine excretion. The most important means whereby the body maintains balance between water intake and output, as well as a balance between intake and output of most electrolytes, is by controlling the rate at which the kidneys excrete these substances.
For example:
Urine volume can be as low as 0.5 L/day in a dehydrated person Urine volume can be as high as 20 L/day in a person who has been drinking tremendous amounts of water Variability of Electrolyte Intake This variability of intake is also true for most electrolytes of the body, such as sodium, chloride, and potassium. In some people, sodium intake may be as low as 20 mEq/day. In others, sodium intake may be as high as 300 to 500 mEq/day.
The kidneys have the task of adjusting the excretion rate of water and electrolytes to match the intake of these substances precisely. They also compensate for excessive losses of fluids and electrolytes that occur in certain disease states. These mechanisms are discussed in Chapters 26 through 32.
BODY FLUID COMPARTMENTS The total body fluid is distributed mainly between two compartments:
Extracellular fluid Intracellular fluid Extracellular fluid is divided into:
Interstitial fluid Blood plasma There is another small compartment of fluid referred to as transcellular fluid. This compartment includes fluid in:
Synovial spaces Peritoneal spaces Pericardial spaces Intraocular spaces Cerebrospinal fluid It is usually considered to be a specialized type of extracellular fluid. In some cases, its composition may differ markedly from that of plasma or interstitial fluid. All the transcellular fluids together constitute about 1 to 2 liters.
Total Body Water in a 70-kg Adult Man In a 70-kg adult man, total body water is about 60% of body weight, or about 42 liters.
This percentage depends on age, sex, and degree of obesity. As a person grows older, the percentage of total body weight that is fluid gradually decreases due in part to the fact that aging is usually associated with an increased percentage of body weight being fat. Fat decreases the percentage of water in the body.
Because women normally have a greater percentage of body fat compared with men, their total body water averages about 50% of body weight.
In premature and newborn babies, total body water ranges from 70% to 75% of body weight.
Therefore, when discussing average body fluid compartments, variations exist depending on age, sex, and percentage of body fat.
Body Fluid Distribution Compartment Volume (70-kg adult) Percentage of Body Weight Total body water 42 L 60% Intracellular fluid 28 L 40% Extracellular fluid 14 L 20% Interstitial fluid 11 L ~16% Plasma 3 L ~4% Transcellular fluid 1–2 L ~1–2% INTRACELLULAR FLUID COMPARTMENT About 28 of the 42 liters of fluid in the body are inside the trillions of cells. This is collectively called the intracellular fluid. Thus, the intracellular fluid constitutes about 40% of total body weight in an “average” person.
The fluid of each cell contains its individual mixture of different constituents. However, the concentrations of these substances are similar from one cell to another. The composition of cell fluids is remarkably similar, even in different animals, ranging from the most primitive organisms to humans.
Daily Water Balance Daily Water Intake and Output Intake (ml/day) Normal Prolonged Heavy Exercise Fluids ingested 2100 Increased From metabolism 200 200 Total intake 2300 &gt;2300 Output (ml/day) Normal Prolonged Heavy Exercise Insensible: skin 350 350 Insensible: lungs 350 650 Sweat 100 5000 Feces 100 100 Urine 1400 500 Total output 2300 ~6600 Figure 25-1. Summary of body fluid regulation, including the major body fluid compartments and the membranes that separate these compartments. The values shown are for an average 70-kg man.
