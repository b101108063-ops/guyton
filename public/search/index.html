                     data-content="INTRODUCTION For the cells of the body to function properly, they must be bathed in extracellular fluid with a relatively constant concentration of electrolytes.
The total concentration of solutes in the extracellular fluid—and therefore the osmolarity—must also be precisely regulated. This prevents the cells from shrinking or swelling.
The osmolarity is determined by the amount of solute (mainly sodium chloride) divided by the volume of the extracellular fluid. Thus, to a large extent, extracellular fluid osmolarity and sodium chloride concentration are regulated by the amount of extracellular water.
The total body water is controlled by:
Fluid intake: which is regulated by factors that determine thirst Renal water excretion: which is controlled by multiple factors that influence glomerular filtration and tubular reabsorption Topics Covered in This Chapter This chapter discusses:
Mechanisms that cause the kidneys to eliminate excess water by excreting a dilute urine Mechanisms that cause the kidneys to conserve water by excreting a concentrated urine Renal feedback mechanisms that control the extracellular fluid sodium concentration and osmolarity Thirst and salt appetite mechanisms that determine the intakes of water and salt These help control extracellular fluid volume, osmolarity, and sodium concentration.
KIDNEYS EXCRETE EXCESS WATER BY FORMING DILUTE URINE Normal kidneys have a tremendous capability to vary the relative proportions of solutes and water in the urine in response to various challenges.
When there is excess water in the body and body fluid osmolarity is reduced, the kidneys can excrete urine with an osmolarity as low as 50 mOsm/L, only about one-sixth the osmolarity of normal extracellular fluid.
Conversely, when there is a deficit of water in the body and extracellular fluid osmolarity is high, the kidneys can excrete highly concentrated urine with an osmolarity of 1200 to 1400 mOsm/L.
Equally important, the kidneys can excrete a large volume of dilute urine or a small volume of concentrated urine without major changes in rates of excretion of solutes such as sodium and potassium. This ability to regulate water excretion independently of solute excretion is necessary for survival, especially when fluid intake is limited.
Urine Concentration Range Condition Urine Osmolarity Maximum dilution 50 mOsm/L (1/6 of plasma) Normal plasma 300 mOsm/L Maximum concentration 1200–1400 mOsm/L ANTIDIURETIC HORMONE CONTROLS URINE CONCENTRATION The body has a powerful feedback system for regulating plasma osmolarity and sodium concentration by altering renal excretion of water independently of solute excretion rate. A primary effector of this feedback is antidiuretic hormone (ADH), also called vasopressin.
When ADH Is Secreted When osmolarity of the body fluids increases above normal (the solutes become too concentrated), the posterior pituitary gland secretes more ADH. This increases the permeability of the distal tubules and collecting ducts to water, increasing water reabsorption and decreasing urine volume without markedly altering the rate of renal excretion of the solutes.
When ADH Secretion Decreases When there is excess water in the body and extracellular fluid osmolarity is reduced, secretion of ADH by the posterior pituitary decreases. This reduces the permeability of the distal tubule and collecting ducts to water, causing increased amounts of more dilute urine to be excreted. Thus, the rate of ADH secretion determines, to a large extent, whether the kidney excretes dilute or concentrated urine.
RENAL MECHANISMS FOR EXCRETING DILUTE URINE When there is a large excess of water in the body, the kidney can excrete as much as 20 L/day of dilute urine with a concentration as low as 50 mOsm/L. The kidney performs this by continuing to reabsorb solutes without reabsorbing large amounts of water in the distal parts of the nephron, including the late distal tubule and collecting ducts.
Renal Responses After Water Ingestion Figure 29-1 shows the approximate renal responses after ingestion of 1 liter of water. Urine volume increased to about six times normal within 45 minutes after water ingestion. However, the total amount of solute excreted remained relatively constant, and urine formed became dilute with osmolarity decreasing from 600 to about 100 mOsm/L.
After ingestion of excess water, the kidney rids the body of excess water without excreting excess amounts of solutes.
Formation of Dilute Urine When the glomerular filtrate is initially formed, its osmolarity is about the same as that of plasma (300 mOsm/L). To excrete excess water, the filtrate is diluted as it passes along the tubule by reabsorbing solutes to a greater extent than water. This dilution occurs only in certain segments of the tubular system.
Tubular Fluid Remains Isosmotic in Proximal Tubules As fluid flows through the proximal tubule, solutes and water are reabsorbed in equal proportions, with little change in osmolarity. Thus, the proximal tubule fluid remains isosmotic to the plasma at about 300 mOsm/L.
Tubular Fluid Becomes Concentrated in Descending Loop of Henle As fluid passes down the descending loop of Henle, water is reabsorbed by osmosis. The tubular fluid reaches equilibrium with the surrounding interstitial fluid of the renal medulla, which is very hypertonic—about two to four times the osmolarity of the original glomerular filtrate. Therefore, the tubular fluid becomes more concentrated as it flows into the inner medulla.
Tubular Fluid Is Diluted in the Ascending Loop of Henle In the ascending limb of the loop of Henle, especially in the thick segment, sodium, potassium, and chloride are avidly reabsorbed. This portion of the tubular segment is impermeable to water, even in the presence of large amounts of ADH. Therefore, the tubular fluid becomes more dilute as it flows up the ascending loop of Henle, entering the early distal tubule with osmolarity decreasing progressively to about 100 mOsm/L.
Regardless of whether ADH is present or absent, fluid leaving the early distal tubular segment is hypo-osmotic, only about one-third the osmolarity of plasma.
Tubular Fluid in Distal and Collecting Tubules Is Further Diluted in Absence of ADH As the dilute fluid in the early distal tubule passes into the late distal convoluted tubule, cortical collecting duct, and medullary collecting duct, there is additional reabsorption of sodium chloride. In the absence of ADH, this portion of the tubule is also impermeable to water, and the additional reabsorption of solutes causes the tubular fluid to become even more dilute, with osmolarity decreasing to as low as 50 mOsm/L. The failure to reabsorb water and continued reabsorption of solutes lead to a large volume of dilute urine.
Summary: Formation of Dilute Urine Segment Water Reabsorption Solute Reabsorption Resulting Osmolarity Proximal tubule Equal to solutes Equal to water 300 mOsm/L (isosmotic) Descending loop Yes (water moves out) No Increases to 400–1200 mOsm/L Ascending loop No Yes (NaCl) Decreases to ~100 mOsm/L Distal tubule/collecting duct (no ADH) No Yes Further decreases to ~50 mOsm/L Distal tubule/collecting duct (high ADH) Yes Yes Increases to 300–1200 mOsm/L Key Concept The mechanism for forming dilute urine is to continue reabsorbing solutes from the distal segments of the tubular system while reducing water reabsorption.
In healthy kidneys, fluid leaving the ascending loop of Henle and early distal tubule is always dilute, regardless of the level of ADH. In the absence of ADH, the urine is further diluted in the late distal tubule and collecting ducts, and a large volume of dilute urine is excreted.
WATER DIURESIS When a person drinks excess water:
Plasma osmolarity decreases temporarily ADH secretion from the posterior pituitary decreases Water permeability of distal tubules and collecting ducts decreases Large volumes of dilute urine are excreted Plasma osmolarity returns to normal This process allows the body to eliminate excess water while preserving solutes.
Figure 29-1. Water diuresis in a person after ingestion of 1 liter of water. After water ingestion, urine volume increases and urine osmolarity decreases, causing excretion of a large volume of dilute urine; however, the total amount of solute excreted by the kidneys remains relatively constant.
Figure 29-2. Formation of dilute urine when antidiuretic hormone (ADH) levels are very low. In the ascending loop of Henle, the tubular fluid becomes very dilute. In the distal tubules and collecting tubules, the tubular fluid is further diluted by the reabsorption of sodium chloride and the failure to reabsorb water when ADH levels are very low.

                     data-content="HEPATIC CIRCULATION Blood Flow Through the Liver Blood flows through the liver from two sources:
Portal vein: delivers about 1050 ml/min Hepatic artery: delivers about 300 ml/min Total: about 1350 ml/min, which is 27% of the resting cardiac output Hepatic Vascular Resistance The pressure in the portal vein leading into the liver averages about 9 mm Hg. The pressure in the hepatic vein leading from the liver into the vena cava normally averages about 0 mm Hg.
This small pressure difference — only 9 mm Hg — shows that the resistance to blood flow through the hepatic sinusoids is normally very low. This is especially true when one considers that about 1350 ml/min of blood flow passes through this route.
CIRRHOSIS OF THE LIVER When liver parenchymal cells are destroyed, they are replaced with fibrous tissue that eventually contracts around the blood vessels. This greatly impedes the flow of portal blood through the liver — a disease process known as cirrhosis of the liver.
Common Causes of Cirrhosis Cause Description Chronic alcoholism Most common cause Nonalcoholic steatohepatitis (NASH) Fat accumulation &#43; liver inflammation Nonalcoholic fatty liver disease (NAFLD) Most common cause in industrialized countries; associated with obesity and type 2 diabetes Carbon tetrachloride poisoning Chemical toxin Viral hepatitis Infectious disease Bile duct obstruction Blocked bile ducts Infectious processes Infections in the bile ducts Portal Vein Obstruction The portal system can also be occasionally blocked by a large clot developing in the portal vein or its major branches.
When the portal system is suddenly blocked, the return of blood from the intestines and spleen through the liver portal blood flow system to the systemic circulation is impeded. This causes portal hypertension, with the capillary pressure in the intestinal wall increasing to 15 to 20 mm Hg above normal.
If the obstruction is not relieved, the patient may die within a few hours. This is because of excessive loss of fluid from the capillaries into the lumens and walls of the intestines.
THE LIVER AS A BLOOD RESERVOIR Because the liver is an expandable organ, large quantities of blood can be stored in its blood vessels.
The normal blood volume of the liver — including that in the hepatic veins and hepatic sinuses — is about 450 ml, or almost 10% of the body’s total blood volume.
When high pressure in the right atrium causes back-pressure in the liver, the liver expands. 0.5 to 1 liter of extra blood can be stored in the hepatic veins and sinuses.
This storage of extra blood occurs especially in cases of cardiac failure with peripheral congestion (discussed in Chapter 22).
Thus, the liver functions as a large, expandable, venous organ. It serves as a valuable blood reservoir in times of excess blood volume. It can also supply extra blood in times of diminished blood volume.
HEPATIC LYMPH FLOW Because the pores in the hepatic sinusoids are very permeable compared with capillaries in other tissues, they allow ready passage of both fluid and proteins into the spaces of Disse.
Therefore, the lymph draining from the liver usually has a protein concentration of about 6 g/dl. This is only slightly less than the protein concentration of plasma.
In addition, the high permeability of the liver sinusoid epithelium allows large quantities of lymph to form. About half of all the lymph formed in the body under resting conditions arises in the liver.
HIGH HEPATIC VASCULAR PRESSURES AND ASCITES When the pressure in the hepatic veins rises only 3 to 7 mm Hg above normal, excessive amounts of fluid begin to transude into the lymph. They also leak through the outer surface of the liver capsule directly into the abdominal cavity.
This fluid is almost pure plasma, containing 80% to 90% as much protein as normal plasma.
At vena caval pressures of 10 to 15 mm Hg, hepatic lymph flow increases to as much as 20 times normal. The “sweating” from the surface of the liver can be so great that it causes large amounts of free fluid in the abdominal cavity. This is called ascites.
Portal System Blockage Blockage of portal flow through the liver also causes high capillary pressures in the entire portal vascular system of the gastrointestinal tract. This results in:
Edema of the gut wall Transudation of fluid through the serosa of the gut into the abdominal cavity Ascites REGULATION OF LIVER MASS — REGENERATION The liver possesses a remarkable ability to restore itself after significant hepatic tissue loss. This can occur from either partial hepatectomy or acute liver injury.
As long as the injury is uncomplicated by viral infection or inflammation, the liver can regenerate. Partial hepatectomy — in which up to 70% of the liver is removed — causes the remaining lobes to enlarge and restore the liver to its original size.
This regeneration is remarkably rapid, requiring only 5 to 7 days in rats. During liver regeneration, hepatocytes are estimated to replicate once or twice. After the original size and volume of the liver are achieved, the hepatocytes revert to their usual quiescent state.
Control of Liver Regeneration Control of this rapid regeneration is not well understood. However, hepatocyte growth factor (HGF) appears to be important in causing liver cell division and growth.
Key facts about HGF:
Produced by mesenchymal cells in the liver and in other tissues — not by hepatocytes Blood levels of HGF rise more than 20-fold after partial hepatectomy Mitogenic responses are usually found only in the liver after these operations, suggesting HGF may be activated only in the affected organ Other Factors in Regeneration Other growth factors and cytokines involved in stimulating regeneration include:
Epidermal growth factor (EGF) Tumor necrosis factor (TNF) Interleukin 6 (IL-6) Termination of Regeneration After the liver has returned to its original size, the process of hepatic cell division is terminated.
The factors involved are not well understood. However, transforming growth factor-β (TGF-β) — a cytokine secreted by hepatic cells — is a potent inhibitor of liver cell proliferation. It has been suggested as the main terminator of liver regeneration.
LIVER LOBULE STRUCTURE Figure 71-1. Basic structure of a liver lobule, showing the liver cellular plates, the blood vessels, the bile-collecting system, and the lymph flow system composed of the spaces of Disse and the interlobular lymphatics.
Key structural components:
Component Description Liver cell plate Organization of hepatocytes Sinusoids Blood-filled spaces between liver cell plates Space of Disse Perisinusal space where lymph forms Portal vein Supplies portal blood to sinusoids Hepatic artery Supplies oxygenated blood Central vein Collects blood from sinusoids Bile canaliculi Collect bile from hepatocytes Kupffer cells Macrophages lining sinusoids Lymphatic duct Drains lymph from liver "></div></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    const dbElements = document.querySelectorAll("#search-database div");

    const searchData = Array.from(dbElements).map(el => ({
        title: el.getAttribute("data-title"),
        book: el.getAttribute("data-book"),
        category: el.getAttribute("data-category"),
        permalink: el.getAttribute("data-permalink"),
        content: el.getAttribute("data-content").toLowerCase()
    }));

    if (!searchInput) return;

    searchInput.addEventListener("input", function (e) {
        const query = e.target.value.toLowerCase().trim();
        searchResults.innerHTML = "";

        if (query === "") return;

        const matches = searchData.filter(item => 
            item.title.toLowerCase().includes(query) || 
            item.content.includes(query) ||
            item.book.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query)
        );

        if (matches.length === 0) {
            searchResults.innerHTML = '<p style="color: #999; text-align: center; margin-top: 2rem;">找不到相關筆記</p>';
            return;
        }

        matches.forEach(item => {
            const a = document.createElement("a");
            a.href = item.permalink;
            a.className = "search-result-item";
            
            a.innerHTML = `
                <div style="font-size: 0.85rem; color: #3a86ff; margin-bottom: 4px; font-weight: normal;">
                    📚 ${item.book} &rsaquo; ${item.category}
                </div>
                <div style="font-size: 1.05rem; font-weight: bold; color: #e5e7eb;">
                    📖 ${item.title}
                </div>
            `;
            searchResults.appendChild(a);
        });
    });
});
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
