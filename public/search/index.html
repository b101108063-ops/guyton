                     data-permalink="/guyton/guyton/ch32_diuretics-and-kidney-diseases/"
                     data-content="Red Blood Cells (Erythrocytes) Transport Function of Red Blood Cells A major function of RBCs, also known as erythrocytes, is to transport hemoglobin. Hemoglobin carries oxygen from the lungs to the tissues.
In some animals, including many invertebrates, hemoglobin circulates as free protein in the circulatory fluids and is not enclosed in RBCs.
When hemoglobin is free in human plasma, about 3% of it leaks through the capillary membrane into the tissue spaces. It also leaks through the glomerular membrane of the kidney into the glomerular filtrate each time the blood passes through the capillaries.
Therefore, hemoglobin must remain inside RBCs to perform its functions in humans effectively.
Carbonic Anhydrase Function The RBCs have other functions besides transport of hemoglobin. For example, they contain a large quantity of carbonic anhydrase.
This enzyme catalyzes the reversible reaction between carbon dioxide (CO₂) and water to form carbonic acid (H₂CO₃). It increases the rate of this reaction several thousandfold.
The rapidity of this reaction makes it possible for the water of the blood to transport enormous quantities of CO₂ in the form of bicarbonate ion (HCO₃⁻) from the tissues to the lungs. There, it is reconverted to CO₂ and expelled into the atmosphere as a body waste product.
The hemoglobin in the cells is an excellent acid-base buffer. Therefore, the RBCs are responsible for most of the acid-base buffering power of whole blood.
Shape and Size of Red Blood Cells Normal RBCs are biconcave discs (Figure 33-3).
Their physical characteristics are:
Parameter Value Mean diameter 7.8 micrometers Thickness (thickest point) 2.5 micrometers Thickness (center) 1 micrometer or less Average volume 90 to 95 cubic micrometers The shapes of RBCs can change remarkably as the cells squeeze through capillaries. Actually, the RBC resembles a bag that can be deformed into almost any shape.
Furthermore, because the normal cell has a great excess of cell membrane for the quantity of material inside, deformation does not stretch the membrane greatly. Consequently, it does not rupture the cell, as would be the case with many other cells.
Concentration of Red Blood Cells in the Blood In healthy men, the average number of RBCs per cubic millimeter is 5,200,000 (±300,000).
In healthy women, it is 4,700,000 (±300,000).
Persons living at high altitudes have greater numbers of RBCs, as discussed later.
Quantity of Hemoglobin in the Cells RBCs can concentrate hemoglobin in the cell fluid up to about 34 g/100 ml of cells.
The concentration does not rise above this value because this is the metabolic limit of the cell’s hemoglobin-forming mechanism.
Furthermore, in normal people, the percentage of hemoglobin is almost always near the maximum in each cell. However, when hemoglobin formation is deficient, the percentage of hemoglobin in the cells may fall considerably below this value. The volume of the RBC may also decrease because of diminished hemoglobin to fill the cell.
Blood Hemoglobin Concentrations When the hematocrit (the percentage of blood that is comprised of cells—normally, 40% to 45%) and the quantity of hemoglobin in each respective cell are normal:
Gender Average Hemoglobin Men 15 g hemoglobin/100 ml Women 14 g hemoglobin/100 ml Each gram of hemoglobin can combine with 1.34 ml of oxygen if the hemoglobin is 100% saturated.
Therefore, in the average man, a maximum of about 20 milliliters of oxygen can be carried in combination with hemoglobin in each 100 milliliters of blood. In woman, 19 milliliters of oxygen can be carried.
Production of Red Blood Cells Areas of the Body That Produce Red Blood Cells In the early weeks of embryonic life, primitive nucleated RBCs are produced in the yolk sac.
During the middle trimester of gestation, the liver is the main organ for RBC production. Reasonable numbers are also produced in the spleen and lymph nodes.
Then, during the last month or so of gestation and after birth, RBCs are produced exclusively in the bone marrow.
Bone Marrow Distribution by Age As illustrated in Figure 33-1, the marrow of essentially all bones produces RBCs until a person is about 5 years old.
The marrow of the long bones, except for the proximal portions of the humeri and tibiae, becomes fatty and produces no more RBCs after about the age of 20 years.
Beyond this age, most RBCs continue to be produced in the marrow of the membranous bones, such as the vertebrae, sternum, ribs, and ilia. Even in these bones, the marrow becomes less productive as age increases.
Genesis of Blood Cells Multipotential Hematopoietic Stem Cells The blood cells begin their lives in the bone marrow from a single type of cell called the multipotential hematopoietic stem cell. From this single cell type, all the cells of the circulating blood are eventually derived.
Figure 33-2 shows the successive divisions of the multipotential cells to form the different circulating blood cells.
As these cells reproduce, a small portion of them remains exactly like the original multipotential cells. This portion is retained in the bone marrow to maintain their supply, although their numbers diminish with age.
Most of the reproduced cells, however, differentiate to form the other cell types, shown at the right in Figure 33-2. The intermediate-stage cells are very much like the multipotential stem cells, even though they have already become committed to a particular line of cells. These are called committed stem cells.
The different committed stem cells, when grown in culture, will produce colonies of specific types of blood cells.
Colony-Forming Units A committed stem cell that produces erythrocytes is called a colony-forming unit–erythrocyte. The abbreviation CFU-E is used to designate this type of stem cell.
Likewise, colony-forming units that form granulocytes and monocytes have the designation CFU-GM, and so forth.
Growth and reproduction of the different stem cells are controlled by multiple proteins called growth inducers.
Bone Marrow RBC Production by Age Age Site of RBC Production Embryonic (early) Yolk sac Middle trimester Liver (main), spleen, lymph nodes Last month of gestation &#43; after birth Bone marrow exclusively Childhood (up to ~5 years) All bones After ~20 years Membranous bones (vertebrae, sternum, ribs, ilia) Figure 33-1. Relative rates of red blood cell production in the bone marrow of different bones at different ages.
Blood Cell Formation from Stem Cells Figure 33-2. Formation of the multiple different blood cells from the original multipotent hematopoietic stem cell in the bone marrow.
MHSC — Multipotent hematopoietic stem cell
Stem Cell Type Differentiates Into CFU-S Colony-forming unit–spleen CFU-B Colony-forming unit–blast CFU-E Colony-forming unit–erythrocytes CFU-GM Colony-forming unit–granulocytes, monocytes CFU-M Colony-forming unit–megakaryocytes LSC Lymphoid stem cell → B lymphocytes, T lymphocytes Final Blood Cells:
Erythrocytes Monocytes Megakaryocytes → Platelets Granulocytes (Neutrophils, Eosinophils, Basophils) Macrocytes "></div><div data-title="Electrocardiographic Interpretation of Cardiac Muscle and Coronary Blood Flow Abnormalities" 
                     data-book=""

                     data-permalink="/guyton/guyton/ch12_electrocardiographic-interpretation-of-cardiac-muscle-and-coronary-blood-flow-ab/"
                     data-content="ABNORMALITIES IN THE T WAVE Earlier in the chapter, we noted that the T wave is normally positive in all the standard bipolar limb leads. This is caused by repolarization of the apex and outer surfaces of the ventricles ahead of the intraventricular surfaces.
The T wave becomes abnormal when the normal sequence of repolarization does not occur. Several factors, including myocardial ischemia, can change this sequence of repolarization.
EFFECT OF SLOW CONDUCTION OF THE DEPOLARIZATION WAVE ON THE CHARACTERISTICS OF THE T WAVE Figure 12-14 shows that the QRS complex is considerably prolonged. The reason for this prolongation is delayed conduction in the left ventricle resulting from left bundle branch block.
This delayed conduction causes the left ventricle to become depolarized about 0.08 second after depolarization of the right ventricle, which gives a strong mean QRS vector to the left.
However, the refractory periods of the right and left ventricular muscle masses are not greatly different from each other. Therefore:
The right ventricle begins to repolarize long before the left ventricle. This causes strong positivity in the right ventricle and negativity in the left ventricle when the T wave is developing. The mean axis of the T wave is deviated to the right — opposite to the mean electrical axis of the QRS complex. Thus, when conduction of the depolarization impulse through the ventricles is greatly delayed, the T wave is almost always of opposite polarity to that of the QRS complex.
SHORTENED DEPOLARIZATION AND T-WAVE ABNORMALITIES If the base of the ventricles exhibits an abnormally short period of depolarization (a shortened action potential), repolarization of the ventricles would not begin at the apex as it normally does.
Instead, the base of the ventricles would repolarize ahead of the apex. The vector of repolarization would point from the apex toward the base of the heart — opposite to the standard vector of repolarization.
Consequently, the T wave in all three standard leads would be negative rather than the usual positive. A shortened depolarization period in the base of the ventricles is sufficient to cause marked changes in the T wave, even to the extent of changing the entire T-wave polarity (Figure 12-23).
Mild Ischemia Mild ischemia is the most common cause of shortening of depolarization of cardiac muscle because this condition increases current flow through the potassium channels.
When ischemia occurs in only one area of the heart, the depolarization period of that area decreases out of proportion to that in other portions. As a result, changes in the T-wave morphology — such as inversion or biphasic waveforms — can be evidence of myocardial ischemia.
Causes of ischemia include:
Chronic, progressive coronary stenosis (narrowing) Acute coronary occlusion Coronary artery spasm Relative coronary insufficiency during exercise or severe anemia Effect of Digitalis on the T Wave Digitalis is a drug that can be used during heart failure to increase the strength of cardiac muscle contraction (discussed in Chapter 22).
However, when an overdose of digitalis is given, depolarization duration in one part of the ventricles may be increased out of proportion to that of other parts. As a result, nonspecific changes occur — such as T-wave inversion or biphasic T waves — in one or more of the electrocardiographic leads.
A biphasic T wave caused by excessive administration of digitalis is shown in Figure 12-24. Changes in the T wave during digitalis administration are often the earliest signs of digitalis toxicity.

                     data-content="ATP as the Energy Currency of Metabolism Carbohydrates, fats, and proteins can all be used by cells to synthesize large quantities of ATP.
ATP is used as an energy source for almost all other cellular functions.
ATP has been called an energy “currency” in cell metabolism.
Energy transfer from foodstuffs to functional systems can only be performed through ATP (or the similar GTP).
Free Energy in ATP Bonds ATP contains a large quantity of free energy in each of its two high-energy phosphate bonds.
Condition Calories per Mole Standard conditions ~7,300 calories Physiological conditions ~12,000 calories The energy in each bond, when liberated by ATP decomposition, can cause almost any chemical reaction step in the body.
Some reactions require only a few hundred calories.
The remainder is lost as heat.
ATP Generation from Combustion of Foodstuffs ATP is produced through:
Carbohydrate combustion: Through anaerobic glycolysis (cytoplasm) and aerobic citric acid cycle (mitochondria)
Fatty acid combustion: Beta-oxidation in cell mitochondria
Protein combustion: Hydrolysis to amino acids, degradation to citric acid cycle intermediates, then to acetyl-CoA and CO₂
Uses of ATP Energy ATP Energizes Synthesis of Cellular Components One of the most important processes requiring ATP energy is synthesis of peptide linkages during protein synthesis.
Different peptide linkages require 500 to 5,000 calories per mole.
Four high-energy phosphate bonds are expended for each peptide linkage.
This provides 48,000 calories total.
Far more than the 500 to 5,000 calories eventually stored in each peptide linkage.
ATP energy is also used for:
Synthesizing glucose from lactic acid Synthesizing fatty acids from acetyl-CoA Synthesizing cholesterol, phospholipids, and hormones Synthesizing almost all other body substances Forming urea (excreted by kidneys) ATP Energizes Muscle Contraction Muscle contraction will not occur without ATP energy.
Myosin acts as an enzyme to break down ATP into ADP.
This releases energy required for contraction.
Only a small amount of ATP is degraded in resting muscle.
During short bursts of maximal contraction, this rate can rise to 150 times the resting level.
ATP Energizes Active Transport Active transport of electrolytes and nutrients across cell membranes requires ATP.
This includes transport from renal tubules and GI tract into blood.
Active transport can occur against electrochemical gradients.
Energy from ATP is required to oppose these gradients.
ATP Energizes Glandular Secretion The same principles apply to glandular secretion as to absorption.
Energy is required to concentrate substances during secretion.
Additional energy is required to synthesize organic compounds for secretion.
ATP Energizes Nerve Conduction Energy for nerve impulse propagation comes from ion concentration differences across neuronal membranes.
High potassium inside and low outside is one energy store.
High sodium outside and low inside is another energy store.
Energy for each action potential comes from this energy storage.
During each action potential, small amounts of potassium leave and sodium enter the cell.
ATP-powered active transport systems then return ions to their original positions.
Phosphocreatine as an Energy Storage Depot Despite ATP’s importance, it is not the most abundant high-energy phosphate store.
Phosphocreatine is three to eight times more abundant than ATP.
Energy Content The high-energy bond of phosphocreatine contains:
8,500 calories per mole (standard conditions) 13,000 calories per mole (body conditions at 37°C) This exceeds the 12,000 calories per mole in each ATP high-energy phosphate bond.
Chemical Structure Phosphocreatine formula:
H O O C - N C N H H - ₂ C - - C N H ~ O ₃ P - O H Energy Transfer Unlike ATP, phosphocreatine cannot directly couple energy transfer.
However, energy transfers interchangeably between phosphocreatine and ATP:
P h o s p h o c r e a t i n e &#43; A D P ⇌ A T P &#43; C r e a t i n e When extra ATP is available, energy is used to synthesize phosphocreatine.
When ATP is depleted, phosphocreatine energy is transferred back to ATP.
ATP Buffer Function The higher energy level of phosphocreatine causes rapid reaction with ADP to form new ATP.
Any slight usage of ATP calls forth energy from phosphocreatine to synthesize new ATP.
This keeps ATP concentration nearly constant.
Therefore, the ATP-phosphocreatine system functions as an ATP “buffer” system.
This constancy is critical because most metabolic reaction rates depend on it.
Anaerobic vs. Aerobic Energy Anaerobic energy is derived without oxygen utilization.
Aerobic energy requires oxidative metabolism.
Carbohydrates, fats, and proteins can all be oxidized to produce ATP.
Only carbohydrates can provide significant energy without oxygen.
This occurs during glycolytic breakdown of glucose to pyruvic acid.
ATP from Anaerobic Glycolysis For each mole of glucose split into pyruvic acid, 2 moles of ATP are formed.
When stored glycogen is split to pyruvic acid, each mole of glucose gives 3 moles of ATP.
Free glucose entering cells must be phosphorylated (using 1 ATP) before splitting.
Glycogen-derived glucose is already in the phosphorylated state.
Therefore, stored glycogen is the best anaerobic energy source.
Anaerobic Energy During Hypoxia One prime example of anaerobic energy utilization occurs in acute hypoxia.
When breathing stops, a small amount of oxygen is stored in lungs and hemoglobin.
This sustains metabolic processes for only about 2 minutes.
Continued life beyond this requires additional energy sources.
Energy can be derived from glycolysis for about another minute.
Glycogen splits into pyruvic acid.
Pyruvic acid becomes lactic acid, which diffuses out of cells.
Anaerobic Energy During Strenuous Activity Skeletal muscles can perform extreme feats for a few seconds.
Muscles are much less capable during prolonged activity.
Extra energy for bursts of activity cannot come from oxidative processes because they respond too slowly.
Extra energy comes from anaerobic sources:
ATP already present in muscle cells Phosphocreatine in the cells Anaerobic glycolysis of glycogen to lactic acid Energy Reserves in Muscle Source Amount Duration of Maximum Contraction ATP ~5 mmol/L intracellular fluid ~1 second Phosphocreatine 3–8× ATP amount 5–10 seconds Glycolytic Energy Release Glycolytic energy release occurs much more rapidly than oxidative energy release.
Extra energy for strenuous activity lasting more than 5–10 seconds but less than 1–2 minutes comes mainly from anaerobic glycolysis.
During strenuous exercise:
Glycogen content of muscles is reduced Lactic acid concentration in blood rises After exercise, oxidative metabolism reconverts about four fifths of lactic acid into glucose.
The remainder becomes pyruvic acid and is degraded.
Metabolic Rate Definition Metabolic rate is the rate of energy expenditure by the body.
It can be measured by:
Direct calorimetry: Measures heat production directly Indirect calorimetry: Estimates metabolic rate from O₂ consumption and CO₂ production Basal Metabolic Rate (BMR) BMR is measured under standardized conditions:
After 12–18 hours of fasting After 8 hours of rest In a comfortable, thermoneutral environment BMR represents minimal energy expenditure for vital functions.
Factors Affecting Metabolic Rate Factor Effect Physical activity Increases metabolic rate significantly Thyroxine Increases BMR Catecholamines Increase metabolic rate Thermic effect of food Increases metabolic rate temporarily Body temperature Fever increases metabolic rate Age Higher in children; decreases with age Thyroxine Effects Thyroxine increases BMR by:
Uncoupling oxidative phosphorylation Increasing Na⁺/K⁺-ATPase activity Prolonged thyroxine excess causes:
Muscle protein catabolism Weight loss Respiratory Quotient and Metabolic Rate The respiratory quotient (RQ) is the ratio of CO₂ produced to O₂ consumed.
Substrate RQ Carbohydrate 1.0 Fat 0.70 Protein 0.80 Indirect calorimetry uses RQ and oxygen consumption to estimate metabolic rate.

                     data-content="EXCITATION-CONTRACTION COUPLING Figure 7-6 shows excitation-contraction coupling in skeletal muscle.
The top panel shows an action potential in the transverse tubule that causes a conformational change in the voltage-sensing dihydropyridine (DHP) receptors.
This opens the ryanodine (RyR) Ca2&#43; release channels in the terminal cisternae of the sarcoplasmic reticulum.
This permits Ca2&#43; to diffuse rapidly into the sarcoplasm and initiate muscle contraction.
During repolarization (bottom panel), the conformational change in the DHP receptor closes the Ca2&#43; release channels.
Ca2&#43; is transported from the sarcoplasm into the sarcoplasmic reticulum by an adenosine triphosphate–dependent calcium pump, called SERCA (sarcoplasmic reticulum Ca2&#43;-ATPase).
MALIGNANT HYPERTHERMIA Malignant hyperthermia is a condition caused by mutations in ryanodine receptors, whereby anesthetics interact with these abnormal receptors to trigger the condition.
These mutations cause unregulated passage of calcium from the sarcoplasmic reticulum into the intracellular spaces.
This causes the muscle fibers to contract excessively.
These sustained muscle contractions greatly increase metabolic rate, generating large amounts of heat.
They also cause cellular acidosis, as well as depletion of energy stores.
Symptoms Symptoms of malignant hyperthermia include:
Muscle rigidity High fever Rapid heart rate Complications Additional complications in severe cases may include:
Rapid breakdown of skeletal muscle (rhabdomyolysis) High plasma potassium level due to release of large amounts of potassium from damaged muscle cells Treatment Treatment of malignant hyperthermia generally involves:
Rapid cooling Administration of dantrolene, a drug that antagonizes ryanodine receptors Dantrolene inhibits calcium ion release from the sarcoplasmic reticulum, thereby attenuating muscle contraction.
CONTRACTION OF SMOOTH MUSCLE Smooth muscle is composed of small fibers that are usually 1 to 5 micrometers in diameter and only 20 to 400 micrometers in length.
In contrast, skeletal muscle fibers are as much as 30 times greater in diameter and hundreds of times as long.
Many of the same principles of contraction apply to smooth muscle as to skeletal muscle.
Most important, essentially the same attractive forces between myosin and actin filaments cause contraction in smooth muscle as in skeletal muscle.
However, the internal physical arrangement of smooth muscle fibers is different.
TYPES OF SMOOTH MUSCLE The smooth muscle of each organ is distinctive from that of most other organs in several ways:
Physical dimensions Organization into bundles or sheets Response to different types of stimuli Characteristics of innervation Function For the sake of simplicity, smooth muscle can generally be divided into two major types, which are shown in Figure 8-1:
Multi-unit smooth muscle Unitary (or single-unit) smooth muscle Multi-Unit Smooth Muscle Multi-unit smooth muscle is composed of discrete, separate, smooth muscle fibers.
Each fiber operates independently of the others and often is innervated by a single nerve ending, as occurs for skeletal muscle fibers.
The outer surfaces of these fibers are covered by a thin layer of basement membrane–like substance, a mixture of fine collagen and glycoprotein that helps insulate the separate fibers from one another.
Important characteristics of multi-unit smooth muscle fibers are that each fiber can contract independently of the others, and their control is exerted mainly by nerve signals.
In contrast, a major share of control of unitary smooth muscle is exerted by non-nervous stimuli.
Examples of multi-unit smooth muscle include:
The ciliary muscle of the eye The iris muscle of the eye The piloerector muscles that cause erection of the hairs when stimulated by the sympathetic nervous system Unitary Smooth Muscle Unitary smooth muscle is also called syncytial smooth muscle or visceral smooth muscle.
The term unitary does not mean single muscle fibers. Instead, it means a mass of hundreds to thousands of smooth muscle fibers that contract together as a single unit.
The fibers usually are arranged in sheets or bundles, and their cell membranes are adherent to one another at multiple points so that force generated in one muscle fiber can be transmitted to the next.
The cell membranes are joined by many gap junctions through which ions can flow freely from one muscle cell to the next.
Action potentials, or ion flow without action potentials, can travel from one fiber to the next and cause the muscle fibers to contract together.
This type of smooth muscle is also known as syncytial smooth muscle because of its syncytial interconnections among fibers.
It is also called visceral smooth muscle because it is found in the walls of most viscera of the body, including:
The gastrointestinal tract Bile ducts Ureters Uterus Many blood vessels CONTRACTILE MECHANISM IN SMOOTH MUSCLE Chemical Basis for Smooth Muscle Contraction Smooth muscle contains both actin and myosin filaments, having chemical characteristics similar to those of the actin and myosin filaments in skeletal muscle.
It does not contain the troponin complex that is required for the control of skeletal muscle contraction, and thus the mechanism for controlling contraction is different.
Chemical studies have shown that actin and myosin filaments derived from smooth muscle interact with each other in much the same way that they do in skeletal muscle.
The contractile process is activated by calcium ions, and adenosine triphosphate (ATP) is degraded to adenosine diphosphate (ADP) to provide the energy for contraction.
There are, however, major differences between the physical organization of smooth muscle and that of skeletal muscle.
There are also differences in:
Excitation-contraction coupling Control of the contractile process by calcium ions Duration of contraction Amount of energy required for contraction Physical Basis for Smooth Muscle Contraction Smooth muscle does not have the same striated arrangement of actin and myosin filaments as is found in skeletal muscle.
Instead, electron micrographic techniques suggest the physical organization shown in Figure 8-2.
This illustrates large numbers of actin filaments attached to dense bodies.
Some of these bodies are attached to the cell membrane, and others are dispersed inside the cell.
Some of the membrane-dense bodies of adjacent cells are bonded together by intercellular protein bridges.
It is mainly through these bonds that the force of contraction is transmitted from one cell to the next.
Interspersed among the actin filaments in the muscle fiber are myosin filaments.
These filaments have a diameter more than twice that of the actin filaments.
In electron micrographs, 5 to 10 times as many actin filaments as myosin filaments are usually found.
To the right in Figure 8-2 is a postulated structure of an individual contractile unit in a smooth muscle cell.
This shows large numbers of actin filaments radiating from two dense bodies.
The ends of these filaments overlap a myosin filament located midway between the dense bodies.
This contractile unit is similar to the contractile unit of skeletal muscle, but without the regularity of the skeletal muscle structure.
In fact, the dense bodies of smooth muscle serve the same role as the Z disks in skeletal muscle.
Another difference is that most of the myosin filaments have “side polar” cross-bridges arranged so that the bridges on one side hinge in one direction, and those on the other side hinge in the opposite direction.
This configuration allows the myosin to pull an actin filament in one direction on one side while simultaneously pulling another actin filament in the opposite direction on the other side.
The value of this organization is that it allows smooth muscle cells to contract as much as 80% of their length instead of being limited to less than 30%, as occurs in skeletal muscle.
Comparison of Smooth Muscle Contraction and Skeletal Muscle Contraction Although most skeletal muscles contract and relax rapidly, most smooth muscle contraction is prolonged tonic contraction, sometimes lasting hours or even days.
Therefore, it is to be expected that both the physical and chemical characteristics of smooth muscle versus skeletal muscle contraction would differ.

                     data-permalink="/guyton/guyton/ch82_female-physiology-before-pregnancy-and-female-hormones/"
                     data-content="FEMALE SEXUAL ORGANS The principal organs of the human female reproductive tract include:
Ovaries Fallopian tubes (uterine tubes) Uterus Vagina Reproduction begins with the development of ova in the ovaries.
In the middle of each monthly sexual cycle, a single ovum is expelled from an ovarian follicle into the abdominal cavity near the open fimbriated ends of the two fallopian tubes.
This ovum then passes through one of the fallopian tubes into the uterus.
If it has been fertilized by a sperm, it implants in the uterus, where it develops into a fetus, a placenta, and fetal membranes—and eventually into a baby.
OOGENESIS AND FOLLICULAR DEVELOPMENT IN THE OVARIES A developing egg (oocyte) differentiates into a mature egg (ovum) through a series of steps called oogenesis.
During early embryonic development, primordial germ cells from the dorsal endoderm of the yolk sac migrate along the mesentery of the hindgut to the outer surface of the ovary.
The ovary is covered by a germinal epithelium, derived embryologically from the epithelium of the germinal ridges.
During this migration, the germ cells divide repeatedly.
Once these primordial germ cells reach the germinal epithelium, they migrate into the substance of the ovarian cortex and become oogonia or primordial ova.
Formation of Primordial Follicles Each primordial ovum collects around it a layer of spindle cells from the ovarian stroma (the supporting tissue of the ovary).
These spindle cells take on epithelioid characteristics and are then called granulosa cells.
The ovum surrounded by a single layer of granulosa cells is called a primordial follicle. At this stage, the ovum is still immature and is called a primary oocyte. It requires two more cell divisions before it can be fertilized by a sperm.
Oogenesis Timeline Stage Timing Primordial germ cell migration Embryonic development Mitotic replication of oogonia In utero (by 5th month) First meiotic division begins In utero (5th month) Meiosis arrested at prophase I Until puberty First meiotic division completed After puberty Second meiotic division Upon fertilization At birth, the ovary contains about 1 to 2 million primary oocytes.
Oocyte Numbers Throughout Life Life Stage Number of Oocytes At birth 1-2 million At puberty ~300,000 Over reproductive life (13-46 years) 400-500 ovulated At menopause Few remaining The many thousands of oocytes that do not mature degenerate (become atretic). At the end of reproductive capability (menopause), only a few primordial follicles remain in the ovaries. Even these follicles degenerate soon thereafter.
Meiosis Process in Oogenesis The first stage of meiosis starts during fetal development but is arrested in the late stage of prophase I until puberty. Puberty usually occurs between ages 10 and 14 in females.
The first meiotic division of the oocyte is completed after puberty. Each oocyte divides into two cells:
A large ovum (secondary oocyte) A small first polar body Each of these cells contains 23 duplicated chromosomes.
The first polar body may or may not undergo a second meiotic division and then disintegrates.
The ovum undergoes a second meiotic division. After the sister chromatids separate, there is a pause in meiosis. If the ovum is fertilized, the final step in meiosis occurs. The sister chromatids in the ovum go to separate cells.
Outcome of Fertilization When the ovary releases the ovum (ovulation), and if the ovum is fertilized, the final meiosis occurs. Half of the sister chromatids remain in the fertilized ovum. The other half are released in a second polar body, which then disintegrates.
FEMALE HORMONAL SYSTEM The female hormonal system consists of three hierarchies of hormones:
Hormonal Hierarchy Level Hormone Source 1 Gonadotropin-releasing hormone (GnRH) Hypothalamus 2 Follicle-stimulating hormone (FSH) and Luteinizing hormone (LH) Anterior pituitary 3 Estrogen and Progesterone Ovaries These various hormones are secreted at drastically differing rates during different parts of the female monthly sexual cycle.
GnRH Secretion Pattern The amount of GnRH released from the hypothalamus increases and decreases much less drastically during the monthly sexual cycle. It is secreted in short pulses averaging once every 90 minutes. This occurs in both females and males.
MONTHLY OVARIAN CYCLE AND FUNCTION OF GONADOTROPIC HORMONES The normal reproductive years of the female are characterized by monthly rhythmic changes in the rates of secretion of the female hormones. There are corresponding physical changes in the ovaries and other sexual organs. This rhythmic pattern is called the female monthly sexual cycle (or menstrual cycle).
The duration of the cycle averages 28 days. It may be as short as 20 days or as long as 45 days in some women. Abnormal cycle length is frequently associated with decreased fertility.
Two Significant Results of the Female Sexual Cycle Only a single ovum is normally released from the ovaries each month, so normally only a single fetus will begin to grow at a time. The uterine endometrium is prepared in advance for implantation of the fertilized ovum at the required time of the month. GONADOTROPIC HORMONES AND THEIR EFFECTS ON THE OVARIES The ovarian changes that occur during the sexual cycle depend completely on the gonadotropic hormones FSH and LH. These are secreted by the anterior pituitary gland. Both FSH and LH are small glycoproteins with molecular weights of about 30,000.
Effect of Gonadotropin Deficiency In the absence of these hormones, the ovaries remain inactive. This is the case throughout childhood, when almost no pituitary gonadotropic hormones are secreted.
Onset of Puberty At age 9 to 12 years, the pituitary begins to secrete progressively more FSH and LH. This leads to the onset of normal monthly sexual cycles beginning between the ages of 11 and 15 years. This period of change is called puberty. The time of the first menstrual cycle is called menarche.
Cyclical Variation in Gonadotropins During each month of the female sexual cycle, there is a cyclical increase and decrease of FSH and LH. These cyclical variations are essential for driving the ovarian cycle.
HORMONE CONCENTRATIONS DURING THE MENSTRUAL CYCLE Phase Days FSH LH Estrogen Progesterone Menstrual 1-5 ↑ Normal Low Low Follicular 5-13 ↓ then ↑ Low Rising Low Ovulatory 13-15 Peak LH surge Peak Rising Luteal 15-28 ↓ ↓ Lower High ESTROGEN AND PROGESTERONE FROM THE OVARIES The ovarian hormones are secreted by the ovaries in response to the two female sex hormones from the anterior pituitary gland.
Estrogen Produced primarily by developing ovarian follicles.
Effects include:
Proliferation of the endometrial lining Development of female secondary sexual characteristics Feedback effects on FSH and LH secretion Progesterone Produced primarily by the corpus luteum after ovulation.
Effects include:
Transformation of the endometrium into a secretory mucosa Preparation of the uterus for implantation Feedback effects on FSH and LH secretion FEMALE REPRODUCTIVE ORGANS ANATOMY Ovary Structure Function Ovarian stroma Supporting tissue Ovarian follicles Contain oocytes Corpus luteum Produces progesterone Granulosa cells Support oocyte development Uterine Tube (Fallopian Tube) Region Function Fimbriae Capture ovulated ovum Ampulla Site of fertilization Isthmus Connects to uterus Mucosal folds Aid transport Uterus Layer Function Endometrium Site of implantation Myometrium Muscle layer for contractions Perimetrium Outer covering OVULATION Ovulation occurs when the mature ovarian follicle ruptures and releases the secondary oocyte.
The ovum, along with a hundred or more attached granulosa cells that constitute the corona radiata, is expelled directly into the peritoneal cavity.
The ovum must then enter one of the fallopian tubes to reach the cavity of the uterus.
Ciliary Transport of Ovum The fimbriated ends of each fallopian tube fall naturally around the ovaries. The inner surfaces of the fimbriated tentacles are lined with ciliated epithelium. The cilia are activated by estrogen from the ovaries. This causes the cilia to beat toward the opening (ostium) of the involved fallopian tube.
One can actually see a slow fluid current flowing toward the ostium. By this means, the ovum enters one of the fallopian tubes.
Success Rate of Ovum Entry Although one might suspect that many ova fail to enter the fallopian tubes, conception studies suggest up to 98% of ova succeed in this task.
In some recorded cases, women with one ovary removed and the opposite fallopian tube removed have had several children with relative ease of conception. This demonstrates that ova can even enter the opposite fallopian tube.

                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch84_fetal-and-neonatal-physiology/"
                     data-content="INTRODUCTION TO FETAL AND NEONATAL PHYSIOLOGY A complete discussion of fetal development, physiology of the child immediately after birth, and growth and development through the early years of life lies within the province of formal courses in obstetrics and pediatrics.
However, many physiological principles are peculiar to the infant. This chapter discusses the more important of these principles.
GROWTH AND DEVELOPMENT OF THE FETUS The placenta and fetal membranes initially develop far more rapidly than does the fetus.
During the first 2 to 3 weeks after implantation of the blastocyst, the fetus remains almost microscopic. Thereafter, the length of the fetus increases almost in proportion to age.
Fetal Length at Different Ages Gestational Age Length 12 weeks ~10 cm 20 weeks ~25 cm 40 weeks (term) ~53 cm (21 inches) Because the weight of the fetus is approximately proportional to the cube of length, the weight increases almost in proportion to the cube of the age of the fetus.
Fetal Weight at Different Ages Gestational Age Weight 12 weeks Miniscule 23 weeks ~1 pound 2 months before birth ~3 pounds 1 month before birth ~4.5 pounds At birth ~7 pounds (range 4.5-11 pounds) Note that the weight remains minuscule during the first 12 weeks. The weight reaches 1 pound only at 23 weeks (5.5 months) of gestation. During the last trimester of pregnancy, the fetus gains weight rapidly.
DEVELOPMENT OF THE ORGAN SYSTEMS Within 1 month after fertilization of the ovum, the gross characteristics of all the different organs of the fetus have already begun to develop. During the next 2 to 3 months, most of the details of the different organs are established. Beyond month 4, the organs of the fetus are grossly the same as those of the neonate.
However, cellular development in each organ is usually far from complete. It requires the full remaining 5 months of pregnancy for complete development. Even at birth, certain structures lack full development.
This is particularly true of the:
Nervous system Kidneys Liver CIRCULATORY SYSTEM The human heart begins beating during the fourth week after fertilization. It contracts at a rate of about 65 beats/min. This rate increases steadily to about 140 beats/min immediately before birth.
FORMATION OF BLOOD CELLS Nucleated red blood cells begin to be formed in the yolk sac and mesothelial layers of the placenta at about the third week of fetal development. This is followed 1 week later (at 4-5 weeks) by formation of non-nucleated red blood cells by the fetal mesenchyme and also by the endothelium of fetal blood vessels.
At 6 weeks, the liver begins to form blood cells. In the third month, the spleen and other lymphoid tissues of the body begin forming blood cells. Finally, from the third month on, the bone marrow gradually becomes the principal source of red blood cells. It also becomes the source of most of the white blood cells, except for continued lymphocyte and plasma cell production in lymphoid tissue.
Blood Cell Production Timeline Age Site of Blood Cell Production 3 weeks Yolk sac, placenta 4-5 weeks Fetal mesenchyme, blood vessel endothelium 6 weeks Liver begins 3 months Spleen and lymphoid tissues begin 3&#43; months Bone marrow becomes principal source RESPIRATORY SYSTEM Respiration cannot occur during fetal life because there is no air to breathe in the amniotic cavity. However, attempted respiratory movements do take place beginning at the end of the first trimester of pregnancy. Tactile stimuli and fetal asphyxia especially cause these attempted respiratory movements.
Respiratory Movements in Late Pregnancy During the last 3 to 4 months of pregnancy, the respiratory movements of the fetus are mainly inhibited. The reasons are unknown.
The lungs remain almost completely deflated. The inhibition of respiration during the later months of fetal life prevents filling of the lungs with fluid and debris from the meconium excreted by the fetus’s gastrointestinal tract into the amniotic fluid.
Small amounts of fluid are secreted into the lungs by the alveolar epithelium up until the moment of birth. This keeps only clean fluid in the lungs.
NERVOUS SYSTEM Most of the reflexes of the fetus that involve the spinal cord and even the brain stem are present by the third to fourth months of pregnancy.
However, nervous system functions that involve the cerebral cortex are still only in the early stages of development, even at birth. Indeed, myelinization of some major tracts of the brain becomes complete only after about 1 year of postnatal life.
GASTROINTESTINAL TRACT By midpregnancy, the fetus begins to ingest and absorb large quantities of amniotic fluid. During the last 2 to 3 months, gastrointestinal function approaches that of the normal neonate. By that time, small quantities of meconium are continually formed in the gastrointestinal tract. Meconium is excreted from the anus into the amniotic fluid.
Meconium Composition Meconium is composed of:
Residue from swallowed amniotic fluid Mucus Epithelial cells Other residues of excretory products from the gastrointestinal mucosa and glands KIDNEYS The fetal kidneys begin to excrete urine during the second trimester. Fetal urine accounts for about 70% to 80% of the amniotic fluid. Abnormal kidney development or severe impairment of kidney function in the fetus greatly reduces formation of amniotic fluid (oligohydramnios). This can lead to fetal death.
Renal Control Systems in Fetus Although fetal kidneys form urine, the renal control systems for regulating fetal extracellular fluid volume and electrolyte balances are almost nonexistent until late fetal life. This is especially true for acid-base balance. These systems do not reach full development until a few months after birth.
FETAL METABOLISM The fetus mainly uses glucose for energy. The fetus has a high capability of storing fat and protein. Much if not most of the fat is synthesized from glucose rather than being absorbed directly from the mother’s blood.
Special Problems of Fetal Metabolism There are special problems of fetal metabolism related to:
Calcium Phosphate Iron Some vitamins METABOLISM OF CALCIUM AND PHOSPHATE About 22.5 grams of calcium and 13.5 grams of phosphorus are accumulated in the average fetus during gestation. About one-half of these accumulate during the last 4 weeks of gestation. This coincides with the period of rapid ossification of the fetal bones and with the period of rapid weight gain of the fetus.
Calcium and Phosphate Accumulation by Fetal Age Fetal Age Accumulation Early pregnancy Minimal (bones are cartilaginous) After 4th month Ossification begins Last 4 weeks 50% of total calcium and phosphate accumulated During the earlier part of fetal life, the bones are relatively unossified and have mainly a cartilaginous matrix. Ossification usually does not occur until after the fourth month of pregnancy.
Maternal Calcium Drain The total amounts of calcium and phosphate needed by the fetus during gestation represent only about 2% of the quantities of these substances in the mother’s bones. Thus, the drain of these substances from the mother is minimal. A much greater drain occurs after birth during lactation.
ACCUMULATION OF IRON Iron accumulates in the fetus even more rapidly than does calcium and phosphate. Most of the iron is in the form of hemoglobin. Hemoglobin begins to be formed as early as the third week after fertilization of the ovum.
Iron Storage Small amounts of iron are concentrated in the mother’s uterine progestational endometrium even before implantation of the ovum. This iron is ingested into the embryo by the trophoblastic cells. It is used to form very early red blood cells.
About one-third of the iron in a fully developed fetus is normally stored in the liver. This iron can then be used by the neonate to form additional hemoglobin for several months after birth.
UTILIZATION AND STORAGE OF VITAMINS The fetus needs vitamins equally as much as the adult and in some instances to a far greater extent. In general, the vitamins function the same in the fetus as in the adult.
Special functions of several vitamins should be mentioned:
B Vitamins The B vitamins, especially vitamin B12 and folic acid, are necessary for:
Formation of red blood cells Nervous tissue development Overall growth of the fetus Vitamin C Vitamin C is necessary for appropriate formation of intercellular substances, especially:
The bone matrix Fibers of connective tissue Vitamin D Vitamin D is necessary for normal bone growth in the fetus. Even more important, the mother needs it for adequate absorption of calcium from her gastrointestinal tract. If the mother has plenty of vitamin D in her body fluids, large quantities of the vitamin will be stored by the fetal liver. This can be used by the neonate to form additional hemoglobin for several months after birth.
Vitamin E The mechanisms of the functions of vitamin E are not entirely clear. However, it is necessary for normal development of the early embryo. In its absence in laboratory animals, spontaneous abortion usually occurs at an early stage of pregnancy.
Vitamin K Vitamin K is used by the fetal liver for formation of Factor VII, prothrombin, and several other blood coagulation factors. When vitamin K is insufficient in the mother, Factor VII and prothrombin become deficient in the fetus and the mother.
Because most vitamin K is formed by bacterial action in the mother’s colon, the neonate has no adequate source of vitamin K at birth. This is why newborns typically receive vitamin K injection shortly after birth.
PREMATURE INFANTS Respiratory Problems The respiratory system is especially likely to be underdeveloped in the extremely premature infant. The vital capacity and the functional residual capacity of the lungs are especially small in relation to the size of the infant. In addition, surfactant secretion is depressed or absent.
As a consequence, respiratory distress syndrome is a common cause of death. Also, the low functional residual capacity in the premature infant is often associated with periodic breathing of the Cheyne-Stokes type.
Gastrointestinal Function Another major problem of the premature infant is ingesting and absorbing adequate food. In infants who are more than 2 months premature, the digestive and absorptive systems are almost always inadequate. The absorption of fat is so poor that the premature infant must have a low-fat diet.
Furthermore, because the absorption of calcium is unusually difficult in premature infants, severe rickets can develop before the difficulty is recognized. For this reason, special attention to adequate calcium and vitamin D intake is necessary.
Immaturity of Other Organ Systems Immaturity of other organ systems that frequently causes serious difficulties in the premature infant includes:
Organ System Problem Liver Poor intermediary metabolism and often a bleeding tendency as a result of poor formation of coagulation factors Kidneys Particularly deficient in their ability to rid the body of acids, thereby predisposing the infant to acidosis and to serious fluid balance abnormalities Blood-forming bone marrow Allows rapid development of anemia Lymphoid system Depressed formation of gamma globulin often leads to serious infection INSTABILITY OF HOMEOSTATIC CONTROL SYSTEMS IN PREMATURE INFANTS Immaturity of the different organ systems in the premature infant creates a high degree of instability in the homeostatic mechanisms of the body.
Examples of Instability Parameter Problem Acid-base balance Can vary tremendously, particularly when food intake varies Blood protein Usually low due to immature liver, leading to hypoproteinemic edema Calcium ion Inability to regulate may bring on hypocalcemic tetany Blood glucose Can vary between 20 to more than 100 mg/dl, depending on feeding regularity Instability of Body Temperature One important problem of the premature infant is the inability to maintain a normal body temperature. The premature infant’s temperature tends to approach that of its surroundings. At normal room temperature, the infant’s temperature may stabilize in the low 90s°F or even in the 80s°F.
Studies show that a body temperature maintained below 96°F (35.5°C) is associated with a particularly high incidence of death. This explains the almost mandatory use of the incubator when treating prematurity.
DANGER OF BLINDNESS CAUSED BY EXCESS OXYGEN THERAPY Because premature infants frequently experience respiratory distress, oxygen therapy has often been used to treat these infants. However, excess use of oxygen in treating premature infants, especially in early prematurity, can lead to blindness.
This is because too much oxygen stops the growth of new blood vessels in the retina. Then, when oxygen therapy is stopped, the blood vessels try to make up for lost time. They burst forth with a great mass of vessels that grow all through the vitreous humor. This blocks light from the pupil to the retina. Later, the vessels are replaced with a mass of fibrous tissue where the eye’s clear vitreous humor should be located.
Retrolental Fibroplasias This condition is known as retrolental fibroplasias. It causes permanent blindness. For this reason, it is particularly important to avoid treatment of premature infants with high concentrations of respiratory oxygen.
Physiological studies indicate that premature infants are usually safe with up to 40% oxygen in the air breathed. However, some child physiologists believe that complete safety can be achieved only at normal oxygen concentration in the air breathed.
GROWTH AND DEVELOPMENT OF THE CHILD The major physiological problems of the child beyond the neonatal period are related to special metabolic needs for growth. These have been fully covered in the sections of this book on metabolism and endocrinology.
Height Changes in Boys and Girls Note that heights of boys and girls parallel each other almost exactly until the end of the first decade of life. Between the ages of 11 and 13 years, the female estrogens begin to be formed. This causes rapid growth in height but early uniting of the epiphyses of the long bones at about the 14th to 16th year of life. Thus, growth in height then ceases.
In contrast, the effect of testosterone in the male causes extra growth at a slightly later age—mainly between ages 13 and 17 years. The male undergoes more prolonged growth because of delayed uniting of the epiphyses. His final height is considerably greater than that of the female.
BEHAVIORAL GROWTH Behavioral growth is principally related to maturity of the nervous system. It is difficult to dissociate maturity of the anatomical structures of the nervous system from maturity caused by training.
Anatomical studies show that certain major tracts in the central nervous system are not completely myelinated until the end of the first year of life. For this reason, the nervous system is frequently stated to not be fully functional at birth. The brain cortex and its associated functions, such as vision, seem to require several months after birth for final functional development to occur.
Brain Development After Birth Age Brain Mass At birth 26% of adult brain mass 1 year 55% of adult brain mass 2 years Almost adult proportions This process is associated with closure of the fontanels and sutures of the skull. This allows only 20% additional growth of the brain beyond the first 2 years of life.
Clinical assessment of mental and behavioral growth uses normal progress charts for the infant during the first year of life. Comparison of these charts with the baby’s actual development helps evaluate development.

                     data-content="ORGANIZATION OF THE CELL A typical cell, as seen by the light microscope, has two major parts: the nucleus and the cytoplasm.
The nucleus is separated from the cytoplasm by a nuclear membrane. The cytoplasm is separated from surrounding fluids by a cell membrane, also called the plasma membrane.
The different substances that make up the cell are collectively called protoplasm. Protoplasm is composed mainly of five basic substances—water, electrolytes, proteins, lipids, and carbohydrates.
WATER Most cells, except for fat cells, are comprised mainly of water in a concentration of 70% to 85%.
Many cellular chemicals are dissolved in the water. Others are suspended in the water as solid particulates.
Chemical reactions take place among the dissolved chemicals or at the surfaces of the suspended particles or membranes.
IONS Important ions in the cell include potassium, magnesium, phosphate, sulfate, bicarbonate, and smaller quantities of sodium, chloride, and calcium.
These ions are all discussed in Chapter 4, which considers the interrelations between the intracellular and extracellular fluids.
The ions provide inorganic chemicals for cellular reactions. They are also necessary for the operation of some cellular control mechanisms.
For example, ions acting at the cell membrane are required for the transmission of electrochemical impulses in nerve and muscle fibers.
PROTEINS After water, the most abundant substances in most cells are proteins, which normally constitute 10% to 20% of the cell mass.
These proteins can be divided into two types:
Structural proteins Functional proteins Structural Proteins Structural proteins are present in the cell mainly in the form of long filaments that are polymers of many individual protein molecules.
A prominent use of such intracellular filaments is to form microtubules, which provide the cytoskeletons of cellular organelles such as cilia, nerve axons, the mitotic spindles of cells undergoing mitosis, and a tangled mass of thin filamentous tubules that hold the parts of the cytoplasm and nucleoplasm together in their respective compartments.
Fibrillar proteins are found outside the cell, especially in the collagen and elastin fibers of connective tissue, and elsewhere, such as in blood vessel walls, tendons, and ligaments.
Functional Proteins The functional proteins are usually composed of combinations of a few molecules in tubular-globular form.
These proteins are mainly the enzymes of the cell and, in contrast to the fibrillar proteins, are often mobile in the cell fluid.
Also, many of them are adherent to membranous structures inside the cell and catalyze specific intracellular chemical reactions.
For example, the chemical reactions that split glucose into its component parts and then combine these with oxygen to form carbon dioxide and water while simultaneously providing energy for cellular function are all catalyzed by a series of protein enzymes.
LIPIDS Lipids are several types of substances that are grouped together because of their common property of being soluble in fat solvents.
Especially important lipids are phospholipids and cholesterol, which together constitute only about 2% of the total cell mass.
Phospholipids and cholesterol are mainly insoluble in water and therefore are used to form the cell membrane and intracellular membrane barriers that separate the different cell compartments.
In addition to phospholipids and cholesterol, some cells contain large quantities of triglycerides, also called neutral fats.
In fat cells (adipocytes), triglycerides often account for as much as 95% of the cell mass.
The fat stored in these cells represents the body’s main storehouse of energy-giving nutrients that can later be used to provide energy wherever it is needed in the body.
CARBOHYDRATES Carbohydrates play a major role in cell nutrition and, as parts of glycoprotein molecules, have structural functions.
Most human cells do not maintain large stores of carbohydrates; the amount usually averages only about 1% of their total mass but increases to as much as 3% in muscle cells and, occasionally, to 6% in liver cells.
However, carbohydrate in the form of dissolved glucose is always present in the surrounding extracellular fluid so that it is readily available to the cell.
Also, a small amount of carbohydrate is stored in cells as glycogen, an insoluble polymer of glucose that can be depolymerized and used rapidly to supply the cell’s energy needs.
CELL STRUCTURE The cell contains highly organized physical structures called intracellular organelles, which are critical for cell function.
For example, without one of the organelles, the mitochondria, more than 95% of the cell’s energy release from nutrients would cease immediately.
The most important organelles and other structures of the cell are shown in Figure 2-2.
MEMBRANOUS STRUCTURES OF THE CELL Most organelles of the cell are covered by membranes composed primarily of lipids and proteins.
These membranes include:
The cell membrane Nuclear membrane Membrane of the endoplasmic reticulum Membranes of the mitochondria Lysosomes Golgi apparatus "></div><div data-title="Fundamentals of Electrocardiography"

                     data-content="ELECTROCARDIOGRAMS VECTORS CAN REPRESENT ELECTRICAL POTENTIALS To understand how cardiac abnormalities affect the contours of the ECG, one must first become familiar with the concept of vectors and vectorial analysis as applied to electrical potentials in and around the heart.
At any given instant during the cardiac cycle, current flows in a particular direction in the heart. A vector is an arrow that points in the direction of the electrical potential generated by the current flow, with the arrowhead in the positive direction. By convention, the length of the arrow is drawn proportional to the voltage of the potential.
Resultant Vector in the Heart at Any Given Instant Figure 12-1 shows depolarization of the ventricular septum and of parts of the apical endocardial walls of the two ventricles. At the instant of heart excitation, electrical current flows between the depolarized areas inside the heart and the non-depolarized areas on the outside of the heart.
Some current also flows inside the heart chambers directly from the depolarized areas toward the still polarized areas. Overall, considerably more current flows downward from the base of the ventricles toward the apex than in the upward direction.
Therefore, the summated vector of the generated potential at this particular instant — called the instantaneous mean vector — is represented by the long black arrow drawn through the center of the ventricles in a direction from the base toward the apex. Because the summated current is quite large, the potential is large, and the vector is long.
THE DIRECTION OF A VECTOR IS DENOTED IN TERMS OF DEGREES When a vector is exactly horizontal and directed toward the person’s left side, the vector extends in the direction of 0 degrees, as shown in Figure 12-2.
From this zero reference point, the scale of vectors rotates clockwise:
Direction Angle Horizontal left 0° Downward (vertical) &#43;90° Rightward &#43;180° Upward (vertical) −90° (or &#43;270°) In a normal heart, the average direction of the vector during spread of the depolarization wave through the ventricles — called the mean QRS vector — is about &#43;59 degrees (vector A in Figure 12-2). This means that during most of the depolarization wave, the apex of the heart remains positive with respect to the base of the heart.
THE THREE STANDARD BIPOLAR LIMB LEADS Each lead is a pair of electrodes connected to the body on opposite sides of the heart. The direction from the negative electrode to the positive electrode is called the axis of the lead.
Lead Axes Lead Electrode Placement Axis Direction Lead I Left arm (&#43;) and right arm (−) 0° Lead II Left leg (&#43;) and right arm (−) &#43;60° Lead III Left leg (&#43;) and left arm (−) &#43;120° The axes of the three bipolar limb leads can be represented in the hexagonal reference system (Figure 12-3).
THE THREE UNIPOLAR LIMB LEADS In addition to the three standard bipolar leads, there are three unipolar limb leads:
Lead Axis Direction aVR &#43;210° aVF &#43;90° aVL −30° The polarities of the electrodes are shown by plus and minus signs in Figure 12-3. These axes and their polarities must be learned, particularly for the bipolar limb leads I, II, and III.
VECTORIAL ANALYSIS OF POTENTIALS RECORDED IN DIFFERENT LEADS Example 1: Positive Deflection in Lead I Figure 12-4 shows a partially depolarized heart, with vector A representing the instantaneous mean direction of current flow in the ventricles.
Direction of vector A: &#43;55 degrees Voltage of the potential: 2 millivolts To determine how much of the voltage in vector A will be recorded in lead I:
Draw a line representing the axis of lead I in the 0-degree direction. Draw a line perpendicular to the axis of lead I from the tip of vector A to the lead I axis. Draw the projected vector (B) along the lead I axis. The arrow of this projected vector points toward the positive end of the lead I axis. This means the record momentarily being recorded in the ECG of lead I is positive.
The instantaneous recorded voltage equals the length of B divided by the length of A times 2 millivolts — about 1 millivolt.
Example 2: Negative Deflection in Lead I Figure 12-5 shows another example. Vector A represents the electrical potential at a given instant during ventricular depolarization in a heart in which the left side of the heart depolarizes more rapidly than the right side.
Direction of vector A: 100 degrees Voltage: 2 millivolts To determine the potential recorded in lead I, draw a perpendicular line from the tip of vector A to the lead I axis and find projected vector B.
Vector B is very short and points in the negative direction. This indicates that at this particular instant, the recording in lead I will be negative (below the zero line in the ECG), and the voltage recorded will be small — about −0.3 millivolts.
This figure demonstrates two key principles:
When the vector in the heart is almost perpendicular to the axis of the lead, the voltage recorded in the ECG of that lead is very low. When the vector is parallel to the axis of the lead, the voltage approaches maximum. Figure 12-1 Mean vector through the partially depolarized ventricles goes from the base of the left ventricle towards the apex.
Figure 12-2 Vectors drawn to represent potentials for several different hearts and the axis of the potential (expressed in degrees) for each heart.
Figure 12-3 Axes of the three bipolar and three unipolar leads.
Figure 12-4 Determination of a projected vector B along the axis of lead I when vector A represents the instantaneous potential in the ventricles.
Figure 12-5 Vectorial analysis when the heart vector is nearly perpendicular to the lead axis, showing a small negative deflection.

                     data-content="—## GASTROINTESTINAL BLOOD FLOW Stimulation of the parasympathetic nerves going to the stomach and lower colon increases local blood flow at the same time that it increases glandular secretion. This increased flow probably results secondarily from the increased glandular activity, not as a direct effect of the nervous stimulation. Sympathetic stimulation, by contrast, has a direct effect on essentially all the gastrointestinal tract to cause intense vasoconstriction of the arterioles and greatly decreased blood flow. After a few minutes of this vasoconstriction, the flow often returns to near normal by means of a mechanism called “autoregulatory escape.” That is, the local metabolic vasodilator mechanisms that are elicited by ischemia override the sympathetic vasoconstriction, returning toward normal the necessary nutrient blood flow to the gastrointestinal glands and muscle. Importance of Nervous Depression of Gastrointestinal Blood Flow When Other Parts of the Body Need Extra Blood Flow. A major value of sympathetic vasoconstriction in the gut is that it allows shutoff of gastrointestinal and other splanchnic blood flow for short periods during heavy exercise when the skeletal muscle and heart need increased flow. Also, in circulatory shock, when all the body’s vital tissues are in danger of cellular death for lack of blood flow—especially the brain and the heart— sympathetic stimulation can decrease splanchnic blood flow to very little for many hours. Sympathetic stimulation also causes strong vasoconstriction of the large-volume intestinal and mesenteric veins. This vasoconstriction decreases the volume of these veins, thereby displacing large amounts of blood into other parts of the circulation. In persons experiencing hemorrhagic shock or other states of low blood volume, this mechanism can provide as much as 200 to 400 ml of extra blood to sustain the general circulation. Bibliography Barth BB, Shen X: Computational motility models of neurogastroenterology and neuromodulation. Brain Res 1693:174, 2018. Chalazonitis A, Rao M: Enteric nervous system manifestations of neurodegenerative disease. Brain Res 1693:207, 2018. ### Furness JB: The enteric nervous system and neurogastroenterology. Nat Rev Gastroenterol Hepatol 9:286, 2012. Furness JB, Stebbing MJ: The first brain: species comparisons and evolutionary implications for the enteric and central nervous systems. Neurogastroenterol Motil 2018 Feb;30(2). http://doi. org/10.1111/ nmo.13234. Granger DN, Holm L, Kvietys P: The gastrointestinal circulation: physiology and pathophysiology, Compr Physiol 5:1541, 2015. Kaelberer MM, Bohórquez DV: The now and then of gut-brain signaling. Brain Res 1693:192, 2018. Kumral D, Zfass AM: Gut movements: a review of the physiology of gastrointestinal transit. Dig Dis Sci 63:2500, 2018. Lake JI, Heuckeroth RO: Enteric nervous system development: migration, differentiation, and disease. Am J Physiol Gastrointest Liver Physiol 305: G1, 2013. Lammers WJ: Inhomogeneities in the propagation of the slow wave in the stomach. Neurogastroenterol Motil 27:1349, 2015. Liddle RA: Interactions of gut endocrine cells with epithelium and neurons. Compr Physiol 8:1019, 2018. Rao M, Gershon MD: Enteric nervous system development: what could possibly go wrong? Nat Rev Neurosci 19:552, 2018. Sanders KM, Ward SM: Nitric oxide and its role as a non-adrenergic, non-cholinergic inhibitory neurotransmitter in the gastrointestinal tract. Br J Pharmacol 176:212, 2019. Sanders KM, Ward SM, Koh SD: Interstitial cells: regulators of smooth muscle function. Physiol Rev 94:859, 2014. Schemann M, Frieling T, Enck P: To learn, to remember, to forgetHow smart is the gut? Acta Physiol (Oxf) 2019 May 7: e13296. doi: 10.1111/apha.13296. Vergnolle N, Cirillo C: Neurons and glia in the enteric nervous system and epithelial barrier function. Physiology (Bethesda) 33:269, 2018. Waise TMZ, Dranse HJ, Lam TKT: The metabolic role of vagal afferent innervation. Nat Rev Gastroenterol Hepatol 15:625, 2018. Central lacteal Vein Artery Blood capillaries &gt; Figure 63-8. Microvasculature of the villus showing a countercurrent arrangement of blood flow in the arterioles and venules. The time that food remains in each part of the alimentary tract is critical for optimal processing and absorption of nutrients. In addition, appropriate mixing must be provided. Because the requirements for mixing and propulsion are quite different at each stage of processing, multiple automatic nervous and hormonal mechanisms control the timing of each of these activities so they will occur optimally—not too rapidly and not too slowly. This chapter discusses these movements, especially the automatic mechanisms of this control. ## INGESTION OF FOOD The amount of food that a person ingests is determined principally by an intrinsic desire for food called hunger. The type of food that a person preferentially seeks is determined by appetite. These mechanisms are extremely important for maintaining an adequate nutritional supply for the body and are discussed in Chapter 72 in relation to nutrition of the body. The current discussion is confined to the mechanics of food ingestion, especially mastication and swallowing. ## MASTICATION (CHEWING) The teeth are admirably designed for chewing. The anterior teeth (incisors) provide a strong cutting action, and the posterior teeth (molars) provide a grinding action. All the jaw muscles working together can close the teeth with a force as great as 55 pounds on the incisors and 200 pounds on the molars. Most of the muscles of chewing are innervated by the motor branch of the fifth cranial nerve, and the chewing process is controlled by nuclei in the brain stem. Stimulation of specific reticular areas in the brain stem taste centers will cause rhythmic chewing movements. In addition, stimulation of areas in the hypothalamus, amygdala, and even the cerebral cortex near the sensory areas for taste and smell can cause chewing. Much of the chewing process is caused by a chewing reflex. The presence of a bolus of food in the mouth at first initiates reflex inhibition of the muscles of mastication, which allows the lower jaw to drop. This drop in turn initiates a stretch reflex of the jaw muscles that leads to rebound contraction. This action automatically raises the jaw to cause closure of the teeth, but it also compresses the bolus again against the linings of the mouth, which inhibits the jaw muscles once again, allowing the jaw to drop and rebound another time; this process is repeated again and again. Chewing is important for digestion of all foods, but it is especially important for most fruits and raw vegetables because they have indigestible cellulose membranes around their nutrient portions that must be broken before the food can be digested. Furthermore, chewing aids the digestion of food for another simple reason—digestive enzymes act only on the surfaces of food particles. Therefore, the rate of digestion depends on the total surface area exposed to the digestive secretions. In addition, grinding the food to a very fine particulate consistency prevents excoriation of the gastrointestinal tract and increases the ease with which food is emptied from the stomach into the small intestine, then into all succeeding segments of the gut. ## SWALLOWING (DEGLUTITION) Swallowing is a complicated mechanism, principally because the pharynx subserves respiration and swallowing. The pharynx is converted for only a few seconds at a time into a tract for propulsion of food. It is especially important that respiration not be compromised because of swallowing. In general, swallowing can be divided into the following stages: (1) a voluntary stage, which initiates the swallowing process; (2) a pharyngeal stage, which is involuntary and constitutes passage of food through the pharynx into the esophagus; and (3) an esophageal stage, another involuntary phase that transports food from the pharynx to the stomach. Voluntary Stage of Swallowing. When the food is ready for swallowing, it is “voluntarily” squeezed or rolled posteriorly into the pharynx by pressure of the tongue upward and backward against the palate, as shown in Figure 64-1. From here on, swallowing becomes entirely—or almost entirely—automatic and ordinarily cannot be stopped. Propulsion and Mixing of Food in the Alimentary Tract UNIT XII Gastrointestinal Physiology Involuntary Pharyngeal Stage of Swallowing. As the bolus of food enters the posterior mouth and pharynx, it stimulates epithelial swallowing receptor areas all around the opening of the pharynx, especially on the tonsillar pillars, and impulses from these areas pass to the brain stem to initiate a series of automatic pharyngeal muscle contractions as follows:
The soft palate is pulled upward to close the posterior nares to prevent reflux of food into the nasal cavities. 2. The palatopharyngeal folds on each side of the pharynx are pulled medially to approximate each other. In this way, these folds form a sagittal slit through which the food must pass into the posterior pharynx. This slit performs a selective action, allowing food that has been masticated sufficiently to pass with ease. Because this stage of swallowing lasts less than 1 second, any large object is usually impeded too much to pass into the esophagus. 3. The vocal cords of the larynx are strongly approximated, and the larynx is pulled upward and anteriorly by the neck muscles. These actions, combined with the presence of ligaments that prevent upward movement of the epiglottis, cause the epiglottis to swing backward over the opening of the larynx. All these effects acting together prevent passage of food into the nose and trachea. Most essential is the tight approximation of the vocal cords, but the epiglottis helps to prevent food from ever getting as far as the vocal cords. Destruction of the vocal cords or of the muscles that approximate them can cause strangulation. 4. The upward movement of the larynx also pulls up and enlarges the opening to the esophagus. At the same time, the upper 3 to 4 centimeters of the esophageal muscular wall, called the upper esophageal sphincter (also called the pharyngoesophageal sphincter), relaxes. Thus, food moves easily and freely from the posterior pharynx into the upper esophagus. Between swallows, this sphincter remains strongly contracted, thereby preventing air from going into the esophagus during respiration. The upward movement of the larynx also lifts the glottis out of the main stream of food flow, so the food mainly passes on each side of the epiglottis rather than over its surface; this action adds still another protection against entry of food into the trachea. 5. Once the larynx is raised and the pharyngoesophageal sphincter becomes relaxed, the entire muscular wall of the pharynx contracts, beginning in the superior part of the pharynx, then spreading downward over the middle and inferior pharyngeal areas, which propels the food by peristalsis into the esophagus. To summarize the mechanics of the pharyngeal stage of swallowing: The trachea is closed, the esophagus is opened, and a fast peristaltic wave initiated by the nervous system of the pharynx forces the bolus of food into the upper esophagus, with the entire process occurring in less than 2 seconds. Nervous Initiation of the Pharyngeal Stage of Swallowing. The most sensitive tactile areas of the posterior mouth and pharynx for initiating the pharyngeal stage of swallowing lie in a ring around the pharyngeal opening, with greatest sensitivity on the tonsillar pillars. Impulses are transmitted from these areas through the sensory portions of the trigeminal and glossopharyngeal nerves into the medulla oblongata, either into or closely associated with the tractus solitarius, which receives essentially all sensory impulses from the mouth. The successive stages of the swallowing process are then automatically initiated in orderly sequence by neuronal areas of the reticular substance of the medulla and lower portion of the pons. The sequence of the swallowing reflex is the same from one swallow to the next, and the timing of the entire cycle also remains constant from one swallow to the next. The areas in the medulla and lower pons that control swallowing are collectively called the deglutition or swallowing center. The motor impulses from the swallowing center to the pharynx and upper esophagus that cause swallowing are transmitted successively by the fifth, ninth, tenth, and twelfth cranial nerves and even a few of the superior cervical nerves. In summary, the pharyngeal stage of swallowing is principally a reflex act. It is almost always initiated by voluntary movement of food into the back of the mouth, which in turn excites involuntary pharyngeal sensory receptors to elicit the swallowing reflex. The Pharyngeal Stage of Swallowing Momentarily Interrupts Respiration. The entire pharyngeal stage of swallowing usually occurs in less than 6 seconds, thereEsophagus Vagus Glossopharyngeal nerve Trigeminal nerve Bolus of food Uvula Epiglottis Vocal cords Peristalsis Pharynx Medulla Swallowing center Figure 64-1. Swallowing mechanism. "></div><div data-title="Genetic Control of Protein Synthesis, Cell Function, and Cell Reproduction"
