                     data-permalink="/guyton/guyton/ch68_metabolism-of-carbohydrates-and-formation-of-adenosine-triphosphate/"
                     data-content="Metabolism and Energy — Introduction The next few chapters deal with metabolism in the body — the chemical processes that enable cells to continue living.
These chapters do not present chemical details of all cellular reactions (the domain of biochemistry).
Instead, they focus on:
A review of the principal chemical processes of the cell An analysis of their physiological implications, especially how they fit into overall body homeostasis Release of Energy From Foods Free Energy Many cellular chemical reactions are aimed at making energy in foods available to physiological systems.
Energy is required for:
Muscle activity Secretion by glands Maintenance of membrane potentials by nerve and muscle fibers Synthesis of substances in cells Absorption of foods from the gastrointestinal tract Many other functions The amount of energy liberated by complete oxidation of a food is called free energy.
Free energy is represented by the symbol ΔG.
Free energy is expressed in calories per mole of substance.
For example, complete oxidation of 1 mole (180 grams) of glucose releases 686,000 calories.
Coupled Reactions All energy foods — carbohydrates, fats, and proteins — can be oxidized in cells, releasing large amounts of energy.
If oxidized outside the body (in a fire), energy is released suddenly and all in the form of heat.
Cellular physiological processes require energy that is not heat, but energy to cause:
Mechanical movement (muscle function) Concentration of solutes (glandular secretion) Many other cell functions Chemical reactions must be coupled with systems responsible for these physiologic functions.
This coupling is accomplished by special cellular enzymes and energy transfer systems.
Adenosine Triphosphate (ATP) The Energy Currency of the Body ATP is an essential link between energy-utilizing and energy-producing functions of the body.
ATP has been called the “energy currency” of the body.
It can be gained and spent repeatedly.
Energy from oxidation of carbohydrates, proteins, and fats converts adenosine diphosphate (ADP) to ATP.
ATP is then consumed by various reactions necessary to maintain and propagate life.
Chemical Structure of ATP ATP is a labile chemical compound present in all cells.
ATP is a combination of:
Adenine Ribose Three phosphate radicals The last two phosphate radicals are connected by high-energy bonds (symbol ∼).
Condition Free energy per mole Standard conditions ~7,300 calories Body conditions (temperature and concentrations) ~12,000 calories After loss of one phosphate radical, ATP becomes ADP.
After loss of the second phosphate radical, it becomes AMP (adenosine monophosphate).
ATP Interconversions Conversion Energy Released ATP → ADP &#43; Pi ~12,000 calories ADP → AMP &#43; Pi ~12,000 calories ATP Cycle Summary Process Role Energy production Oxidation of proteins, carbohydrates, fats → ADP &#43; Pi → ATP Energy utilization Active ion transport, muscle contraction, synthesis of molecules, cell division and growth ATP is present everywhere in the cytoplasm and nucleoplasm of all cells.
Essentially all physiological mechanisms requiring energy obtain it directly from ATP (or another similar compound, GTP — guanosine triphosphate).
Central Role of Glucose in Carbohydrate Metabolism Overview The final products of carbohydrate digestion in the alimentary tract are glucose, fructose, and galactose.
Glucose represents about 80% of these products.
After absorption, much of the fructose and almost all galactose are rapidly converted into glucose in the liver.
Therefore, little fructose and galactose circulate in blood.
Glucose thus becomes the final common pathway for transport of almost all carbohydrates to tissue cells.
Liver Processing In liver cells, appropriate enzymes promote interconversions among monosaccharides.
When the liver releases monosaccharides back into blood, the final product is almost entirely glucose.
The reason is that liver cells contain large amounts of glucose-6-phosphatase.
Glucose-6-phosphate can be degraded to glucose and phosphate.
Glucose can then be transported through the liver cell membrane back into the blood.
More than 95% of all monosaccharides circulating in blood are glucose.
Glucose Transport Through Cell Membranes Transport Mechanism Before glucose can be used by tissue cells, it must be transported through the cell membrane into the cellular cytoplasm.
Glucose cannot easily diffuse through cell membrane pores because:
The maximum molecular weight of particles that diffuse readily is about 100 Glucose has a molecular weight of 180 Glucose passes into cells via specialized glucose transporters (GLUTs).
Glucose Transporter Types Transporter Location Function GLUT1 RBCs, brain endothelium Basal glucose uptake GLUT2 Liver, pancreatic β-cells, kidney Low affinity, high capacity GLUT3 Brain neurons High affinity GLUT4 Muscle, adipose tissue Insulin-responsive GLUT5 Small intestine Fructose transport SGLT1 Small intestine Sodium-glucose cotransporter SGLT2 Kidney Glucose reabsorption Insulin and GLUT4 Insulin stimulates translocation of GLUT4 to cell membranes in muscle and adipose tissue.
This increases glucose uptake in these tissues after meals.
Glycolysis Overview Glycolysis is the anaerobic breakdown of glucose (or glycogen) to pyruvate or lactate.
It occurs in the cytoplasm of all cells.
One molecule of glucose is converted to two molecules of pyruvate.
Net Products of Glycolysis (from Glucose) Product Yield ATP 2 ATP (net) NADH 2 NADH Pyruvate 2 molecules Glycolysis from Glycogen When glycolysis begins from glycogen instead of free glucose:
The first step (phosphorylation) is bypassed This saves 1 ATP Result: 4 ATP produced (gross), but 1 ATP used = 3 ATP net Anaerobic Fermentation In the absence of oxygen, pyruvate is converted to lactate by lactate dehydrogenase.
This regenerates NAD⁺ needed for continued glycolysis.
This allows glycolysis to continue when oxygen is scarce.
Mitochondrial Metabolism Pyruvate Decarboxylation Pyruvate enters mitochondria and is converted to acetyl-CoA by pyruvate dehydrogenase.
This reaction generates:
1 NADH per pyruvate (2 per glucose) 1 CO₂ per pyruvate (2 per glucose) Acetyl-CoA then enters the citric acid cycle.
The Citric Acid Cycle (Krebs Cycle) The citric acid cycle occurs in the mitochondrial matrix.
For each acetyl-CoA (per turn of the cycle):
Product Yield CO₂ 2 molecules NADH 3 molecules FADH₂ 1 molecule GTP (equivalent to ATP) 1 molecule Per glucose molecule (2 acetyl-CoA):
Product Yield CO₂ 4 molecules NADH 6 molecules FADH₂ 2 molecules ATP (or GTP) 2 molecules Oxidative Phosphorylation Electron Transport Chain The electron transport chain is located in the inner mitochondrial membrane.
NADH and FADH₂ donate electrons to the chain.
Electrons flow through a series of carriers:
Complex I (NADH dehydrogenase) Complex II (Succinate dehydrogenase) Coenzyme Q Complex III (Cytochrome bc1) Cytochrome c Complex IV (Cytochrome c oxidase) Proton Pumping As electrons flow, protons (H⁺) are pumped from the mitochondrial matrix to the intermembrane space.
This creates an electrochemical gradient (proton motive force).
ATP Synthesis Protons flow back into the matrix through ATP synthase.
This flow drives the synthesis of ATP from ADP and Pi.
Electron Donor ATP Yield (approx.) NADH 2.5 ATP FADH₂ 1.5 ATP Total ATP from Glucose Stage ATP from NADH ATP from FADH₂ Direct ATP Glycolysis 2 (cytosolic) 0 2 Pyruvate decarboxylation 2 0 0 Citric acid cycle 6 2 2 Total ~30-32 ATP Note: 2 ATP from glycolysis are considered cytosolic and require shuttle systems to enter mitochondria.
Glycogen Storage and Breakdown Glycogen Synthesis Glycogen is the storage form of glucose in liver and muscle.
Glycogen synthase catalyzes glycogen synthesis from glucose-6-phosphate.
Insulin promotes glycogen synthesis by activating glycogen synthase.
Glycogenolysis (Breakdown) Glycogen phosphorylase catalyzes breakdown of glycogen to glucose-1-phosphate.
In liver: Glucose-1-phosphate → Glucose-6-phosphate → Glucose (via glucose-6-phosphatase) → Blood
In muscle: Glucose-1-phosphate → Glucose-6-phosphate → Glycolysis (muscle lacks glucose-6-phosphatase)
Hormonal Regulation Hormone Effect on Glycogen Mechanism Insulin Promotes synthesis Activates glycogen synthase Glucagon Promotes breakdown (liver) Activates glycogen phosphorylase Epinephrine Promotes breakdown Activates glycogen phosphorylase via cAMP Gluconeogenesis Overview Gluconeogenesis is the synthesis of glucose from non-carbohydrate precursors.
This occurs primarily in the liver during fasting or starvation.
Precursors Gluconeogenic precursors include:
Lactate (from anaerobic glycolysis) Glycerol (from triglyceride breakdown) Amino acids (especially alanine and glutamine) Propionyl-CoA (from odd-chain fatty acids) Key Enzymes Gluconeogenesis requires four key enzymes not in glycolysis:
Pyruvate carboxylase (pyruvate → oxaloacetate) Phosphoenolpyruvate carboxykinase (oxaloacetate → phosphoenolpyruvate) Fructose-1,6-bisphosphatase (fructose-1,6-bisphosphate → fructose-6-phosphate) Glucose-6-phosphatase (glucose-6-phosphate → glucose) Cori Cycle Lactate produced by muscle during anaerobic glycolysis travels to the liver.
The liver converts lactate back to glucose via gluconeogenesis.
Glucose returns to muscle for energy.
This is the Cori cycle.

                     data-content="ARTERY DISEASE Aortic-Coronary Bypass Surgery In many patients with coronary ischemia, the constricted areas of the coronary arteries are located at only a few discrete points blocked by atherosclerotic disease.
The coronary vessels elsewhere are normal or almost normal.
In the 1960s, a surgical procedure called aortic-coronary bypass or coronary artery bypass grafting (CABG) was developed.
In this procedure, a section of a subcutaneous vein is removed from an arm or leg and grafted from the root of the aorta to the side of a peripheral coronary artery beyond the atherosclerotic blockage point.
One to five such grafts are usually performed.
Each graft supplies a peripheral coronary artery beyond a block.
Anginal pain is relieved in most patients after coronary bypass surgery.
In patients whose hearts have not become too severely damaged before the operation, the coronary bypass procedure may provide the patient with normal life expectancy.
If the heart has already been severely damaged, however, the bypass procedure may be of little value.
Coronary Angioplasty Since the 1980s, a procedure has been used to open partially blocked coronary vessels before they become totally occluded.
This procedure, called coronary artery angioplasty, is performed as follows.
A small balloon-tipped catheter, about 1 millimeter in diameter, is passed under radiographic guidance into the coronary system.
The catheter is pushed through the partially occluded artery until the balloon portion straddles the partially occluded point.
The balloon is then inflated with high pressure, which stretches the diseased artery markedly.
After this procedure, blood flow through the vessel often increases 3-fold to 4-fold.
More than 75% of patients who undergo the procedure are relieved of coronary ischemic symptoms for at least several years.
However, many of these patients still eventually require coronary bypass surgery.
Stents Small stainless steel mesh tubes called stents are sometimes placed inside a coronary artery dilated by angioplasty.
Stents hold the artery open, thus preventing restenosis.
Within a few weeks after the stent is placed, the endothelium usually grows over the metal surface.
This allows blood to flow smoothly through the stent.
However, reclosure (restenosis) of the blocked coronary artery occurs in about 25% to 40% of patients treated with angioplasty.
Restenosis often occurs within 6 months of the initial procedure.
Restenosis is usually due to excessive formation of scar tissue that develops underneath the healthy new endothelium.
Stents that slowly release drugs (drug-eluting stents) may help prevent excessive growth of scar tissue.
Newer Procedures Newer procedures for opening atherosclerotic coronary arteries are constantly in experimental development.
One of these procedures uses a laser beam from the tip of a coronary artery catheter aimed at the atherosclerotic lesion.
The laser literally dissolves the lesion without substantially damaging the remainder of the arterial wall.
FAILURE ACUTE EFFECTS OF MODERATE CARDIAC FAILURE If a heart suddenly becomes severely damaged, such as by myocardial infarction, the pumping ability of the heart is immediately depressed.
Two main effects occur: (1) reduced cardiac output; and (2) damming of blood in the veins, resulting in increased venous pressure.
The progressive changes in heart pumping effectiveness at different times after an acute myocardial infarction are shown graphically in Figure 22-1.
The top curve of this figure shows a normal cardiac output curve.
Point A on this curve is the normal operating point, showing a normal cardiac output under resting conditions of 5 L/min and a right atrial pressure of 0 mm Hg.
Immediately after the heart becomes damaged, the cardiac output curve becomes greatly depressed.
The curve falls to the lowest curve at the bottom of the graph.
Within a few seconds, a new circulatory state is established at point B.
Cardiac output has fallen to 2 L/min, about two-fifths normal.
Right atrial pressure has risen to &#43;4 mm Hg because venous blood returning to the heart from the body is dammed up in the right atrium.
This low cardiac output is still sufficient to sustain life for perhaps a few hours.
It is likely to be associated with fainting.
Fortunately, this acute stage usually lasts for only a few seconds.
Sympathetic nervous reflexes occur almost immediately and compensate, to a great extent, for the damaged heart.
Compensation for Acute Cardiac Failure by Sympathetic Nervous Reflexes When cardiac output falls precariously low, many circulatory reflexes are rapidly activated.
The best known is the baroreceptor reflex, which is activated by diminished arterial pressure.
The chemoreceptor reflex, the central nervous system ischemic response, and reflexes that originate in the damaged heart also likely contribute.
The sympathetic nervous system becomes strongly stimulated within a few seconds.
Parasympathetic nervous signals to the heart become inhibited at the same time.
Strong sympathetic stimulation has major effects on the heart and peripheral vasculature.
If all ventricular musculature is diffusely damaged but still functional, sympathetic stimulation strengthens this damaged musculature.
If part of the muscle is nonfunctional and part is still normal, the normal muscle is strongly stimulated.
This partially compensates for the nonfunctional muscle.
Thus, the heart becomes a stronger pump as a result of sympathetic stimulation.
This effect is illustrated in Figure 22-1, which shows about a twofold elevation of the very low cardiac output curve after sympathetic compensation.
Sympathetic stimulation also increases venous return.
It increases the tone of most blood vessels of the circulation, especially the veins.
This raises the mean systemic filling pressure to 12 to 14 mm Hg, almost 100% above normal.
This increased filling pressure greatly increases the tendency for blood to flow from the veins back into the heart.
Therefore, the damaged heart becomes primed with more inflowing blood than usual.
Right atrial pressure rises still further, which helps the heart pump still larger quantities of blood.
In Figure 22-1, the new circulatory state is depicted by point C.
Cardiac output is now 4.2 L/min.
Right atrial pressure is 5 mm Hg.
The sympathetic reflexes become maximally developed in about 30 seconds.
A person who has a sudden, moderate heart attack might experience nothing more than cardiac pain and a few seconds of fainting.
Shortly thereafter, with the aid of sympathetic reflex compensations, the cardiac output may return to a level adequate to sustain the person if he or she remains quiet.
The pain might persist.
CHRONIC STAGE OF FAILURE—FLUID RETENTION AND COMPENSATED CARDIAC OUTPUT After the first few minutes of an acute heart attack, a prolonged semichronic state begins.
This state is characterized mainly by two events: (1) retention of fluid by the kidneys; and (2) varying degrees of recovery of the heart over a period of weeks to months.
This is illustrated by the light green curve in Figure 22-1.
Renal Retention of Fluid and Increase in Blood Volume A low cardiac output has a profound effect on renal function.
It sometimes causes anuria when the cardiac output falls to 50% to 60% of normal.
In general, urine output remains below normal as long as the cardiac output and arterial pressure remain significantly less than normal.
Urine output usually does not return to normal after an acute heart attack until the cardiac output and arterial pressure rise almost to normal levels.
Moderate Fluid Retention in Cardiac Failure Can Be Beneficial Many cardiologists have considered fluid retention always to have a detrimental effect in cardiac failure.
However, a moderate increase in body fluid and blood volume is an important factor in helping compensate for the diminished pumping ability of the heart.
The increased blood volume increases venous return in two ways.
First, it increases the mean systemic filling pressure.
This increases the pressure gradient for causing venous flow of blood toward the heart.
Second, it distends the veins, which reduces venous resistance.
This allows even more ease of flow of blood to the heart.
If the heart is not damaged too much, this increased venous return can almost fully compensate for the heart’s diminished pumping ability.
Even when the heart’s pumping ability is reduced to as low as 40% to 50% of normal, the increased venous return can often cause nearly normal cardiac output.
This is as long as the person remains in a quiet resting state.
When the heart’s pumping capability is reduced further, blood flow to the kidneys finally becomes too low.
The kidneys cannot excrete enough salt and water to equal salt and water intake.
Therefore, fluid retention begins and continues indefinitely unless major therapeutic procedures are used.
Furthermore, because the heart is already pumping at its maximum capacity, this excess fluid no longer has a beneficial effect on the circulation.
Instead, the fluid retention increases the workload on the already damaged heart.
Severe edema develops throughout the body.
This can be very detrimental and can lead to death.
Detrimental Effects of Excess Fluid Retention in Severe Cardiac Failure In contrast to the beneficial effects of moderate fluid retention, in severe cardiac failure, extreme excesses of fluid can have serious physiologic consequences.
These include:
Increasing the workload on the damaged heart Overstretching of the heart, which further weakens it Filtration of fluid into the lungs, causing pulmonary edema and consequent deoxygenation of the blood Development of extensive edema in most parts of the body These detrimental effects of excessive fluid are discussed in later sections of this chapter.
Recovery of the Heart After Myocardial Infarction After a heart becomes suddenly damaged as a result of myocardial infarction, the natural reparative processes of the body begin.
These help restore normal cardiac function.
A new collateral blood supply begins to penetrate the peripheral portions of the infarcted area of the heart.
This often causes some of the heart muscle in the fringe areas to become functional again.
Also, the undamaged portion of the heart musculature hypertrophies.
This offsets some of the cardiac damage.
Summary of Cardiac Output Changes After Acute Myocardial Infarction Parameter Normal (Point A) Acutely Damaged (Point B) With Sympathetic Compensation (Point C) Cardiac output 5 L/min 2 L/min 4.2 L/min Right atrial pressure 0 mm Hg &#43;4 mm Hg &#43;5 mm Hg The progressive changes occur over seconds, minutes, days, and weeks as illustrated in Figure 22-1.
The sympathetic reflexes reach maximum development in about 30 seconds.
A person with a sudden moderate heart attack might only experience cardiac pain and brief fainting.
With compensation, cardiac output may return to an adequate level if the person remains quiet.

                     data-content="AUTONOMIC NERVOUS SYSTEM The most important part of the autonomic nervous system for regulating the circulation is the sympathetic nervous system. The parasympathetic nervous system contributes importantly to regulation of heart function.
Sympathetic Nervous System Figure 18-1 shows the anatomy of sympathetic nervous control of the circulation. Sympathetic vasomotor nerve fibers leave the spinal cord through all the thoracic spinal nerves and through the first one or two lumbar spinal nerves.
These fibers then pass immediately into a sympathetic chain — one on each side of the vertebral column. From there, they pass by two routes to the circulation:
Through specific sympathetic nerves that innervate mainly the vasculature of the internal viscera and the heart Almost immediately into peripheral portions of the spinal nerves distributed to the vasculature of the peripheral areas Sympathetic Innervation of the Blood Vessels Figure 18-2 shows the distribution of sympathetic nerve fibers to the blood vessels. In most tissues, all vessels except the capillaries are innervated.
Precapillary sphincters and metarterioles are innervated in some tissues (such as mesenteric blood vessels), although their sympathetic innervation is usually not as dense as in small arteries, arterioles, and veins. Innervation of small arteries and arterioles allows sympathetic stimulation to increase resistance to blood flow and decrease the rate of blood flow through the tissues. Innervation of large vessels — particularly veins — makes it possible for sympathetic stimulation to decrease the volume of these vessels. This can push blood into the heart and plays a major role in regulation of heart pumping. Sympathetic Stimulation Increases Heart Rate and Contractility Sympathetic fibers go directly to the heart (shown in Figure 18-1). As discussed in Chapter 9, sympathetic stimulation markedly increases the activity of the heart — both increasing the heart rate and enhancing its strength and volume of pumping.
Parasympathetic Stimulation Decreases Heart Rate and Contractility Although the parasympathetic nervous system is exceedingly important for many other autonomic functions (such as control of multiple gastrointestinal actions), it plays only a minor role in regulating vascular function in most tissues.
Its most important circulatory effect is to control heart rate by way of parasympathetic nerve fibers to the heart in the vagus nerves (shown in Figure 18-1 by the dashed red line from the brain medulla directly to the heart).
Parasympathetic stimulation causes a marked decrease in heart rate and a slight decrease in heart muscle contractility.
SYMPATHETIC VASOCONSTRICTOR SYSTEM AND ITS CONTROL BY THE CENTRAL NERVOUS SYSTEM The sympathetic nerves carry large numbers of vasoconstrictor nerve fibers and only a few vasodilator fibers. The vasoconstrictor fibers are distributed to essentially all segments of the circulation, but more to some tissues than to others.
This sympathetic vasoconstrictor effect is especially powerful in the kidneys, intestines, spleen, and skin — but is much less potent in skeletal muscle, heart, and brain.
VASOMOTOR CENTER IN THE BRAIN Located bilaterally mainly in the reticular substance of the medulla and lower third of the pons is an area called the vasomotor center (shown in Figures 18-1 and 18-3).
This center transmits:
Parasympathetic impulses through the vagus nerves to the heart Sympathetic impulses through the spinal cord and peripheral sympathetic nerves to virtually all arteries, arterioles, and veins of the body Areas of the Vasomotor Center Although the total organization of the vasomotor center is still unclear, experiments have made it possible to identify certain important areas:
Area Location Function Vasoconstrictor area Bilaterally in the anterolateral portions of the upper medulla Distributes fibers that cause vasoconstriction Other areas (Not specified) Various regulatory functions Sympathetic Vasoconstriction Effects Sympathetic vasoconstriction affects different vascular beds differently:
Tissue Vasoconstrictor Effect Kidneys Very powerful Intestines Very powerful Spleen Very powerful Skin Very powerful Skeletal muscle Much weaker Heart Much weaker Brain Much weaker Figure 18-1. Anatomy of sympathetic nervous control of the circulation. Also shown by the dashed red line is a vagus nerve that carries parasympathetic signals to the heart.
Figure 18-2. Sympathetic innervation of the systemic circulation (arteries, arterioles, capillaries, venules, veins).
Figure 18-3. Areas of the brain that play important roles in the nervous regulation of the circulation. The dashed lines represent inhibitory pathways.
"></div><div data-title="Organization of the Nervous System, Basic Functions of Synapses, and Neurotransmitters" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch46_organization-of-the-nervous-system-basic-functions-of-synapses-and-neurotransm/"
                     data-content="CENTRAL NERVOUS SYSTEM NEURON — THE BASIC FUNCTIONAL UNIT The central nervous system is estimated to contain 80 to 100 billion neurons.
Figure 46-1 shows a typical neuron of a type found in the brain motor cortex.
Signal Entry Points Incoming signals enter the neuron through synapses located mostly on the neuronal dendrites, but also on the cell body.
For different types of neurons, there may be only a few hundred or as many as 200,000 such synaptic connections from input fibers.
Signal Exit Point In contrast, the output signal travels via a single axon leaving the neuron.
This axon may have many separate branches to other parts of the nervous system or peripheral body.
Direction of Signal Flow A special feature of most synapses is that the signal normally passes only in the forward direction.
The signal travels from the axon of a preceding neuron to dendrites on cell membranes of subsequent neurons.
This feature forces the signal to travel in required directions to perform specific nervous functions.
SENSORY PART OF THE NERVOUS SYSTEM — SENSORY RECEPTORS Most activities of the nervous system are initiated by sensory experiences that excite sensory receptors.
These may include:
Visual receptors in the eyes Auditory receptors in the ears Tactile receptors on the surface of the body Other types of receptors These sensory experiences can either:
Cause immediate reactions from the brain Result in memories that are stored in the brain for minutes, weeks, or years, determining bodily reactions at some future date Somatic Portion of the Sensory System Figure 46-2 shows the somatic portion of the sensory system.
It transmits sensory information from:
The receptors of the entire body surface Some deep structures This information enters the central nervous system through peripheral nerves.
It is conducted immediately to multiple sensory areas:
Area Function Spinal cord at all levels Initial processing Reticular substance of the medulla, pons, and mesencephalon Arousal and consciousness Cerebellum Coordination Thalamus Relay and integration Areas of the cerebral cortex Sensory perception MOTOR PART OF THE NERVOUS SYSTEM — EFFECTORS The most important eventual role of the nervous system is to control the various bodily activities.
This task is achieved by controlling:
Contraction of appropriate skeletal muscles throughout the body Contraction of smooth muscle in the internal organs Secretion of active chemical substances by both exocrine and endocrine glands These activities are collectively called motor functions of the nervous system.
The muscles and glands are called effectors because they are the actual anatomical structures that perform the functions dictated by the nerve signals.
Skeletal Motor Nerve Axis Figure 46-3 shows the skeletal motor nerve axis of the nervous system for controlling skeletal muscle contraction.
Operating parallel to this axis is another system, called the autonomic nervous system, for controlling:
Smooth muscles Glands Other internal bodily systems (This system is discussed in Chapter 61.)
Levels of Nervous System Control Skeletal muscles can be controlled from many levels of the central nervous system:
Level Primary Function Spinal cord Automatic, instantaneous muscle responses to sensory stimuli Reticular substance of medulla, pons, and mesencephalon Automatic responses, arousal Basal ganglia Movement planning and coordination Cerebellum Coordination and balance Motor cortex Deliberate complex muscle movements controlled by thought Lower regions are concerned primarily with automatic, instantaneous muscle responses to sensory stimuli.
Higher regions are concerned with deliberate complex muscle movements controlled by thought processes of the brain.
PROCESSING OF INFORMATION — INTEGRATIVE FUNCTION OF THE NERVOUS SYSTEM One of the most important functions of the nervous system is to process incoming information so that appropriate mental and motor responses will occur.
More than 99% of all sensory information is discarded by the brain as irrelevant and unimportant.
Examples of discarded information:
Parts of the body in contact with clothing Seat pressure when sitting Most of the visual field Perpetual background noise (usually relegated to the subconscious) However, when important sensory information excites the mind, it is immediately channeled into proper integrative and motor regions of the brain to cause desired responses.
This channeling and processing of information is called the integrative function of the nervous system.
Example: If a person places a hand on a hot stove, the desired instantaneous response is to lift the hand.
Other associated responses follow, such as moving the entire body away from the stove and perhaps shouting with pain.
ROLE OF SYNAPSES IN PROCESSING INFORMATION The synapse is the junction point from one neuron to the next.
Synapses determine the directions that nervous signals will spread through the nervous system.
Synaptic Transmission Characteristics Type Effect Easy transmission synapses Transmit signals readily Difficult transmission synapses Transmit signals only with difficulty Facilitatory signals Open synapses for transmission Inhibitory signals Close synapses to transmission Functions of Synapses Some postsynaptic neurons respond with large numbers of output impulses.
Other neurons respond with only a few.
Thus, synapses perform a selective action:
Blocking weak signals while allowing strong signals to pass At other times, selecting and amplifying certain weak signals Often channeling signals in many directions rather than in only one direction The brain’s ability to selectively process information depends on these synaptic mechanisms.
"></div><div data-title="Overview of the Circulation: Pressure, Flow, and Resistance" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch14_overview-of-the-circulation---pressure-flow-and-resistance/"
                     data-content="INTRODUCTION: FUNCTIONS OF THE CIRCULATION The function of the circulation is to serve the needs of the body tissues. The circulation:
Transports nutrients to the tissues Transports waste products away from the tissues Transports hormones from one part of the body to another Maintains an appropriate environment in all the tissue fluids for survival and optimal function of the cells The rate of blood flow through many tissues is controlled mainly in response to their need for nutrients and removal of waste products of metabolism.
In some organs, such as the kidneys, the circulation serves additional functions. Blood flow to the kidney is far in excess of its metabolic requirements. This is related to its excretory function, which requires that a large volume of blood be filtered each minute.
The heart and blood vessels are controlled to provide the cardiac output and arterial pressure needed to supply adequate tissue blood flow.
PHYSICAL CHARACTERISTICS OF THE CIRCULATION The circulation (Figure 14-1) is divided into:
Systemic circulation (also called the greater circulation or peripheral circulation) — supplies blood flow to all tissues except the lungs Pulmonary circulation — supplies blood to the lungs Functional Parts of the Circulation Component Function Arteries Transport blood under high pressure to the tissues; have strong vascular walls; blood flows at high velocity Arterioles Last small branches of the arterial system; act as control conduits through which blood is released into the capillaries; can close completely or dilate severalfold to alter blood flow Capillaries Exchange fluid, nutrients, electrolytes, hormones, and other substances between blood and interstitial fluid; have thin walls with numerous minute pores Venules Collect blood from capillaries and gradually coalesce into larger veins Veins Function as conduits for transport of blood from venules back to the heart; serve as a major reservoir of extra blood The veins also serve as a major reservoir of extra blood. Because the pressure in the venous system is low, the venous walls are thin. Even so, they are muscular enough to contract or expand, serving as a controllable reservoir for extra blood.
Volumes of Blood in the Different Parts of the Circulation Figure 14-1 lists the percentages of total blood volume in major segments of the circulation:
Location Percentage of Total Blood Volume Systemic circulation (total) 84% — of which: Veins and venules 64% — of which: Arteries 13% — of which: Arterioles and capillaries 7% Heart 7% Pulmonary vessels 9% Lungs (including pulmonary vessels) 16% (heart &#43; lungs) Most surprising is the low blood volume in the capillaries. However, it is here that the most important function of the circulation occurs. This is the diffusion of substances back and forth between the blood and tissues (discussed in Chapter 16).
Cross-Sectional Areas and Velocities of Blood Flow If all the systemic vessels of each type were put side by side, the approximate total cross-sectional areas for the average human would be:
Vessel Cross-Sectional Area (cm²) Aorta 2.5 Small arteries 20 Arterioles 40 Capillaries 2500 Venules 250 Small veins 80 Venae cavae 8 Note particularly that the cross-sectional areas of the veins are much larger than those of the arteries. They average about four times those of the corresponding arteries. This difference explains the large blood storage capacity of the venous system.
Relationship Between Velocity and Cross-Sectional Area Because the same volume of blood flow (F) must pass through each segment of the circulation each minute, the velocity of blood flow (v) is inversely proportional to the vascular cross-sectional area (A):
v = F / A
Under resting conditions:
Velocity averages about 33 cm/sec in the aorta Velocity in capillaries is only 1/1000 as rapid — about 0.3 mm/sec Because the capillaries have a typical length of only 0.3 to 1 millimeter, the blood remains in the capillaries for only 1 to 3 seconds. All diffusion of nutrient food substances and electrolytes through the capillary walls must be performed in this short time.
Pressures in the Various Portions of the Circulation Because the heart pumps blood continually into the aorta, the mean pressure in the aorta is high — averaging about 100 mm Hg.
Heart pumping is pulsatile, so the arterial pressure normally alternates between:
Systolic pressure: average 120 mm Hg Diastolic pressure: average 80 mm Hg (Shown on the left side of Figure 14-2.)
VASCULAR DISTENSIBILITY A valuable characteristic of the vascular system is that all blood vessels are distensible. The distensible nature of the arteries allows them to accommodate the pulsatile output of the heart and to average out the pressure pulsations. This capability provides smooth continuous flow of blood through the very small blood vessels of the tissues.
Venous Distensibility and Blood Storage The most distensible of all the vessels are the veins. Even slight increases in venous pressure cause the veins to store 0.5 to 1.0 liter of extra blood. Therefore, the veins provide a reservoir for storing large quantities of extra blood.
Units of Vascular Distensibility Vascular distensibility is normally expressed as the fractional increase in volume for each mm Hg rise in pressure:
Vascular distensibility = (Increase in volume / Original volume) / Increase in pressure
For example, if 1 mm Hg causes a vessel that originally contained 10 ml of blood to increase its volume by 1 ml, the distensibility would be 0.1 per mm Hg, or 10% per mm Hg.
Veins Are Much More Distensible Than Arteries The walls of the arteries are thicker and far stronger than those of the veins. Consequently, the veins are, on average, about eight times more distensible than the arteries.
A given increase in pressure causes about eight times as much increase in blood in a vein as in an artery of comparable size.
In the pulmonary circulation, the pulmonary vein distensibilities are similar to those of the systemic circulation. However, the pulmonary arteries normally operate under pressures about one sixth of those in the systemic arterial system. Their distensibilities are correspondingly greater — about six times the distensibility of systemic arteries.
VASCULAR COMPLIANCE (OR VASCULAR CAPACITANCE) In hemodynamic studies, it is often more important to know the total quantity of blood that can be stored in a given portion of the circulation for each mm Hg pressure rise than to know the distensibilities of the individual vessels.
This value is called the compliance or capacitance of the respective vascular bed:
Vascular compliance = Increase in volume / Increase in pressure
Compliance and distensibility are quite different. A highly distensible vessel with a small volume may have far less compliance than a much less distensible vessel with a large volume. This is because compliance equals distensibility times volume.
The compliance of a systemic vein is about 24 times that of its corresponding artery. This is because it is about 8 times as distensible and has a volume about 3 times as great (8 × 3 = 24).
ARTERIAL AND VENOUS CIRCULATIONS A convenient method for expressing the relationship of pressure to volume in a vessel is to use a volume-pressure curve.
Figure 15-1 shows the volume-pressure curves of the normal systemic arterial system and venous system:
Arterial System When filled with about 700 ml of blood: mean arterial pressure is 100 mm Hg When filled with only 400 ml of blood: pressure falls to zero Venous System Normal volume ranges from 2000 to 3500 ml A change of several hundred ml in volume is required to change the venous pressure by only 3 to 5 mm Hg This explains why as much as one-half liter of blood can be transfused into a healthy person in only a few minutes without greatly altering the function of the circulation.
Effect of Sympathetic Stimulation or Inhibition Sympathetic stimulation or inhibition affects the volume-pressure curves of the arterial and venous systems:
Sympathetic stimulation: Increases vascular smooth muscle tone, which increases the pressure at each volume of the arteries or veins Sympathetic inhibition: Decreases the pressure at each volume Control of the vessels by the sympathetics is a valuable means for diminishing the dimensions of one segment of the circulation. This allows transferring blood to other segments.
For example, an increase in vascular tone throughout the systemic circulation can cause large volumes of blood to shift into the heart. This is one of the principal methods that the body uses to rapidly increase heart pumping.
Sympathetic control of vascular capacitance is highly important during hemorrhage. Enhancement of sympathetic tone, especially to the veins, reduces the vessel sizes enough that the circulation continues to operate almost normally. This occurs even when as much as 25% of the total blood volume has been lost.
DELAYED COMPLIANCE (STRESS-RELAXATION) OF VESSELS The term delayed compliance means that a vessel exposed to increased volume at first exhibits a large increase in pressure. However, progressive delayed stretching of smooth muscle in the vessel wall allows the pressure to return toward normal over a period of minutes to hours.
This effect is shown in Figure 15-2. In this figure, pressure is recorded in a small segment of a vein occluded at both ends. An extra volume of blood is suddenly injected until the pressure rises from 5 to 12 mm Hg.
Even though none of the blood is removed after it is injected, the pressure begins to decrease immediately. It approaches about 9 mm Hg after several minutes.
The volume of blood injected causes immediate elastic distention of the vein. Then the smooth muscle fibers of the vein begin to creep to longer lengths. Their tensions correspondingly decrease. This effect is called stress-relaxation (explained in Chapter 8).
Clinical Significance of Delayed Compliance Delayed compliance is a valuable mechanism whereby the circulation can accommodate extra blood when necessary. This is important such as after a large transfusion.
Delayed compliance in the reverse direction is one way in which the circulation automatically adjusts itself over a period of minutes or hours to diminished blood volume after serious hemorrhage.
ARTERIAL PRESSURE PULSATIONS With each beat of the heart, a new surge of blood fills the arteries. Were it not for distensibility of the arterial system, all this new blood would have to flow through the peripheral blood vessels almost instantaneously — only during cardiac systole. No flow would occur during diastole.
However, the compliance of the arterial tree normally reduces the pressure pulsations to almost no pulsations by the time the blood reaches the capillaries. Therefore, tissue blood flow is mainly continuous with very little pulsation.
Normal Pulse Pressure Values The pressure pulsations at the root of the aorta are illustrated in Figure 15-3. In a healthy young adult:
Parameter Value Systolic pressure (top of each pulse) ~120 mm Hg Diastolic pressure (lowest point of each pulse) ~80 mm Hg Pulse pressure (difference) ~40 mm Hg Factors That Affect Pulse Pressure Two major factors affect the pulse pressure:
The stroke volume output of the heart — The greater the stroke volume output, the greater the amount of blood that must be accommodated in the arterial tree with each heartbeat. This causes a greater pressure rise and fall during systole and diastole, thus a greater pulse pressure.
The compliance (total distensibility) of the arterial tree — The less the compliance of the arterial system, the greater the pulse pressure.
A third less important factor is the character of ejection from the heart during systole.

                     data-content="SPERMATOGENESIS During formation of the embryo, the primordial germ cells migrate into the testes and become immature germ cells called spermatogonia.
These spermatogonia lie in two or three layers of the inner surfaces of the seminiferous tubules.
At puberty the spermatogonia begin to undergo mitotic division and continually proliferate and differentiate through definite stages of development to form sperm.
STEPS OF SPERMATOGENESIS Spermatogenesis occurs in the seminiferous tubules during active sexual life as the result of stimulation by anterior pituitary gonadotropic hormones.
Spermatogenesis begins in the male at an average age of 13 years and continues throughout most of the remainder of life. It decreases markedly in old age.
Stages of Germ Cell Development Cell Type Stage Duration Primordial germ cell Enters testis Birth Spermatogonia Proliferate by mitosis 25 days Primary spermatocyte Meiotic division I 12-14 years Secondary spermatocytes Meiotic division II 9 days Spermatids Differentiation 19 days Mature sperm Spermatozoa 21 days Total time from spermatogonia to spermatozoa: approximately 74 days.
SPERMATOGENESIS CELL DIVISION PROCESS Mitotic Proliferation In the first stage of spermatogenesis, the spermatogonia migrate among Sertoli cells toward the central lumen of the seminiferous tubule.
The Sertoli cells are large, with overflowing cytoplasmic envelopes that surround the developing spermatogonia all the way to the central lumen of the tubule.
Meiosis Spermatogonia that cross the barrier into the Sertoli cell layer become progressively modified and enlarged to form large primary spermatocytes.
Each of these primary spermatocytes, in turn, undergoes meiotic division to form two secondary spermatocytes.
After another few days, these secondary spermatocytes also divide to form spermatids that are eventually modified to become spermatozoa (sperm).
During the change from the spermatocyte stage to the spermatid stage, the 46 chromosomes (23 pairs of chromosomes) of the spermatocyte are divided. Thus, 23 chromosomes go to one spermatid and the other 23 go to the second spermatid.
The chromosomal genes are also divided so that only one-half of the genetic characteristics of the eventual fetus are provided by the father. The other half is derived from the oocyte provided by the mother.
Sex Chromosomes In each spermatogonium, one of the 23 pairs of chromosomes carries the genetic information that determines the sex of each eventual offspring.
This pair is composed of one X chromosome, which is the female chromosome, and one Y chromosome, which is the male chromosome.
When an X-chromosome-bearing sperm fertilizes the ovum, a female results (XX). When a Y-chromosome-bearing sperm fertilizes the ovum, a male results (XY).
MALE REPRODUCTIVE ORGANS ANATOMY Testis Structure Structure Function Seminiferous tubules Site of sperm production (spermatogenesis) Leydig cells (interstitial cells) Secrete testosterone Rete testis Collects sperm from seminiferous tubules Efferent ductules Transport sperm to epididymis Epididymis Structure Region Function Head of epididymis Receives sperm from efferent ductules Body of epididymis Sperm maturation occurs here Tail of epididymis Storage of mature sperm Accessory Organs Organ Secretion Seminal vesicles Fructose-rich fluid (60-70% of semen) Prostate gland Alkaline, enzymatic fluid Bulbourethral glands Mucus secretion SEMEN PROPERTIES Semen consists of:
Sperm from the vas deferens (10%) Fluid from the seminal vesicles (60-70%) Fluid from the prostate gland (20-30%) Small amounts from the bulbourethral glands Semen Characteristics Property Value Volume per ejaculation 2-5 mL Sperm count 50-150 million/mL pH 7.2-7.8 Fructose content 200-400 mg/dL MALE SEXUAL RESPONSE Erection Erection is primarily a parasympathetic function. It results from relaxation of the smooth muscle in the arterial walls of the penis. This allows increased blood flow into the corpora cavernosa and corpus spongiosum.
Ejaculation Ejaculation is primarily a sympathetic function. It involves:
Closure of the internal urethral sphincter Contraction of the seminal vesicles and prostate Contraction of the bulbocavernosus muscle TESTOSTERONE AND MALE HORMONES Testosterone Synthesis Testosterone is synthesized by Leydig cells in the testicular interstitium. LH stimulates testosterone production.
Functions of Testosterone Function Description Fetal development Development of male internal genitalia (Wolffian ducts) External genitalia Masculinization of penis and scrotum Puberty Secondary sexual characteristics Spermatogenesis Required for sperm maturation Libido Maintains sexual desire Anabolic effects Increased muscle mass and bone density Male Secondary Sexual Characteristics Characteristic Mechanism Deep voice Laryngeal cartilage growth Facial hair Terminal hair growth on face Body hair Increased body hair distribution Muscle mass Protein synthesis stimulation Bone density Increased bone mineralization FSH AND LH IN MALES Follicle-Stimulating Hormone (FSH) FSH is produced by the anterior pituitary. It stimulates Sertoli cells in the seminiferous tubules.
Effects of FSH:
Promotes spermatogenesis Stimulates inhibin production Stimulates androgen-binding protein (ABP) production Luteinizing Hormone (LH) LH stimulates Leydig cells to produce testosterone.
It is also called interstitial cell-stimulating hormone (ICSH) in males.
Hormonal Feedback in Males Hormone Target Effect Testosterone Hypothalamus/Pituitary Inhibits GnRH, LH secretion Inhibin Pituitary Inhibits FSH secretion FSH Sertoli cells Stimulates inhibin PINEAL GLAND AND MELATONIN Melatonin Secretion The pineal gland secretes melatonin primarily at night. Melatonin secretion is stimulated by darkness and inhibited by light.
Functions of Melatonin Function Description Circadian rhythm regulation Helps set the biological clock Seasonal reproduction Affects reproductive function in some species Sleep promotion Contributes to sleep onset Pineal Gland Anatomy The pineal gland is located in the epithalamus. It receives sympathetic innervation from the superior cervical ganglia.

                     data-content="DIVING — PHYSIOLOGY OF DEEP-SEA DIVING Before the 1940s, almost all diving was done using a diving helmet connected to a hose through which air was pumped to the diver from the surface.
In 1943, the French explorer Jacques Cousteau popularized a self-contained underwater breathing apparatus, known as SCUBA.
OPEN-CIRCUIT DEMAND SCUBA SYSTEM The type of SCUBA used in more than 99% of all sports and commercial diving is the open-circuit demand system.
Components Component Function One or more tanks of compressed air Source of breathing mixture First-stage “reducing” valve Reduces very high pressure from tanks to low pressure Combination inhalation “demand” valve and exhalation valve Allows air to be pulled into lungs with slight negative pressure; exhaled into sea at slightly positive pressure Mask and tube system with small “dead space” Delivers air to diver Operation The operation proceeds as follows:
The first-stage reducing valve reduces the pressure from the tanks so that the air delivered to the mask has a pressure only a few mm Hg greater than the surrounding water pressure. The breathing mixture does not flow continually into the mask. With each inspiration, slight extra negative pressure in the demand valve of the mask pulls the diaphragm of the valve open. This action automatically releases air from the tank into the mask and lungs. Only the amount of air needed for inhalation enters the mask. On expiration, the air cannot go back into the tank but is expired into the water. Limitation of SCUBA The most important problem with SCUBA is the limited amount of time a diver can remain beneath the water surface.
For example, only a few minutes are possible at a 200-foot depth.
The reason for this limitation is that tremendous airflow from the tanks is required to wash CO2 out of the lungs.
The greater the depth, the greater the airflow in terms of quantity of air per minute required because the volumes have been compressed to small sizes.
EFFECTS OF INDIVIDUAL GASES ON THE BODY The individual gases to which a diver is exposed when breathing air are:
Nitrogen Oxygen (O2) Carbon dioxide (CO2) Each of these can cause significant physiological effects at high pressures.
NITROGEN NARCOSIS AT HIGH NITROGEN PRESSURES About four-fifths of the air is nitrogen.
At sea level pressure, the nitrogen has no significant effect on bodily function.
But at high pressures, it can cause varying degrees of narcosis.
Symptoms at Different Depths Depth (feet) Pressure (atm) Symptoms 120 ~4.5 Mild narcosis; joviality and loss of cares 150–200 ~5–7 Drowsiness 200–250 ~7–8.5 Strength wanes considerably; often too clumsy to perform required work &gt;250 &gt;8.5 Almost useless as a result of nitrogen narcosis Nitrogen narcosis has characteristics similar to those of alcohol intoxication.
For this reason, it has frequently been called “raptures of the depths.”
Mechanism The mechanism of this narcotic effect is believed to be the same as that of most other gas anesthetics.
Nitrogen dissolves in the fatty substances in neuronal membranes.
Because of its physical effect on altering ionic conductance through the membranes, it reduces neuronal excitability.
Treatment Ascent to a shallower depth reverses the narcosis within a few minutes.
There are no known long-term effects if the ascent is not too rapid.
OXYGEN TOXICITY AT HIGH PRESSURES Effect of Very High PO2 on Blood Oxygen Transport When the PO2 in the blood rises above 100 mm Hg, the amount of O2 dissolved in the water of the blood increases markedly.
Figure 45-2 depicts the O2-hemoglobin dissociation curve with the alveolar PO2 extended to more than 3000 mm Hg.
The lowest curve in the figure shows the volume of O2 dissolved in the fluid of the blood at each PO2 level.
Key observations:
In the normal range of alveolar PO2 (&lt;120 mm Hg), almost none of the total O2 in the blood is accounted for by dissolved O2 As the O2 pressure rises into the thousands of mm Hg, a large portion of the total O2 is dissolved in the water of the blood, in addition to that bound with hemoglobin Effect of High Alveolar PO2 on Tissue PO2 Let us assume that the PO2 in the lungs is about 3000 mm Hg (4 atm pressure).
This pressure represents a total O2 content in each 100 ml of blood of about 29 volumes percent.
This means:
20 volumes percent bound with hemoglobin 9 volumes percent dissolved in the blood water As this blood passes through the tissue capillaries and the tissues use their normal amount of O2 (~5 ml from each 100 ml of blood), the O2 content on leaving the tissue capillaries is still 24 volumes percent.
At this point, the PO2 is approximately 1200 mm Hg.
O2 is delivered to the tissues at this extremely high pressure instead of at the normal value of 40 mm Hg.
Thus, once the alveolar PO2 rises above a critical level, the hemoglobin-O2 buffer mechanism is no longer capable of keeping the tissue PO2 in the normal safe range (between 20 and 60 mm Hg).
Acute Oxygen Poisoning The extremely high tissue PO2 that occurs when O2 is breathed at a very high alveolar O2 pressure can be detrimental to many of the body’s tissues.
Breathing O2 at 4 atm pressure (PO2 = 3040 mm Hg):
Causes brain seizures followed by coma in most people within 30 to 60 minutes The seizures often occur without warning They are likely to be lethal to divers submerged beneath the sea Other symptoms of acute O2 poisoning:
Nausea Muscle twitchings Dizziness Disturbances of vision Irritability Disorientation Important: Exercise greatly increases the diver’s susceptibility to O2 toxicity.
This causes symptoms to appear much earlier and with far greater severity than in the resting person.
Excessive Intracellular Oxidation — Oxidizing Free Radicals Molecular O2 has little capability of oxidizing other chemical compounds.
Instead, it must first be converted into an active form of oxygen called oxygen free radicals.
Important forms of active oxygen:
Superoxide free radical (O2−) Hydrogen peroxide radical Even when the tissue PO2 is normal at the level of 40 mm Hg, small amounts of free radicals are continually being formed from the dissolved O2.
Fortunately, tissues contain several enzymes that rapidly remove these free radicals:
Peroxidases Catalases Superoxide dismutases As long as the hemoglobin-O2 buffering mechanism maintains a normal tissue PO2, the oxidizing free radicals are removed rapidly enough that they have little or no effect in the tissues.
Critical Threshold Above a critical alveolar PO2 (i.e., &gt; approximately 2 atm PO2):
The hemoglobin-O2 buffering mechanism fails The tissue PO2 can rise to hundreds or thousands of mm Hg The amounts of oxidizing free radicals overwhelm the enzyme systems designed to remove them The free radicals can have serious destructive effects on tissues SPECIAL PHYSIOLOGICAL PROBLEMS IN SUBMARINES Escape From Submarines Essentially the same problems encountered in deep sea diving are often found in relation to submarines.
This is especially true when it is necessary to escape from a submerged submarine.
Escape depths:
Possible from as deep as 300 feet without use of any apparatus With rebreathing devices, especially using helium, can theoretically allow escape from as deep as 600 feet or perhaps more Major problem — Prevention of air embolism:
As the person ascends, the gases in the lungs expand This sometimes ruptures a pulmonary blood vessel Gases are forced to enter the vessel and cause air embolism of the circulation Therefore, as the person ascends, he or she must make a special effort to exhale continually Health Problems in the Submarine Internal Environment Except for escape, submarine medicine generally centers on several engineering problems to keep hazards out of the internal environment.
First — Radiation hazards:
In atomic submarines, there is the problem of radiation hazards With appropriate shielding, the amount of radiation received by the crew submerged beneath the sea has been less than the normal amount received above the surface from cosmic rays Second — Poisonous gases:
Poisonous gases on occasion escape into the atmosphere of the submarine and must be controlled rapidly During several weeks’ submergence, cigarette smoking by the crew can liberate enough carbon monoxide to cause carbon monoxide poisoning if not removed rapidly On occasion, even Freon gas has been found to diffuse out of refrigeration systems in sufficient quantity to cause toxicity HYPERBARIC OXYGEN THERAPY The intense oxidizing properties of high-pressure O2 (hyperbaric oxygen) can have valuable therapeutic effects in several important clinical conditions.
Large pressure tanks are now available in many medical centers into which patients can be placed and treated with hyperbaric O2.
Typical administration:
O2 is usually administered at PO2 values of 2 to 3 atm pressure through a mask or intratracheal tube The gas around the body is normal air compressed to the same high-pressure level The same oxidizing free radicals responsible for O2 toxicity are also believed to be responsible for at least some of the therapeutic benefits.
Treatment of Gas Gangrene One successful use of hyperbaric O2 has been for treatment of gas gangrene.
The bacteria that cause this condition (clostridial organisms) grow best under anaerobic conditions.
They stop growing at O2 pressures greater than about 70 mm Hg.
Therefore, hyperbaric oxygenation of the tissues can frequently stop the infectious process entirely.
This converts a condition that formerly was almost 100% fatal into one that is cured in most cases by early treatment with hyperbaric therapy.
Other Conditions Treated with Hyperbaric O2 Condition Mechanism/Benefit Decompression sickness High PO2 helps eliminate nitrogen bubbles Arterial gas embolism High PO2 helps dissolve gas bubbles Carbon monoxide poisoning High PO2 displaces CO from hemoglobin Osteomyelitis High PO2 inhibits anaerobic bacteria Myocardial infarction High PO2 may reduce ischemic damage "></div><div data-title="Physiology of Gastrointestinal Disorders"

                     data-content="Peptic Ulcer Disease Helicobacter pylori Infection Helicobacter pylori is a spiral-shaped bacterium that colonizes the gastric mucosa and is a major cause of peptic ulcer disease.
H. pylori produces urease, which converts urea to ammonia.
This ammonia neutralizes gastric acid and creates a favorable environment for bacterial survival.
H. pylori also produces cytotoxins that directly damage epithelial cells.
The bacteria activate host inflammatory responses, leading to further mucosal injury.
NSAID-Induced Gastric Damage NSAIDs cause gastric damage primarily by inhibiting the enzyme cyclooxygenase-1 (COX-1).
COX-1 inhibition reduces prostaglandin synthesis.
Prostaglandins normally:
Stimulate mucus and bicarbonate secretion Maintain mucosal blood flow Promote epithelial cell renewal Without these protective mechanisms, the gastric mucosa becomes vulnerable to acid damage.
Storage Colon and Absorbing Colon The large intestine can be divided into two functional regions.
The absorbing colon (proximal half) is responsible for fluid and electrolyte absorption.
The storage colon (distal half) functions primarily for feces storage until excretion.
Acute Pancreatitis Pathophysiology Acute pancreatitis results from inappropriate activation of pancreatic enzymes within the pancreas.
This leads to autodigestion of pancreatic tissue by its own enzymes.
The two most common causes are:
Gallstones (obstructing pancreatic duct) Alcohol (direct toxic effect on pancreatic acinar cells) Clinical Manifestations When pancreatic enzymes are activated prematurely:
Trypsin activates other proteolytic enzymes Elastase damages blood vessel walls Phospholipase A2 damages cell membranes This cascade leads to inflammation, hemorrhage, and potentially systemic complications.
Malabsorption Syndromes Celiac Disease Celiac disease is an immune-mediated enteropathy triggered by gluten (gliadin) in genetically susceptible individuals.
These individuals express HLA-DQ2 or HLA-DQ8 on antigen-presenting cells.
The immune response leads to villous atrophy in the small intestine.
This atrophy reduces the absorptive surface area, leading to malabsorption of nutrients.
Lactose Intolerance Lactose intolerance results from deficiency of the brush border enzyme lactase.
Without lactase, lactose cannot be hydrolyzed into glucose and galactose.
Undigested lactose causes osmotic diarrhea and bacterial fermentation in the colon.
This condition is prevalent in adults worldwide, with varying prevalence by ethnicity.
Secretory Diarrhea Cholera and Bacterial Enterotoxins Cholera toxin and similar bacterial enterotoxins cause severe secretory diarrhea.
These toxins activate cystic fibrosis transmembrane conductance regulator (CFTR) chloride channels.
CFTR activation leads to massive chloride secretion into the intestinal lumen.
Water follows osmotically, resulting in profuse watery diarrhea.
Mechanism The pathophysiology involves:
Bacterial toxin binding to intestinal epithelial cells Activation of intracellular signaling pathways Increased chloride channel conductance Sodium and water secretion into the lumen Loss of up to 10&#43; liters of fluid per day Gastroesophageal Reflux Disease (GERD) Pathophysiology GERD results from transient lower esophageal sphincter (LES) relaxations that allow gastric contents to reflux into the esophagus.
Contributing factors include:
Hiatal hernia (displacement of gastric cardia above the diaphragm) Impaired mucosal defense mechanisms Increased gastric acid secretion Delayed gastric emptying Consequences Repeated acid exposure leads to:
Esophagitis (esophageal inflammation) Barrett’s esophagus (intestinal metaplasia) Increased risk of esophageal adenocarcinoma Irritable Bowel Syndrome (IBS) Functional Disorder Characteristics IBS is a functional gastrointestinal disorder characterized by:
Visceral hypersensitivity (painful response to normal distension) Altered gut motility (abnormal contraction patterns) Brain-gut axis dysregulation (impaired communication between CNS and ENS) Diagnostic Criteria IBS is diagnosed based on:
Recurrent abdominal pain (at least 1 day/week for 3 months) Association with defecation Change in stool frequency or form Subtypes IBS Subtype Characteristics IBS-C Constipation-predominant IBS-D Diarrhea-predominant IBS-M Mixed stool patterns IBS-U Unclassified References Bharucha AE, Wouters MM, Tack J: Existing and emerging therapies for managing constipation and diarrhea. Curr Opin Pharmacol 37:158, 2017.

                     data-permalink="/guyton/guyton/ch76_pituitary-hormones-and-their-control-by-the-hypothalamus/"
                     data-content="HORMONE PRODUCTION Increased Extracellular Fluid Osmolarity Stimulates ADH Secretion When a concentrated electrolyte solution is injected into the artery that supplies the hypothalamus, the ADH neurons in the supraoptic and paraventricular nuclei immediately transmit impulses into the posterior pituitary to release large quantities of ADH into the circulating blood.
ADH secretion sometimes increases to as high as 20 times normal in response to this stimulus.
Conversely, injection of a dilute solution into this artery causes cessation of these impulses and therefore almost total cessation of ADH secretion.
The concentration of ADH in the body fluids can change from small amounts to large amounts, or vice versa, in only a few minutes.
Osmoreceptor Mechanism In or near the hypothalamus are modified neuron receptors called osmoreceptors.
When the extracellular fluid becomes too concentrated, fluid is pulled by osmosis out of the osmoreceptor cell, decreasing its size and initiating appropriate nerve signals in the hypothalamus to cause additional ADH secretion.
Conversely, when the extracellular fluid becomes too dilute, water moves by osmosis in the opposite direction, into the cell, which decreases the signal for ADH secretion.
Although some researchers place these osmoreceptors in the hypothalamus (in the supraoptic nuclei), others believe that they are located in the organum vasculosum, a highly vascular structure in the anteroventral wall of the third ventricle (AV3V region).
As discussed in Chapter 29, lesions of the AV3V region greatly impair ADH secretion, whereas electrical stimulation or stimulation by angiotensin II increases ADH secretion.
Regardless of the mechanism, concentrated body fluids stimulate these osmoreceptors and ADH secretion, whereas dilute body fluids inhibit them.
This provides a powerful feedback control system for controlling the total osmotic pressure of the body fluids.
Further details on the control of ADH secretion and the role of ADH in controlling renal function and body fluid osmolality are presented in Chapter 29.
Low Blood Volume and Low Blood Pressure Stimulate ADH Secretion Whereas minute concentrations of ADH cause increased water conservation by the kidneys, higher concentrations of ADH have a potent effect of constricting the arterioles throughout the body and therefore increasing the arterial pressure.
For this reason, ADH is also called vasopressin.
One of the stimuli for causing intense ADH secretion is decreased blood volume. This occurs strongly when the blood volume decreases 15% to 25% or more; the secretory rate then sometimes rises to as high as 50 times normal.
Baroreceptor Control of ADH The atria have stretch receptors that are excited by overfilling. When excited, they send signals to the brain to inhibit ADH secretion.
Conversely, when the receptors are unexcited as a result of underfilling, the opposite occurs, with greatly increased ADH secretion.
Decreased stretch of the baroreceptors of the carotid, aortic, and pulmonary regions also stimulates ADH secretion.
For further details about this blood volume-pressure feedback mechanism, refer to Chapter 29.
Hypothalamic Control of Posterior Pituitary Structure Function Supraoptic nucleus Produces ADH Paraventricular nucleus Produces oxytocin and ADH Hypothalamo-hypophysial tract Neural pathway to posterior pituitary Mammillary body Adjacent structure Optic chiasm Adjacent structure OXYTOCIN Oxytocin Causes Contraction of the Pregnant Uterus The hormone oxytocin, in accordance with its name, powerfully stimulates contraction of the pregnant uterus, especially toward the end of gestation.
Therefore, many obstetricians believe that this hormone is at least partially responsible for causing birth of the baby.
This belief is supported by the following facts:
In a hypophysectomized animal, the duration of labor is prolonged, indicating a possible effect of oxytocin during delivery. The amount of oxytocin in the plasma increases during labor, especially during the last stage. Stimulation of the cervix in a pregnant animal elicits nervous signals that pass to the hypothalamus and cause increased secretion of oxytocin. These effects and this possible mechanism for aiding in the birth process are discussed in more detail in Chapter 83.
Oxytocin Aids in Milk Ejection by the Breasts Oxytocin also plays an especially important role in lactation—a role that is far better understood than its role in delivery.
In lactation, oxytocin causes milk to be expressed from the alveoli into the ducts of the breast so that the baby can obtain it by suckling.
This mechanism works as follows:
The suckling stimulus on the nipple of the breast causes signals to be transmitted through sensory nerves to the oxytocin neurons in the paraventricular and supraoptic nuclei in the hypothalamus. This causes release of oxytocin by the posterior pituitary gland. The oxytocin is then carried by the blood to the breasts. It causes contraction of myoepithelial cells that lie outside of and form a latticework surrounding the alveoli of the mammary glands. In less than a minute after the beginning of suckling, milk begins to flow. This mechanism is called milk letdown or milk ejection. It is discussed further in Chapter 83 in relation to the physiology of lactation.
THYROID METABOLIC HORMONES About 93% of the metabolically active hormones secreted by the thyroid gland is thyroxine and 7% is triiodothyronine.
However, almost all the thyroxine is eventually converted to triiodothyronine in the tissues, so both are functionally important.
The functions of these two hormones are qualitatively the same, but they differ in rapidity and intensity of action.
Triiodothyronine is about four times as potent as thyroxine, but it is present in the blood in much smaller quantities and persists for a much shorter time compared with thyroxine.
Comparison of T4 and T3 Characteristic Thyroxine (T4) Triiodothyronine (T3) Potency Lower (1x) Higher (4x) Blood concentration Higher Lower Duration in blood Longer Shorter Percentage of secretion 93% 7% PHYSIOLOGIC ANATOMY OF THE THYROID GLAND As shown in Figure 77-1, the thyroid gland is composed of large numbers of closed follicles (100–300 micrometers in diameter) that are filled with a secretory substance called colloid and lined with cuboidal epithelial cells that secrete into the interior of the follicles.
The major constituent of colloid is the large glycoprotein thyroglobulin, which contains the thyroid hormones.
Once the secretion has entered the follicles, it must be absorbed back through the follicular epithelium into the blood before it can function in the body.
The thyroid gland has a blood flow about five times the weight of the gland each minute, which is a blood supply as great as that of any other area of the body, with the possible exception of the adrenal cortex.
The thyroid gland also contains C cells that secrete calcitonin, a hormone that contributes to regulation of plasma calcium ion concentration, as discussed in Chapter 80.
IODINE IS REQUIRED FOR THYROXINE FORMATION To form normal quantities of thyroxine, about 50 milligrams of ingested iodine in the form of iodides are required each year, or about 1 mg/week.
To prevent iodine deficiency, common table salt is iodized with about 1 part sodium iodide to every 100,000 parts sodium chloride.
Fate of Ingested Iodides Iodides ingested orally are absorbed from the gastrointestinal tract into the blood in about the same manner as chlorides.
Normally, most of the iodides are rapidly excreted by the kidneys, but only after about one fifth are selectively removed from the circulating blood by the cells of the thyroid gland and used for synthesis of the thyroid hormones.
IODIDE PUMP—THE SODIUM-IODIDE SYMPORTER (IODIDE TRAPPING) The first stage in formation of thyroid hormones is transport of iodides from the blood into the thyroid glandular cells and follicles.
The basal membrane of the thyroid cell has the specific ability to pump the iodide actively to the interior of the cell. This pumping is achieved by the action of a sodium-iodide symporter, which co-transports one iodide ion along with two sodium ions across the basolateral (plasma) membrane into the cell.
The energy for transporting iodide against a concentration gradient comes from the sodium-potassium adenosine triphosphatase (Na&#43;-K&#43; ATPase) pump, which pumps sodium out of the cell, thereby establishing a low intracellular sodium concentration and a gradient for facilitated diffusion of sodium into the cell.
This process of concentrating the iodide in the cell is called iodide trapping.
In a normal gland, the iodide pump concentrates the iodide to about 30 times its concentration in the blood.
When the thyroid gland becomes maximally active, this concentration ratio can rise to as high as 250 times.
The rate of iodide trapping by the thyroid is influenced by several factors, the most important being the concentration of TSH. TSH stimulates and hypophysectomy greatly diminishes the activity of the iodide pump in thyroid cells.
Iodide is transported out of the thyroid cells across the apical membrane into the follicle by a chloride-iodide ion counter-transporter molecule called pendrin.
The thyroid epithelial cells also secrete into the follicle thyroglobulin that contains tyrosine amino acids to which the iodine will bind.
Factors Affecting Iodide Trapping Factor Effect on Iodide Trapping TSH Stimulates Hypophysectomy Greatly diminishes Maximum activity Concentration ratio up to 250x Normal activity Concentration ratio about 30x THYROXINE AND TRIIODOTHYRONINE FORMATION AND SECRETION Formation and Secretion of Thyroglobulin by the Thyroid Cells The thyroid cells are typical protein-secreting glandular cells.
The endoplasmic reticulum and Golgi apparatus synthesize and secrete into the follicles a large glycoprotein molecule called thyroglobulin, with a molecular weight of about 335,000.
Each molecule of thyroglobulin contains about 70 tyrosine amino acids, and they are the major substrates that combine with iodine to form the thyroid hormones.
Thus, the thyroid hormones form within the thyroglobulin molecule.
That is, the thyroxine and triiodothyronine hormones formed from the tyrosine amino acids remain part of the thyroglobulin molecule during synthesis of the thyroid hormones and even afterward as stored hormones in the follicular colloid.
Thyroid Hormone Synthesis Steps Step Location Process 1. Iodide transport Basolateral membrane NIS pumps iodide into cell using Na&#43; gradient 2. Iodide transfer Apical membrane Pendrin transports iodide into colloid 3. Iodination Colloid Peroxidase adds iodine to tyrosine on thyroglobulin 4. Coupling Colloid MIT &#43; DIT couple to form T3 and T4 5. Endocytosis Apical membrane Colloid droplets taken into cell 6. Proteolysis Lysosomes Tg proteases release T3 and T4 7. Release Basolateral membrane T3 and T4 diffuse into blood Abbreviations: DIT, Diiodotyrosine; ER, endoplasmic reticulum; I-, iodide ion; I2, iodine; MIT, Monoiodotyrosine; NIS, sodium-iodide symporter; RT3, reverse triiodothyronine; T3, triiodothyronine; T4, thyroxine; TG, thyroglobulin.
