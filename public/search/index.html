                     data-content="—## SECRETION—LOCAL STIMULI By far the most important means for regulating small intestine secretion are local enteric nervous reflexes, especially reflexes initiated by tactile or irritative stimuli from the chyme in the intestines. SECRETION OF MUCUS BY THE LARGE ## INTESTINE Mucus Secretion. The mucosa of the large intestine, like that of the small intestine, has many crypts of Lieberkühn; however, unlike the small intestine, it contains no villi. The epithelial cells secrete almost no digestive enzymes. Instead, they contain mucous cells that secrete only mucus. This mucus contains moderate amounts of HCO3− secreted by a few non–mucus-secreting epithelial cells. The rate of mucus secretion is regulated principally by direct, tactile stimulation of the epithelial cells lining the large intestine and by local nervous reflexes to the mucous cells in the crypts of Lieberkühn. Stimulation of the pelvic nerves from the spinal cord, which carry parasympathetic innervation to the distal one-half to two-thirds of the large intestine, also can cause marked increases in mucus secretion along with increased peristaltic motility of the colon, as discussed in Chapter 64. During extreme parasympathetic stimulation, often caused by emotional disturbances, so much mucus can occasionally be secreted into the large intestine that the person has a bowel movement of ropy mucus as often as every minutes. This mucus often contains little or no fecal material. Mucus in the large intestine protects the intestinal wall against excoriation, but in addition, it provides an adherent medium for holding fecal matter together. Furthermore, it protects the intestinal wall from the great amount of bacterial activity that takes place inside the feces, and, finally, the mucus plus the alkalinity of the secretion (a pH of 8.0 caused by large amounts of sodium bicarbonate) provides a barrier to keep acids formed in the feces from attacking the intestinal wall. Diarrhea Caused by Excess Secretion of Water and Electrolytes in Response to Irritation. Whenever a segment of the large intestine becomes intensely irritated, as occurs when bacterial infection becomes rampant during enteritis, the mucosa secretes extra large quantities of water and electrolytes in addition to the normal viscid alkaline mucus. This secretion acts to dilute the irritating factors and to cause rapid movement of the feces toward the anus. The result is diarrhea, with loss of large quantities of water and electrolytes. However, the diarrhea also washes away irritant factors, which promotes earlier recovery from the disease than might otherwise occur. Paneth cell Epithelial cell Mucous goblet cell &gt; Figure 65-13. A crypt of Lieberkühn, found in all parts of the small intestine between the villi, which secretes almost pure extracellular fluid. UNIT XII Gastrointestinal Physiology Bibliography Adriaenssens AE, Reimann F, Gribble FM: Distribution and stimulus secretion coupling of enteroendocrine cells along the intestinal tract. Compr Physiol 8:1603, 2018. Bhattacharyya A, Chattopadhyay R, Mitra S, Crowe SE: Oxidative stress: an essential factor in the pathogenesis of gastrointestinal mucosal diseases. Physiol Rev 94:329, 2014. Boyer JL: Bile formation and secretion. Compr Physiol 3:1035, 2013. Camilleri M: Leaky gut: mechanisms, measurement and clinical implications in humans. Gut 68:1516, 2019. Camilleri M, Sellin JH, Barrett KE: Pathophysiology, evaluation, and management of chronic watery diarrhea. Gastroenterology 152:515, 2017. Di Ciaula A, Wang DQ, Portincasa P: An update on the pathogenesis of cholesterol gallstone disease. Curr Opin Gastroenterol 34:71, 2018. Gribble FM, Reimann F: Function and mechanisms of enteroendocrine cells and gut hormones in metabolism. Nat Rev Endocrinol 15:226, 2019. Hegyi P, Maléth J, Walters JR, Hofmann AF, Keely SJ: Guts and gall: bile acids in regulation of intestinal epithelial function in health and disease. Physiol Rev 98:1983, 2018. Housset C, Chrétien Y, Debray D, Chignard N: Functions of the gallbladder. Compr Physiol 6:1549, 2016. Lanas A, Chan FKL: Peptic ulcer disease. Lancet 390:613, 2017. Lee MG, Ohana E, Park HW, et al: Molecular mechanism of pancreatic and salivary gland fluid and HCO3− secretion. Physiol Rev 92:39, 2012. Lefebvre P, Cariou B, Lien F, et al: Role of bile acids and bile acid receptors in metabolic regulation. Physiol Rev 89:147, 2009. Liddle RA: Interactions of gut endocrine cells with epithelium and neurons. Compr Physiol 8:1019, 2018. Trauner M, Boyer JL: Bile salt transporters: molecular characterization, function, and regulation. Physiol Rev 83:633, 2003. Wallace JL: Prostaglandins, NSAIDs, and gastric mucosal protection: why doesn’t the stomach digest itself? Physiol Rev 88:1547, 2008. Yao X, Smolka AJ: Gastric parietal cell physiology and Helicobacter pyloriinduced disease. Gastroenterology 156:2158, 2019. The major foods on which the body lives (with the exception of small quantities of substances such as vitamins and minerals) are carbohydrates, fats, and proteins. They generally cannot be absorbed in their natural forms through the gastrointestinal mucosa, and for this reason, they are useless as nutrients without preliminary digestion. This chapter discusses the processes by which carbohydrates, fats, and proteins are digested into small enough compounds for absorption and the mechanisms by which the digestive end products, as well as water, electrolytes, and other substances, are absorbed. DIGESTION OF VARIOUS FOODS BY ## HYDROLYSIS Hydrolysis of Carbohydrates. Almost all the carbohydrates of the diet are either large polysaccharides or disaccharides, which are combinations of monosaccharides bound to one another by condensation. This phenomenon means that a hydrogen ion (H&#43;) has been removed from one of the monosaccharides, and a hydroxyl ion (OH−) has been removed from the next one. The two monosaccharides then combine with each other at these sites of removal, and the H&#43; and OH− then combine to form water (H2O). When carbohydrates are digested, this process is reversed, and the carbohydrates are converted into monosaccharides. Specific enzymes in the digestive juices of the gastrointestinal tract return the H&#43; and OH− from H2O to the polysaccharides and thereby separate the monosaccharides from each other. This process, called hydrolysis, is the following (in which R′′- R′ is a disaccharide): R‘’ − R‘ &#43; H 2 O R‘’OH &#43; R‘H     →  Digestive enzyme Hydrolysis of Fats. Almost the entire fat portion of the diet consists of triglycerides (neutral fats), which are combinations of three fatty acid molecules condensed with a single glycerol molecule. During condensation, three molecules of water are removed. Hydrolysis (digestion) of the triglycerides consists of the reverse process: the fat-digesting enzymes return three molecules of water to the triglyceride molecule and thereby split the fatty acid molecules away from the glycerol. Hydrolysis of Proteins. Proteins are formed from multiple amino acids that are bound together by peptide linkages. At each linkage, a OH− has been removed from one amino acid and a H&#43; has been removed from the succeeding one; thus, the successive amino acids in the protein chain are also bound together by condensation, and digestion occurs by the reverse effect: hydrolysis. That is, the proteolytic enzymes return H&#43; and OH− from water molecules to the protein molecules to split them into their constituent amino acids. Therefore, the chemistry of digestion is simple because, in the case of all three major types of food, the same basic process of hydrolysis is involved. The only difference lies in the types of enzymes required to promote the hydrolysis reactions for each type of food. All the digestive enzymes are proteins. Their secretion by the different gastrointestinal glands was discussed in Chapter 65. ## DIGESTION OF CARBOHYDRATES Carbohydrate Foods of the Diet. Only three major sources of carbohydrates exist in the normal human diet. They are sucrose, which is the disaccharide known popularly as cane sugar; lactose, which is a disaccharide found in milk; and starches, which are large polysaccharides present in almost all nonanimal foods, particularly in potatoes and different types of grains. Other carbohydrates ingested to a slight extent are amylose, glycogen, alcohol, lactic acid, pyruvic acid, pectins, dextrins, and minor quantities of carbohydrate derivatives in meats. The diet also contains a large amount of cellulose, which is a carbohydrate. However, enzymes capable of hydrolyzing cellulose are not secreted in the human digestive tract. Consequently, cellulose cannot be considered a food for humans. Digestion of Carbohydrates Begins in the Mouth and Stomach. When food is chewed, it is mixed with Digestion and Absorption in the Gastrointestinal Tract UNIT XII Gastrointestinal Physiology saliva, which contains the digestive enzyme ptyalin (an α-amylase) secreted mainly by the parotid glands. This enzyme hydrolyzes starch into the disaccharide maltose and other small polymers of glucose that contain three to nine glucose molecules, as shown in Figure 66-1. However, the food remains in the mouth only a short time, so probably not more than 5% of all the starches become hydrolyzed by the time the food is swallowed. Starch digestion sometimes continues in the body and fundus of the stomach for as long as 1 hour before the food becomes mixed with the stomach secretions. Activity of the salivary amylase is then blocked by acid of the gastric secretions because the amylase is essentially inactive as an enzyme once the pH of the medium falls below about 4.0. Nevertheless, on average, before food and its accompanying saliva become completely mixed with the gastric secretions, as much as 30% to 40% of the starches will have been hydrolyzed, mainly to form maltose. DIGESTION OF CARBOHYDRATES IN THE ## SMALL INTESTINE Digestion by Pancreatic Amylase. Pancreatic secretion, like saliva, contains a large quantity of αamylase that is almost identical in its function to the αamylase of saliva but is several times as powerful. Therefore, within 15 to 30 minutes after the chyme empties from the stomach into the duodenum and mixes with pancreatic juice, virtually all the carbohydrates will have become digested. In general, the carbohydrates are almost totally converted into maltose and/or other small glucose polymers before passing beyond the duodenum or upper jejunum. Hydrolysis of Disaccharides and Small Glucose Polymers Into Monosaccharides by Intestinal Epithelial Enzymes. The enterocytes lining the villi of the small intestine contain four enzymes (lactase, sucrase, maltase, and α-dextrinase), which are capable of splitting the disaccharides lactose, sucrose, and maltose, plus other small glucose polymers, into their constituent monosaccharides. These enzymes are located in the enterocytes covering the intestinal microvilli brush border, so the disaccharides are digested as they come in contact with these enterocytes. Lactose splits into a molecule of galactose and a molecule of glucose. Sucrose splits into a molecule of fructose and a molecule of glucose. Maltose and other small glucose polymers all split into multiple molecules of glucose. Thus, the final products of carbohydrate digestion are all monosaccharides. They are all water soluble and are absorbed immediately into the portal blood. In the ordinary diet, which contains far more starches than all other carbohydrates combined, glucose represents more than 80% of the final products of carbohydrate digestion, and galactose and fructose each seldom represent more than 10%. The major steps in carbohydrate digestion are summarized in Figure 66-1. ## DIGESTION OF PROTEINS Proteins of the Diet. Dietary proteins are chemically long chains of amino acids bound together by peptide linkages. A typical linkage is the following: C N O CH COOH OH &#43; H NH2 CH R R H C N O CH COOH &#43; H 2O NH 2 CH R R H The characteristics of each protein are determined by the types of amino acids in the protein molecule and by the sequential arrangements of these amino acids. The physical and chemical characteristics of different proteins important in human tissues are discussed in Chapter 70. Digestion of Proteins in the Stomach. Pepsin, an important peptic enzyme of the stomach, is most active at a pH of 2.0 to 3.0 and is inactive at a pH above about 5.0. Consequently, for this enzyme to cause digestion of protein, the stomach juices must be acidic. As explained in Chapter 65, the gastric glands secrete a large quantity of hydrochloric acid. This hydrochloric acid is secreted by the parietal (oxyntic) cells in the glands at a pH of about 0.8, but by the time it is mixed with the stomach contents and with secretions from the non-oxyntic glandular cells of the stomach, the pH then averages around &gt; Figure 66-1. Digestion of carbohydrates. Ptyalin (saliva): 20%-40% Starches Glucose Maltose and 3 to 9 glucose polymers Lactose Sucrose Fructose	Galactose Sucrase (intestine) Lactase (intestine) Pancreatic amylase: 50%-80% Maltase and -dextrinase (intestine)

                     data-book=""

                     data-permalink="/guyton/guyton/ch47_sensory-receptors-neuronal-circuits-for-processing-information/"
                     data-content="THE STIMULI THEY DETECT Table 47-1 lists and classifies five basic types of sensory receptors:
Type Detection Mechanoreceptors Mechanical compression or stretching of the receptor or adjacent tissues Thermoreceptors Changes in temperature (some detect cold, others detect warmth) Nociceptors (pain receptors) Physical or chemical damage occurring in the tissues Electromagnetic receptors Light on the retina of the eye Chemoreceptors Taste, smell, arterial oxygen level, osmolality, carbon dioxide concentration, and other body chemistry factors DIFFERENTIAL SENSITIVITY OF RECEPTORS Each type of receptor is highly sensitive to one type of stimulus for which it is designed.
Yet it is almost nonresponsive to other types of sensory stimuli.
Examples:
Rods and cones of the eyes are highly responsive to light but almost completely nonresponsive to heat, cold, pressure on the eyeballs, or chemical changes in the blood Osmoreceptors of the supraoptic nuclei detect minute changes in osmolality but have never been known to respond to sound Pain receptors in the skin are almost never stimulated by usual touch or pressure stimuli but become highly active when tactile stimuli damage tissues MODALITY OF SENSATION — THE “LABELED LINE” PRINCIPLE Each of the principal types of sensation that we can experience (pain, touch, sight, sound, and so forth) is called a modality of sensation.
Nerve fibers transmit only impulses. How do different fibers transmit different modalities?
Answer: Each nerve tract terminates at a specific point in the central nervous system.
The type of sensation felt when a nerve fiber is stimulated is determined by the point in the nervous system to which the fiber leads.
Examples:
If a pain fiber is stimulated, the person perceives pain regardless of the type of stimulus (electricity, overheating, crushing, tissue damage) If a touch fiber is stimulated, the person perceives touch because touch fibers lead to specific touch areas in the brain Fibers from the retina terminate in vision areas; fibers from the ear terminate in auditory areas; temperature fibers terminate in temperature areas This specificity of nerve fibers for transmitting only one modality of sensation is called the labeled line principle.
TRANSDUCTION OF SENSORY STIMULI INTO NERVE IMPULSES RECEPTOR POTENTIALS — LOCAL ELECTRICAL CURRENTS AT NERVE ENDINGS All sensory receptors have one feature in common.
Whatever the type of stimulus that excites the receptor, its immediate effect is to change the membrane electrical potential of the receptor.
This change in potential is called a receptor potential.
Mechanisms of Receptor Potentials Different receptors can be excited in one of several ways to cause receptor potentials:
Mechanism Description Mechanical deformation Stretches the receptor membrane and opens ion channels Chemical application Chemicals applied to the membrane open ion channels Temperature change Alters the permeability of the membrane Electromagnetic radiation Light on a retinal visual receptor changes membrane characteristics and allows ions to flow through channels In all cases, the basic cause of the change in membrane potential is a change in membrane permeability of the receptor.
This allows ions to diffuse more or less readily through the membrane and thereby change the transmembrane potential.
Maximum Receptor Potential Amplitude The maximum amplitude of most sensory receptor potentials is about 100 mV.
This level occurs only at an extremely high intensity of sensory stimulus.
This is about the same maximum voltage recorded in action potentials.
It is also the change in voltage when the membrane becomes maximally permeable to sodium ions.
Relation of the Receptor Potential to Action Potentials When the receptor potential rises above the threshold for eliciting action potentials in the nerve fiber attached to the receptor, action potentials occur.
NEURONAL CIRCUITS Almost every part of the brain connects either directly or indirectly with every other part.
This creates a serious challenge: if the first part excites the second, the second the third, the third the fourth, and so on until the signal re-excites the first part, then an excitatory signal entering any part of the brain would set off a continuous cycle of re-excitation of all parts.
If this cycle should occur, the brain would be inundated by a mass of uncontrolled reverberating signals that transmit no information but consume the circuits of the brain.
Such an effect occurs in widespread areas of the brain during epileptic seizures.
How Does the CNS Prevent This? The answer lies mainly in two basic mechanisms that function throughout the central nervous system:
Inhibitory circuits Fatigue of synapses INHIBITORY CIRCUITS AS A MECHANISM FOR STABILIZING NERVOUS SYSTEM FUNCTION Two types of inhibitory circuits in widespread areas of the brain help prevent excessive spread of signals:
Type 1: Inhibitory feedback circuits
Return from the termini of pathways back to the initial excitatory neurons of the same pathways Occur in virtually all sensory nervous pathways Inhibit either the input neurons or the intermediate neurons in the sensory pathway when the termini become overly excited Type 2: Gross inhibitory control
Some neuronal pools exert gross inhibitory control over widespread areas of the brain Example: Many of the basal ganglia exert inhibitory influences throughout the muscle control system SYNAPTIC FATIGUE — STABILIZING THE NERVOUS SYSTEM Synaptic fatigue means that synaptic transmission becomes progressively weaker the more prolonged and more intense the period of excitation.
Those neuronal pathways that are overused usually become rapidly fatigued, so their sensitivities decrease.
Conversely, those that are underused become rested, and their sensitivities increase.
Thus, fatigue and recovery from fatigue constitute an important short-term means of moderating the sensitivities of the different nervous system circuits.
Automatic Short-Term Adjustment of Pathway Sensitivity These functions help keep the circuits operating in a range of sensitivity that allows effective function.
Long-Term Changes in Synaptic Sensitivity The long-term sensitivities of synapses can be changed tremendously by:
Upregulating the number of receptor proteins at synaptic sites when there is underactivity Downregulating the receptors when there is overactivity Mechanism:
Receptor proteins are being formed constantly by the endoplasmic reticular-Golgi apparatus system They are constantly being inserted into the receptor neuron synaptic membrane When synapses are overused, excesses of transmitter substance combine with receptor proteins Many of these receptors are inactivated and removed from the synaptic membrane It is fortunate that upregulation and downregulation of receptors continually adjust the sensitivity in each circuit to almost the exact level required for proper function.
If the sensitivities of only a few circuits were abnormally high, one might expect almost continual muscle cramps, seizures, psychotic disturbances, hallucinations, or mental tension.
Fortunately, the automatic controls normally readjust the sensitivities back to controllable ranges.

                     data-book=""

                     data-content="UNIT IX: THE NERVOUS SYSTEM The somatic senses are the nervous mechanisms that collect sensory information from all over the body.
These senses are in contradistinction to the special senses, which mean specifically vision, hearing, smell, taste, and equilibrium.
CLASSIFICATION OF SOMATIC SENSES The somatic senses can be classified into three physiological types:
Type Description Mechanoreceptive somatic senses Tactile and position sensations stimulated by mechanical displacement of body tissues Thermoreceptive senses Detect heat and cold Pain sense Activated by factors that damage the tissues This chapter deals with the mechanoreceptive tactile and position senses.
The tactile senses include:
Touch Pressure Vibration Tickle The position senses include:
Static position Rate of movement senses Other Classifications of Somatic Sensations Somatic sensations are also often grouped together in other classes:
Classification Description Exteroreceptive sensations From the surface of the body Proprioceptive sensations Relating to the physical state of the body, including position sensations, tendon and muscle sensations, pressure sensations from the bottom of the feet, and even the sensation of equilibrium Visceral sensations From the viscera of the body (internal organs) Deep sensations From deep tissues such as fasciae, muscles, and bone; mainly “deep” pressure, pain, and vibration DETECTION AND TRANSMISSION OF TACTILE SENSATIONS Interrelations Among Touch, Pressure, and Vibration Although touch, pressure, and vibration are frequently classified as separate sensations, they are all detected by the same types of receptors.
There are three principal differences among them:
Sensation Primary Mechanism Touch Results from stimulation of tactile receptors in the skin or tissues immediately beneath the skin Pressure Results from deformation of deeper tissues Vibration Results from rapidly repetitive sensory signals Six Types of Tactile Receptors There are at least six entirely different types of tactile receptors (Figure 48-1).
1. Free Nerve Endings Free nerve endings are found everywhere in the skin and in many other tissues.
They can detect touch and pressure.
Even light contact with the cornea of the eye, which contains no other type of nerve ending besides free nerve endings, can nevertheless elicit touch and pressure sensations.
2. Meissner’s Corpuscle Meissner’s corpuscle is a touch receptor with great sensitivity.
Structure:
Elongated encapsulated nerve ending Large (type Aβ) myelinated sensory nerve fiber Many branching terminal nerve filaments inside the capsule Location:
Present in the nonhairy parts of the skin Particularly abundant in the fingertips, lips, and other areas where spatial location discrimination is highly developed Function:
Adapts in a fraction of a second after stimulation Particularly sensitive to movement of objects over the surface of the skin Also sensitive to low-frequency vibration 3. Merkel’s Discs (Expanded Tip Tactile Receptors) The fingertips and other areas that contain large numbers of Meissner’s corpuscles also contain large numbers of expanded tip tactile receptors, one type of which is Merkel’s discs.
Differences from Meissner’s corpuscles:
Transmit an initially strong but partially adapting signal Then transmit a continuing weaker signal that adapts only slowly Responsible for giving out steady-state signals that allow one to determine continuous touch of objects against the skin Structure:
Merkel discs are often grouped together in a receptor organ called touch domes These project upward against the underside of the epithelium of the skin This creates a dome and constitutes an extremely sensitive receptor The entire group of Merkel’s discs is innervated by a single large myelinated nerve fiber (type Aβ) These receptors play extremely important roles in:
Localizing touch sensations to specific surface areas of the body Determining the texture of what is felt 4. Hair End-Organs Slight movement of any hair on the body stimulates a nerve fiber entwining its base.
Each hair and its basal nerve fiber constitute a touch receptor called the hair end-organ.
Function:
Adapts readily Detects mainly: Movement of objects on the surface of the body Initial contact with the body 5. Ruffini’s Endings Ruffini’s endings are multibranched encapsulated endings located in:
Deeper layers of the skin Still deeper internal tissues Function:
Adapt very slowly Important for signaling continuous states of deformation of the tissues Signal heavy prolonged touch and pressure Found in joint capsules Help to signal the degree of joint rotation 6. Pacinian Corpuscles Pacinian corpuscles lie:
Immediately beneath the skin Deep in the fascial tissues of the body Function:
Stimulated only by rapid local compression of the tissues Adapt in a few hundredths of a second Particularly important for detecting tissue vibration Detect other rapid changes in the mechanical state of the tissues Transmission of Tactile Signals in Peripheral Nerve Fibers Receptor Type Fiber Type Conduction Velocity Meissner’s corpuscles, Iggo dome receptors, hair receptors, Pacinian corpuscles, Ruffini’s endings Type Aβ (large myelinated) 30–70 m/sec Free nerve ending tactile receptors Type Aδ (small myelinated) 5–30 m/sec Free nerve endings (tickle) Type C (unmyelinated) Up to 2 m/sec Key principle: The more critical types of sensory signals—those that help determine precise localization, minute gradations of intensity, or rapid changes in sensory signal intensity—are all transmitted in more rapidly conducting types of sensory nerve fibers.
Conversely, the cruder types of signals—pressure, poorly localized touch, and especially tickle—are transmitted via much slower, very small nerve fibers.
Detection of Vibration All tactile receptors are involved in detection of vibration, although different receptors detect different frequencies of vibration.
Receptor Frequency Range Transmission Pacinian corpuscles 30–800 cycles/sec Type Aβ fibers; up to 1000 impulses/sec Other (more slowly adapting) receptors 2–80 cycles/sec Slower fibers Pacinian corpuscles can detect signal vibrations from 30 to 800 cycles/sec because they respond extremely rapidly to minute and rapid deformations of the tissues.
