                     data-content="RESPIRATORY ABNORMALITIES The previous chapters discussed several methods for studying respiratory abnormalities.
These methods include:
Vital capacity Tidal air Functional residual capacity Dead space Physiologic shunt Physiological dead space This array of measurements is only part of the armamentarium of the clinical pulmonary physiologist.
STUDY OF BLOOD GASES AND BLOOD pH Among the most fundamental of all tests of pulmonary performance are determinations of:
Blood partial pressure of oxygen (PO2) Blood partial pressure of carbon dioxide (PCO2) Blood pH It is often important to make these measurements rapidly as an aid in determining appropriate therapy for:
Acute respiratory distress Acute abnormalities of acid-base balance The following simple and rapid methods have been developed to make these measurements within minutes, using no more than a few drops of blood.
DETERMINATION OF BLOOD pH Blood pH is measured using a glass pH electrode of the type commonly used in chemical laboratories.
The electrodes used for this purpose are miniaturized.
The voltage generated by the glass electrode is a direct measure of pH.
This voltage is generally read directly from a voltmeter scale or recorded on a chart.
DETERMINATION OF BLOOD PCO2 A glass electrode pH meter can also be used to determine blood CO2.
When a weak solution of sodium bicarbonate is exposed to CO2 gas, the CO2 dissolves in the solution until an equilibrium state is reached.
In this equilibrium state, the pH of the solution is a function of the CO2 and bicarbonate ion (HCO3−) concentrations.
This relationship is described by the Henderson-Hasselbalch equation:
p H = 6 . 1 &#43; l o g ( H C O 3 − / P C O 2 ) Procedure for Measuring PCO2 When the glass electrode is used to measure CO2 in blood:
A miniature glass electrode is surrounded by a thin plastic membrane A solution of sodium bicarbonate of known concentration is in the space between the electrode and plastic membrane Blood is then superfused onto the outer surface of the plastic membrane CO2 diffuses from the blood into the bicarbonate solution Only a drop or so of blood is required The pH is measured by the glass electrode The PCO2 is calculated using the formula DETERMINATION OF BLOOD PO2 The concentration of O2 in a fluid can be measured by a technique called polarography.
Procedure Electric current is made to flow between a small negative electrode and the solution If the voltage of the electrode is more than −0.6 volt different from the voltage of the solution, O2 will deposit on the electrode The rate of current flow through the electrode is directly proportional to the concentration of O2 (and therefore to PO2 as well) Practical Implementation In practice:
A negative platinum electrode with a surface area of about 1 square millimeter is used This electrode is separated from the blood by a thin plastic membrane The membrane allows diffusion of O2 but not diffusion of proteins or other substances that will “poison” the electrode COMBINED MEASUREMENT DEVICE Often, all three measuring devices for pH, PCO2, and PO2 are built into the same apparatus.
All these measurements can be made within a minute or so using a single droplet-sized sample of blood.
Thus, changes in blood gas levels and pH can be followed almost moment by moment at the bedside.
NORMAL VALUES AND SIGNIFICANCE Parameter Normal Arterial Value Abnormal Indicating Disturbance PO2 80–100 mm Hg &lt;60 mm Hg PCO2 35–45 mm Hg &gt;45 mm Hg pH 7.37–7.45 &lt;7.36 or &gt;7.45 SUMMARY: CHEMICAL CONTROL OF RESPIRATION The respiratory system maintains blood O2, CO2, and pH within narrow limits.
The following mechanisms are involved:
Central chemoreceptors in the medulla (respond to increased PCO2 and H&#43; in CSF) Peripheral chemoreceptors in carotid and aortic bodies (respond mainly to low PO2) Integration by the brainstem respiratory center Feedback adjustments to alveolar ventilation SUMMARY: HIGHER CORTICAL AND VOLUNTARY CONTROL The cerebral cortex allows voluntary control of breathing for activities like speech, singing, and breath-holding.
The hypothalamus and limbic system can influence respiration during emotional states.
These override the automatic brainstem control but cannot permanently suppress it.
"></div><div data-title="Renal Regulation of Potassium, Calcium, Phosphate, and Magnesium" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch30_renal-regulation-of-potassium-calcium-phosphate-and-magnesium/"
                     data-content="REGULATION OF EXTRACELLULAR FLUID POTASSIUM CONCENTRATION AND POTASSIUM EXCRETION The extracellular fluid potassium concentration normally is regulated at about 4.2 mEq/L. It seldom rises or falls more than ±0.3 mEq/L. This precise control is necessary because many cell functions are sensitive to changes in extracellular fluid potassium concentration.
An increase in plasma potassium concentration of only 3 to 4 mEq/L can cause cardiac arrhythmias. Higher concentrations can lead to cardiac arrest or fibrillation.
The Challenge of Potassium Regulation A special difficulty in regulating extracellular potassium concentration is the fact that more than 98% of the total body potassium is contained in the cells, and only 2% is contained in the extracellular fluid.
For a 70-kg adult with about 28 liters of intracellular fluid and 14 liters of extracellular fluid:
About 3920 mEq of potassium are inside the cells Only about 59 mEq are in the extracellular fluid The potassium contained in a single meal may be as high as 50 mEq. Daily intake usually ranges between 50 and 200 mEq/day. Failure to rapidly rid the extracellular fluid of the ingested potassium could cause life-threatening hyperkalemia. Likewise, a small loss of potassium from the extracellular fluid could cause severe hypokalemia.
Role of the Kidneys in Potassium Balance Maintenance of a balance between intake and output of potassium depends primarily on excretion by the kidneys. The amount excreted in the feces is only about 5% to 10% of the potassium intake. Thus, the maintenance of a normal potassium balance requires the kidneys to adjust their potassium excretion rapidly and precisely in response to wide variations in intake.
Role of Cellular Redistribution Control of potassium distribution between the extracellular and intracellular compartments also plays an important role in potassium homeostasis. Because more than 98% of the total body potassium is contained in the cells, they can serve as:
An overflow site for excess extracellular fluid potassium during hyperkalemia A source of potassium during hypokalemia Redistribution of potassium between the intracellular and extracellular fluid compartments provides a first line of defense against changes in extracellular fluid potassium concentration.
REGULATION OF INTERNAL POTASSIUM DISTRIBUTION After ingestion of a potassium-rich meal, extracellular fluid potassium concentration would rise to a dangerous level if the ingested potassium did not move into the cells rapidly.
For example, absorption of 40 mEq of potassium (the amount contained in a meal rich in vegetables and fruit) into an extracellular fluid volume of 14 liters would raise plasma potassium concentration by about 2.9 mEq/L if all the potassium remained in the extracellular compartment. Fortunately, most of the ingested potassium rapidly moves into the cells until the kidneys can eliminate the excess.
Between meals, plasma potassium concentration also remains nearly constant as potassium is released by the cells to balance the extracellular fluid potassium excreted by the kidneys.
Factors That Alter Potassium Distribution Factors That Shift K&#43; Into Cells (Decrease Extracellular [K&#43;]) Factors That Shift K&#43; Out of Cells (Increase Extracellular [K&#43;]) Insulin Insulin deficiency (diabetes mellitus) Aldosterone Aldosterone deficiency (Addison disease) β-Adrenergic stimulation β-Adrenergic blockade Alkalosis Acidosis Cell lysis Strenuous exercise Increased extracellular fluid osmolarity Insulin Stimulates Potassium Uptake Into Cells Insulin stimulates sodium-potassium adenosine triphosphatase (ATPase) activity in many tissues, including skeletal muscle. This in turn transports potassium into the cells. Insulin is important for increasing cell potassium uptake after a meal.
In people who have insulin-deficient diabetes mellitus, the rise in plasma potassium concentration after eating a meal is much greater than normal. Injections of insulin can help correct the hyperkalemia.
Aldosterone Increases Potassium Uptake Into Cells Increased potassium intake also stimulates secretion of aldosterone, which increases cell potassium uptake. Excess aldosterone secretion (Conn syndrome) is almost invariably associated with hypokalemia due in part to movement of extracellular potassium into the cells.
Conversely, patients with deficient aldosterone production (Addison disease) often have clinically significant hyperkalemia due to accumulation of potassium in the extracellular space, as well as renal retention of potassium.
β-Adrenergic Stimulation Increases Cellular Uptake of Potassium Increased secretion of catecholamines, especially epinephrine, can cause movement of potassium from the extracellular to the intracellular fluid, mainly by activation of β2-adrenergic receptors.
Conversely, treatment of hypertension with β-adrenergic receptor blockers, such as propranolol, causes potassium to move out of the cells, creating a tendency toward hyperkalemia.
Acid–Base Abnormalities Can Cause Changes in Potassium Distribution Metabolic acidosis increases extracellular potassium concentration by causing loss of potassium from the cells. Metabolic alkalosis decreases extracellular fluid potassium concentration.
The mechanisms responsible for the effect of hydrogen ion concentration on internal distribution of potassium are not completely understood. One effect of increased hydrogen ion concentration is to reduce activity of the Na&#43;-K&#43; ATPase pump, decreasing cellular uptake of potassium and raising extracellular potassium concentration. Alkalosis has the opposite effect, shifting potassium from the extracellular fluid into the cells and tending to cause hypokalemia.
Cell Lysis Causes Increased Extracellular Potassium Concentration As cells are destroyed, the large amounts of potassium contained in the cells are released into the extracellular fluid. This release of potassium can cause significant hyperkalemia if large amounts of tissue are destroyed, such as with severe muscle injury or red blood cell lysis.
Strenuous Exercise Can Cause Hyperkalemia During prolonged exercise, potassium is released from skeletal muscle into the extracellular fluid. Usually the hyperkalemia is mild but may be clinically significant after heavy exercise, especially in patients treated with β-adrenergic blockers and in individuals with insulin deficiency. In rare cases, hyperkalemia after exercise may be severe enough to cause cardiac toxicity.
Increased Extracellular Fluid Osmolarity Causes Redistribution of Potassium Increased extracellular fluid osmolarity causes osmotic flow of water out of the cells. The cellular dehydration increases intracellular potassium concentration, promoting diffusion of potassium out of the cells and increasing extracellular fluid potassium concentration. Decreased extracellular fluid osmolarity has the opposite effect.
OVERVIEW OF RENAL POTASSIUM EXCRETION Renal potassium excretion is determined by the sum of three processes:
Filtration: the rate of potassium filtration (GFR multiplied by the plasma potassium concentration) Reabsorption: the rate of potassium reabsorption by the tubules Secretion: the rate of potassium secretion by the tubules The normal rate of potassium filtration by the glomerular capillaries is about 756 mEq/day, calculated as: GFR (180 L/day) × plasma potassium concentration (4.2 mEq/L).
Daily Potassium Balance Component Amount (mEq/day) K&#43; intake 100 K&#43; excretion (urine) 92 K&#43; excretion (feces) 8 Potassium Handling by the Kidneys Process Description Filtration K&#43; freely filtered at glomerulus (~756 mEq/day) Reabsorption Most filtered K&#43; reabsorbed in proximal tubule and loop of Henle Secretion K&#43; secreted by principal cells in collecting duct (regulated by aldosterone) Regulation of Potassium Secretion Potassium secretion in the collecting duct is primarily regulated by:
Aldosterone: increases K&#43; secretion Urine flow rate: increased flow enhances K&#43; secretion Plasma potassium concentration: directly stimulates aldosterone secretion SODIUM RETENTION BY THE KIDNEYS In liver cirrhosis, a reduction in plasma protein concentration results from destruction of liver cells, reducing the ability of the liver to synthesize enough plasma proteins.
Cirrhosis is also associated with large amounts of fibrous tissue in the liver structure, greatly impeding the flow of portal blood through the liver. This impedance raises capillary pressure throughout the portal vascular bed, contributing to the leakage of fluid and proteins into the peritoneal cavity, a condition called ascites.
Once fluid and protein are lost from the circulation, the renal responses are similar to those in other conditions associated with decreased plasma volume. The kidneys continue to retain salt and water until plasma volume and arterial pressure are restored to normal.
In some cases, plasma volume may actually increase above normal because of increased vascular capacity in cirrhosis. The high pressures in the portal circulation can greatly distend veins, increasing vascular capacity.
PRECISELY REGULATED Precise H&#43; regulation is essential because the activities of almost all enzyme systems in the body are influenced by H&#43; concentration. Changes in H&#43; concentration alter virtually all cell and body functions.
Comparison With Other Ions Compared with other ions, the H&#43; concentration of the body fluids normally is kept at a low level. The concentration of sodium in extracellular fluid (142 mEq/L) is about 3.5 million times as great as the normal concentration of H&#43; (averaging only 0.00004 mEq/L). Equally important, the normal variation in H&#43; concentration in extracellular fluid is only about one millionth as great as the normal variation in sodium ion concentration. The precision with which H&#43; is regulated emphasizes its importance to the various cell functions.
ACIDS AND BASES—DEFINITIONS AND MEANINGS A hydrogen ion is a single free proton released from a hydrogen atom. Molecules containing hydrogen atoms that can release hydrogen ions in a solution are referred to as acids. For example, hydrochloric acid (HCl) ionizes in water to form hydrogen ions (H&#43;) and chloride ions (Cl−). Likewise, carbonic acid (H2CO3) ionizes in water to form H&#43; and bicarbonate ions (HCO3−).
Definition of Bases A base is an ion or a molecule that can accept an H&#43;. For example, HCO3− is a base because it can combine with H&#43; to form H2CO3. Likewise, HPO4= is a base because it can accept an H&#43; to form H2PO4−.
The proteins in the body also function as bases because some of the amino acids that make up proteins have net negative charges that readily accept H&#43;. The protein hemoglobin in the red blood cells is among the most important of the body’s bases.
Strong and Weak Acids and Bases Strong acid: HCl rapidly dissociates and releases especially large amounts of H&#43; in solution.
Weak acid: H2CO3 is less likely to dissociate its ions and releases H&#43; with less vigor.
Strong base: reacts rapidly and strongly with H&#43;. A typical example is OH−, which reacts with H&#43; to form water (H2O).
Weak base: HCO3− binds with H&#43; much more weakly than OH−.
Most acids and bases in the extracellular fluid that are involved in normal acid–base regulation are weak acids and bases. The most important ones are:
Carbonic acid (H2CO3) HCO3− base NORMAL H&#43; CONCENTRATION AND pH OF BODY FLUIDS The blood H&#43; concentration is normally maintained within tight limits around a normal value of about 0.00004 mEq/L (40 nEq/L). Normal variations are only about 3 to 5 nEq/L. Under extreme conditions, the H&#43; concentration can vary from as low as 10 nEq/L to as high as 100 nEq/L without resulting in death.
The pH Scale Because H&#43; concentration normally is low and these small numbers are cumbersome, it is customary to express H&#43; concentration on a logarithm scale using pH units. pH is related to the actual H&#43; concentration by:
p H = l o g ( 1 / [ H &#43; ] ) = − l o g [ H &#43; ] For example, normal [H&#43;] is 40 nEq/L (0.00000004 Eq/L). Therefore, the normal pH is:
p H = − l o g [ 0 . 0 0 0 0 0 0 0 4 ] = 7 . 4 pH is inversely related to the H&#43; concentration. A low pH corresponds to a high H&#43; concentration, and a high pH corresponds to a low H&#43; concentration.
Normal pH Values Fluid pH Arterial blood 7.4 Venous blood 7.35 Interstitial fluid 7.35 Intracellular fluid 6.0–7.4 Urine 4.5–8.0 Gastric HCl 0.8 The lower limit of pH at which a person can live more than a few hours is about 6.8. The upper limit is about 8.0.
Intracellular pH usually is slightly lower than plasma pH because cell metabolism produces acid, especially H2CO3. Depending on the type of cells, the pH of intracellular fluid has been estimated to range between 6.0 and 7.4. Hypoxia of the tissues and poor blood flow to the tissues can cause acid accumulation and decreased intracellular pH.
The terms acidosis and alkalosis describe the processes that lead to acidemia and alkalemia, respectively. The pH of urine can range from 4.5 to 8.0, depending on the acid–base status of the extracellular fluid. The kidneys play a major role in correcting abnormalities of extracellular fluid H&#43; concentration by excreting acids or bases at variable rates.
An extreme example of an acidic body fluid is the HCl secreted into the stomach by the oxyntic (parietal) cells of the stomach mucosa. The H&#43; concentration in these cells is about 4 million times greater than the hydrogen concentration in blood, with a pH of 0.8.
DEFENDING AGAINST CHANGES IN H&#43; CONCENTRATION: BUFFERS, LUNGS, AND KIDNEYS Three primary systems regulate the H&#43; concentration in the body fluids:
Chemical acid–base buffer systems of the body fluids: These immediately combine with an acid or a base to prevent excessive changes in H&#43; concentration. The respiratory center: This regulates the removal of CO2 (and therefore H2CO3) from the extracellular fluid. The kidneys: These can excrete acidic or alkaline urine and readjust the extracellular fluid H&#43; concentration toward normal during acidosis or alkalosis. How Buffer Systems Work When there is a change in H&#43; concentration, the buffer systems of the body fluids react within seconds to minimize these changes. Buffer systems do not eliminate H&#43; from or add H&#43; to the body; they only keep them tied up until balance can be re-established. The general form of the buffering reaction is:
B u f f e r &#43; H &#43; ↔ H B u f f e r When the H&#43; concentration increases, the reaction is forced to the right. More H&#43; binds to the buffer, as long as buffer is available. Conversely, when the H&#43; concentration decreases, the reaction shifts toward the left, and H&#43; is released from the buffer.
Lines of Defense Against H&#43; Changes Line of Defense Speed Power Chemical buffers Seconds Limited Respiratory system Minutes Moderate Kidneys Hours to days Most powerful The respiratory system acts within a few minutes to eliminate CO2 and therefore H2CO3 from the body. The first two lines of defense keep the H&#43; concentration from changing too much until the more slowly responding third line of defense—the kidneys—can eliminate the excess acid or base from the body.
Although the kidneys are relatively slow to respond compared with the other defenses, over a period of hours to several days they are by far the most powerful of the acid–base regulatory systems.
Summary of pH and H&#43; Concentration H&#43; Concentration (mEq/L) pH Body Fluid 4.0 × 10−5 7.40 Arterial blood 4.5 × 10−5 7.35 Venous blood 4.5 × 10−5 7.35 Interstitial fluid 1 × 10−3 to 4 × 10−5 6.0–7.4 Intracellular fluid 3 × 10−2 to 1 × 10−5 4.5–8.0 Urine 160 0.8 Gastric HCl "></div><div data-title="Renal Tubular Reabsorption and Secretion" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch28_renal-tubular-reabsorption-and-secretion/"
                     data-content="TUBULAR REABSORPTION INCLUDES PASSIVE AND ACTIVE MECHANISMS For a substance to be reabsorbed, it must first be transported across the tubular epithelial membranes into the renal interstitial fluid. Then it must be transported through the peritubular capillary membrane back into the blood.
Reabsorption of water and solutes includes a series of transport steps. Reabsorption across the tubular epithelium into the interstitial fluid includes active or passive transport, using the same basic mechanisms discussed in Chapter 4 for transport across other cell membranes of the body.
Water and solutes can be transported:
Through the cell membranes (transcellular route) Through the spaces between the cell junctions (paracellular route) After absorption across the tubular epithelial cells into the interstitial fluid, water and solutes are transported through the peritubular capillary walls into the blood by ultrafiltration (bulk flow) mediated by hydrostatic and colloid osmotic forces.
The peritubular capillaries behave like the venous ends of most other capillaries because there is a net reabsorptive force that moves the fluid and solutes from the interstitium into the blood.
ACTIVE TRANSPORT Active transport can move a solute against an electrochemical gradient, which requires energy derived from metabolism.
Primary Active Transport Transport that is coupled directly to an energy source, such as the hydrolysis of adenosine triphosphate (ATP), is termed primary active transport.
An example is the sodium-potassium adenosine triphosphatase pump (Na&#43;-K&#43; ATPase pump). This pump functions throughout most parts of the renal tubule.
Secondary Active Transport Transport that is coupled indirectly to an energy source, such as that due to an ion gradient, is referred to as secondary active transport. Reabsorption of glucose by the renal tubule is an example of secondary active transport.
Although solutes can be reabsorbed by active and/or passive mechanisms by the tubule, water is always reabsorbed passively, moving across the tubular epithelial membrane by the process of osmosis.
Solutes Can Be Transported Through Epithelial Cells or Between Cells Renal tubular cells, like other epithelial cells, are held together by tight junctions. Lateral intercellular spaces lie behind the tight junctions, separating the epithelial cells of the tubule.
Solutes can be reabsorbed or secreted:
Transcellular pathway: across the cells through the cell membranes Paracellular pathway: between the cells through the tight junctions and intercellular spaces Sodium is a substance that moves through both routes, with most transported through the transcellular pathway. In some nephron segments, especially the proximal tubule, water is also reabsorbed across the paracellular pathway, and substances dissolved in the water (especially potassium, magnesium, and chloride ions) are carried with the reabsorbed fluid between the cells.
Primary Active Transport Through the Tubular Membrane Linked to Hydrolysis of Adenosine Triphosphatase The special importance of primary active transport is that it can move solutes against an electrochemical gradient. The energy for this active transport comes from the hydrolysis of ATP by way of membrane-bound ATPase, which is also a component of the carrier mechanism that binds and moves solutes across the cell membranes.
The primary active transporters in the kidneys that are known include:
Na&#43;-K&#43; ATPase Hydrogen ATPase Hydrogen-potassium ATPase Calcium ATPase Example: Reabsorption of Sodium Ions Across the Proximal Tubular Membrane A good example of primary active transport is the reabsorption of sodium ions across the proximal tubular membrane, as shown in Figure 28-2.

                     data-content="SPERMATOGENESIS During formation of the embryo, the primordial germ cells migrate into the testes and become immature germ cells called spermatogonia.
These spermatogonia lie in two or three layers of the inner surfaces of the seminiferous tubules.
At puberty the spermatogonia begin to undergo mitotic division and continually proliferate and differentiate through definite stages of development to form sperm.
STEPS OF SPERMATOGENESIS Spermatogenesis occurs in the seminiferous tubules during active sexual life as the result of stimulation by anterior pituitary gonadotropic hormones.
Spermatogenesis begins in the male at an average age of 13 years and continues throughout most of the remainder of life. It decreases markedly in old age.
MALE REPRODUCTIVE ANATOMY Testis Structure Structure Function Seminiferous tubules Site of sperm production (spermatogenesis) Leydig cells (interstitial cells) Secrete testosterone Rete testis Collects sperm from seminiferous tubules Efferent ductules Transport sperm to epididymis Epididymis (head, body, tail) Sperm maturation and storage Vas deferens Transports sperm during ejaculation Accessory Organs Organ Secretion Seminal vesicles Fructose-rich fluid (60-70% of semen) Prostate gland Alkaline, enzymatic fluid Bulbourethral glands Mucus secretion Semen Characteristics Property Value Volume per ejaculation 2-5 mL Sperm count 50-150 million/mL pH 7.2-7.8 Fructose content 200-400 mg/dL SPERMATOGENESIS CELL DIVISION PROCESS Mitotic Proliferation In the first stage of spermatogenesis, the spermatogonia migrate among Sertoli cells toward the central lumen of the seminiferous tubule.
The Sertoli cells are large, with overflowing cytoplasmic envelopes that surround the developing spermatogonia all the way to the central lumen of the tubule.
Meiosis Spermatogonia that cross the barrier into the Sertoli cell layer become progressively modified and enlarged to form large primary spermatocytes.
Each primary spermatocyte undergoes meiotic division to form two secondary spermatocytes.
After another few days, these secondary spermatocytes also divide to form spermatids. Spermatids are eventually modified to become spermatozoa (sperm).
Chromosome Division During the change from the spermatocyte stage to the spermatid stage, the 46 chromosomes (23 pairs of chromosomes) of the spermatocyte are divided. Thus, 23 chromosomes go to one spermatid and the other 23 go to the second spermatid.
The chromosomal genes are also divided so that only one-half of the genetic characteristics of the eventual fetus are provided by the father. The other half is derived from the oocyte provided by the mother.
Timeline of Spermatogenesis Cell Type Duration Spermatogonia proliferation 25 days Primary spermatocyte (meiosis I) 12-14 years after puberty Secondary spermatocytes (meiosis II) 9 days Spermatids differentiation 19 days Mature sperm release 21 days Total time from spermatogonia to spermatozoa: approximately 74 days.
SEX CHROMOSOMES AND OFFSPRING SEX In each spermatogonium, one of the 23 pairs of chromosomes carries the genetic information that determines the sex of each eventual offspring.
This pair is composed of:
One X chromosome (female chromosome) One Y chromosome (male chromosome) Determination of Offspring Sex Sperm Type Ovum Type Offspring Sex X-chromosome bearing X Female (XX) Y-chromosome bearing X Male (XY) Half of the mature sperm carry an X chromosome and half carry a Y chromosome. Therefore, the sex of the offspring is determined by which type of sperm fertilizes the ovum.
TESTOSTERONE AND MALE HORMONES Testosterone Synthesis Testosterone is synthesized by Leydig cells in the testicular interstitium. LH (luteinizing hormone) stimulates testosterone production.
Functions of Testosterone Function Description Fetal development Development of male internal genitalia (Wolffian ducts) External genitalia Masculinization of penis and scrotum Puberty Secondary sexual characteristics development Spermatogenesis Required for sperm maturation Libido Maintains sexual desire Anabolic effects Increased muscle mass and bone density Male Secondary Sexual Characteristics Characteristic Mechanism Deep voice Laryngeal cartilage growth Facial hair Terminal hair growth on face Body hair Increased body hair distribution Muscle mass Protein synthesis stimulation Bone density Increased bone mineralization FSH AND LH IN MALES Follicle-Stimulating Hormone (FSH) FSH is produced by the anterior pituitary gland. It stimulates Sertoli cells in the seminiferous tubules.

Hormonal Feedback in Males Hormone Target Effect Testosterone Hypothalamus/Pituitary Inhibits GnRH, LH secretion Inhibin Pituitary Inhibits FSH secretion FSH Sertoli cells Stimulates inhibin PINEAL GLAND AND MELATONIN Melatonin Secretion The pineal gland secretes melatonin primarily at night. Melatonin secretion is stimulated by darkness and inhibited by light.
Functions of Melatonin Function Description Circadian rhythm regulation Helps set the biological clock Seasonal reproduction Affects reproductive function in some species Sleep promotion Contributes to sleep onset Pineal Gland Anatomy The pineal gland is located in the epithalamus. It receives sympathetic innervation from the superior cervical ganglia.

                     data-content="Basophils Similarity to Mast Cells The basophils in the circulating blood are similar to the large tissue mast cells located immediately outside many of the capillaries in the body.
Both mast cells and basophils liberate heparin into the blood. Heparin is a substance that can prevent blood coagulation.
Inflammatory Mediators The mast cells and basophils also release histamine, as well as smaller quantities of bradykinin and serotonin.
It is mainly the mast cells in inflamed tissues that release these substances during inflammation.
Role in Allergic Reactions The mast cells and basophils play an important role in some types of allergic reactions because the type of antibody that causes allergic reactions, immunoglobulin E (IgE), has a special propensity to become attached to mast cells and basophils.
Then, when the specific antigen for the specific IgE antibody subsequently reacts with the antibody, the resulting attachment of antigen to antibody causes the mast cell or basophil to release increased quantities of:
Histamine Bradykinin Serotonin Heparin Slow-reacting substance of anaphylaxis (a mixture of three leukotrienes) Several lysosomal enzymes These substances cause local vascular and tissue reactions that mediate many, if not most, of the allergic manifestations. These reactions are discussed in greater detail in Chapter 35.
Leukopenia Definition and Vulnerability A clinical condition known as leukopenia, in which the bone marrow produces very few WBCs, occasionally occurs. This condition leaves the body unprotected against many bacteria and other agents that might invade the tissues.
Normal Bacterial Flora Normally, the human body lives in symbiosis with many bacteria because the mucous membranes of the body are constantly exposed to large numbers of bacteria.
The mouth almost always contains various spirochetal, pneumococcal, and streptococcal bacteria. These same bacteria are present to a lesser extent in the entire respiratory tract.
The distal gastrointestinal tract is especially loaded with colon bacilli. One can always find bacteria on the surfaces of the eyes, urethra, and vagina.
Any decrease in the number of WBCs immediately allows invasion of adjacent tissues by bacteria that are already present.
Rapid Clinical Course Within 2 days after the bone marrow stops producing WBCs, ulcers may appear in the mouth and colon, or some form of severe respiratory infection might develop.
Bacteria from the ulcers rapidly invade surrounding tissues and the blood. Without treatment, death often ensues in less than 1 week after acute total leukopenia begins.
Causes of Bone Marrow Aplasia Irradiation of the body by x-rays or gamma rays, or exposure to drugs and chemicals that contain benzene or anthracene nuclei, is likely to cause aplasia of the bone marrow.
Some common drugs such as chloramphenicol (an antibiotic), thiouracil (used to treat thyrotoxicosis), and even various barbiturate hypnotics on rare occasions cause leukopenia, thus setting off the entire infectious sequence of this disorder.
Recovery Potential After moderate irradiation injury to the bone marrow, some stem cells, myeloblasts, and hemocytoblasts may remain undestroyed in the marrow and are capable of regenerating the bone marrow, provided sufficient time is available.
A patient properly treated with transfusions, plus antibiotics and other drugs to ward off infection, usually develops enough new bone marrow within weeks to months for blood cell concentrations to return to normal.
Leukemias Definition Uncontrolled production of WBCs can be caused by cancerous mutation of a myelogenous or lymphogenous cell. This process causes leukemia, which is usually characterized by greatly increased numbers of abnormal WBCs in the circulating blood.
Classification of Leukemias There are two general types of leukemia:
Type Origin Characteristics Lymphocytic leukemia Cancerous production of lymphoid cells, usually beginning in a lymph node or other lymphocytic tissue Spreads to other areas of the body Myelogenous leukemia Cancerous production of young myelogenous cells in the bone marrow Spreads throughout the body; WBCs produced in extramedullary tissues (especially lymph nodes, spleen, and liver) Specialized Types In myelogenous leukemia, the cancerous process occasionally produces partially differentiated cells, resulting in:
Neutrophilic leukemia Eosinophilic leukemia Basophilic leukemia Monocytic leukemia More frequently, however, the leukemia cells are bizarre and undifferentiated and not identical to any of the normal WBCs.
Acute vs. Chronic Usually, the more undifferentiated the cell, the more acute is the leukemia, often leading to death within a few months if untreated.
With some of the more differentiated cells, the process can be chronic, sometimes developing slowly over 10 to 20 years.
Leukemic cells, especially the very undifferentiated cells, are usually nonfunctional for providing normal protection against infection.
Effects of Leukemia on the Body Metastatic Growth The first effect of leukemia is metastatic growth of leukemic cells in abnormal areas of the body. Leukemic cells from the bone marrow may reproduce so much that they invade the surrounding bone, causing pain and, eventually, a tendency for bones to fracture easily.
Systemic Spread Almost all leukemias eventually spread to the spleen, lymph nodes, liver, and other vascular regions, regardless of whether the leukemia originated in the bone marrow or lymph nodes.
Common Clinical Effects Common effects in leukemia are:
Effect Mechanism Infection Displacement of normal bone marrow cells by nonfunctional leukemic cells Severe anemia Displacement of normal erythropoietic cells Bleeding tendency Thrombocytopenia (lack of platelets) Metabolic Drain Finally, an important effect of leukemia on the body is excessive use of metabolic substrates by the growing cancerous cells.
The leukemic tissues reproduce new cells so rapidly that tremendous demands are made on the body reserves for foodstuffs, specific amino acids, and vitamins. Consequently, the energy of the patient is greatly depleted.
Excessive utilization of amino acids by leukemic cells causes especially rapid deterioration of the normal protein tissues of the body. Thus, while the leukemic tissues grow, other tissues become debilitated.
After metabolic starvation has continued long enough, this factor alone is sufficient to cause death.
Immunity Overview The human body has the ability to resist almost all types of organisms or toxins that tend to damage the tissues and organs. This capability is called immunity.
Much of the immunity is acquired immunity that does not develop until after the body is first attacked by a bacterium, virus, or toxin. Often, weeks or months are required for the immunity to develop.
An additional element of immunity that results from general processes, rather than from processes directed at specific disease organisms, is called innate immunity.
Innate Immunity Innate immunity includes the following aspects:
Phagocytosis of bacteria and other invaders by white blood cells and cells of the tissue macrophage system (as described in Chapter 34)
Destruction of swallowed organisms by the acid secretions of the stomach and the digestive enzymes
Resistance of the skin to invasion by organisms
Presence in the blood of certain chemicals and cells that attach to foreign organisms or toxins and destroy them:
Lysozyme — a mucolytic polysaccharide that attacks bacteria and causes them to dissolute Basic polypeptides — which react with and inactivate certain types of gram-positive bacteria The complement complex — a system of about 20 proteins that can be activated in various ways to destroy bacteria Natural killer lymphocytes — that can recognize and destroy foreign cells, tumor cells, and even some infected cells Examples of Innate Immunity This innate immunity makes the human body resistant to diseases such as:
Some paralytic viral infections of animals Hog cholera Cattle plague Distemper (a viral disease that kills a large percentage of dogs that become afflicted with it) Likewise, many animals are resistant or even immune to many human diseases, such as poliomyelitis, mumps, human cholera, measles, and syphilis, which are very damaging or even lethal to humans.
Acquired (Adaptive) Immunity In addition to its generalized innate immunity, the human body has the ability to develop extremely powerful specific immunity against individual invading agents such as lethal bacteria, viruses, toxins, and even foreign tissues from other animals.
This ability is called acquired or adaptive immunity. Acquired immunity is caused by a special immune system that forms antibodies and/or activated lymphocytes that attack and destroy the specific invading organism or toxin.
Degree of Protection Acquired immunity can often bestow an extreme degree of protection. For example, certain toxins, such as the paralytic botulinum toxin or the tetanizing toxin of tetanus, can be protected against in doses as high as 100,000 times the amount that would be lethal without immunity.
It is for this reason that the treatment process known as immunization is so important in protecting people against disease and against toxins.
Basic Types of Acquired Immunity — Humoral and Cell-Mediated Two basic but closely allied types of acquired immunity occur in the body:
Type Mechanism Cells Involved Humoral immunity Body develops circulating antibodies (globulin molecules in blood plasma) that attack the invading agent B lymphocytes (B cells) Cell-mediated immunity Formation of large numbers of activated T lymphocytes specifically crafted to destroy the foreign agent T lymphocytes (T cells) Both the antibodies and activated lymphocytes are formed in the lymphoid tissues of the body.
Antigens and Their Role Because acquired immunity does not develop until after invasion by a foreign organism or toxin, the body must have some mechanism for recognizing this invasion.
Each toxin or organism almost always contains one or more specific chemical compounds in its makeup that is (are) different from all other compounds. In general, these are proteins or large polysaccharides that initiate the acquired immunity.
These substances are called antigens (antibody generators).
Requirements for Antigenicity For a substance to be antigenic:
It usually must have a high molecular weight of 8000 or more The process of antigenicity usually depends on regularly recurring molecular groups, called epitopes, on the surface of the large molecule This explains why proteins and large polysaccharides are almost always antigenic because both these substances have this stereochemical characteristic.
Lymphocytes Are Responsible for Acquired Immunity Acquired immunity is the product of the body’s lymphocytes. In people who have a genetic lack of lymphocytes or whose lymphocytes have been destroyed by radiation or chemicals, no acquired immunity can develop.
Within days after birth, such a person dies of fulminating bacterial infection unless he or she is treated by heroic measures. Therefore, it is clear that lymphocytes are essential to the survival of humans.
Distribution of Lymphocytes Lymphocytes are located most extensively in the lymph nodes, but are also found in special lymphoid tissues such as the spleen, submucosal areas of the gastrointestinal tract, thymus, and bone marrow.
The lymphoid tissue is distributed advantageously in the body to intercept invading organisms or toxins before they can spread too widely.
First Encounter with Antigens In most cases, the invading agent first enters the tissue fluids and then is carried by lymph vessels to the lymph node or other lymphoid tissue.
The lymphoid tissue of the gastrointestinal walls is exposed immediately to antigens invading from the gut.
The lymphoid tissue of the throat and pharynx (including the tonsils and adenoids) is well located to intercept antigens that enter by way of the upper respiratory tract.
The lymphoid tissue in the lymph nodes is exposed to antigens that invade the peripheral tissues of the body.
The lymphoid tissue of the spleen, thymus, and bone marrow plays the specific role of intercepting antigenic agents that have succeeded in reaching the circulating blood.
T and B Lymphocytes Although most lymphocytes in normal lymphoid tissue look alike when studied under a microscope, these cells are distinctly divided into two major populations:
Population Function Site of Preprocessing T lymphocytes Form activated lymphocytes that provide cell-mediated immunity Thymus gland B lymphocytes Form antibodies that provide humoral immunity Liver (mid-fetal), Bone marrow (late fetal and after birth) Origin of Both Populations Both types of lymphocytes are derived originally in the embryo from multipotent hematopoietic stem cells that form common lymphoid progenitor cells as one of their most important offspring as they differentiate.
Almost all the lymphocytes that are formed eventually end up in the lymphoid tissue, but before doing so, they are further differentiated or preprocessed.
T Lymphocyte Processing The lymphoid progenitor cells that are eventually destined to form activated T lymphocytes first migrate to and are preprocessed in the thymus gland. Thus, they are called T lymphocytes to designate the role of the thymus. They are responsible for cell-mediated immunity.
B Lymphocyte Discovery The other population of lymphocytes—the B lymphocytes that are destined to form antibodies—are preprocessed in the liver during mid–fetal life and in the bone marrow in late fetal life and after birth.
This population of cells was first discovered in birds, which have a special preprocessing organ called the bursa of Fabricius. For this reason, these lymphocytes are called B lymphocytes to designate the role of the bursa. They are responsible for humoral immunity.
Formation of Immune Response (Figure 35-1) Figure 35-1. Formation of antibodies and sensitized lymphocytes by a lymph node in response to antigens. This shows the origin of thymic (T) and bursal (B) lymphocytes that, respectively, are responsible for the cell-mediated and humoral immune processes.
Pathway:
Hematopoietic stem cells → Common lymphoid progenitor cell Common lymphoid progenitor cell → Developing B cell (in liver/bone marrow) → B lymphocyte → Plasma cell → Antibodies Common lymphoid progenitor cell → Thymus → T lymphocyte → Activated T lymphocytes Both activated T lymphocytes and antibodies go to peripheral lymphoid tissue where they encounter antigens "></div><div data-title="Resistance of the Body to Infection: II. Immunity and Allergy"

Formation of Immune Response Figure 35-1. Formation of antibodies and sensitized lymphocytes by a lymph node in response to antigens. This shows the origin of thymic (T) and bursal (B) lymphocytes that, respectively, are responsible for the cell-mediated and humoral immune processes.
Pathway:
Hematopoietic stem cells → Common lymphoid progenitor cells Common lymphoid progenitor cells → Developing B cells (processed in bone marrow/liver) → B lymphocytes → Plasma cells → Antibodies Common lymphoid progenitor cells → T cells (processed in thymus) → Activated T lymphocytes Both activated T lymphocytes and antibodies go to peripheral lymphoid tissue where they encounter antigens Immunization by Injection of Antigens Immunization has been used for many years to produce acquired immunity against specific diseases.
Types of Immunization Dead organisms: A person can be immunized by injecting dead organisms that are no longer capable of causing disease but that still have some of their chemical antigens. This type of immunization is used to protect against typhoid fever, whooping cough, diphtheria, and many other types of bacterial diseases.
Toxoids: Immunity can be achieved against toxins that have been treated with chemicals so that their toxic nature has been destroyed, even though their antigens for causing immunity are still intact. This procedure is used in immunizing against tetanus, botulism, and other similar toxic diseases.
Attenuated organisms: Finally, a person can be immunized by being infected with live organisms that have been attenuated. These organisms have been grown in special culture media or have been passed through a series of animals until they have mutated enough that they will not cause disease but do still carry specific antigens required for immunization. This procedure is used to protect against smallpox, yellow fever, poliomyelitis, measles, and many other viral diseases.
Passive Immunity Thus far, all the acquired immunity we have discussed has been active immunity—that is, the person’s own body develops antibodies or activated T cells in response to invasion of the body by a foreign antigen.
However, temporary immunity can be achieved in a person without injecting any antigen. This temporary immunity is achieved by infusing antibodies, activated T cells, or both obtained from the blood of someone else or from some other animal that has been actively immunized against the antigen.
Duration of Passive Immunity Component Duration in Recipient Antibodies 2 to 3 weeks Activated T cells (from another person) A few weeks Activated T cells (from an animal) A few hours to a few days Such transfusion of antibodies or T lymphocytes to confer immunity is called passive immunity.
Allergy and Hypersensitivity An important undesirable side effect of immunity is the development, under some conditions, of an allergy or other type of immune hypersensitivity. There are several types of allergy and other hypersensitivities, some of which occur only in people who have a specific allergic tendency.
Allergy Caused by Activated T Cells: Delayed-Reaction Allergy Delayed-reaction allergy is caused by activated T cells and not by antibodies.
In the case of poison ivy, the toxin of poison ivy in itself does not cause much harm to the tissues. However, on repeated exposure, it does cause the formation of activated helper and cytotoxic T cells.
Then, after subsequent exposure to the poison ivy toxin, within a day or so, the activated T cells diffuse from the circulating blood in large numbers into the skin to respond to the poison ivy toxin. At the same time, these T cells elicit a cell-mediated type of immune reaction.
Remembering that this type of immunity can cause release of many toxic substances from the activated T cells, as well as extensive invasion of the tissues by macrophages, along with their subsequent effects, one can understand that the eventual result of some delayed-reaction allergies can be serious tissue damage.
Site of Damage The damage normally occurs in the tissue area where the instigating antigen is present:
In the skin (in the case of poison ivy) In the lungs to cause lung edema or asthmatic attacks (in the case of some airborne antigens) Atopic Allergies Associated With Excess IgE Antibodies Some people have an allergic tendency. Their allergies are called atopic allergies because they are caused by a nonordinary response of the immune system.
The allergic tendency is genetically passed from parent to child and is characterized by the presence of large quantities of IgE antibodies in the blood. These antibodies are called reagins or sensitizing antibodies to distinguish them from the more common IgG antibodies.

Histamine Protease Slow-reacting substance of anaphylaxis (a mixture of toxic leukotrienes) Eosinophil chemotactic substance Neutrophil chemotactic substance Heparin Platelet-activating factors Effects of Released Substances These substances cause effects such as:
Dilation of the local blood vessels Attraction of eosinophils and neutrophils to the reactive site Increased permeability of the capillaries with loss of fluid into the tissues Contraction of local smooth muscle cells Anaphylaxis — Widespread Allergic Reaction When a specific allergen is injected directly into the circulation, the allergen can react with basophils of the blood and mast cells in the tissues located immediately outside the small blood vessels if the basophils and mast cells have been sensitized by the attachment of IgE reagins.
Therefore, a widespread allergic reaction occurs throughout the vascular system and closely associated tissues. This reaction is called anaphylaxis.
Role of Histamine Histamine is released into the circulation and causes body-wide vasodilation, as well as increased permeability of the capillaries, with a resultant marked loss of plasma from the circulation.
Occasionally, a person who experiences this reaction dies of circulatory shock within a few minutes unless treated with epinephrine to counteract the effects of the histamine.
Role of Leukotrienes Also released from the activated basophils and mast cells is a mixture of leukotrienes called slow-reacting substance of anaphylaxis.
These leukotrienes can cause spasm of the smooth muscle of the bronchioles, eliciting an asthma-like attack and sometimes causing death by suffocation.
Urticaria — Localized Anaphylactoid Reactions Urticaria results from antigen entering specific skin areas and causing localized anaphylactoid reactions.
Histamine released locally causes:
Vasodilation that induces an immediate red flare Increased local permeability of the capillaries that leads to local circumscribed areas of swelling of the skin within another few minutes The swellings are commonly called hives.
Administration of antihistamine drugs to a person before exposure will prevent the hives.
Hay Fever In hay fever, the allergen-reagin reaction occurs in the nose.
Histamine released in response to the reaction causes local intranasal vascular dilation, with resultant increased capillary pressure and increased capillary permeability.
Both these effects cause rapid fluid leakage into the nasal cavities and into associated deeper tissues of the nose. The nasal linings become swollen and secretory.
Here again, the use of antihistamine drugs can prevent this swelling reaction.
Asthma Asthma often occurs in the hypersensitive allergic person. In these individuals, the allergen-reagin reaction occurs in the bronchioles of the lungs.
Here, an important product released from the mast cells is believed to be the slow-reacting substance of anaphylaxis (a mixture of three leukotrienes), which causes spasm of the bronchiolar smooth muscle.
Consequently, the person has difficulty breathing until the reactive products of the allergic reaction have been removed.
The administration of antihistamine medication has less effect on the course of asthma because histamine does not appear to be the major factor eliciting the asthmatic reaction.

                     data-content="RESPIRATORY INSUFFICIANCE — PATHOPHYSIOLOGY The previous chapters discussed several methods for studying respiratory abnormalities, including:
Vital capacity Tidal air Functional residual capacity Dead space Physiologic shunt Physiological dead space This array of measurements is only part of the clinical pulmonary physiologist’s tools.
MAXIMUM EXPIRATORY FLOW In many respiratory diseases, particularly asthma, resistance to airflow becomes especially great during expiration.
This sometimes causes tremendous difficulty in breathing.
Concept of Maximum Expiratory Flow When a person expires with great force, the expiratory airflow reaches a maximum flow.
This maximum flow cannot be increased even with greatly increased additional force.
The maximum expiratory flow is much greater when the lungs are filled with a large volume of air than when they are almost empty.
Mechanism of Flow Limitation Figure 43-1A shows the effect of increased pressure applied to the outsides of the alveoli and air passageways when the chest cage is compressed.
The arrows indicate that the same pressure compresses the outsides of the alveoli and bronchioles.
Therefore, this pressure:
Forces air from the alveoli toward the bronchioles Tends to collapse the bronchioles at the same time Once the bronchioles have almost completely collapsed, further expiratory force can still increase the alveolar pressure greatly.
However, it also increases the degree of bronchiolar collapse and airway resistance by an equal amount.
This prevents further increase in flow.
Effect of Lung Volume on Maximum Expiratory Flow Figure 43-1B shows the effect of different degrees of lung collapse (and therefore also of bronchiolar collapse) on the maximum expiratory flow.
The curve recorded shows the maximum expiratory flow at all levels of lung volume.
This occurs after a healthy person:
First inhales as much air as possible Then expires with maximum expiratory effort until no greater rate can be achieved Note that the person quickly reaches a maximum expiratory airflow of more than 400 L/min.
Regardless of how much additional expiratory effort the person exerts, this is still the maximum flow rate that can be achieved.
As the lung volume becomes smaller, the maximum expiratory flow rate also becomes less.
Reason for this phenomenon:
In the enlarged lung, the bronchi and bronchioles are held open partially by elastic pull on their outsides by lung structural elements As the lung becomes smaller, these structures are relaxed The bronchi and bronchioles are collapsed more easily by external chest pressure This progressively reduces the maximum expiratory flow rate as lung volume decreases ABNORMALITIES OF THE MAXIMUM EXPIRATORY FLOW-VOLUME CURVE Figure 43-2 shows the normal maximum expiratory flow-volume curve.
It also shows two additional flow-volume curves recorded in two types of lung diseases:
Constricted lungs Partial airway obstruction Constricted Lungs Constricted lungs have:
Reduced total lung capacity (TLC) Reduced residual volume (RV) Furthermore, because the lung cannot expand to a normal maximum volume, even with the greatest possible expiratory effort, the maximal expiratory flow cannot rise to equal that of the normal curve.
Constricted lung diseases include:
Fibrotic diseases of the lung (tuberculosis, silicosis) Diseases that constrict the chest cage (kyphosis, scoliosis, fibrotic pleurisy) Airway Obstruction In diseases with airway obstruction, it is usually much more difficult to expire than to inspire.
This is because the closing tendency of the airways is greatly increased by the extra positive pressure required in the chest to cause expiration.
By contrast, the extra negative pleural pressure that occurs during inspiration actually “pulls” the airways open at the same time.
"></div><div data-title="Rhythmical Excitation of the Heart"

                     data-content="CONDUCTIVE SYSTEM OF THE HEART Figure 10-1 shows the specialized excitatory and conductive system of the heart that controls cardiac contractions.
The figure shows:
The sinus node (also called sinoatrial [S-A] node), in which the normal rhythmical impulses are generated The internodal pathways that conduct impulses from the sinus node to the atrioventricular (A-V) node The A-V node, in which impulses from the atria are delayed before passing into the ventricles The A-V bundle, which conducts impulses from the atria into the ventricles The left and right bundle branches of Purkinje fibers, which conduct the cardiac impulses to all parts of the ventricles SINUS (SINOATRIAL) NODE The sinus node is a small, flattened, ellipsoid strip of specialized cardiac muscle about 3 mm wide, 15 mm long, and 1 mm thick.
It is located in the superior posterolateral wall of the right atrium immediately below and slightly lateral to the opening of the superior vena cava.
The fibers of this node have almost no contractile muscle filaments and are each only 3 to 5 micrometers (μm) in diameter.
This is in contrast to a diameter of 10 to 15 μm for the surrounding atrial muscle fibers.
The sinus nodal fibers connect directly with the atrial muscle fibers, so that any action potential that begins in the sinus node spreads immediately into the atrial muscle wall.
AUTOMATIC ELECTRICAL RHYTHMICITY OF THE SINUS FIBERS Some cardiac fibers have the capability of self-excitation, a process that can cause automatic rhythmical discharge and contraction.
This capability is especially true of the heart’s specialized conducting system, including fibers of the sinus node.
For this reason, the sinus node ordinarily controls the beat rate of the entire heart.
MECHANISM OF SINUS NODAL RHYTHMICITY Figure 10-2 shows action potentials recorded from inside a sinus nodal fiber for three heartbeats and, by comparison, a single ventricular muscle fiber action potential.
Note that the resting membrane potential of the sinus nodal fiber between discharges is about –55 to –60 millivolts.
This is in comparison with –85 to –90 millivolts for the ventricular muscle fiber.
The cause of this lower negativity is that the cell membranes of the sinus fibers are naturally leaky to sodium and calcium ions.
Positive charges of the entering sodium and calcium ions neutralize some of the intracellular negativity.
Before we explain the rhythmicity of the sinus nodal fibers, recall from the discussions of Chapters 5 and 9 that cardiac muscle has three main types of membrane ion channels that play important roles in causing the voltage changes of the action potential:
Fast sodium channels Calcium channels (particularly L-type or “slow” calcium channels) Potassium channels Ventricular Muscle Action Potential Opening of the fast sodium channels for a few 10,000ths of a second is responsible for the rapid upstroke spike of the action potential observed in ventricular muscle because of rapid influx of positive sodium ions to the interior of the fiber.
Then, the plateau of the ventricular action potential is caused primarily by slower opening of the slow sodium-calcium channels, which lasts for about 0.3 second.
Finally, opening of potassium channels allows for the diffusion of large amounts of positive potassium ions in the outward direction through the fiber membrane and returns the membrane potential to its resting level.
Sinus Nodal Fiber Differences However, there is a difference in the function of these channels in the sinus nodal fiber because the resting potential is much less negative—only –55 millivolts in the nodal fiber instead of the –90 millivolts in the ventricular muscle fiber.
At this level of –55 millivolts, the fast sodium channels mainly have already become inactivated, or blocked.
This is because any time the membrane potential remains less negative than about –55 millivolts for more than a few milliseconds, the inactivation gates on the inside of the cell membrane that close the fast sodium channels become closed and remain so.
Therefore, only the slow sodium-calcium channels can open (i.e., can become activated) and thereby cause the action potential.
As a result, the atrial nodal action potential is slower to develop than the action potential of the ventricular muscle.
Also, after the action potential does occur, return of the potential to its negative state occurs slowly as well, rather than the abrupt return that occurs for the ventricular fiber.
LEAKINESS OF SINUS NODAL FIBERS TO SODIUM AND CALCIUM CAUSES SELF-EXCITATION Because of the high sodium ion concentration in the extracellular fluid outside the nodal fiber, as well as a moderate number of already open sodium channels, positive sodium ions from outside the fibers normally tend to leak to the inside through inward, “funny” currents.
Therefore, between heartbeats, the influx of positively charged sodium ions causes a slow rise in the resting membrane potential in the positive direction.
Thus, as shown in Figure 10-2, the resting potential gradually rises and becomes less negative between each two heartbeats.
When the potential reaches a threshold voltage of about –40 millivolts, the L-type calcium channels become activated, thus causing the action potential.
Therefore, basically, the inherent leakiness of the sinus nodal fibers to sodium and calcium ions causes their self-excitation.
TERMINATION OF THE ACTION POTENTIAL Why does this leakiness to sodium and calcium ions not cause the sinus nodal fibers to remain depolarized all the time?
Two events occur during the course of the action potential to prevent such a constant state of depolarization:
The L-type calcium channels become inactivated (i.e., they close) within about 100 to 150 milliseconds after opening At about the same time, greatly increased numbers of potassium channels open Therefore, influx of positive calcium and sodium ions through the L-type calcium channels ceases.
At the same time, large quantities of positive potassium ions diffuse out of the fiber.
Both these effects reduce the intracellular potential back to its negative resting level and therefore terminate the action potential.
Furthermore, the potassium channels remain open for another few tenths of a second, temporarily continuing movement of positive charges out of the cell, with resultant excess negativity inside the fiber.
This process is called hyperpolarization.
The hyperpolarization state initially carries the resting membrane potential down to about –55 to –60 millivolts at the termination of the action potential.
RETURN TO RESTING POTENTIAL Why is this new state of hyperpolarization not maintained forever?
The reason is that during the next few tenths of a second after the action potential is over, progressively more and more potassium channels close.
The inward-leaking sodium (“funny” current) and calcium ions once again overbalance the outward flux of potassium ions.
This causes the resting potential to drift back toward the threshold level, and the process repeats.
REFERENCES Fukada K, Kanazawa H, Aizawa Y, et al: Cardiac innervation and sudden cardiac death. Circ Res 116: 2005, 2015.

                     data-permalink="/guyton/guyton/ch19_role-of-the-kidneys-in-long-term-control-of-arterial-pressure-and-in-hypertensio/"
                     data-content="ARTERIAL PRESSURE REGULATION: AN INTEGRATED SYSTEM It is clear that arterial pressure is regulated not by a single pressure controlling system but by several interrelated systems, each of which performs a specific function.
When a person bleeds severely and the pressure falls suddenly, two problems confront the pressure control system:
Survival — The arterial pressure must be rapidly returned to a high enough level that the person can live through the acute episode. Restoration — The blood volume and arterial pressure must eventually return to their normal levels so the circulatory system can re-establish full normality. The Hierarchy of Pressure Control Chapter 18 established that the first line of defense against acute changes in arterial pressure is the nervous control system. This chapter emphasizes a second line of defense achieved mainly by kidney mechanisms for long-term control.
However, there are other pieces to the puzzle. Figure 19-16 helps put these pieces together.
ARTERIAL PRESSURE CONTROL MECHANISMS: OVERVIEW Figure 19-16 shows the approximate immediate (seconds and minutes) and long-term (hours and days) control responses, expressed as feedback gain, of eight arterial pressure control mechanisms.
These mechanisms can be divided into three groups:
Time Frame Mechanisms Rapid (seconds or minutes) Baroreceptor feedback, CNS ischemic mechanism, Chemoreceptor mechanism Intermediate (minutes or hours) Renin-angiotensin vasoconstrictor, Stress relaxation, Capillary fluid shift Long-term (days, months, years) Renal-body fluid pressure control RAPID PRESSURE CONTROL MECHANISMS (Seconds or Minutes) The rapidly acting pressure control mechanisms are almost entirely acute nervous reflexes or other autonomic nervous system responses.
After any acute fall in pressure (as might be caused by severe hemorrhage), the nervous mechanisms combine to cause:
Constriction of the veins and transfer of blood into the heart Increased heart rate and contractility to provide greater pumping capability Constriction of most peripheral arterioles All these effects occur almost instantly to raise the arterial pressure back into a survival range.
When the pressure suddenly rises too high (as might occur in response to a rapid transfusion of excess blood), the same control mechanisms operate in the reverse direction, again returning the pressure toward normal.
INTERMEDIATE PRESSURE CONTROL MECHANISMS (Many Minutes) Several pressure control mechanisms exhibit significant responses only after a few minutes following an acute arterial pressure change.
1. Renin-Angiotensin Vasoconstrictor Mechanism The renin-angiotensin vasoconstrictor system provides a semi-acute means for increasing arterial pressure when necessary.
2. Stress Relaxation When the pressure in the blood vessels becomes too high, they become stretched more and more for minutes or hours. As a result, the pressure in the vessels falls toward normal. This continuing stretch of the vessels — called stress relaxation — serves as an intermediate-term pressure “buffer.”
3. Capillary Fluid Shift Mechanism The capillary fluid shift mechanism means simply that:
When capillary pressure falls too low, fluid is absorbed from the tissues through the capillary membranes and into the circulation, building up blood volume and increasing pressure. When capillary pressure rises too high, fluid is lost out of the circulation into the tissues, reducing blood volume and virtually all pressures throughout the circulation. These three intermediate mechanisms mostly become activated within 30 minutes to several hours. During this time, the nervous mechanisms usually become less and less effective — illustrating the importance of these non-nervous, intermediate-term pressure control measures.
LONG-TERM MECHANISMS FOR ARTERIAL PRESSURE REGULATION The goal of this chapter has been to explain the role of the kidneys in long-term control of arterial pressure. To the far right in Figure 19-16 is shown the renal-blood volume pressure control mechanism — the same as the renal-body fluid pressure control mechanism.
This mechanism takes a few hours to begin showing significant response. Yet, it eventually develops a feedback gain for control of arterial pressure that is nearly equal to infinity. This means that this mechanism can eventually return the arterial pressure nearly all the way back — not merely partway back — to the pressure level that provides normal output of salt and water by the kidneys.
Aldosterone Interaction Many factors can affect the pressure-regulating level of the renal-body fluid mechanism. One of these is aldosterone.
A decrease in arterial pressure leads within minutes to an increase in aldosterone secretion. Over the next hour or days, this effect plays an important role in modifying the pressure control characteristics of the renal-body fluid mechanism.
Importance of the Renin-Angiotensin-Aldosterone System Especially important is the interaction of the renin-angiotensin system with the aldosterone and renal fluid mechanisms.
For example, a person’s salt intake varies tremendously from one day to another. Salt intake can decrease to as little as one-tenth normal or can increase to 10 to 15 times normal — and yet the regulated level of the mean arterial pressure will change only a few mm Hg if the renin-angiotensin-aldosterone system is fully operative.
However, without a functional renin-angiotensin-aldosterone system, blood pressure becomes very sensitive to changes in salt intake.
Summary: Integrated Pressure Control Arterial pressure control begins with the life-saving measures of the nervous pressure controls. Then it continues with the sustaining characteristics of the intermediate pressure controls. Finally, it is stabilized at the long-term pressure level by the renal-body fluid mechanism.
This long-term mechanism has multiple interactions with:
The renin-angiotensin-aldosterone system The nervous system Several other factors that provide special blood pressure control capabilities for special purposes Figure 19-16. Approximate potency of various arterial pressure control mechanisms at different time intervals after the onset of a disturbance to the arterial pressure. Note especially the near-infinite gain (∞) of the renal-body fluid pressure control mechanism that occurs after a few weeks’ time. CNS, Central nervous system.
