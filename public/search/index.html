                     data-content="OF ACTION General Principles of Diuretic Action Diuretics increase the rate of urine volume output, as the name implies.
Most diuretics also increase the urinary excretion of solutes, especially sodium and chloride. In fact, most diuretics that are used clinically act by decreasing renal tubular sodium reabsorption.
This causes natriuresis (increased sodium output), which in turn causes diuresis (increased water output). Increased water excretion occurs secondary to inhibition of tubular sodium reabsorption because sodium remaining in the tubules acts osmotically to decrease water reabsorption.
Because renal tubular reabsorption of many solutes, such as potassium, chloride, magnesium, and calcium, is also influenced secondarily by sodium reabsorption, many diuretics raise the renal excretion of these solutes as well.
Clinical Uses of Diuretics The most common clinical use of diuretics is to reduce extracellular fluid volume, especially in diseases associated with edema and in hypertension.
As discussed in Chapter 25, loss of sodium from the body mainly decreases extracellular fluid volume. Therefore, diuretics are usually administered in clinical conditions in which extracellular fluid volume is expanded.
Magnitude of Diuretic Effect Some diuretics can increase urine output more than 20-fold within a few minutes after they are administered.
However, the effect of most diuretics on renal output of salt and water subsides within a few days due to activation of compensatory mechanisms initiated by decreased extracellular fluid volume (Figure 32-1).
A decrease in extracellular fluid volume may reduce arterial pressure and glomerular filtration rate (GFR). It may also increase renin secretion and angiotensin II (Ang II) formation.
All these responses together eventually override the chronic effects of the diuretic on urine output. Thus, in the steady state, urine output becomes equal to intake, but only after reductions in arterial pressure and extracellular fluid volume have occurred.
This relieves the hypertension or edema that prompted the use of diuretics in the first place.
Tubular Sites of Diuretic Action The many diuretics available for clinical use have different mechanisms of action. They inhibit tubular reabsorption at different sites along the renal nephron.
The general classes of diuretics, their mechanisms of action, and their tubular sites of action are shown in Table 32-1.
Osmotic Diuretics Mechanism of Action Injection of substances into the blood stream that are filtered by the glomerular capillaries but are not easily reabsorbed by the renal tubules—such as urea, mannitol, and sucrose—causes a marked increase in the concentration of osmotically active molecules in the tubules.
The osmotic pressure of these solutes then reduces water reabsorption, flushing large quantities of tubular fluid into the urine.
Clinical Example: Diabetes Mellitus Large volumes of urine are also formed in certain diseases associated with excess solutes that fail to be reabsorbed from the tubular fluid.
For example, when blood glucose concentration rises to high levels in diabetes mellitus, the increased filtered load of glucose into the tubules exceeds their capacity to reabsorb glucose (i.e., exceeds their transport maximum for glucose).
Above a plasma glucose concentration of about 250 mg/dl, little of the extra glucose is reabsorbed by the tubules. Instead, the excess glucose remains in the tubules, acts as an osmotic diuretic, and increases urine flow rate.
Therefore, one of the hallmarks of uncontrolled diabetes mellitus is polyuria (frequent urination). This is balanced by a high level of fluid intake (polydipsia) secondary to dehydration, increased extracellular fluid osmolarity, and activation of the thirst mechanism.
Loop Diuretics Mechanism of Action Furosemide, ethacrynic acid, and bumetanide are powerful diuretics that decrease reabsorption in the thick ascending limb of the loop of Henle. They block the 1-sodium, 2-chloride, 1-potassium co-transporter located in the luminal membrane of the epithelial cells (see Figure 28-9).
These loop diuretics are among the most powerful of the clinically used diuretics.
Effects on Electrolyte Excretion By blocking sodium-chloride-potassium co-transport in the luminal membrane of the loop of Henle, the loop diuretics increase urine output of sodium, chloride, potassium, and other electrolytes, as well as water.
This occurs for two reasons:
They greatly increase the quantities of solutes delivered to the distal parts of the nephrons, and these solutes act as osmotic agents to prevent water reabsorption. They disrupt the countercurrent multiplier system by decreasing absorption of ions from the loop of Henle into the medullary interstitium, thereby decreasing the osmolarity of the medullary interstitial fluid. Effects on Urine Concentration and Dilution Therefore, loop diuretics impair the ability of the kidneys to concentrate or dilute the urine.
Urinary dilution is impaired because the inhibition of sodium and chloride reabsorption in the loop of Henle causes more of these ions to be excreted, along with increased water excretion.
Urine concentrating ability is impaired because the renal medullary interstitial fluid concentration of these ions, and therefore renal medullary osmolarity, is reduced. Consequently, reabsorption of fluid from the collecting ducts is decreased, so the maximal concentrating ability of the kidneys is also greatly reduced.
In addition, decreased renal medullary interstitial fluid osmolarity reduces reabsorption of water from the descending loop of Henle.
Because of these multiple effects, 20% to 30% of the glomerular filtrate may be delivered into the urine. Under acute conditions, urine output may be as great as 25 times normal for at least a few minutes.
Thiazide Diuretics Mechanism of Action The thiazide derivatives, such as chlorothiazide, act mainly on the early distal tubules. They block the sodium-chloride co-transporter in the luminal membrane of the tubular cells (see Figure 28-10).
Under favorable conditions, these agents may cause a maximum of 5% to 10% of the glomerular filtrate to pass into the urine. This is about the same amount of sodium normally reabsorbed by the distal tubules.
Carbonic Anhydrase Inhibitors Mechanism of Action Acetazolamide inhibits the enzyme carbonic anhydrase, which is critical for reabsorption of bicarbonate (HCO3−) in the renal tubules, as discussed in Chapter 31.
Carbonic anhydrase is especially abundant in the proximal tubule, the primary site of action of carbonic anhydrase inhibitors. Some carbonic anhydrase is also present in other tubular cells, such as in the intercalated cells of the collecting tubule.
Diuretic Compensatory Mechanisms When diuretics are administered, several compensatory mechanisms are activated:
Parameter Effect of Diuretic Extracellular fluid volume Decreases Arterial pressure Decreases Glomerular filtration rate (GFR) Decreases Renin secretion Increases Angiotensin II formation Increases Sodium excretion Initially increases, then returns to intake level Figure 32-1. Sodium excretion and extracellular fluid volume during diuretic administration. The immediate increase in sodium excretion is accompanied by a decrease in extracellular fluid volume. If sodium intake is held constant, compensatory mechanisms will eventually return sodium excretion to equal sodium intake, thus re-establishing sodium balance.
Summary of Diuretic Classes Class of Diuretic (examples) Mechanism of Action Tubular Site of Action Osmotic diuretics (mannitol) Inhibit water and solute reabsorption by increasing osmolarity of tubular fluid Mainly proximal tubules Loop diuretics (furosemide, bumetanide) Inhibit Na⁺-K⁺-Cl⁻ co-transport in luminal membrane Thick ascending loop of Henle Thiazide diuretics (hydrochlorothiazide, chlorthalidone) Inhibit Na⁺-Cl⁻ co-transport in luminal membrane Early distal tubules Carbonic anhydrase inhibitors (acetazolamide) Inhibit H⁺ secretion and HCO₃⁻ reabsorption, which reduces Na⁺ reabsorption Mainly proximal tubules Aldosterone antagonists (spironolactone, eplerenone) Inhibit action of aldosterone on tubular receptor, decrease Na⁺ reabsorption, decrease K⁺ secretion Collecting tubules Sodium channel blockers (triamterene, amiloride) Block entry of Na⁺ into Na⁺ channels of luminal membrane, decrease Na⁺ reabsorption, decrease K⁺ secretion Collecting tubules "></div><div data-title="Adrenocortical Hormones"

                     data-content="INSULIN AND ITS METABOLIC EFFECTS Insulin was first isolated from the pancreas in 1922 by Banting and Best, and almost overnight rescued patients with severe cases of diabetes mellitus from a rapid decline in health and early death.
Historically, insulin has been associated with “blood sugar,” and true enough, insulin has profound effects on carbohydrate metabolism.
However, abnormalities of fat metabolism that cause conditions such as acidosis and arteriosclerosis are also important causes of morbidity and death in patients with diabetes mellitus.
Patients with prolonged, untreated diabetes have diminished ability to synthesize proteins, which leads to wasting of the tissues and many cellular functional disorders.
Therefore, it is clear that insulin affects fat and protein metabolism almost as much as it affects carbohydrate metabolism.
INSULIN IS A HORMONE ASSOCIATED WITH ENERGY ABUNDANCE When a person’s diet includes a great abundance of foods that provide energy, especially excess amounts of carbohydrates, insulin secretion increases.
In turn, the insulin plays an important role in storing the excess energy.
In the case of excess carbohydrates, it causes them to be stored as glycogen, mainly in the liver and muscles.
Furthermore, all the excess carbohydrates that cannot be stored as glycogen are converted under the stimulus of insulin into fats and stored in adipose tissue.
In the case of proteins, insulin has a direct effect in promoting amino acid uptake by cells and conversion of these amino acids into protein.
In addition, it inhibits breakdown of proteins that are already in the cells.
INSULIN CHEMISTRY AND SYNTHESIS Human insulin, which has a molecular weight of 5808, is composed of two amino acid chains that are connected to each other by disulfide linkages.
When the two amino acid chains are split apart, insulin’s functional activity is lost.
Insulin Synthesis Pathway Insulin is synthesized in beta cells by the usual cell machinery for protein synthesis, beginning with translation of the insulin RNA by ribosomes attached to the endoplasmic reticulum to form preproinsulin.
This initial preproinsulin has a molecular weight of about 11,500, but it is then cleaved in the endoplasmic reticulum to form a proinsulin with a molecular weight of about 9000.
Proinsulin consists of three chains of peptides: A, B, and C.
Most of the proinsulin is further cleaved in the Golgi apparatus to form insulin, which is composed of the A and B chains connected by disulfide linkages, and the C chain peptide, called connecting peptide (C peptide).
The insulin and C peptide are packaged in secretory granules and secreted in equimolar amounts.
About 5% to 10% of the final secreted product is still in the form of proinsulin.
C Peptide Function The proinsulin and C peptide have virtually no insulin activity.
However, C peptide binds to a membrane structure, most likely a G protein–coupled membrane receptor, and elicits activation of at least two enzyme systems:
Sodium-potassium adenosine triphosphatase Endothelial nitric oxide synthase Although both of these enzymes have multiple physiological functions, the importance of C peptide in regulating these enzymes is still uncertain.
C Peptide Clinical Use C peptide levels can be measured by radioimmunoassay in insulin-treated diabetic patients to determine how much of their own natural insulin they are still producing.
Patients with type 1 diabetes who are unable to produce insulin will usually also have greatly decreased levels of C peptide.
Insulin Clearance When insulin is secreted into the blood, it circulates almost entirely in an unbound form.
Because it has a plasma half-life that averages only about 6 minutes, it is mainly cleared from the circulation within 10 to 15 minutes.
Except for the portion of the insulin that combines with receptors in the target cells, the insulin is degraded by the enzyme insulinase mainly in the liver, to a lesser extent in the kidneys and muscles, and slightly in most other tissues.
This rapid removal from the plasma is important because, at times, it is as important to rapidly turn off the control functions of insulin as it is to turn them on.
ACTIVATION OF TARGET CELL RECEPTORS BY INSULIN To initiate its effects on target cells, insulin must first bind with and activate a membrane receptor protein that has a molecular weight of about 300,000.
Insulin Receptor Structure The insulin receptor is a combination of four subunits held together by disulfide linkages:
Two alpha subunits that lie entirely outside the cell membrane Two beta subunits that penetrate through the membrane, protruding into the cell cytoplasm Insulin binds with the alpha subunits on the outside of the cell.
Because of the linkages with the beta subunits, portions of the beta subunits protruding into the cell become autophosphorylated.
Thus, the insulin receptor is an example of an enzyme-linked receptor.
Receptor Signaling Cascade Autophosphorylation of the beta subunits of the receptor activates a local tyrosine kinase.
This in turn causes phosphorylation of multiple other intracellular enzymes, including a group called insulin-receptor substrates (IRS).
Different types of IRS (e.g., IRS-1, IRS-2, and IRS-3) are expressed in different tissues.
The net effect is to activate some of these enzymes while inactivating others.
In this way, insulin directs the intracellular metabolic machinery to produce the desired effects.
Insulin Synthesis and Secretion Summary Step Location Process Preproinsulin synthesis Endoplasmic reticulum Ribosomes translate insulin mRNA Proinsulin formation Endoplasmic reticulum Signal peptide cleaved Proinsulin processing Golgi apparatus C peptide cleaved, granules formed Insulin secretion Secretory granules Equimolar insulin &#43; C peptide released METABOLIC EFFECTS OF INSULIN Effects on Glucose Uptake Insulin promotes glucose uptake by stimulating the translocation of GLUT4 glucose transporters to the cell membrane.
This is particularly important in skeletal muscle and adipose tissue.
Effects on Glycogen Synthesis Insulin activates glycogen synthase, promoting glycogen synthesis in liver and muscle.
It also inhibits glycogen phosphorylase, preventing glycogen breakdown.
Effects on Lipid Metabolism Insulin promotes lipogenesis (fat synthesis) in adipose tissue and liver.
It inhibits lipolysis (fat breakdown) in adipose tissue.
Effects on Protein Metabolism Insulin promotes amino acid uptake and protein synthesis in skeletal muscle and other tissues.
It inhibits protein catabolism.
Insulin vs Glucagon Summary Function Insulin Effect Glucagon Effect Blood glucose Lowers Raises Glycogen synthesis Stimulates Inhibits Glycogenolysis Inhibits Stimulates Gluconeogenesis Inhibits Stimulates Lipolysis Inhibits Stimulates Lipogenesis Stimulates Inhibits Protein synthesis Stimulates Inhibits Protein breakdown Inhibits Stimulates PANCREATIC ISLET STRUCTURE The pancreatic islets (islets of Langerhans) contain several cell types:
Cell Type Percentage Secretion Beta cells 60-70% Insulin Alpha cells 20-25% Glucagon Delta cells 5-10% Somatostatin F cells/PP cells &lt;5% Pancreatic polypeptide Each islet is supplied with capillaries and innervated by autonomic nerve fibers.

                     data-content="—## GLUCOCORTICOIDS, AND ANDROGENS Two major types of adrenocortical hormones, the mineralocorticoids and the glucocorticoids, are secreted by the adrenal cortex. In addition to these hormones, small amounts of sex hormones are secreted, especially androgenic hormones, which exhibit about the same effects in the body as the male sex hormone testosterone. They are normally of only slight importance, although in certain abnormalities of the adrenal cortices, extreme quantities can be secreted (which is discussed later in the chapter) and can result in masculinizing effects. The mineralocorticoids gained this name because they especially affect the electrolytes (the “minerals”) of the extracellular fluids, especially sodium and potassium. The glucocorticoids gained their name because they exhibit important effects that increase blood glucose concentration. They have additional effects on protein and fat metabolism that are equally as important to body function as their effects on carbohydrate metabolism. More than 30 steroids have been isolated from the adrenal cortex, but two are of exceptional importance to the normal endocrine function of the human body: aldosterone, which is the principal mineralocorticoid, and cortisol, which is the principal glucocorticoid. SYNTHESIS AND SECRETION OF ## THE ADRENAL CORTEX HAS THREE DISTINCT LAYERS &gt; Figure 78-1 shows that the adrenal cortex is composed of three relatively distinct layers: 1. The zona glomerulosa, a thin layer of cells that lies just underneath the capsule, constitutes about 15% of the adrenal cortex. These cells are the only ones in the adrenal gland capable of secreting significant amounts of aldosterone because they contain the enzyme aldosterone synthase, which is necessary for synthesis of aldosterone. The secretion of these cells Adrenocortical Hormones Cortisol and androgens Magnified section Zona glomerulosa aldosterone Zona fasciculata Zona reticularis Cortex Medulla (catecholamines) &gt; Figure 78-1. Secretion of adrenocortical hormones by the different zones of the adrenal cortex and secretion of catecholamines by the adrenal medulla. UNIT XIV Endocrinology and Reproduction is controlled mainly by the extracellular fluid concentrations of angiotensin II and potassium, both of which stimulate aldosterone secretion. 2. The zona fasciculata, the middle and widest zone, constitutes about 75% of the adrenal cortex and secretes the glucocorticoids cortisol and corticosterone, as well as small amounts of adrenal androgens and estrogens. The secretion of these cells is controlled in large part by the hypothalamic-pituitary axis via adrenocorticotropic hormone (ACTH). 3. The zona reticularis, the inner zone of the cortex, secretes the adrenal androgens dehydroepiandrosterone and androstenedione, as well as small amounts of estrogens and some glucocorticoids. ACTH also regulates secretion of these cells, although other factors such as cortical androgen-stimulating hormone, released from the pituitary, may also be involved. The mechanisms for controlling adrenal androgen production, however, are not nearly as well understood as those for glucocorticoids and mineralocorticoids. Aldosterone and cortisol secretion are regulated by independent mechanisms. Factors such as angiotensin II that specifically increase the output of aldosterone and cause hypertrophy of the zona glomerulosa have no effect on the other two zones. Similarly, factors such as ACTH that increase secretion of cortisol and adrenal androgens and cause hypertrophy of the zona fasciculata and zona reticularis have little effect on the zona glomerulosa. Adrenocortical Hormones Are Steroids Derived From Cholesterol. All human steroid hormones, including those produced by the adrenal cortex, are synthesized from cholesterol. Although the cells of the adrenal cortex can synthesize de novo small amounts of cholesterol from acetate, approximately 80% of the cholesterol used for steroid synthesis is provided by low-density lipoproteins (LDLs) in the circulating plasma. The LDLs, which have high concentrations of cholesterol, diffuse from the plasma into the interstitial fluid and attach to specific receptors contained in structures called coated pits on the adrenocortical cell membranes. The coated pits are then internalized by endocytosis, forming vesicles that eventually fuse with cell lysosomes and release cholesterol that can be used to synthesize adrenal steroid hormones. Transport of cholesterol into the adrenal cells is regulated by feedback mechanisms that can markedly alter the amount available for steroid synthesis. For example, ACTH, which stimulates adrenal steroid synthesis, increases the number of adrenocortical cell receptors for LDL, as well as the activity of enzymes that liberate cholesterol from LDL. Once the cholesterol enters the cell, it is delivered to the mitochondria, where it is cleaved by the enzyme cholesterol desmolase to form pregnenolone; this is the rate-limiting step in the eventual formation of adrenal steroids (Figure 78-2). In all three zones of the adrenal cortex, this initial step in steroid synthesis is stimulated by the different factors that control secretion of the major hormone products aldosterone and cortisol. For example, both ACTH, which stimulates cortisol secretion, and angiotensin II, which stimulates aldosterone secretion, increase conversion of cholesterol to pregnenolone. Synthetic Pathways for Adrenal Steroids. Figure 78-2 gives the principal steps in the formation of the important steroid products of the adrenal cortex: aldosterone, cortisol, and the androgens. Essentially all these steps occur in two of the organelles of the cell, the mitochondria and the endoplasmic reticulum, with some steps occurring in one of these organelles and some in the other. Each step is catalyzed by a specific enzyme system. A change in even a single enzyme in the schema can cause vastly different types and relative proportions of hormones to be formed. For example, very large quantities of masculinizing sex hormones or other steroid compounds not normally present in the blood can occur with altered activity of only one of the enzymes in this pathway. The chemical formulas of aldosterone and cortisol, which are the major mineralocorticoid and glucocorticoid hormones, respectively, are shown in Figure 78-2. Cortisol has a keto oxygen on carbon number 3 and is hydroxylated at carbon numbers 11 and 21. The mineralocorticoid aldosterone has an oxygen atom bound at the number 18 carbon. In addition to aldosterone and cortisol, other steroids having glucocorticoid or mineralocorticoid activities, or both, are normally secreted in small amounts by the adrenal cortex. Furthermore, several additional potent steroid hormones not normally formed in the adrenal glands have been synthesized and are used in various forms of therapy. Some of the more important of the corticosteroid hormones, including the synthetic ones, are the following, as summarized in Table 78-1. Mineralocorticoids • Aldosterone (very potent; accounts for ≈90% of all mineralocorticoid activity) • Deoxycorticosterone (1/30 as potent as aldosterone, but very small quantities are secreted) • Corticosterone (slight mineralocorticoid activity) • 9αFluorocortisol (synthetic; slightly more potent than aldosterone) • Cortisol (slight mineralocorticoid activity, but a large quantity is secreted) • Cortisone (slight mineralocorticoid activity) Glucocorticoids • Cortisol (very potent; accounts for ≈95% of all glucocorticoid activity) • Corticosterone (provides ≈4% of total glucocorticoid activity, but is much less potent than cortisol) • Cortisone (almost as potent as cortisol) • Prednisone (synthetic; four times as potent as cortisol) • Methylprednisone (synthetic; five times as potent as cortisol) • Dexamethasone (synthetic; 30 times as potent as cortisol) It is clear from this list that some of these hormones and synthetic steroids have both glucocorticoid and mineralocorticoid activities. It is especially significant that cortisol normally has some mineralocorticoid activity, because some syndromes of excess cortisol secretion can cause significant mineralocorticoid effects, along with its much more potent glucocorticoid effects. The intense glucocorticoid activity of the synthetic hormone dexamethasone, which has almost zero mineralocorticoid activity, makes it an especially important drug for stimulating specific glucocorticoid activity.

                     data-content="BAROMETRIC PRESSURES AT DIFFERENT ALTITUDES As altitude increases, barometric pressure decreases.
This decrease in barometric pressure is the basic cause of all the hypoxia problems in high-altitude physiology.
As the barometric pressure decreases, the atmospheric oxygen partial pressure (PO2) decreases proportionately.
It remains at all times slightly less than 21% of the total barometric pressure.
Barometric and Oxygen Pressures at Different Altitudes Altitude (ft) Barometric Pressure (mm Hg) PO2 in Air (mm Hg) Sea level 760 159 10,000 523 110 20,000 349 73 30,000 226 47 40,000 141 29 50,000 87 18 At sea level, PO2 is about 159 mm Hg.
At 50,000 feet, PO2 is only 18 mm Hg.
ALVEOLAR PO2 AT DIFFERENT ELEVATIONS Carbon Dioxide and Water Vapor Decrease the Alveolar Oxygen Even at high altitudes, carbon dioxide (CO2) is continually excreted from the pulmonary blood into the alveoli.
In addition, water vaporizes into the inspired air from the respiratory surfaces.
These two gases dilute the O2 in the alveoli, thus reducing the O2 concentration.
Water vapor pressure in the alveoli remains at 47 mm Hg as long as the body temperature is normal, regardless of altitude.
In the case of CO2, during exposure to very high altitudes, the alveolar partial pressure of CO2 (PCO2) falls from the sea level value of 40 mm Hg to lower values.
In the acclimatized person, who increases ventilation about fivefold, the PCO2 falls to about 7 mm Hg because of increased respiration.
Calculation of Alveolar PO2 at High Altitudes At the top of Mount Everest (29,028 feet):
Barometric pressure = 253 mm Hg Water vapor pressure = 47 mm Hg (must be subtracted) Remaining pressure = 206 mm Hg CO2 pressure (acclimatized) = 7 mm Hg (must be subtracted) Remaining pressure = 199 mm Hg If no O2 were used by the body: O2 would be one-fifth of 199 = ~40 mm Hg With O2 continuously absorbed into blood: ~35 mm Hg remains At the summit of Mount Everest, only the best acclimatized people can barely survive when breathing air.
Alveolar PO2 at Different Altitudes Altitude (ft) PO2 in Alveoli — Unacclimatized (mm Hg) PO2 in Alveoli — Acclimatized (mm Hg) Sea level 104 104 20,000 40 53 30,000 18 30 The difference between acclimatized and unacclimatized persons is that alveolar ventilation increases much more in the acclimatized person.
SATURATION OF HEMOGLOBIN WITH OXYGEN AT DIFFERENT ALTITUDES Figure 44-1 shows arterial blood O2 saturation at different altitudes while a person is breathing air and while breathing O2.
Breathing Air Up to an altitude of about 10,000 feet, even when air is breathed, the arterial O2 saturation remains at least as high as 90%.
Above 10,000 feet, the arterial O2 saturation falls rapidly:
At 20,000 feet: slightly less than 70% At still higher altitudes: even lower Breathing Pure Oxygen When a person breathes pure O2 instead of air, most of the space in the alveoli formerly occupied by nitrogen becomes occupied by O2.
At 30,000 feet, an aviator could have an alveolar PO2 as high as 139 mm Hg instead of 18 mm Hg when breathing air.
The saturation remains above 90% until the aviator ascends to about 39,000 feet.
Then it falls rapidly to about 50% at about 47,000 feet.
THE “CEILING” — BREATHING AIR VS BREATHING OXYGEN An aviator breathing pure O2 in an unpressurized airplane can ascend to far higher altitudes than one breathing air.
The arterial saturation at 47,000 feet when breathing O2 is about 50%.
This is equivalent to the arterial O2 saturation at 23,000 feet when breathing air.
An unacclimatized person usually can remain conscious until the arterial O2 saturation falls to 50%.
Therefore:
Ceiling for breathing air: ~23,000 feet (short exposure) Ceiling for breathing pure O2: ~47,000 feet (provided equipment operates perfectly) ACUTE EFFECTS OF HYPOXIA Symptoms Beginning at ~12,000 Feet (Unacclimatized) Some of the important acute effects of hypoxia in the unacclimatized person breathing air, beginning at about 12,000 feet:
Drowsiness Lassitude Mental and muscle fatigue Sometimes headache Occasionally nausea Sometimes euphoria Progressive Symptoms These effects progress to:
Above 18,000 feet: Twitchings or seizures Above 23,000 feet: Coma, followed shortly thereafter by death Impaired Mental Proficiency One of the most important effects of hypoxia is decreased mental proficiency.
This decreases:
Judgment Memory Performance of discrete motor movements Example: If an unacclimatized aviator stays at 15,000 feet for 1 hour, mental proficiency ordinarily falls to about 50% of normal.
After 18 hours at this level, it falls to about 20% of normal.
ACCLIMATIZATION TO LOW PO2 A person remaining at high altitudes for days, weeks, or years becomes more and more acclimatized to the low PO2.
After acclimatization:
It becomes possible for the person to work harder without hypoxic effects It becomes possible to ascend to still higher altitudes Principal Means of Acclimatization Mechanism Description Increased pulmonary ventilation Peripheral chemoreceptors stimulate increased ventilation Increased red blood cells More hemoglobin to carry oxygen Increased diffusing capacity Better gas exchange in lungs Increased tissue vascularity More capillaries deliver oxygen to tissues Improved cellular O2 utilization Cells use oxygen more efficiently Increased Pulmonary Ventilation — Role of Arterial Chemoreceptors Immediate exposure to low PO2 stimulates the arterial chemoreceptors.
This stimulation increases alveolar ventilation to a maximum of about 1.65 times normal.
This compensation occurs within seconds for the high altitude.
It alone allows the person to function reasonably well.
"></div><div data-title="Blood Types; Transfusion; and Tissue and Organ Transplantation" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch36_blood-types-transfusion-and-tissue-and-organ-transplantation/"
                     data-content="Tissue Antigens and Transplantation Most of the different antigens of RBCs that cause transfusion reactions are also widely present in other cells of the body. Each bodily tissue has its own additional complement of antigens.
Consequently, foreign cells transplanted anywhere into the body of a recipient can produce an immune reaction. In other words, most recipients are just as able to resist invasion by foreign tissue cells as to resist invasion by foreign bacteria or RBCs.
Types of Grafts Type Definition Expected Outcome Autograft Transplant from one part of the same animal to another Cells will almost always continue to live normally and indefinitely if adequate blood supply is provided Isograft Transplant from one identical twin to another Same as autograft Allograft Transplant from one person to another or from an animal to another animal of the same species Immune reactions almost always occur unless specific therapy is used Xenograft From a nonhuman animal to a human or from an animal of one species to one of another species Cells usually die within 1 day to 5 weeks unless therapy is used Transplantation of Cellular Tissues Tissues Successfully Transplanted Some of the different cellular tissues and organs that have been transplanted from one person to another as allografts, either experimentally or for therapeutic purposes, are:
Skin Kidney Heart Liver Glandular tissue Bone marrow Lung Long-Term Success With proper matching of tissues between persons:
Many kidney allografts have been successful for at least 5 to 15 years Allograft liver and heart transplants have been successful for 1 to 15 years Reactions in Transplanted Tissue Because of the extreme potential importance of transplanting certain tissues and organs, serious attempts have been made to prevent antigen-antibody reactions associated with transplantation.
Tissue Typing — Human Leukocyte Antigen Complex of Antigens The most important antigens for causing graft rejection are a complex called human leukocyte antigen (HLA) antigens.
Six of these antigens are present on the tissue cell membranes of each person. There are about 150 different HLA antigens to choose from, representing more than 1 trillion possible combinations.
Consequently, it is virtually impossible for two persons—except in the case of identical twins—to have the same six HLA antigens. Development of significant immunity against any of these antigens can cause graft rejection.
How HLA Antigens Are Distributed The HLA antigens are on the white blood cells, as well as on the tissue cells. Therefore, tissue typing for these antigens is done on the membranes of lymphocytes that have been separated from the person’s blood.
The lymphocytes are mixed with appropriate antisera and complement. After incubation, the cells are tested for membrane damage, usually by determining the rate of transmembrane uptake by the lymphocytic cells of a special dye.
Matching Success Some of the HLA antigens are not severely antigenic. Therefore, a precise match of some antigens between donor and recipient is not always essential to allow allograft acceptance.
By using a more advanced method of genetic testing and obtaining the best possible match between donor and recipient, the grafting procedure has become far less hazardous.
The best success has been with tissue type matches between siblings and between parent and child. The match in identical twins is exact, so transplants between identical twins are almost never rejected because of an immune reaction.
Prevention of Graft Rejection by Suppressing the Immune System If the immune system were completely suppressed, graft rejection would not occur.
In fact, in a person who has serious depression of the immune system, grafts can be successful without the use of significant therapy to prevent rejection.
However, in the person with a healthy immune system, even with the best possible tissue typing, allografts seldom resist rejection for more than a few days or weeks without the use of specific therapy to suppress the immune system.
Furthermore, because the T cells are mainly the portion of the immune system important for killing grafted cells, their suppression is much more important than suppression of plasma antibodies.
Immunosuppressive Agents Some of the therapeutic agents that have been used for this purpose include:
Agent Mechanism Glucocorticoid hormones Inhibit genes that code for several cytokines, especially interleukin-2 (IL-2). IL-2 is an essential factor that induces T-cell proliferation and antibody formation Azathioprine and similar drugs Have a toxic effect on the lymphoid system and therefore block formation of antibodies and T cells Cyclosporine and tacrolimus Inhibit formation of T-helper cells and are especially efficacious in blocking the T-cell rejection reaction. They do not depress some other portions of the immune system Antilymphocyte or IL-2 receptor antibodies Immunosuppressive antibody therapy Risks of Immunosuppression Use of these agents often leaves the person unprotected from infectious disease. Therefore, sometimes bacterial and viral infections become rampant.
In addition, the incidence of cancer is several times greater in an immunosuppressed person. This is presumably because the immune system is important in destroying many early cancer cells before they can begin to proliferate.
Current Approach Transplantation of living tissues in people has been successful mainly because of the development of drugs that suppress the responses of the immune system.
With the introduction of improved immunosuppressive agents, successful organ transplantation has become much more common. The current approach to immunosuppressive therapy attempts to balance acceptable rates of rejection with moderation of the adverse effects of immunosuppressive drugs.
Hemostasis Events The term hemostasis means prevention of blood loss.
Whenever a vessel is severed or ruptured, hemostasis is achieved by several mechanisms:
Vascular constriction Formation of a platelet plug Formation of a blood clot as a result of blood coagulation Eventual growth of fibrous tissue into the blood clot to close the hole in the vessel permanently Vascular Constriction Immediately after a blood vessel has been cut or ruptured, the trauma to the vessel wall causes smooth muscle in the wall to contract. This instantaneously reduces the flow of blood from the ruptured vessel.
Mechanisms of Vascular Contraction The contraction results from:
Local myogenic spasm Local autacoid factors from the traumatized tissues, vascular endothelium, and blood platelets Nervous reflexes initiated by pain nerve impulses or other sensory impulses that originate from the traumatized vessel or nearby tissues However, even more vasoconstriction probably results from local myogenic contraction of the blood vessels initiated by direct damage to the vascular wall.
For the smaller vessels, the platelets are responsible for much of the vasoconstriction by releasing a vasoconstrictor substance—thromboxane A2.
Duration of Spasm The more severely a vessel is traumatized, the greater the degree of vascular spasm. The spasm can last for many minutes or even hours, during which time the processes of platelet plugging and blood coagulation can take place.
Formation of the Platelet Plug If the cut in the blood vessel is very small—many very small vascular holes develop throughout the body each day—the cut is often sealed by a platelet plug rather than by a blood clot.
To understand this process, it is important that we first discuss the nature of platelets themselves.
Physical and Chemical Characteristics of Platelets Platelets (also called thrombocytes) are minute discs 1 to 4 micrometers in diameter.
They are formed in the bone marrow from megakaryocytes, which are extremely large hematopoietic cells in the marrow. The megakaryocytes fragment into the minute platelets in the bone marrow or soon after entering the blood, especially as they squeeze through capillaries.
The normal concentration of platelets in the blood is between 150,000 and 450,000/μl.
Platelet Contents Platelets have many functional characteristics of whole cells, even though they do not have nuclei and cannot reproduce. In their cytoplasm are:
Component Function Actin and myosin molecules Contractile proteins similar to those in muscle cells Thrombosthenin Another contractile protein that can cause platelets to contract Endoplasmic reticulum and Golgi apparatus residuals Store large quantities of calcium ions Mitochondria and enzyme systems Capable of forming ATP and ADP Enzyme systems Synthesize prostaglandins (local hormones) Fibrin-stabilizing factor Important protein involved in blood coagulation Growth factor Causes vascular endothelial cells, vascular smooth muscle cells, and fibroblasts to multiply and grow Platelet Membrane On the platelet cell membrane surface is a coat of glycoproteins that:
Repulses adherence to normal endothelium Causes adherence to injured areas of the vessel wall, especially to injured endothelial cells Causes even more adherence to exposed collagen from deep within the vessel wall The platelet membrane also contains large amounts of phospholipids that activate multiple stages in the blood-clotting process.
Platelet Lifespan The platelet is an active structure. It has a half-life in the blood of only 8 to 12 days. After several weeks, its functional processes run out and it is eliminated from the circulation mainly by the tissue macrophage system.
More than half of the platelets are removed by macrophages in the spleen, where the blood passes through a latticework of tight trabeculae.
Mechanism of Platelet Plug Formation Platelet repair of vascular openings is based on several important functions of the platelet.
When platelets come in contact with a damaged vascular surface—especially with collagen fibers in the vascular wall—the platelets rapidly change their own characteristics drastically (Figure 37-1).
Steps in Platelet Activation Swelling — Platelets begin to swell Shape change — They assume irregular forms with numerous irradiating pseudopods protruding from their surfaces Granule release — Their contractile proteins contract forcefully and cause the release of granules that contain multiple active factors Stickiness — They become sticky so that they adhere to collagen in the tissues and to a protein called von Willebrand factor (vWF), which leaks into the traumatized tissue from the plasma Secretion — The platelets secrete increased quantities of ADP and platelet-activating factor (PAF) Thromboxane formation — Their enzymes form thromboxane A2 Role of Thromboxane A2, ADP, and PAF Thromboxane is a vasoconstrictor. Along with ADP and PAF, it acts on nearby platelets to activate them. The stickiness of these additional activated platelets causes them to adhere to the original activated platelets.
Platelet Plug Formation At the site of a puncture in a blood vessel wall, the damaged vascular wall activates successively increasing numbers of platelets that attract more and more additional platelets, thus forming a platelet plug.
This plug is loose at first but is usually successful in blocking blood loss if the vascular opening is small.
Then, during the subsequent process of blood coagulation, fibrin threads form. These threads attach tightly to the platelets, thus constructing an unyielding plug.
Importance of Platelet Mechanism for Closing Vascular Holes The platelet-plugging mechanism is extremely important for closing minute ruptures in very small blood vessels that occur many thousands of times daily.
Indeed, multiple small holes through the endothelial cells themselves are often closed by platelets actually fusing with the endothelial cells to form additional endothelial cell membranes.
Literally thousands of small hemorrhagic areas develop each day under the skin (petechiae, which appear as purple or red dots on the skin) and throughout the internal tissues of a person who has few blood platelets.
This phenomenon does not occur in persons with normal numbers of platelets.
Blood Coagulation in the Ruptured Vessel The third mechanism for hemostasis is formation of the blood clot.
The clot begins to develop in 15 to 20 seconds if the trauma to the vascular wall is severe, and in 1 to 2 minutes if the trauma is minor.
Activator substances from the traumatized vascular wall, from platelets, and from blood proteins adhering to the traumatized vascular wall initiate the clotting process.
Timeline of Clot Formation Time Event 15-20 seconds Clot begins (severe trauma) 1-2 minutes Clot begins (minor trauma) 3-6 minutes Entire opening or broken end of the vessel is filled with clot (if opening is not too large) 20-60 minutes Clot retracts, which closes the vessel still further Platelets also play an important role in clot retraction.
Formation of Platelet Plug (Figure 37-1) Figure 37-1. Formation of a platelet plug in a severed blood vessel. Endothelial injury and exposure of the vascular extracellular matrix facilitates platelet adhesions and activation, which changes their shape and causes release of adenosine diphosphate (ADP), thromboxane A2 (TXA2), and platelet-activating factor (PAF). These platelet-secreted factors recruit additional platelets (aggregation) to form a hemostatic plug. Von Willebrand factor (vWF) serves as an adhesion bridge between subendothelial collagen and the glycoprotein Ib (GpIb) platelet receptor.
Steps:
Severed vessel Platelets agglutinate Fibrin appears Fibrin clot forms Clot retraction occurs "></div><div data-title="Body Temperature Regulation and Fever" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch74_body-temperature-regulation-and-fever/"
                     data-content="Normal Body Temperature Core Temperature Range Normal core temperature ranges from 97°F to 99.5°F (approximately 36°C to 37.5°C).
Oral temperature is typically measured.
Rectal temperature is approximately 1°F higher than oral temperature.
Circadian Variation Body temperature follows a circadian rhythm.
The nadir (lowest point) occurs in the early morning hours.
The peak occurs in the late afternoon or evening.
Average Normal Temperature The commonly cited average normal temperature is 98.6°F (37°C).
However, normal temperature varies among individuals.
Heat Production and Heat Loss Heat Production Heat is produced by metabolic processes in the body.
Major sources of heat production include:
Basal metabolic rate of all cells Muscle contraction Thyroxine and epinephrine effects Activity level Heat Loss Mechanisms Heat is lost from the body through several mechanisms:
Mechanism Description Radiation Heat loss via infrared rays (60% of heat loss at rest in neutral environment) Conduction Direct transfer of heat to objects in contact with skin (~15%) Convection Heat transfer to air currents (significant with air movement) Evaporation Heat loss through sweat evaporation (dominant when ambient temp &gt; core) Evaporative Heat Loss Evaporation is the dominant heat loss mechanism when ambient temperature exceeds core temperature.
Approximately 0.6 calories are lost per milliliter of sweat evaporated.
Thermoregulatory Center — The Hypothalamus Hypothalamic Regions The hypothalamus serves as the primary thermoregulatory center.
Region Function Anterior hypothalamus Detects temperature via warm-sensitive neurons; initiates heat loss responses Posterior hypothalamus Initiates heat conservation and heat production when temperature falls Afferent Temperature Signals The hypothalamus integrates afferent signals from:
Central thermoreceptors in the hypothalamus Peripheral thermoreceptors in the skin Spinal cord thermoreceptors Heat Conservation Mechanisms When core temperature falls, the posterior hypothalamus initiates:
Vasoconstriction of skin blood vessels Piloerection (goosebumps) Increased metabolic rate shivering Heat Loss Mechanisms When core temperature rises, the anterior hypothalamus initiates:
Vasodilation of skin blood vessels Sweating Decreased metabolic rate Skin Blood Flow and Thermal Conductance Blood Flow Variation Skin blood flow can vary 8-fold between full vasoconstriction and full vasodilation.
This accounts for most change in thermal conductance.
Vasoconstriction Full vasoconstriction minimizes blood flow to the skin.
This reduces heat loss from the body surface.
This is the primary heat conservation mechanism.
Vasodilation Full vasodilation maximizes blood flow to the skin.
This increases heat loss from the body surface.
This is the primary heat dissipation mechanism.
Insulation Subcutaneous Fat Subcutaneous adipose tissue provides thermal insulation.
Fat has a thermal conductivity approximately 1/3 that of other tissues.
This reduces heat transfer between the body core and the skin surface.
Individual Variation Subcutaneous fat thickness is the primary determinant of interindividual variation in cold tolerance.
People with more body fat can tolerate cold better than leaner individuals.
Sweating and Evaporation Sweat Glands Sweat glands are exocrine glands in the skin.
When activated, they secrete sweat onto the skin surface.
Evaporative Cooling Evaporation of sweat cools the skin surface.
This is the most effective heat dissipation mechanism when ambient temperature is high.
Sweat Rate Sweat rate can reach several liters per hour during extreme heat or exercise.
Fluid Loss Prolonged sweating can lead to significant fluid and electrolyte loss.
This can cause dehydration if fluids are not replaced.
Fever Definition Fever is an elevated core body temperature above the normal range.
It results from a raised hypothalamic set-point.
Pyrogens Fever is triggered by pyrogens, substances that raise the hypothalamic set-point.
Exogenous Pyrogens Exogenous pyrogens include:
Bacterial endotoxin Lipopolysaccharide (LPS) Other microbial products Endogenous Pyrogens Endogenous pyrogens are cytokines produced by the immune system:
IL-1β (Interleukin-1 beta) TNF-α (Tumor necrosis factor alpha) IL-6 (Interleukin-6) These cytokines act on the hypothalamus.
Mechanism of Fever Endogenous pyrogens act on the organum vasculosum of the lamina terminalis (OVLT).
This is a circumventricular organ with poor blood-brain barrier.
Pyrogens induce synthesis of prostaglandin E₂ (PGE₂).
PGE₂ raises the hypothalamic temperature set-point.
The body then initiates heat conservation and production to reach the new set-point.
This causes the characteristic chills and shivering of fever onset.
Antipyretics Antipyretic drugs lower fever by inhibiting prostaglandin synthesis.
Drug Mechanism Aspirin Inhibits cyclooxygenase (COX-1 and COX-2) Acetaminophen Inhibits cyclooxygenase in the CNS These drugs inhibit cyclooxygenase and prostaglandin synthesis.
This lowers the elevated set-point to normalize temperature.
Benefits of Fever Fever may have beneficial effects:
Enhances immune system function Inhibits some microbial growth May help resolve infections Harmful Effects High fever can be harmful:
Increased metabolic rate Increased cardiac workload Seizures (especially in children) Neurological damage in extreme cases Heat Stroke Definition Heat stroke is a failure of thermoregulation.
It occurs when core temperature rises above 40°C (104°F).
Mechanism Heat stroke results from overwhelming heat dissipation mechanisms.
This occurs during:
High environmental temperatures Heavy exercise Dehydration Symptoms Heat stroke symptoms include:
Altered mental status Confusion Loss of consciousness Hot, dry skin Rapid heartbeat Treatment Emergency treatment includes:
Rapid cooling IV fluid resuscitation Supportive care Hypothermia Definition Hypothermia is core body temperature below 35°C (95°F).
Causes Hypothermia results from:
Cold environmental exposure Impaired thermoregulation Medical conditions (hypothyroidism, sepsis) Stages Stage Temperature Mild 32–35°C (90–95°F) Moderate 28–32°C (82–90°F) Severe &lt;28°C (&lt;82°F) Effects Progressive effects include:
Shivering (until exhaustion) Confusion Loss of coordination Loss of consciousness Cardiac arrhythmias Death Behavioral Temperature Regulation Beyond autonomic responses, humans use behavioral mechanisms:
Seeking shade or sunlight Adjusting clothing Modifying activity level Using heating or cooling devices Behavioral regulation is a critical component of human thermoregulation.
"></div><div data-title="Capillary Dynamics and Fluid Exchange" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch16_capillary-dynamics-and-fluid-exchange/"
                     data-content="OSMOTIC PRESSURE The basic principles of osmosis and osmotic pressure were presented in Chapter 4. Here we review only the most important aspects as they apply to volume regulation.
Osmosis and Selective Permeability Because cell membranes are relatively impermeable to most solutes but are highly permeable to water (selectively permeable), whenever there is a higher concentration of solute on one side of the cell membrane, water diffuses across the membrane toward the region of higher solute concentration.
If a solute such as sodium chloride is added to the extracellular fluid, water rapidly diffuses from the cells through the cell membranes into the extracellular fluid until the water concentration on both sides of the membrane becomes equal.
Conversely, if a solute such as sodium chloride is removed from the extracellular fluid, water diffuses from the extracellular fluid through the cell membranes and into the cells.
Osmolality and Osmolarity Term Definition Osmolality Osmoles per kilogram of water Osmolarity Osmoles per liter of solution In dilute solutions such as body fluids, these two terms can be used almost synonymously because the differences are small. Most clinical calculations are based on osmolarities rather than osmolalities.
Calculation of Osmolarity and Osmotic Pressure Using the van’t Hoff law, one can calculate the potential osmotic pressure of a solution, assuming that the cell membrane is impermeable to the solute.
Example: 0.9% Sodium Chloride Solution A 0.9% solution means 0.9 gram of sodium chloride per 100 milliliters of solution — or 9 g/L.
Molecular weight of NaCl: 58.5 g/mol Molarity: 9 g/L ÷ 58.5 g/mol = 0.154 mol/L Because each NaCl molecule equals 2 osmoles: 0.154 × 2 = 0.308 Osm/L = 308 mOsm/L Potential osmotic pressure: 308 mOsm/L × 19.3 mm Hg/mOsm/L = 5944 mm Hg The Osmotic Coefficient This calculation is an approximation because sodium and chloride ions do not behave entirely independently as a result of interionic attraction between them.
A correction factor called the osmotic coefficient corrects for these deviations from van’t Hoff’s law:
For sodium chloride, the osmotic coefficient is about 0.93 Therefore, the actual osmolarity of a 0.9% sodium chloride solution is 308 × 0.93 = 286 mOsm/L For practical reasons, the osmotic coefficients of different solutes are sometimes neglected in determining osmolarity and osmotic pressures of physiologic solutions.
Osmolarity of Body Fluids Table 25-2 shows the approximate osmolarity of osmotically active substances in plasma, interstitial fluid, and intracellular fluid.
Compartment Major Osmotically Active Substances Plasma ~80% from Na⁺ and Cl⁻ ions Interstitial fluid ~80% from Na⁺ and Cl⁻ ions Intracellular fluid ~50% from K⁺ ions; remainder from many other substances The total osmolarity of each of the three compartments is about 300 mOsm/L, with the plasma being about 1 mOsm/L greater than that of the interstitial and intracellular fluids.
The slight difference between plasma and interstitial fluid is caused by the osmotic effects of the plasma proteins, which maintain
"></div><div data-title="Cardiac Arrhythmias and Their Electrocardiographic Interpretation" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch13_cardiac-arrhythmias-and-their-electrocardiographic-interpretation/"
                     data-content="TACHYCARDIA Tachycardia means a fast heart rate, defined as faster than 100 beats/min in an adult. Figure 13-1 shows an ECG from a patient with tachycardia.
This ECG is normal except that the heart rate is about 150 beats/min instead of the normal 72 beats/min.
Causes of Tachycardia Cause Mechanism Increased body temperature Increased temperature increases sinus node metabolism and excitability Dehydration Volume depletion triggers sympathetic response Blood loss anemia Sympathetic reflex stimulation Sympathetic nerve stimulation Direct increase in heart rate Toxic conditions Direct effects on cardiac rhythm Effect of Fever on Heart Rate The heart rate usually increases about 10 beats/min for each degree Fahrenheit increase in body temperature. This equals an increase of 18 beats/min for each degree Celsius.
This relationship holds up to a body temperature of about 105°F (40.5°C). Beyond this temperature, the heart rate may decrease because of progressive debility of the heart muscle.
Fever causes tachycardia because an increased temperature increases the rate of metabolism of the sinus node, which in turn directly increases its excitability and rate of rhythm.
Sympathetic Nervous System Activation Many factors can cause the sympathetic nervous system to excite the heart. For example:
Severe blood loss: Sympathetic reflex stimulation of the heart may increase the heart rate to 150 to 180 beats/min. Myocardial weakening: The weakened heart does not pump blood into the arterial tree to a normal extent, causing reductions in blood pressure and eliciting sympathetic reflexes to increase the heart rate. BRADYCARDIA Bradycardia means a slow heart rate, usually defined as fewer than 60 beats/min. It is shown by the ECG in Figure 13-2.
Bradycardia in Athletes The well-trained athlete’s heart is often larger and considerably stronger than that of a normal person. This allows the athlete’s heart to pump a large stroke volume output per beat, even during periods of rest.
When the athlete is at rest, increased quantities of blood pumped into the arterial tree with each beat initiate feedback circulatory reflexes that cause bradycardia.
Vagal Stimulation Causes Bradycardia Any circulatory reflex that stimulates the vagus nerves causes release of acetylcholine at the vagal endings in the heart, resulting in a parasympathetic effect.
Perhaps the most striking example occurs in patients with carotid sinus syndrome. In these patients, the pressure receptors (baroreceptors) in the carotid sinus region of the carotid artery walls are excessively sensitive.
Even mild external pressure on the neck can elicit a strong baroreceptor reflex, causing intense vagal-acetylcholine effects on the heart, including extreme bradycardia. Sometimes this reflex is so powerful that it actually stops the heart for 5 to 10 seconds, leading to loss of consciousness (syncope).
SINUS ARRHYTHMIA Figure 13-3 shows a cardiotachometer recording of the heart rate — at first during normal respiration, and then during deep respiration in the second half of the record.
A cardiotachometer records the duration of the interval between successive QRS complexes in the ECG by the height of successive spikes.
Note from this record that the heart rate increased and decreased no more than 5% during quiet respiration. Then, during deep respiration, the heart rate increased and decreased with each respiratory cycle by as much as 30%.
Mechanism of Sinus Arrhythmia Sinus arrhythmia can result from any one of many circulatory conditions that alter the strengths of the sympathetic and parasympathetic nerve signals to the heart sinus node.
The respiratory type of sinus arrhythmia results mainly from the spillover of signals from the medullary respiratory center into the adjacent vasomotor center during inspiratory and expiratory cycles of respiration. The spillover signals cause alternate increases and decreases in the number of impulses transmitted through the sympathetic and vagus nerves to the heart.
HEART BLOCK WITHIN THE INTRACARDIAC CONDUCTION PATHWAYS SINOATRIAL (SA) BLOCK In rare cases, the impulse from the sinus node is blocked before it enters the atrial muscle. This phenomenon is demonstrated in Figure 13-4, which shows sudden cessation of P waves, with resultant standstill of the atria.
However, the ventricles pick up a new rhythm, with the impulse usually originating spontaneously in the atrioventricular (A-V) node. The rate of the ventricular QRS-T complex is slowed but not otherwise altered.
SA block can be due to:
Myocardial ischemia affecting the sinus node Inflammation or infection of the heart Side effects from certain medications Observed in well-trained athletes ATRIOVENTRICULAR (A-V) BLOCK The only means whereby impulses ordinarily can pass from the atria into the ventricles is through the A-V bundle, also known as the bundle of His.
Conditions that can decrease the rate of impulse conduction in this bundle or block the impulse entirely include:
Ischemia of the A-V node or A-V bundle fibers — Coronary insufficiency can cause ischemia of the A-V node and bundle. Compression of the A-V bundle by scar tissue or calcified portions of the heart. Inflammation of the A-V node or A-V bundle — Results frequently from different types of myocarditis caused by diphtheria or rheumatic fever. Extreme vagal stimulation — Occasionally blocks impulse conduction through the A-V node. Such vagal excitation can result from strong stimulation of the baroreceptors in people with carotid sinus syndrome. Degeneration of the A-V conduction system — Seen sometimes in older patients. Medications such as digitalis or beta-adrenergic antagonists can impair A-V conduction. INCOMPLETE ATRIOVENTRICULAR BLOCK First-Degree Block — Prolonged P-R Interval The usual lapse of time between the beginning of the P wave and the beginning of the QRS complex is about 0.16 second when the heart is beating at a normal rate.
This so-called P-R interval usually:
Decreases in length with a faster heartbeat Increases with a slower heartbeat In general, when the P-R interval increases to more than 0.20 second, the P-R interval is said to be prolonged, and the patient is said to have first-degree incomplete heart block.
Figure 13-5 shows an ECG with a prolonged P-R interval — about 0.30 second instead of the normal 0.20 second or less.
Second-Degree Block In second-degree heart block, some but not all of the atrial impulses fail to pass through the A-V node to the ventricles.
This results in intermittent missing QRS complexes on the ECG. The atrial rhythm continues normally, but ventricular responses are periodic.
Third-Degree (Complete) Block In third-degree heart block, there is complete electrical dissociation between the atria and ventricles. The atria beat at their own rhythm (driven by the sinus node), while the ventricles assume an independent rhythm from the A-V node or an ectopic focus.
This creates complete A-V dissociation on the ECG.
ATRIAL FIBRILLATION Rhythm During Atrial Fibrillation When the atria are fibrillating, impulses arrive from the atrial muscle at the A-V node rapidly but also irregularly.
Because the A-V node will not pass a second impulse for about 0.35 second after a previous one, at least 0.35 second must elapse between one ventricular contraction and the next.
Then, an additional but variable interval of 0 to 0.6 second occurs before one of the irregular atrial fibrillatory impulses happens to arrive at the A-V node.
Thus, the interval between successive ventricular contractions varies from a minimum of about 0.35 second to a maximum of about 0.95 second, causing a very irregular heartbeat.
This irregularity — demonstrated by the variable spacing of the heartbeats in the ECG shown in Figure 13-19 — is one of the clinical findings used to diagnose the condition.
Because of the rapid rate of the fibrillatory impulses in the atria, the ventricle is driven at a fast heart rate, usually between 125 and 150 beats/min.
Electroshock Treatment of Atrial Fibrillation Similar to ventricular fibrillation being converted back to a normal rhythm by electroshock, atrial fibrillation can also be converted by electroshock.
The procedure is similar to that for ventricular fibrillation conversion, except the single electric shock is programmed (or synchronized) to fire only during the QRS complex when the ventricles are refractory to stimulation.
A normal rhythm often follows if the heart is capable of generating a normal rhythm. This procedure is called synchronized cardioversion instead of defibrillation.
ATRIAL FLUTTER Atrial flutter is another condition caused by a circus movement in the atria. It is different from atrial fibrillation in that the electrical signal travels as a single large wave, always in one direction, around and around the atrial muscle mass (shown in Figure 13-20).
Atrial flutter causes a rapid rate of contraction of the atria, usually between 200 and 350 beats/min.
However, because one side of the atria is contracting while the other side is relaxing, the amount of blood pumped by the atria is reduced.
Furthermore, the signals reach the A-V node too rapidly for all of them to be passed into the ventricles because the refractory periods of the A-V node and A-V bundle are too long to pass more than a fraction of the atrial signals.
Therefore, there are usually two to three beats of the atria for every single beat of the ventricles.
ECG in Atrial Flutter Figure 13-21 shows a typical ECG in atrial flutter. The P waves are strong because of the contraction of semi-coordinated masses of muscle.
Note that a QRS-T complex follows an atrial P wave only once for every two beats of the atria, giving a 2:1 rhythm.
Atrial Flutter Characteristic Value Atrial rate 200–350 beats/min Ventricular response (typically) 2:1 or 3:1 conduction ECG appearance Sawtooth flutter waves CARDIAC ARREST Cardiac arrest is a serious abnormality of the cardiac rhythmicity-conduction system. It results from cessation of all electrical control signals in the heart — no spontaneous rhythm remains.
Causes Cardiac arrest may occur during deep anesthesia, when severe hypoxia may develop because of inadequate respiration. The hypoxia prevents the muscle fibers and conductive fibers from maintaining normal electrolyte concentration differentials across their membranes. Their excitability may be so affected that the automatic rhythmicity disappears.
Treatment In many cases of cardiac arrest from anesthesia, prolonged CPR (for many minutes or even hours) is quite successful in re-establishing a normal heart rhythm.
In some patients, severe myocardial disease can cause permanent or semi-permanent cardiac arrest, which can cause death. Rhythmical electrical impulses from an implanted electronic cardiac pacemaker have been used successfully to keep patients alive for months to years.

                     data-content="NORMAL HEART SOUNDS When listening to a normal heart with a stethoscope, one hears a sound usually described as “lub, dub, lub, dub.”
The “lub” is associated with closure of the atrioventricular (A-V) valves at the beginning of systole.
The “dub” is associated with closure of the semilunar (aortic and pulmonary) valves at the end of systole.
The “lub” sound is called the first heart sound.
The “dub” sound is called the second heart sound.
The normal pumping cycle of the heart is considered to start when the A-V valves close at the onset of ventricular systole.
The First Heart Sound Is Associated With Closure of A-V Valves The main cause of the first heart sound is vibration of the taut valves immediately after closure.
Vibration also occurs in the adjacent walls of the heart and major vessels around the heart.
In generating the first heart sound, contraction of the ventricles causes sudden backflow of blood against the A-V valves (tricuspid and mitral valves).
This causes them to close and bulge toward the atria.
The chordae tendineae abruptly stop the back bulging.
The elastic tautness of the chordae tendineae and valves causes the back-surging blood to bounce forward again into each respective ventricle.
This mechanism causes the blood and the ventricular walls, as well as the taut valves, to vibrate.
Vibrating turbulence in the blood also occurs.
The vibrations travel through the adjacent tissues to the chest wall.
There they can be heard as sound using a stethoscope.
The Second Heart Sound Is Associated With Closure of the Aortic and Pulmonary Valves The second heart sound results from sudden closure of the semilunar valves (aortic and pulmonary valves) at the end of systole.
When the semilunar valves close, they bulge backward toward the ventricles.
Their elastic stretch recoils the blood back into the arteries.
This causes a short period of reverberation of blood back and forth between the walls of the arteries and the semilunar valves.
Reverberation also occurs between these valves and the ventricular walls.
The vibrations occurring in the arterial walls are then transmitted mainly along the arteries.
When vibrations of the vessels or ventricles come into contact with a sounding board such as the chest wall, they create sound that can be heard using a stethoscope.
Duration and Pitch of First and Second Heart Sounds The duration of each heart sound is slightly more than 0.10 second.
The first sound is about 0.14 second.
The second sound is about 0.11 second.
The reason for the shorter second sound is that the semilunar valves are tauter than the A-V valves. Taut valves vibrate for a shorter time than do the A-V valves.
The audible range of frequency (pitch) in the first and second heart sounds begins at the lowest frequency the ear can detect, about 40 cycles/sec. It goes up above 500 cycles/sec.
When a special electronic apparatus is used to record these sounds, a larger proportion of recorded sound is at frequencies and sound levels below the audible range, going down to 3 to 4 cycles/sec and peaking at about 20 cycles/sec.
For this reason, major portions of the heart sounds can be recorded electronically by phonocardiography, even though they cannot be heard with a stethoscope.
The second heart sound normally has a higher frequency than the first heart sound for two reasons:
The tautness of the semilunar valves in comparison with the much less taut A-V valves The greater elastic coefficient of the taut arterial walls, which provides the principal vibrating chambers for the second sound (compared with the much looser, less elastic ventricular chambers, which provide the vibrating system for the first heart sound) Clinicians use these differences to distinguish special characteristics of the two respective sounds.
The Third Heart Sound Occurs at the Beginning of the Middle Third of Diastole Occasionally, a weak, rumbling third heart sound is heard at the beginning of the middle third of diastole.
A logical but unproved explanation is oscillation of blood back and forth between the walls of the ventricles, initiated by inrushing blood from the atria.
This is analogous to running water from a faucet into a paper sack. The inrushing water reverberates back and forth between the walls of the sack, causing vibrations in its walls.
The reason the third heart sound does not occur until the middle third of diastole is believed to be as follows: In the early part of diastole, the ventricles are not filled sufficiently to create even the small amount of elastic tension necessary for reverberation.
The frequency of this sound is usually so low that the ear cannot hear it. Yet it can often be recorded in the phonocardiogram.
The third heart sound may be normally present in children, adolescents, and young adults. It generally indicates systolic heart failure in older adults.
Atrial Contraction—Fourth Heart Sound An atrial heart sound can sometimes be recorded in the phonocardiogram. It can almost never be heard with a stethoscope because of its weakness and very low frequency (usually 20 cycles/sec or less).
This sound occurs when the atria contract. It is presumably caused by the inrush of blood into the ventricles, initiating vibrations similar to those of the third heart sound.
A fourth heart sound is common in persons who derive benefit from atrial contraction for ventricular filling. This is a result of decreased ventricular wall compliance and increased resistance to ventricular filling.
A fourth heart sound is often heard in older patients with left ventricular hypertrophy.
Chest Surface Areas for Auscultation of Normal Heart Sounds Listening to the sounds of the body, usually with the aid of a stethoscope, is called auscultation.
Figure 23-2 shows the areas of the chest wall from which different heart valvular sounds can best be distinguished.
Although sounds from all valves can be heard from all these areas, the cardiologist distinguishes them by a process of elimination: moving the stethoscope from one area to another and noting the loudness of the sounds in different areas. Sound components from each valve are gradually picked out.
The areas for listening to different heart sounds are not directly over the valves themselves:
Aortic area: upward along the aorta (sound transmission up the aorta) Pulmonic area: upward along the pulmonary artery (sound transmission up the pulmonary artery) Tricuspid area: over the right ventricle Mitral area: over the apex of the left ventricle The mitral area is over the portion of the heart nearest the surface of the chest. The heart is rotated so that the remainder of the left ventricle lies more posteriorly.
Phonocardiogram If a microphone specially designed to detect low-frequency sound is placed on the chest, the heart sounds can be amplified and recorded using a high-speed recording apparatus.
The recording is called a phonocardiogram. Heart sounds appear as waves, as shown schematically in Figure 23-3.
Recording A is an example of normal heart sounds, showing vibrations of the first, second, and third heart sounds. Even the very weak atrial sound is shown.
Note specifically that the third and atrial heart sounds are each a very low rumble. The third heart sound can be recorded in only one-third to one-half of people. The atrial heart sound can be recorded in perhaps one-fourth of people.
Summary of Heart Sounds Heart Sound Timing Cause Frequency Audible? S1 (First) Beginning of systole Closure of A-V valves; vibration of valves, chordae tendineae, ventricular walls 40–500 cycles/sec (peak ~20) Yes S2 (Second) End of systole Closure of semilunar valves; reverberation in arteries Higher than S1 Yes S3 (Third) Early diastole (middle third) Oscillation of ventricular walls from inrushing blood Very low Usually no (recordable) S4 (Fourth) Late diastole (atrial contraction) Inrush of blood from atrial contraction Very low (~20 cycles/sec) Rarely (recordable) Auscultation Sites Valve Location Reason Mitral Apex of left ventricle Nearest chest surface Tricuspid Over right ventricle Sound transmission Aortic Upward along aorta Sound transmitted up aorta Pulmonic Upward along pulmonary artery Sound transmitted up pulmonary artery Figure 23-1. Amplitude of different frequency vibrations in heart sounds and heart murmurs in relationship to threshold of audibility. The range of sounds that can be heard is between 40 and 520 cycles/sec.
Figure 23-2. Chest areas from which sounds from each valve are heard best.
Figure 23-3. Phonocardiogram showing heart sounds.
