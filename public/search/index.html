                     data-content="PROTEIN SYNTHESIS In the cell nucleus, large numbers of genes are attached end on end in extremely long, double-stranded helical molecules of DNA having molecular weights measured in the billions.
A very short segment of such a molecule is shown in Figure 3-2. This molecule is composed of several simple chemical compounds bound together in a regular pattern.
BUILDING BLOCKS OF DNA Figure 3-3 shows the basic chemical compounds involved in the formation of DNA.
These compounds include:
Phosphoric acid A sugar called deoxyribose Four nitrogenous bases: Purines: adenine and guanine Pyrimidines: thymine and cytosine The phosphoric acid and deoxyribose form the two helical strands that are the backbone of the DNA molecule.
The nitrogenous bases lie between the two strands and connect them, as illustrated in Figure 3-2.
NUCLEOTIDES The first stage of DNA formation is to combine one molecule of phosphoric acid, one molecule of deoxyribose, and one of the four bases to form an acidic nucleotide.
Four separate nucleotides are thus formed, one for each of the four bases:
Base Nucleotide Name Adenine Deoxyadenylic acid Thymine Deoxythymidylic acid Guanine Deoxyguanylic acid Cytosine Deoxycytidylic acid GENE EXPRESSION PATHWAY Genes control cell function through the following pathway:
Gene (DNA) → contains the genetic code RNA formation → transcription occurs Protein formation → translation occurs Cell function → proteins control cellular activities The process involves:
Transcription: DNA is copied to messenger RNA (mRNA) Translation: mRNA is read at ribosomes to build proteins THE CELL MEMBRANE: A LIPID BILAYER WITH TRANSPORT PROTEINS The structure of the membrane covering the outside of every cell of the body is discussed in Chapter 2 and illustrated in Figure 2-3 and Figure 4-2.
This membrane consists almost entirely of a lipid bilayer with large numbers of protein molecules in the lipid.
Many of these protein molecules penetrate all the way through the membrane.
The lipid bilayer is not miscible with the extracellular fluid or the intracellular fluid. Therefore, it constitutes a barrier against movement of water molecules and water-soluble substances between the extracellular and intracellular fluid compartments.
However, lipid-soluble substances can diffuse directly through the lipid substance, as shown in Figure 4-2.
TRANSPORT PROTEINS The membrane protein molecules interrupt the continuity of the lipid bilayer. They constitute an alternative pathway through the cell membrane.
Many of these penetrating proteins can function as transport proteins.
Channel Proteins Some proteins have watery spaces all the way through the molecule. They allow free movement of water, as well as selected ions or molecules. These proteins are called channel proteins.
Carrier Proteins Other proteins, called carrier proteins, bind with molecules or ions that are to be transported.
Conformational changes in the protein molecules then move the substances through the interstices of the protein to the other side of the membrane.
Channel proteins and carrier proteins are usually selective for the types of molecules or ions that are allowed to cross the membrane.
DIFFUSION VERSUS ACTIVE TRANSPORT Transport through the cell membrane occurs via one of two basic processes:
Diffusion Active transport Diffusion Diffusion means random molecular movement of substances molecule by molecule, either through intermolecular spaces in the membrane or in combination with a carrier protein.
The energy that causes diffusion is the energy of the normal kinetic motion of matter.
Active Transport Active transport means movement of ions or other substances across the membrane in combination with a carrier protein.
This movement causes the substance to move against an energy gradient, such as from a low-concentration state to a high-concentration state.
This movement requires an additional source of energy besides kinetic energy.
DIFFUSION All molecules and ions in the body fluids, including water molecules and dissolved substances, are in constant motion, with each particle moving in its separate way.
The motion of these particles is what physicists call “heat”—the greater the motion, the higher the temperature.
The motion never ceases, except at absolute zero temperature.
When a moving molecule approaches a stationary molecule, the electrostatic and other nuclear forces of the moving molecule repel the stationary one.
This transfers some of the energy of motion from the moving molecule to the stationary molecule.
Consequently, the stationary molecule gains kinetic energy of motion, whereas the moving molecule slows down.
As shown in Figure 4-3, a single molecule in a solution bounces among the other molecules—first in one direction, then another, then another, and so forth—randomly bouncing thousands of times each second.
This continual movement of molecules among one another in liquids or gases is called diffusion.
Ions diffuse in the same manner as whole molecules, and even suspended colloid particles diffuse in a similar manner.
However, colloids diffuse far less rapidly than molecular substances because of their large size.
DIFFUSION THROUGH THE CELL MEMBRANE Diffusion through the cell membrane is divided into two subtypes:
Simple diffusion Facilitated diffusion Simple Diffusion Simple diffusion means that kinetic movement of molecules or ions occurs through a membrane opening or through intermolecular spaces without interaction with carrier proteins in the membrane.
The rate of diffusion is determined by:
The amount of substance available The velocity of kinetic motion The number and sizes of openings in the membrane through which the molecules or ions can move Facilitated Diffusion Facilitated diffusion requires interaction of a carrier protein.
The carrier protein aids passage of molecules or ions through the membrane by binding chemically with them and shuttling them through the membrane in this form.
Pathways for Simple Diffusion Simple diffusion can occur through the cell membrane by two pathways:
Through the interstices of the lipid bilayer if the diffusing substance is lipid-soluble Through watery channels that penetrate all the way through some of the large transport proteins DIFFUSION OF LIPID-SOLUBLE SUBSTANCES The lipid solubility of a substance is an important factor for determining how rapidly it diffuses through the lipid bilayer.
For example, the lipid solubilities of oxygen, nitrogen, carbon dioxide, and alcohols are high.
All these substances can dissolve directly in the lipid bilayer and diffuse through the cell membrane in the same manner that diffusion of water solutes occurs in a watery solution.
The rate of diffusion of each of these substances through the membrane is directly proportional to its lipid solubility.
Especially large amounts of oxygen can be transported in this way. Therefore, oxygen can be delivered to the interior of the cell almost as though the cell membrane did not exist.
DIFFUSION OF WATER AND OTHER LIPID-INSOLUBLE MOLECULES Even though water is highly insoluble in the membrane lipids, it readily passes through channels in protein molecules that penetrate all the way through the membrane.
Many of the body’s cell membranes contain protein “pores” called aquaporins that selectively permit rapid passage of water through the membrane.
The aquaporins are highly specialized, and there are at least 13 different types in various cells of mammals.
The rapidity with which water molecules can diffuse through most cell membranes is astounding.
For example, the total amount of water that diffuses in each direction is very large.

                     data-content="MYOGENIC AUTOREGULATION OF RENAL BLOOD FLOW AND GLOMERULAR FILTRATION RATE Another mechanism contributes to the maintenance of a relatively constant renal blood flow and GFR: the ability of individual blood vessels to resist stretching during increased arterial pressure.
This is referred to as the myogenic mechanism.
Studies of individual blood vessels (especially small arterioles) throughout the body have shown that they respond to increased wall tension or wall stretch by contraction of the vascular smooth muscle.
Stretch of the vascular wall allows increased movement of calcium ions from the extracellular fluid into the cells, causing them to contract through the mechanisms discussed in Chapter 8.
This contraction prevents excessive stretch of the vessel. By raising vascular resistance, it also helps prevent excessive increases in renal blood flow and GFR when arterial pressure increases.
Although the myogenic mechanism probably operates in most arterioles throughout the body, its importance in renal blood flow and GFR autoregulation has been questioned because this pressure-sensitive mechanism has no means of directly detecting changes in renal blood flow or GFR per se.
On the other hand, this mechanism may be more important in protecting the kidney from hypertension-induced injury.
In response to sudden increases in blood pressure, the myogenic constrictor response in afferent arterioles occurs within seconds. It attenuates transmission of increased arterial pressure to the glomerular capillaries.
TUBULOGLOMERULAR FEEDBACK Tubuloglomerular feedback (macula densa mechanism) links distal tubular sodium chloride delivery to afferent arteriolar resistance. This helps maintain constant GFR and renal blood flow despite changes in arterial pressure.
HIGH PROTEIN INTAKE AND HYPERGLYCEMIA INCREASE RENAL BLOOD FLOW AND GLOMERULAR FILTRATION RATE Although renal blood flow and GFR are relatively stable under most conditions, there are circumstances in which these variables change significantly.
A high protein intake is known to increase renal blood flow and GFR. With a long-term, high-protein diet, such as one containing large amounts of meat, increases in GFR and renal blood flow are due partly to growth of the kidneys.
However, the GFR and renal blood flow also increase 20% to 30% within 1 or 2 hours after a person eats a high-protein meal.
Mechanism of Increased GFR After High Protein Intake One likely explanation for the increased GFR is the following:
A high-protein meal releases into the blood amino acids Amino acids are reabsorbed in the proximal tubules Because amino acids and sodium are reabsorbed together by cotransport in the proximal tubules, increased amino acid reabsorption also stimulates sodium reabsorption This increased reabsorption of sodium decreases sodium delivery to the macula densa This elicits a tubuloglomerular feedback–mediated decrease in resistance of the afferent arterioles The decreased afferent arteriolar resistance then raises renal blood flow and GFR This allows sodium excretion to be maintained at a nearly normal level while increasing excretion of the waste products of protein metabolism, such as urea Similar Mechanism in Diabetes A similar mechanism may explain the marked increases in renal blood flow and GFR that occur with large increases in blood glucose levels in persons with uncontrolled diabetes mellitus.
Glucose, like some amino acids, is also reabsorbed along with sodium in the proximal tubule. Increased glucose delivery to the tubules causes them to reabsorb excess sodium along with glucose.
This increased reabsorption of sodium decreases the sodium chloride concentration at the macula densa. This activates tubuloglomerular feedback–mediated dilation of the afferent arterioles, and subsequent increases in renal blood flow and GFR occur.
Purpose of Tubuloglomerular Feedback These examples demonstrate that renal blood flow and GFR per se are not the primary variables controlled by the tubuloglomerular feedback mechanism.
The main purpose of this feedback is to ensure a constant delivery of sodium chloride to the distal tubule, where final processing of the urine takes place.
Disturbances that tend to increase the reabsorption of sodium chloride at tubular sites before the macula densa tend to elicit increased renal blood flow and GFR. This helps return distal sodium chloride delivery toward normal, allowing normal rates of sodium and water excretion to be maintained.
Opposite Sequence With Reduced Proximal Reabsorption An opposite sequence of events occurs when proximal tubular reabsorption is reduced. For example, when the proximal tubules are damaged (by poisoning from heavy metals such as mercury, or large doses of drugs such as tetracyclines), their ability to reabsorb sodium chloride is decreased.
Large amounts of sodium chloride are then delivered to the distal tubule. Without appropriate compensation, this would quickly cause excessive volume depletion.
One important compensatory response appears to be tubuloglomerular feedback–mediated renal vasoconstriction, which occurs in response to the increased sodium chloride delivery to the macula densa.
These examples again demonstrate the importance of this feedback mechanism, ensuring that the distal tubules receive the proper rate of delivery of:
Sodium chloride Other tubular fluid solutes Tubular fluid volume This allows appropriate amounts of these substances to be excreted in the urine.
OTHER FACTORS THAT INFLUENCE RENAL BLOOD FLOW AND GLOMERULAR FILTRATION RATE The GFR and renal blood flow are low at birth. They approach normal adult levels after about 2 years of life.
In the absence of kidney disease, they are maintained relatively constant until the fourth decade. Thereafter, GFR declines by about 5% to 10% per decade, with considerable variability among individuals.
This decline in GFR coincides with:
Nitric oxide deficiency Increased oxidative stress Loss of functional nephrons This may be related partly to:
Increasing blood pressure Metabolic disorders Other insults that cause cumulative glomerular injury with aging Sex Differences Men have higher renal blood flow and GFR than women, even when corrected for body mass. However, men also have a more rapid decline in GFR with aging than premenopausal women.
The mechanisms responsible for these sex differences are not fully understood. Beneficial effects of estrogens and damaging effects of androgens on the kidneys have been suggested as a partial explanation.
Conditions That Influence Renal Blood Flow and GFR Condition RBF GFR Aging ↓ ↓ High dietary protein ↑ ↑ Hyperglycemia ↑ ↑ Obesity ↑ ↑ High NaCl intake ↑ ↑ Glucocorticoids ↑ ↑ Fever, pyrogens ↑ ↑ Note: Refers to early effects, prior to development of glomerular injury that may occur with chronic hyperglycemia, obesity, and high salt intake.
GFR Changes With Age Age GFR Status Birth Low ~2 years Normal adult levels 30–40 years Relatively constant &gt;40 years Declines ~5–10% per decade RENAL CLEARANCE As the glomerular filtrate enters the renal tubules, it flows sequentially through successive parts:
Proximal tubule Loop of Henle Distal tubule Collecting tubule Collecting duct It is then excreted as urine. Along this course:
Some substances are selectively reabsorbed from the tubules back into the blood Other substances are secreted from the blood into the tubular lumen The urine that is formed represents the sum of three basic renal processes:
Glomerular filtration Tubular reabsorption Tubular secretion U r i n a r y e x c r e t i o n = G l o m e r u l a r f i l t r a t i o n − T u b u l a r r e a b s o r p t i o n &#43; T u b u l a r s e c r e t i o n For many substances, tubular reabsorption plays a much more important role than secretion in determining the final urinary excretion rate. However, tubular secretion accounts for significant amounts of:
Potassium ions Hydrogen ions A few other substances TUBULAR REABSORPTION IS QUANTITATIVELY LARGE AND HIGHLY SELECTIVE Table 28-1 shows the renal handling of several substances that are all freely filtered in the kidneys and reabsorbed at variable rates.
The rate at which each of these substances is filtered is calculated as:
F i l t r a t i o n = G l o m e r u l a r f i l t r a t i o n r a t e × P l a s m a c o n c e n t r a t i o n This calculation assumes that the substance is freely filtered and not bound to plasma proteins. For example, if plasma glucose concentration is 1 g/L, the amount of glucose filtered each day is about 180 L/day × 1 g/L, or 180 g/day. Because virtually none of the filtered glucose is normally excreted, the rate of glucose reabsorption is also 180 g/day.
Key Observations From Filtration and Reabsorption Data First observation: The processes of glomerular filtration and tubular reabsorption are quantitatively large relative to urinary excretion for many substances.
A small change in glomerular filtration or tubular reabsorption can potentially cause a relatively large change in urinary excretion. For example, a 10% decrease in tubular reabsorption (from 178.5 to 160.7 L/day) would increase urine volume from 1.5 to 19.3 L/day, almost a 13-fold increase if the GFR remained constant.
In reality, changes in tubular reabsorption and glomerular filtration are closely coordinated, and large fluctuations in urinary excretion are avoided.
Second observation: Unlike glomerular filtration, which is relatively nonselective, tubular reabsorption is highly selective.
Some substances, such as glucose and amino acids, are almost completely reabsorbed, and urinary excretion rate is essentially zero. Many ions in the plasma, such as sodium, chloride, and bicarbonate, are also highly reabsorbed, but their rates of reabsorption and urinary excretion are variable, depending on the needs of the body.
Waste products, such as urea and creatinine, conversely, are poorly reabsorbed and are excreted in relatively large amounts. By controlling their reabsorption of different substances, the kidneys regulate excretion of solutes independently of one another. This capability is essential for precise control of body fluid composition.

                     data-content="HEART VALVE SURGERY It is almost impossible to repair intracardiac defects surgically while the heart is still pumping.
Many types of artificial heart-lung machines have been developed to take the place of the heart and lungs during an operation.
Such a system is called extracorporeal circulation. The system consists principally of a pump and an oxygenating device.
Almost any type of pump that does not cause hemolysis of the blood seems suitable.
Methods used for oxygenating blood include:
Bubbling oxygen through the blood and removing the bubbles before passing it back into the patient Dripping the blood downward over surfaces of plastic sheets in the presence of oxygen Passing the blood over surfaces of rotating discs Passing the blood between thin membranes or through thin tubes permeable to oxygen and carbon dioxide HYPERTROPHY OF THE HEART IN VALVULAR AND CONGENITAL HEART DISEASE Hypertrophy of cardiac muscle is one of the most important mechanisms whereby the heart adapts to increased workloads.
These workloads may be caused by:
Increased pressure against which the heart muscle must contract Increased cardiac output that must be pumped One can calculate approximately how much hypertrophy will occur in each chamber of the heart by multiplying the ventricular output by the pressure against which the ventricle must work. An emphasis is placed on pressure.
Hypertrophy occurs in most types of valvular and congenital disease. Sometimes it causes the heart to weigh as much as 800 grams instead of the normal 300 grams.
Detrimental Effects of Late Stages of Cardiac Hypertrophy Although the most common cause of cardiac hypertrophy is hypertension, almost all forms of cardiac diseases can stimulate enlargement of the heart, including valvular and congenital disease.
So-called physiological cardiac hypertrophy is generally considered to be a compensatory response of the heart to increased workload. It is usually beneficial for maintaining cardiac output in the presence of abnormalities that impair the heart’s effectiveness as a pump.
However, extreme degrees of hypertrophy can lead to heart failure. One reason is that the coronary vasculature typically does not increase to the same extent as the mass of cardiac muscle increases.
A second reason is that fibrosis often develops in the muscle, especially in the subendocardial muscle where coronary blood flow is poor. Fibrous tissue replaces degenerating muscle fibers.
Because of the disproportionate increase in muscle mass relative to coronary blood flow, relative ischemia may develop. Coronary blood flow insufficiency may ensue.
Anginal pain is therefore a frequent accompaniment of cardiac hypertrophy associated with valvular and congenital heart disease.
Enlargement of the heart is also associated with a greater risk for developing arrhythmias. These arrhythmias can lead to further impairment of cardiac function and sudden death because of fibrillation.
Comparison of Physiological vs. Pathological Cardiac Hypertrophy Feature Physiological Hypertrophy Pathological Hypertrophy Cause Exercise, normal growth Hypertension, valve disease, congenital defects Extent Moderate Extreme Coronary vessels Adequate supply Insufficient (relative ischemia) Fibrosis Minimal Often present, especially subendocardial Result Beneficial, maintains output Can lead to heart failure, arrhythmias DECREASED CARDIAC OUTPUT Shock Usually Results from Inadequate Cardiac Output Any condition that reduces cardiac output far below normal may lead to circulatory shock.
Two types of factors can severely reduce cardiac output:
1. Cardiac abnormalities that decrease the ability of the heart to pump blood:
Myocardial infarction Toxic states of the heart Severe heart valve dysfunction Heart arrhythmias Other conditions The circulatory shock resulting from diminished cardiac pumping ability is called cardiogenic shock. As many as 70% of people who experience cardiogenic shock do not survive.
2. Factors that decrease venous return:
Diminished blood volume (most common cause) Decreased vascular tone, especially of the venous blood reservoirs Obstruction to blood flow at some point in the circulation, especially in the venous return pathway to the heart The heart cannot pump blood that does not flow into it.
CIRCULATORY SHOCK WITHOUT DIMINISHED CARDIAC OUTPUT Occasionally, cardiac output is normal or even more than normal. Yet the person is in a state of circulatory shock.
This situation can result from:
Excessive metabolic rate, so even a normal cardiac output is inadequate Abnormal tissue perfusion patterns, so most of the cardiac output is passing through blood vessels besides those that supply the local tissues with nutrition All causes of shock lead to inadequate delivery of nutrients to critical tissues and organs. They also lead to inadequate removal of cellular waste products from the tissues.
IS ARTERIAL PRESSURE THE PRIMARY MEASURE IN CIRCULATORY SHOCK? In the minds of many physicians, the arterial pressure level is the principal measure of adequacy of circulatory function. However, the arterial pressure can often be seriously misleading.
At times, a person may be in severe shock and still have an almost normal arterial pressure. This is because of powerful nervous reflexes that keep the pressure from falling.
At other times, the arterial pressure can fall to half of normal. The person may still have normal tissue perfusion and not be in shock.
In most types of shock, especially shock caused by severe blood loss:
Arterial blood pressure decreases at the same time cardiac output decreases Usually not as much TISSUE DETERIORATION IS THE END RESULT OF CIRCULATORY SHOCK Once circulatory shock reaches a critical state of severity, regardless of its initiating cause, the shock itself leads to more shock.
Inadequate blood flow causes the body tissues to begin deteriorating, including the heart and circulatory system.
This deterioration causes even greater decreases in cardiac output. A vicious cycle ensues: progressively increasing circulatory shock occurs, followed by less adequate tissue perfusion, then more shock until death occurs.
It is with this late stage of circulatory shock that we are especially concerned. Appropriate physiological treatment can often reverse the rapid slide to death.
STAGES OF SHOCK Because the characteristics of circulatory shock change with different degrees of severity, shock is often divided into three major stages:
Stage 1: Nonprogressive (Compensated) Stage The normal circulatory compensatory mechanisms eventually cause full recovery without help from outside therapy.
Stage 2: Progressive Stage Without therapy, the shock becomes steadily worse until death occurs.
Stage 3: Irreversible Stage The shock has progressed to such an extent that all forms of known therapy are inadequate to save the person’s life. Even though, for the moment, the person is still alive.
Comparison of Shock Stages Stage Characteristics Outcome Nonprogressive (Compensated) Reflexes restore circulation Full recovery without therapy Progressive Worsens despite compensation Death without treatment Irreversible Therapy futile Death even with treatment SHOCK CAUSED BY HYPOVOLEMIA—HEMORRHAGIC SHOCK Hypovolemia means diminished blood volume. Hemorrhage is the most common cause of hypovolemic shock.
Hemorrhage decreases the filling pressure of the circulation. As a consequence, venous return decreases. Cardiac output falls below normal, and shock may ensue.
Relationship of Bleeding Volume to Cardiac Output and Arterial Pressure About 10% of the total blood volume can be removed with almost no effect on arterial pressure or cardiac output.
Greater blood loss usually diminishes cardiac output first. Arterial pressure falls later.
Both fall to zero when about 40% to 45% of the total blood volume has been removed.
Sympathetic Reflex Compensations in Shock The decrease in arterial pressure after hemorrhage causes powerful sympathetic reflexes. These are initiated mainly by arterial baroreceptors and other vascular stretch receptors.
These reflexes stimulate the sympathetic vasoconstrictor system in most tissues. This results in three important effects:
Arterioles constrict in most parts of the systemic circulation, thereby increasing total peripheral resistance Veins and venous reservoirs constrict, thereby helping maintain adequate venous return despite diminished blood volume Heart activity increases markedly, sometimes increasing heart rate from the normal value of 70 beats/min to as high as 160 to 180 beats/min Survival Value of Sympathetic Reflexes Without sympathetic reflexes, only 15% to 20% of blood volume can be removed over 30 minutes before death occurs.
With reflexes intact, a person can sustain 30% to 40% loss of blood volume. These reflexes extend the survivable blood loss to about twice that possible in their absence.
Greater Effect on Arterial Pressure Than on Cardiac Output The arterial pressure is maintained at or near normal levels longer than cardiac output during hemorrhage. The reason is that sympathetic reflexes are geared more for maintaining arterial pressure than cardiac output.
They increase arterial pressure mainly by increasing total peripheral resistance. This has no beneficial effect on cardiac output.
However, sympathetic constriction of veins is important. It keeps venous return and cardiac output from falling too much. It also helps maintain arterial pressure.
The “Second Plateau” in Arterial Pressure During Severe Hemorrhage A second plateau occurs at about 50 mm Hg in the arterial pressure curve during severe hemorrhage.
This results from activation of the central nervous system ischemic response. This causes extreme stimulation of the sympathetic nervous system when the brain begins to experience lack of oxygen or excess buildup of carbon dioxide.
This can be called the “last-ditch stand” of the sympathetic reflexes. Their purpose is to keep arterial pressure from falling too low.
Summary of Hemorrhage Effects Blood Volume Lost Effect on Cardiac Output Effect on Arterial Pressure &lt;10% Minimal effect Minimal effect 10–30% Decreases first Decreases later 30–40% Markedly reduced Partially maintained by reflexes 40–45% Falls to zero Falls to zero Sympathetic Compensation Effects Effect Mechanism Benefit Arteriolar constriction ↑ Total peripheral resistance Maintains arterial pressure Venous constriction ↑ Venous return Maintains cardiac output ↑ Heart rate ↑ Contractility Maintains cardiac output "></div><div data-title="Hemostasis and Blood Coagulation"

                     data-content="Outside the Body Although blood removed from the body and held in a glass test tube normally clots in about 6 minutes, blood collected in siliconized containers often does not clot for 1 hour or more.
The reason for this delay is that preparing the surfaces of the containers with silicone prevents contact activation of platelets and factor XII, the two principal factors that initiate the intrinsic clotting mechanism.
Conversely, untreated glass containers allow contact activation of the platelets and factor XII, with the rapid development of clots.
Heparin as Anticoagulant Heparin can be used for preventing coagulation of blood outside the body, as well as in the body. Heparin is especially used in surgical procedures in which the blood must be passed through a heart-lung machine or artificial kidney machine and then back into the patient.
Calcium-Binding Anticoagulants Various substances that decrease the concentration of calcium ions in the blood can also be used for preventing blood coagulation outside the body.
For example, a soluble oxalate compound mixed in a very small quantity with a sample of blood causes precipitation of calcium oxalate from the plasma. This decreases the ionic calcium level so much that blood coagulation is blocked.
Citrate Anticoagulants Any substance that deionizes the blood calcium will prevent coagulation. The negatively charged citrate ion is especially valuable for this purpose. It is mixed with blood usually in the form of sodium, ammonium, or potassium citrate.
The citrate ion combines with calcium in the blood to produce a nonionized calcium compound. The lack of ionic calcium prevents coagulation.
Citrate anticoagulants have an important advantage over the oxalate anticoagulants because oxalate is toxic to the body, whereas moderate quantities of citrate can be injected intravenously.
After injection, the citrate ion is removed from the blood within a few minutes by the liver. It is polymerized into glucose or metabolized directly for energy.
Consequently, 500 milliliters of blood that has been rendered noncoagulable by citrate can ordinarily be transfused into a recipient within a few minutes without dire consequences.
Risk of Citrate Toxicity However, if the liver is damaged, or if large quantities of citrated blood or plasma are given too rapidly (within fractions of a minute), the citrate ion may not be removed quickly enough.
Under these conditions, the citrate can greatly depress the level of calcium ion in the blood. This can result in tetany and convulsive death.
Blood Coagulation Tests Bleeding Time When a sharp-pointed knife is used to pierce the tip of the finger or earlobe, bleeding ordinarily lasts for 1 to 6 minutes. This time depends largely on the depth of the wound and degree of hyperemia in the finger or earlobe at the time of the test.
Lack of any one of several of the clotting factors can prolong the bleeding time, but it is especially prolonged by lack of platelets.
Clotting Time Many methods have been devised for determining blood-clotting time. The one most widely used is to collect blood in a chemically clean glass test tube and then to tip the tube back and forth about every 30 seconds until the blood has clotted.
By this method, the normal clotting time is 6 to 10 minutes. Procedures using multiple test tubes have also been devised for determining clotting time more accurately.
Unfortunately, the clotting time varies widely depending on the method used for measuring it. Therefore, it is no longer used in many clinics. Instead, measurements of the clotting factors themselves are made using sophisticated chemical procedures.
International Normalized Ratio (INR) Prothrombin Time The prothrombin time indicates the concentration of prothrombin in the blood (Figure 37-7).
Blood removed from the patient is immediately oxalated so that none of the prothrombin can change into thrombin. Then, a large excess of calcium ion and tissue factor is quickly mixed with the oxalated blood.
The excess calcium nullifies the effect of the oxalate, and the tissue factor activates the prothrombin to thrombin reaction by means of the extrinsic clotting pathway.
The time required for coagulation to take place is known as the prothrombin time. The shortness of the time is determined mainly by the prothrombin concentration.
The normal prothrombin time is about 12 seconds. In each laboratory, a curve relating prothrombin concentration to prothrombin time is drawn for the method used so that the prothrombin in the blood can be quantified.
Problem with Variability The results obtained for prothrombin time may vary considerably, even in the same individual. This is because there can be differences in activity of the tissue factor and the analytical system used to perform the test.
Tissue factor is isolated from human tissues, such as placental tissue. Different batches may have different activity.
INR Formula and Purpose The international normalized ratio (INR) was devised as a way to standardize measurements of prothrombin time.
For each batch of tissue factor, the manufacturer assigns an international sensitivity index (ISI), which indicates the activity of the tissue factor with a standardized sample. The ISI usually varies between 1.0 and 2.0.
The INR is the ratio of the person’s prothrombin time (PT) to a normal control sample raised to the power of the ISI:
INR = (PT test / PT normal)^ISI
Normal INR Values Condition INR Range Normal healthy person 0.9 to 1.3 High risk of bleeding 4 or 5 Chance of having a clot 0.5 Warfarin therapy target 2.0 to 3.0 Testing Other Clotting Factors Tests similar to that for prothrombin time and INR have been devised to determine the quantities of other blood-clotting factors.
In each of these tests, excesses of calcium ions and all the other factors in addition to the one being tested are added to oxalated blood all at once. Then, the time required for coagulation is determined in the same manner as for prothrombin time.
If the factor being tested is deficient, the coagulation time is prolonged. The time itself can then be used to quantitate the concentration of the factor.
Anticoagulants Summary Anticoagulant Mechanism Clinical Use Heparin Potentiates antithrombin III Surgical procedures (heart-lung machine, dialysis) Citrate Binds calcium ion (forms nonionized calcium compound) Blood transfusion storage Oxalate Precipitates calcium as calcium oxalate Laboratory blood samples (toxic if injected) Clotting Factor Testing Test Measures Normal Value Bleeding time Platelet function 1-6 minutes Clotting time Overall coagulation capacity 6-10 minutes Prothrombin time (PT) Extrinsic pathway (Factors VII, X, V, II, fibrinogen) ~12 seconds INR Standardized PT 0.9-1.3 (untreated) "></div><div data-title="Insulin, Glucagon, and Diabetes Mellitus"

                     data-content="EXTRACELLULAR FLUID AND PLASMA CALCIUM REGULATION Extracellular fluid calcium concentration is normally regulated precisely. It seldom rises or falls more than a few percent from the normal value of about 9.4 mg/dl.
This is equivalent to 2.4 millimoles of calcium per liter.
This precise control is essential because calcium plays a key role in many physiological processes.
Excitable cells such as neurons are sensitive to changes in calcium ion concentrations. Increases above normal (hypercalcemia) cause progressive depression of the nervous system. Conversely, decreases in calcium concentration (hypocalcemia) cause the nervous system to become more excited.
Calcium Storage in Bone An important feature of extracellular calcium regulation is that only about 0.1% of the total body calcium is in the extracellular fluid.
About 1% is in the cells and their organelles. The rest is stored in bones.
Therefore, the bones can serve as large reservoirs, storing excess calcium and releasing calcium when extracellular fluid concentration decreases.
Phosphate Distribution in the Body Approximately 85% of the body’s phosphate is stored in bones.
14% to 15% is in the cells. Less than 1% is in the extracellular fluid.
Although extracellular fluid phosphate concentration is not nearly as well regulated as calcium concentration, phosphate serves several important functions and is controlled by many of the same factors that regulate calcium.
CALCIUM IN THE PLASMA AND INTERSTITIAL FLUID Calcium in the plasma is present in three forms:
Form Percentage Concentration Diffusibility Combined with plasma proteins 41% 1.0 mmol/L Non-diffusible through capillary membrane Diffusible but combined with anions (citrate, phosphate) 9% 0.2 mmol/L Diffusible but not ionized Ionized calcium 50% 1.2 mmol/L Diffusible through capillary membrane Thus, the plasma and interstitial fluids have a normal calcium ion concentration of about 1.2 mmol/L (or 2.4 mEq/L, because it is a divalent ion).
This level is only one-half the total plasma calcium concentration.
This ionic calcium is the form that is important for most functions of calcium in the body, including:
The effect of calcium on the heart The nervous system Bone formation INORGANIC PHOSPHATE IN THE EXTRACELLULAR FLUIDS Inorganic phosphate in the plasma is mainly in two forms:
HPO4= (concentration about 1.05 mmol/L) H2PO4− (concentration about 0.26 mmol/L) When the total quantity of phosphate in the extracellular fluid rises, so does the quantity of each of these two types of phosphate ions.
Furthermore, when the pH of the extracellular fluid becomes more acidic, there is a relative increase in H2PO4− and a decrease in HPO4=.
The opposite occurs when the extracellular fluid becomes alkaline.
These relations were presented in the discussion of acid-base balance in Chapter 31.
Because it is difficult to determine chemically the exact quantities of HPO4= and H2PO4− in the blood, ordinarily the total quantity of phosphate is expressed in terms of milligrams of phosphorus per deciliter of blood.
The average total quantity of inorganic phosphorus represented by both phosphate ions is about 4 mg/dl. Normal limits vary between 3 to 4 mg/dl in adults and 4 to 5 mg/dl in children.
PHYSIOLOGICAL EFFECTS OF CALCIUM AND PHOSPHATE CONCENTRATIONS Changing the level of phosphate in the extracellular fluid from far below normal to two to three times normal does not cause major immediate effects on the body.
In contrast, even slight increases or decreases of calcium ion in the extracellular fluid can cause extreme immediate physiological effects.
In addition, chronic hypocalcemia or hypophosphatemia greatly decreases bone mineralization, as is explained later in the chapter.
HYPOCALCEMIA CAUSES NERVOUS SYSTEM EXCITEMENT AND TETANY When the extracellular fluid concentration of calcium ions falls below normal, the nervous system becomes progressively more excitable.
This is because of increased neuronal membrane permeability to sodium ions, allowing easy initiation of action potentials.
At plasma calcium ion concentrations about 50% below normal, the peripheral nerve fibers become so excitable that they begin to discharge spontaneously. This initiates trains of nerve impulses that pass to the peripheral skeletal muscles to elicit tetanic muscle contraction.
Consequently, hypocalcemia causes tetany. It also occasionally causes seizures because of its action of increasing excitability in the brain.
Carpopedal Spasm Tetany ordinarily occurs when the blood concentration of calcium falls from its normal level of 9.4 mg/dl to about 6 mg/dl. This is only 35% below the normal calcium concentration.
Tetany is usually lethal at about 4 mg/dl.
Other Effects of Extreme Hypocalcemia In laboratory animals, extreme hypocalcemia can cause other effects that are seldom evident in patients:
Marked dilation of the heart Changes in cellular enzyme activities Increased membrane permeability in some cells (in addition to nerve cells) Impaired blood clotting HYPERCALCEMIA DEPRESSES NERVOUS SYSTEM AND MUSCLE ACTIVITY When calcium concentration in the body fluids rises above normal, the nervous system becomes depressed.
Reflex activities of the central nervous system are sluggish.
Also, increased calcium ion concentration decreases the QT interval of the heart.
It causes lack of appetite and constipation, probably because of depressed contractility of the muscle walls of the gastrointestinal tract.
Threshold for Hypercalcemia Effects These depressive effects begin to appear when the blood level of calcium rises above about 12 mg/dl.
They can become marked as the calcium level rises above 15 mg/dl.
When the calcium concentration rises above about 17 mg/dl in the blood, calcium phosphate crystals are likely to precipitate throughout the body. This condition is discussed later in connection with parathyroid poisoning.
ABSORPTION AND EXCRETION OF CALCIUM AND PHOSPHATE Intestinal Absorption and Fecal Excretion The usual rates of intake are approximately 1000 mg/day each for calcium and phosphorus. This is about the amounts in 1 liter of milk.
Normally, divalent cations such as calcium ions are poorly absorbed from the intestines.
However, as discussed later, vitamin D promotes calcium absorption by the intestines, and about 35% (350 mg/day) of the ingested calcium is usually absorbed.
The remaining calcium in the intestine is excreted in the feces.
An additional 250 mg/day of calcium enters the intestines via secreted gastrointestinal juices and sloughed mucosal cells.
Thus, about 90% (900 mg/day) of the daily intake of calcium is excreted in the feces.
Phosphate Absorption Intestinal absorption of phosphate occurs easily.
Except for the portion of phosphate that is excreted in the feces in combination with nonabsorbed calcium, almost all the dietary phosphate is absorbed into the blood from the gut.
This is later excreted in the urine.
SUMMARY: CALCIUM AND PHOSPHATE BALANCE Parameter Calcium Phosphate Daily intake ~1000 mg ~1000 mg Intestinal absorption ~350 mg (35%) ~800 mg (80%) Fecal excretion ~900 mg (90%) ~200 mg (20%) Urinary excretion Variable Variable Storage in bone ~99% ~85% CALCIUM ION CONCENTRATION AND PHYSIOLOGICAL FUNCTION The precise regulation of ionized calcium concentration is critical for:
Function Role of Calcium Neuromuscular excitability Controls membrane stability Cardiac contraction Affects QT interval Blood coagulation Cofactor for clotting factors Bone mineralization Matrix calcification "></div><div data-title="Introduction to Endocrinology" 
                     data-book=""

                     data-content="Chemical Messenger Systems The multiple activities of cells, tissues, and organs are coordinated by several types of chemical messenger systems:
Messenger Type Description Neurotransmitters Released by axon terminals into synaptic junctions; act locally to control nerve cell functions Endocrine hormones Released by glands into circulating blood; influence function of target cells at another location Neuroendocrine hormones Secreted by neurons into circulating blood; influence function of target cells at another location Paracrines Secreted into extracellular fluid; affect neighboring target cells of a different type Autocrines Secreted into extracellular fluid; affect the same cells that produced them Cytokines Peptides secreted into extracellular fluid; can function as autocrines, paracrines, or endocrine hormones Cytokines Examples of cytokines: interleukins and other lymphokines secreted by helper cells that act on other cells of the immune system.
Cytokine hormones (e.g., leptin from adipocytes) are sometimes called adipokines.
Coordination of Chemical Messenger Systems The body’s chemical messenger systems interact to maintain homeostasis.
For example, adrenal medullae and pituitary gland secrete hormones primarily in response to neural stimuli.
Neuroendocrine cells in the hypothalamus have axons terminating in the posterior pituitary and median eminence.
They secrete several neurohormones:
Antidiuretic hormone Oxytocin Hypophysiotropic hormones (controlling anterior pituitary secretion) Chemical Structure and Synthesis of Hormones Three general classes of hormones exist:
Class Examples Proteins and polypeptides Pituitary hormones, insulin, glucagon, parathyroid hormone (PTH) Steroids Cortisol, aldosterone, estrogen, progesterone, testosterone Derivatives of amino acid tyrosine Thyroxine, triiodothyronine, epinephrine, norepinephrine There are no known polysaccharides or nucleic acid hormones.
Polypeptide and Protein Hormones Size Range Most hormones in the body are polypeptides and proteins.
They range from small peptides with as few as 3 amino acids (e.g., thyrotropin-releasing hormone) to proteins with almost 200 amino acids (e.g., growth hormone, prolactin).
Classification:
Proteins: Polypeptides with 100 or more amino acids Peptides: Polypeptides with fewer than 100 amino acids Synthesis and Secretion Protein and peptide hormones are synthesized on the rough endoplasmic reticulum of endocrine cells.
They are usually synthesized first as larger, biologically inactive preprohormones.
These are cleaved to form prohormones in the endoplasmic reticulum.
Prohormones are transferred to the Golgi apparatus for packaging into secretory vesicles.
Enzymes in vesicles cleave prohormones to produce:
Smaller, biologically active hormones Inactive fragments Vesicles are stored within the cytoplasm until secretion is needed.
Secretion occurs when vesicles fuse with the cell membrane.
Contents are extruded by exocytosis.
Secretion Stimuli In many cases, the stimulus is increased cytosolic calcium from plasma membrane depolarization.
In other cases, stimulation of an endocrine cell surface receptor causes:
Increased cyclic adenosine monophosphate (cAMP) Activation of protein kinases Initiation of hormone secretion Peptide hormones are water soluble and enter the circulatory system easily.
Steroid Hormones Structure Steroid hormones have a chemical structure similar to cholesterol.
They are synthesized from cholesterol.
They are lipid soluble and consist of:
Three cyclohexyl rings One cyclopentyl ring Combined into a single structure.
Storage and Secretion There is usually very little hormone storage in steroid-producing cells.
However, large stores of cholesterol esters in cytoplasmic vacuoles can be rapidly mobilized.
Much of the cholesterol in steroid-producing cells comes from plasma.
There is also de novo synthesis of cholesterol.
Because steroids are highly lipid soluble, they diffuse across the cell membrane easily.
They enter interstitial fluid, then blood.
Amine Hormones Two groups of hormones are derived from tyrosine:
Group Examples Thyroid hormones Thyroxine (T₄), Triiodothyronine (T₃) Adrenal medullary hormones Epinephrine, Norepinephrine These are formed by enzymes in the cytoplasmic compartments of glandular cells.
Thyroid Hormones Thyroid hormones are synthesized and stored in the thyroid gland.
They are incorporated into thyroglobulin.
Thyroglobulin is stored in large follicles.
Hormone secretion occurs when amines are split from thyroglobulin.
Anatomic Locus of Major Endocrine Glands Gland/Location Hormone Examples Pituitary gland Growth hormone, TSH, ACTH, FSH, LH, prolactin, ADH, oxytocin Pineal gland Melatonin Hypothalamus Releasing/inhibiting hormones Thymus gland Thymosin Parathyroid glands Parathyroid hormone Thyroid gland Thyroxine, calcitonin Kidneys Erythropoietin, renin Pancreas Insulin, glucagon Adrenal glands Cortisol, aldosterone, epinephrine Adipose tissue Leptin Stomach Gastrin Small intestine Cholecystokinin, secretin Testes (male) Testosterone Ovaries (female) Estrogen, progesterone Transport and Action of Endocrine Hormones Endocrine hormones are carried by the circulatory system to cells throughout the body.
They bind with receptors and initiate cell reactions.
Hormones Affecting Many Cells Some endocrine hormones affect many different types of cells:
Growth hormone causes growth in most parts of the body Thyroxine increases the rate of many chemical reactions in almost all cells Hormones Affecting Specific Tissues Other hormones affect mainly specific target tissues because those tissues have abundant receptors:
ACTH specifically stimulates the adrenal cortex Ovarian hormones mainly affect female sex organs and secondary sexual characteristics Functions Regulated by Hormone Systems The multiple hormone systems regulate almost all body functions:
Metabolism Growth and development Water and electrolyte balance Reproduction Behavior Examples of Hormone Functions Without This Hormone Result Growth hormone Very short stature Thyroxine and triiodothyronine Sluggish chemical reactions and behavior Insulin Cells cannot use carbohydrates for energy Sex hormones No sexual development or function Pituitary Gland — Overview The pituitary gland (hypophysis) is about 1 centimeter in diameter and 0.5 to 1 gram in weight.
It lies in the sella turcica, a bony cavity at the base of the brain.
It is connected to the hypothalamus by the pituitary (hypophysial) stalk.
Anterior and Posterior Lobes Physiologically, the pituitary is divisible into two distinct portions:
Portion Also Known As Anterior pituitary Adenohypophysis Posterior pituitary Neurohypophysis Between these is a small, relatively avascular zone called the pars intermedia.
This zone is much less developed in humans but larger and more functional in some animals.
Embryological Origins Portion Embryological Origin Anterior pituitary Rathke’s pouch — an embryonic invagination of the pharyngeal epithelium Posterior pituitary Neural tissue outgrowth from the hypothalamus The origin from pharyngeal epithelium explains the epithelioid nature of anterior pituitary cells.
The origin from neural tissue explains the presence of large numbers of glial-type cells in the posterior pituitary.
Pituitary Hormones Anterior Pituitary Hormones Six major peptide hormones are secreted by the anterior pituitary:
Hormone Abbreviation Function Growth hormone GH Promotes growth of entire body by affecting protein formation, cell multiplication, and cell differentiation Adrenocorticotropic hormone (corticotropin) ACTH Controls secretion of adrenocortical hormones, affecting metabolism of glucose, proteins, and fats Thyroid-stimulating hormone (thyrotropin) TSH Controls secretion rate of thyroxine and triiodothyronine by thyroid gland Prolactin PRL Promotes mammary gland development and milk production Follicle-stimulating hormone FSH Controls growth of ovaries and testes, and their hormonal/reproductive activities Luteinizing hormone LH Controls growth of ovaries and testes, and their hormonal/reproductive activities Posterior Pituitary Hormones Two important peptide hormones are secreted by the posterior pituitary:
Hormone Abbreviation Function Antidiuretic hormone ADH (vasopressin) Controls rate of water excretion into urine; helps control water concentration in body fluids Oxytocin — Helps express milk from breast glands to nipples during suckling; helps in delivery of baby at end of gestation Anterior Pituitary Cell Types Usually, there is one cell type for each major hormone formed in the anterior pituitary.
At least five cell types can be differentiated using special stains with high-affinity antibodies.
Cell Types Summary Cell Type Hormone Produced Staining Somatotropes Human growth hormone (hGH) Acidophils Corticotropes ACTH — Thyrotropes TSH Basophils Gonadotropes LH and FSH Basophils Lactotropes Prolactin (PRL) Acidophils Proportion of Cell Types Cell Type Percentage of Anterior Pituitary Somatotropes (GH-secreting) 30%–40% Corticotropes (ACTH-secreting) ~20% Thyrotropes (TSH-secreting) 3%–5% Gonadotropes (FSH/LH-secreting) 3%–5% Lactotropes (prolactin-secreting) 3%–5% Somatotropes stain strongly with acid dyes and are called acidophils.
Pituitary tumors that secrete large quantities of hGH are called acidophilic tumors.
Posterior Pituitary — Hypothalamic Synthesis The bodies of cells that secrete posterior pituitary hormones are not in the pituitary gland.
They are large neurons, called magnocellular neurons, located in the:
Supraoptic nucleus Paraventricular nucleus of the hypothalamus.
The hormones are transported in the axoplasm of the neuronal nerve fibers.
These fibers pass from the hypothalamus to the posterior pituitary gland.
Hypothalamus Controls Pituitary Secretion Almost all pituitary secretion is controlled by hormonal or nervous signals from the hypothalamus.
When the pituitary is removed and transplanted to another part of the body, secretion rates — except for prolactin — fall to very low levels.
Control of Posterior Pituitary Secretion from the posterior pituitary is controlled by nerve signals originating in the hypothalamus.
Control of Anterior Pituitary Anterior pituitary secretion is controlled by hormones called:
Hypothalamic releasing hormones Hypothalamic inhibitory hormones (or factors) These are secreted within the hypothalamus.
They are conducted to the anterior pituitary through hypothalamic-hypophysial portal vessels.
Hypothalamic Inputs The hypothalamus receives signals from many sources:
Pain signals — transmitted into the hypothalamus Emotional signals — powerful depressing or exciting thoughts Olfactory stimuli — pleasant or unpleasant smells transmitted directly and through the amygdaloid nuclei "></div><div data-title="Lipid Metabolism" 
                     data-book=""

                     data-permalink="/guyton/guyton/ch69_lipid-metabolism/"
                     data-content="Chemical Structure of Lipids Overview of Lipid Types Lipids are a diverse group of organic compounds that are insoluble in water but soluble in organic solvents.
The main types include:
Triglycerides (neutral fat) — energy storage Phospholipids — cell membrane structure Cholesterol — membrane structure and steroid hormone precursor Fatty acids — energy metabolism Cholesterol Cholesterol does not contain fatty acid, but its sterol nucleus is synthesized from portions of fatty acid molecules.
This gives cholesterol many of the physical and chemical properties of other lipids.
Triglycerides (Neutral Fat) Triglycerides are used mainly to provide energy for metabolic processes.
This function is shared almost equally with carbohydrates.
Some lipids — especially cholesterol, phospholipids, and small amounts of triglycerides — form the membranes of all cells.
These lipids also perform other essential cellular functions.
Basic Chemical Structure of Triglycerides A triglyceride molecule consists of:
Three long-chain fatty acid molecules One molecule of glycerol Example: Tristearin
Position Chemical Group Fatty acid 1 COO–CH₃–CH₂–(CH₂)₁₆ Fatty acid 2 COO–CH₃–CH–(CH₂)₁₆ Fatty acid 3 COO–CH₃–CH₂–(CH₂)₁₆ Glycerol backbone Central connecting molecule Common Fatty Acids in Human Triglycerides Fatty Acid Carbon Chain Length Saturation Stearic acid 18 carbons Fully saturated Oleic acid 18 carbons One double bond Palmitic acid 16 carbons Fully saturated Transport of Lipids in the Body Chylomicrons — Transport of Triglycerides from the Gastrointestinal Tract As explained in Chapter 66, almost all dietary fats — except some short-chain fatty acids — are absorbed from the intestines into intestinal lymph.
During digestion, most triglycerides are split into monoglycerides and fatty acids.
While passing through intestinal epithelial cells, monoglycerides and fatty acids are resynthesized into new triglycerides.
These enter the lymph as minute dispersed droplets called chylomicrons.
Chylomicron Structure Chylomicron diameters are between 0.08 and 0.6 micron.
A small amount of apolipoprotein — mainly apolipoprotein B — is adsorbed to outer surfaces.
The protein molecules project into surrounding water, increasing suspension stability.
This prevents adherence to lymphatic vessel walls.
Chylomicron Composition Component Percentage Phospholipids ~9% Cholesterol ~3% Apolipoproteins ~1% Triglycerides Remainder Chylomicron Transport Pathway Most cholesterol and phospholipids absorbed from the GI tract enter the chylomicrons.
Chylomicrons are transported upward through the thoracic duct.
They are emptied into circulating venous blood at the juncture of the jugular and subclavian veins.
Removal of Chylomicrons from Blood Plasma Appearance About 1 hour after a fat-containing meal, chylomicron concentration in plasma may rise to 1%–2% of total plasma.
Because of their large size, the plasma appears turbid and sometimes yellow.
Chylomicrons have a half-life of less than 1 hour.
Plasma becomes clear again within a few hours.
Lipoprotein Lipase Most chylomicrons are removed as they pass through capillaries of various tissues.
Tissues especially involved include:
Adipose tissue Skeletal muscle Heart These tissues synthesize lipoprotein lipase (LPL).
LPL is transported to the surface of capillary endothelial cells.
LPL hydrolyzes triglycerides of chylomicrons as they contact the endothelial wall.
This releases fatty acids and glycerol.
Fate of Released Fatty Acids Fatty acids released from chylomicrons diffuse into fat cells of adipose tissue and muscle cells.
Once inside cells, fatty acids can be:
Used for fuel (oxidation) Re-synthesized into triglycerides (storage) New glycerol is supplied by metabolic processes of storage cells.
LPL also hydrolyzes phospholipids, releasing fatty acids for storage.
Chylomicron Remnants After triglycerides are removed, cholesterol-enriched chylomicron remnants remain.
These remnants bind to receptors on endothelial cells in liver sinusoids.
Apolipoprotein E plays an important role in initiating clearance of these lipoproteins.
Free Fatty Acid Transport Mechanism When fat stored in adipose tissue is needed elsewhere, it must be transported.
It is transported mainly as free fatty acids (FFA).
This transport is achieved by hydrolysis of triglycerides back into fatty acids and glycerol.
Triglyceride Hydrolysis Stimuli Two main stimuli promote this hydrolysis:
Glucose deficiency: When glucose available to fat cells is inadequate, α-glycerophosphate is also insufficient. Since α-glycerophosphate is required to maintain the glycerol portion of triglycerides, hydrolysis results.
Hormone-sensitive lipase activation: A hormone-sensitive cellular lipase can be activated by several hormones. This promotes rapid hydrolysis of triglycerides.
Binding to Albumin Upon leaving fat cells, fatty acids ionize strongly in plasma.
The ionic portion combines immediately with albumin molecules.
Fatty acids bound this way are called:
Free fatty acids (FFA) Nonesterified fatty acids (NEFA) This distinguishes them from fatty acids existing as:
Esters of glycerol Cholesterol Other substances Free Fatty Acid Concentration Under resting conditions, the concentration of free fatty acids in plasma is about 15 mg/dL.
This represents only about 0.45 gram of fatty acids in the entire circulatory system.
Despite this small amount, the rate of turnover is extremely rapid.
Half the plasma fatty acid is replaced every 2–3 minutes.
At this rate, almost all normal energy requirements can be provided by oxidation of transported free fatty acids.
This can occur without using carbohydrates or proteins for energy.
Conditions Increasing FFA Conditions that increase fat utilization for cellular energy also increase plasma free fatty acid concentration.
The concentration sometimes increases fivefold to eightfold.
This especially occurs in:
Starvation Diabetes mellitus In both conditions, the person derives little or no metabolic energy from carbohydrates.
Fatty Acid Binding Capacity Normally, only about 3 molecules of fatty acid combine with each molecule of albumin.
As many as 30 fatty acid molecules can combine with a single albumin molecule when need is extreme.
Lipoprotein Classes Overview Lipoproteins are spherical particles that transport lipids in plasma.
They consist of:
Core: Triglycerides and cholesterol esters Surface: Phospholipids, cholesterol, and apolipoproteins Classes of Lipoproteins Lipoprotein Main Function Major Lipids Chylomicrons Transport dietary fat from intestine Mostly triglycerides VLDL Transport endogenous triglycerides from liver Triglycerides IDL Intermediate (VLDL → LDL) Triglycerides, cholesterol LDL Transport cholesterol to tissues Cholesterol esters HDL Reverse cholesterol transport Phospholipids, cholesterol LDL and HDL Functions LDL carries cholesterol to peripheral tissues.
High LDL levels are associated with increased cardiovascular disease risk.
HDL removes cholesterol from peripheral tissues and transports it to the liver.
High HDL levels are associated with reduced cardiovascular disease risk.
Fatty Acid Oxidation Beta-Oxidation Beta-oxidation is the process by which fatty acids are broken down in mitochondria.
Fatty acids are sequentially broken into 2-carbon acetyl-CoA units.
Each round of beta-oxidation produces:
1 acetyl-CoA 1 NADH 1 FADH₂ Beta-Oxidation Steps Activation: Fatty acid is converted to fatty acyl-CoA (uses 2 ATP) Transport: Carnitine carries fatty acyl-CoA into mitochondria Sequential cleavage: Each cycle removes 2 carbons as acetyl-CoA Energy Yield from Fatty Acid Oxidation Example: Stearic acid (18 carbons)
Product Yield Acetyl-CoA 9 units NADH 8 units FADH₂ 8 units Total ATP from complete oxidation: approximately 120 ATP
Odd-Chain vs. Even-Chain Fatty Acids Even-chain fatty acids: Yield only acetyl-CoA
Odd-chain fatty acids: Yield propionyl-CoA (3 carbons) as the final product
Propionyl-CoA is converted to succinyl-CoA, which enters the citric acid cycle.
Succinyl-CoA is a gluconeogenic substrate.
Ketone Body Formation Ketogenesis When excess acetyl-CoA accumulates in liver mitochondria, it is converted to ketone bodies.
The liver is the only organ that significant ketogenesis occurs in.
Ketone Bodies Ketone Body Description Acetoacetate Primary ketone body formed β-hydroxybutyrate Most abundant ketone body in blood during starvation Acetone Formed by spontaneous decarboxylation of acetoacetate Uses of Ketone Bodies During prolonged fasting or starvation:
Ketone bodies become a major energy source for the brain The brain adapts to using ketone bodies (acetoacetate and β-hydroxybutyrate) This reduces glucose requirement and muscle protein breakdown Ketogenic vs. Glucogenic Amino Acids Ketogenic amino acids: Yield acetyl-CoA or acetoacetate (e.g., leucine, lysine)
Glucogenic amino acids: Yield pyruvate or citric acid cycle intermediates (e.g., alanine, glutamate)
Mixed: Yield both (e.g., isoleucine, tryptophan, phenylalanine, tyrosine)
Fat Storage and Mobilization Fat Storage Triglycerides are stored in adipose tissue.
Adipose tissue is found:
Subcutaneously Around organs In bone marrow Mobilization of Stored Fat When energy is needed, triglycerides are hydrolyzed to fatty acids and glycerol.
Hormone-sensitive lipase (HSL) is the key enzyme.
Hormonal Regulation Hormone Effect Mechanism Glucagon Promotes lipolysis Activates HSL via cAMP Epinephrine Promotes lipolysis Activates HSL via cAMP ACTH Promotes lipolysis Activates HSL via cAMP Insulin Inhibits lipolysis Decreases cAMP Growth hormone Promotes lipolysis Increases lipolysis during prolonged fasting Glycerol Handling Glycerol released from triglyceride hydrolysis travels to the liver.
Glycerol can be:
Used in glycolysis Converted to glucose via gluconeogenesis Cholesterol Metabolism Sources of Cholesterol Source Percentage Dietary cholesterol ~25–30% Endogenous synthesis ~70–75% Cholesterol Synthesis The liver synthesizes most endogenous cholesterol.
The rate-limiting enzyme is HMG-CoA reductase.
Cholesterol synthesis requires:
Acetyl-CoA NADPH ATP Functions of Cholesterol Cholesterol serves as:
Structural component of cell membranes Precursor for steroid hormones Precursor for bile acids Component of myelin sheaths Cholesterol Transport Excess cholesterol is transported back to the liver via reverse cholesterol transport.
This process is mediated by HDL.
Summary of Lipid Transport Chylomicron Composition Summary Component Description Triglycerides Principal component (inner core) Phospholipids ~9% (outer surface) Cholesterol ~3% (inner core) Apolipoproteins ~1% (surface; mainly apolipoprotein B) Size 0.08–0.6 micron diameter Transport route Intestinal lymph → thoracic duct → venous blood Half-life Less than 1 hour "></div><div data-title="Local and Humoral Control of Tissue Blood Flow"

                     data-permalink="/guyton/guyton/ch17_local-and-humoral-control-of-tissue-blood-flow/"
                     data-content="OTHER CHEMICAL FACTORS Many different ions and other chemical factors can dilate or constrict local blood vessels. The following list details their specific effects:
Factor Effect Mechanism Calcium ions (Ca²⁺) Vasoconstriction Increase in intracellular calcium stimulates smooth muscle contraction Potassium ions (K⁺) Vasodilation Inhibits smooth muscle contraction (within physiological range) Magnesium ions (Mg²⁺) Powerful vasodilation Inhibits smooth muscle contraction Hydrogen ions (H⁺) Vasodilation (↑ H⁺); Vasoconstriction (↓ H⁺) pH affects arteriolar tone Acetate and citrate Mild vasodilation Anions with significant vascular effects Carbon dioxide (CO₂) Moderate vasodilation (most tissues); Marked vasodilation (brain) Direct effect on vessels; indirect effect via sympathetic nervous system Carbon Dioxide and Sympathetic Vasoconstriction Carbon dioxide in the blood has two effects:
Direct effect: Causes vasodilation in most tissues — moderate — but marked vasodilation in the brain. Indirect effect: Acting on the brain vasomotor center, CO₂ has an extremely powerful indirect effect transmitted through the sympathetic nervous vasoconstrictor system. This causes widespread vasoconstriction throughout the body. LONG-TERM BLOOD FLOW REGULATION Most Vasodilators or Vasoconstrictors Have Little Effect on Long-Term Blood Flow Unless They Alter the Metabolic Rate of the Tissues In most experimental studies, tissue blood flow and cardiac output are not substantially altered — except for 1 or 2 days — when large amounts of powerful vasoconstrictors (such as angiotensin II) or vasodilators (such as bradykinin) are chronically infused.
Why is blood flow not significantly altered, even with large amounts of these vasoactive agents?
To answer this question, we must return to one of the fundamental principles of circulatory function — the ability of each tissue to autoregulate its own blood flow according to metabolic needs.
Administration of a powerful vasoconstrictor may cause transient decreases in tissue blood flow and cardiac output, but usually has little long-term effect if it does not alter metabolic rate. Likewise, most vasodilators cause only short-term changes if they do not alter tissue metabolism. Therefore, blood flow is generally regulated according to the specific needs of the tissues, as long as arterial pressure is adequate to perfuse them.

                     data-content="SKELETAL MUSCLE Muscle Fiber Structure Skeletal muscles are composed of numerous fibers ranging from 10 to 80 micrometers in diameter. Each fiber extends the entire length of the muscle.
Each fiber is made up of successively smaller subunits. In most skeletal muscles, each fiber is usually innervated by only one nerve ending, located near the middle of the fiber. About 2% of fibers have multiple nerve endings.
Component Description Sarcolemma True cell membrane (plasma membrane) plus outer polysaccharide coat with collagen fibrils Myofibrils Several hundred to several thousand per fiber Tendon fibers Connect muscle to bone Sarcolemma is the thin membrane enclosing each muscle fiber. It consists of:
A true cell membrane (plasma membrane) An outer coat of thin polysaccharide material containing numerous thin collagen fibrils At each end of the muscle fiber, the sarcolemma fuses with a tendon fiber. These bundle into muscle tendons that connect muscles to bones.
Myofibril Composition Each muscle fiber contains several hundred to several thousand myofibrils. Each myofibril is composed of approximately:
Filament Type Number per Myofibril Description Myosin filaments ~1500 Thick filaments Actin filaments ~3000 Thin filaments These filaments are large polymerized protein molecules responsible for muscle contraction. The thick filaments are myosin, and the thin filaments are actin.
Sarcomere Organization Filament Arrangement
Myosin and actin filaments partially interdigitate, causing myofibrils to have alternating light and dark bands.
Band Type Composition Properties I bands (light) Actin filaments only Isotropic to polarized light A bands (dark) Myosin filaments &#43; overlapped actin filaments Anisotropic to polarized light Cross-bridges are small projections from the sides of myosin filaments. The interaction between these cross-bridges and actin filaments causes contraction.
Z Disk Structure
The actin filaments attach at their ends to a Z disk. From the Z disk, these filaments extend in both directions to interdigitate with myosin filaments.
The Z disk is composed of filamentous proteins different from actin and myosin filaments. It passes crosswise across the myofibril and also crosswise from myofibril to myofibril, attaching myofibrils to one another all the way across the muscle fiber. Therefore, the entire muscle fiber has light and dark bands, as do the individual myofibrils. These bands give skeletal and cardiac muscle their striated appearance.
Sarcomere Definition
The portion of the myofibril (or of the whole muscle fiber) that lies between two successive Z disks is called a sarcomere. When the muscle fiber is contracted, the length of the sarcomere is about 2 micrometers. At this length, the actin filaments completely overlap the myosin filaments, and the tips of the actin filaments are just beginning to overlap one another. At this length, the muscle is capable of generating its greatest force of contraction.
Titin Filament Organization The side-by-side relationship between myosin and actin filaments is maintained by a large number of filamentous molecules of a protein called titin.
Property Value Molecular weight ~3 million Daltons Classification One of the largest protein molecules in the body Characteristics Filamentous and very springy These springy titin molecules act as a framework that holds the myosin and actin filaments in place so that the contractile machinery maintains proper alignment.
Figure 6-1. Organization of skeletal muscle, from the gross to the molecular level. A–E show the hierarchy from muscle to myofibrils. F–I show cross sections at indicated levels.
"></div><div data-title="Metabolism of Carbohydrates and Formation of Adenosine Triphosphate" 
                     data-book=""
