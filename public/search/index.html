                     data-content="PROTEIN SYNTHESIS In the cell nucleus, large numbers of genes are attached end to end in extremely long, double-stranded helical molecules of DNA having molecular weights measured in the billions.
A very short segment of such a molecule is shown in Figure 3-2. This molecule is composed of several simple chemical compounds bound together in a regular pattern, the details of which are explained in the next few paragraphs.
BUILDING BLOCKS OF DNA Figure 3-3 shows the basic chemical compounds involved in the formation of DNA.
These compounds include:
Phosphoric acid A sugar called deoxyribose Four nitrogenous bases: Purines: adenine and guanine Pyrimidines: thymine and cytosine The phosphoric acid and deoxyribose form the two helical strands that are the backbone of the DNA molecule.
The nitrogenous bases lie between the two strands and connect them, as illustrated in Figure 3-2.
NUCLEOTIDES The first stage of DNA formation is to combine one molecule of phosphoric acid, one molecule of deoxyribose, and one of the four bases to form an acidic nucleotide.
Four separate nucleotides are thus formed, one for each of the four bases:
Base Nucleotide Name Adenine Deoxyadenylic acid Thymine Deoxythymidylic acid Guanine Deoxyguanylic acid Cytosine Deoxycytidylic acid Figure 3-4 shows the chemical structure of these nucleotides.
GENE EXPRESSION The general schema whereby genes control cell function involves:
DNA transcription → in the nucleus RNA formation and processing → mRNA is formed RNA transport → mRNA moves to cytosol Translation → at ribosomes Protein formation → functional cell products THE CELL MEMBRANE: A LIPID BILAYER WITH TRANSPORT PROTEINS The structure of the membrane covering the outside of every cell of the body is discussed in Chapter 2 and illustrated in Figure 2-3 and Figure 4-2.
This membrane consists almost entirely of a lipid bilayer with large numbers of protein molecules in the lipid, many of which penetrate all the way through the membrane.
The lipid bilayer is not miscible with the extracellular fluid or the intracellular fluid. Therefore, it constitutes a barrier against movement of water molecules and water-soluble substances between the extracellular and intracellular fluid compartments.
However, lipid-soluble substances can diffuse directly through the lipid substance, as shown in Figure 4-2.
TRANSPORT PROTEINS The membrane protein molecules interrupt the continuity of the lipid bilayer, constituting an alternative pathway through the cell membrane.
Many of these penetrating proteins can function as transport proteins.
Channel Proteins Some proteins have watery spaces all the way through the molecule and allow free movement of water, as well as selected ions or molecules. These proteins are called channel proteins.
Carrier Proteins Other proteins, called carrier proteins, bind with molecules or ions that are to be transported.
Conformational changes in the protein molecules then move the substances through the interstices of the protein to the other side of the membrane.
Channel proteins and carrier proteins are usually selective for the types of molecules or ions that are allowed to cross the membrane.
DIFFUSION VERSUS ACTIVE TRANSPORT Transport through the cell membrane occurs via one of two basic processes:
Diffusion Active transport Diffusion Many variations of these basic mechanisms exist, but diffusion means random molecular movement of substances molecule by molecule, either through intermolecular spaces in the membrane or in combination with a carrier protein.
The energy that causes diffusion is the energy of the normal kinetic motion of matter.
Active Transport Active transport means movement of ions or other substances across the membrane in combination with a carrier protein in such a way that the carrier protein causes the substance to move against an energy gradient.
This movement is from a low-concentration state to a high-concentration state. This movement requires an additional source of energy besides kinetic energy.
DIFFUSION All molecules and ions in the body fluids, including water molecules and dissolved substances, are in constant motion, with each particle moving in its separate way.
The motion of these particles is what physicists call “heat”—the greater the motion, the higher the temperature—and the motion never ceases, except at absolute zero temperature.
When a moving molecule, A, approaches a stationary molecule, B, the electrostatic and other nuclear forces of molecule A repel molecule B, transferring some of the energy of motion of molecule A to molecule B.
Consequently, molecule B gains kinetic energy of motion, whereas molecule A slows down, losing some of its kinetic energy.
As shown in Figure 4-3, a single molecule in a solution bounces among the other molecules—first in one direction, then another, then another, and so forth—randomly bouncing thousands of times each second.
This continual movement of molecules among one another in liquids or gases is called diffusion.
Ions diffuse in the same manner as whole molecules, and even suspended colloid particles diffuse in a similar manner.
However, the colloids diffuse far less rapidly than molecular substances because of their large size.
DIFFUSION THROUGH THE CELL MEMBRANE Diffusion through the cell membrane is divided into two subtypes:
Simple diffusion Facilitated diffusion Simple Diffusion Simple diffusion means that kinetic movement of molecules or ions occurs through a membrane opening or through intermolecular spaces without interaction with carrier proteins in the membrane.
The rate of diffusion is determined by:
The amount of substance available The velocity of kinetic motion The number and sizes of openings in the membrane through which the molecules or ions can move Facilitated Diffusion Facilitated diffusion requires interaction of a carrier protein.
The carrier protein aids passage of molecules or ions through the membrane by binding chemically with them and shuttling them through the membrane in this form.
Pathways for Simple Diffusion Simple diffusion can occur through the cell membrane by two pathways:
Through the interstices of the lipid bilayer if the diffusing substance is lipid-soluble Through watery channels that penetrate all the way through some of the large transport proteins DIFFUSION OF LIPID-SOLUBLE SUBSTANCES The lipid solubility of a substance is an important factor for determining how rapidly it diffuses through the lipid bilayer.
For example, the lipid solubilities of oxygen, nitrogen, carbon dioxide, and alcohols are high, and all these substances can dissolve directly in the lipid bilayer and diffuse through the cell membrane in the same manner that diffusion of water solutes occurs in a watery solution.
The rate of diffusion of each of these substances through the membrane is directly proportional to its lipid solubility.
Especially large amounts of oxygen can be transported in this way. Therefore, oxygen can be delivered to the interior of the cell almost as though the cell membrane did not exist.
DIFFUSION OF WATER AND OTHER LIPID-INSOLUBLE MOLECULES Even though water is highly insoluble in the membrane lipids, it readily passes through channels in protein molecules that penetrate all the way through the membrane.
Many of the body’s cell membranes contain protein “pores” called aquaporins that selectively permit rapid passage of water through the membrane.
The aquaporins are highly specialized, and there are at least 13 different types in various cells of mammals.
The rapidity with which water molecules can diffuse through most cell membranes is astounding.
For example, the total amount of water that diffuses in each direction is very large.

                     data-content="OLFACTION — THE OLFACTORY SYSTEM The olfactory portions of the brain were among the first brain structures developed in primitive animals.
Much of the remainder of the brain developed around these olfactory beginnings.
Part of the brain that originally subserved olfaction later evolved into the basal brain structures that control emotions and other aspects of human behavior.
This system is called the limbic system (discussed in Chapter 59).
TRANSMISSION OF OLFACTORY SIGNALS INTO THE OLFACTORY BULB The olfactory nerve fibers leading backward from the bulb are called cranial nerve I, or the olfactory tract.
Both the tract and the bulb are an anterior outgrowth of brain tissue from the base of the brain.
The bulbous enlargement at its end (the olfactory bulb) lies over the cribriform plate.
The cribriform plate separates the brain cavity from the upper reaches of the nasal cavity.
The cribriform plate has multiple small perforations through which small nerves pass upward from the olfactory membrane in the nasal cavity to enter the olfactory bulb.
Olfactory Bulb Structure Figure 54-3 demonstrates the close relation between olfactory cells in the olfactory membrane and the olfactory bulb.
Short axons from the olfactory cells terminate in multiple globular structures in the olfactory bulb called glomeruli.
Each bulb has several thousand such glomeruli.
Each glomerulus is the terminus for about 25,000 axons from olfactory cells.
Each glomerulus is also the terminus for dendrites from:
About 25 large mitral cells About 60 smaller tufted cells The cell bodies of these cells lie in the olfactory bulb superior to the glomeruli.
These dendrites receive synapses from the olfactory cell neurons.
The mitral and tufted cells send axons through the olfactory tract to transmit olfactory signals to higher levels in the central nervous system.
Glomeruli and Odor Analysis Some research has suggested that different glomeruli respond to different odors.
Specific glomeruli may be the real clue to the analysis of different odor signals transmitted into the central nervous system.
PRIMITIVE AND NEWER OLFACTORY PATHWAYS The olfactory tract enters the brain at the anterior junction between the mesencephalon and cerebrum.
There, the tract divides into two pathways:
One passing medially into the medial olfactory area One passing laterally into the lateral olfactory area The medial olfactory area represents a very primitive olfactory system.
The lateral olfactory area is the input to:
A less old olfactory system A newer system The Primitive Olfactory System — The Medial Olfactory Area The medial olfactory area consists of a group of nuclei located in the midbasal portions of the brain immediately anterior to the hypothalamus.
Most conspicuous are the septal nuclei, which are midline nuclei that feed into the hypothalamus and other primitive portions of the brain’s limbic system.
This is the brain area most concerned with basic behavior.
Understanding the medial olfactory area: Consider what happens in animals when the lateral olfactory areas on both sides of the brain are removed, and only the medial system remains.
Removal of the lateral areas hardly affects the more basic responses to olfaction:
Licking the lips Salivation Other feeding responses caused by the smell of food Basic emotional drives associated with smell Conversely, removal of the lateral areas abolishes the more complicated olfactory conditioned reflexes.
The Less Old Olfactory System — The Lateral Olfactory Area The lateral olfactory area is composed mainly of:
Prepyriform cortex Pyriform cortex Cortical portion of the amygdaloid nuclei From these areas, signal pathways pass into almost all portions of the limbic system, especially into less primitive portions such as the hippocampus.
These areas seem to be most important for learning to like or dislike certain foods depending on experiences.
Conditioned food aversion: The lateral olfactory area and its many connections with the limbic behavioral system cause a person to develop an absolute aversion to foods that have caused nausea and vomiting.
Feature of the Lateral Olfactory Area Many signal pathways from the lateral olfactory area also feed directly into an older part of the cerebral cortex called the paleocortex in the anteromedial portion of the temporal lobe.
This area is the only area of the entire cerebral cortex where sensory signals pass directly to the cortex without passing first through the thalamus.
The Newer Pathway A newer olfactory pathway passes through the thalamus to the dorsomedial thalamic nucleus, then to the lateroposterior quadrant of the orbitofrontal cortex.
Based on studies in monkeys, this newer system probably helps in the conscious analysis of odor.
SUMMARY OF OLFACTORY PATHWAYS There appear to be three distinct olfactory systems:
System Pathway Function Primitive Medial olfactory area Basic olfactory reflexes Less old Lateral olfactory area (limbic connections) Automatic, partially learned control of food intake; aversion to toxic foods Newer Thalamus to orbitofrontal cortex Conscious perception and analysis of olfaction CENTRIFUGAL CONTROL OF ACTIVITY IN THE OLFACTORY BULB Many nerve fibers originate in the olfactory portions of the brain and pass from the brain in the outward direction into the olfactory tract to the olfactory bulb (centrifugally from the brain to the periphery).
These nerve fibers terminate on a large number of small granule cells located among the mitral and tufted cells in the olfactory bulb.
The granule cells send inhibitory signals to the mitral and tufted cells.
This inhibitory feedback may be a means for sharpening a person’s specific ability to distinguish one odor from another.
OLFACTORY RECEPTOR NEURONS The olfactory receptor neurons are bipolar neurons located in the olfactory epithelium.
Each neuron has:
An olfactory vesicle with cilia extending into the nasal cavity A single axon passing through the cribriform plate to the olfactory bulb The cilia contain the odorant receptors that detect odorant molecules.
Each receptor neuron expresses one specific odorant receptor gene.
MECHANISM OF ODORANT DETECTION Odorant molecules bind to receptors on olfactory cilia.
This activates G-proteins (Golf) which activate adenylate cyclase.
This increases cAMP, which opens cyclic nucleotide-gated ion channels.
Sodium and calcium ions flow into the cell, depolarizing it.
This depolarization triggers action potentials that travel along the axon to the olfactory bulb.
ODOR DISCRIMINATION The olfactory system can distinguish thousands of different odors.
This is accomplished through:
A large family of odorant receptor genes (~400 functional genes in humans) Each receptor type responds to multiple odorants Each odorant activates multiple receptor types The pattern of activation is decoded by the brain to identify the odor OLFACTION AND FEEDING BEHAVIOR The lateral hypothalamus and amygdala mediate olfactory contributions to feeding behavior.
Olfactory signals influence:
Appetite and satiety Selection of appropriate foods Conditioned food aversions (via amygdala) REFERENCES Augustine V, Gokce SK, Oka Y: Peripheral and central nutrient sensing underlying appetite regulation. Trends Neurosci 41:526, 2018. Buck LB: The molecular architecture of odor and pheromone sensing in mammals. Cell 100:611, 2000. Chandrashekar J, Hoon MA, Ryba NJ, Zuker CS: The receptors and cells for mammalian taste. Nature 444:288, 2006. Lodovichi C, Belluscio L: Odorant receptors in the formation of the olfactory bulb circuitry. Physiology (Bethesda) 27:200, 2012. Mori K, Takahashi YK, Igarashi KM, Yamaguchi M: Maps of odorant molecular features in the mammalian olfactory bulb. Physiol Rev 86:409, 2006. Smith DV, Margolskee RF: Making sense of taste. Sci Am 284:32, 2001. Yarmolinsky DA, Zuker CS, Ryba NJ: Common sense about taste: from mammals to insects. Cell 139:234, 2009. "></div><div data-title="The Limbic System and the Hypothalamus—Behavioral and Motivational Mechanisms of the Brain"

                     data-content="—## SLEEP Sleep is defined as unconsciousness from which a person can be aroused by sensory or other stimuli. It is to be distinguished from coma, which is unconsciousness from which a person cannot be aroused. There are multiple stages of sleep, from very light sleep to very deep sleep. Sleep researchers also divide sleep into two entirely different types of sleep that have different qualities, as described in the following section. ## SLEEP AND RAPID EYE MOVEMENT SLEEP Each night, a person goes through stages of two major types of sleep that alternate with each other (Figure 60-1). These types are called (1) rapid eye movement sleep (REM sleep), in which the eyes undergo rapid movements even though the person is still asleep, and (2) slow-wave sleep or nonREM (NREM) sleep, in which the brain waves are strong and of low frequency, as we discuss later. REM sleep occurs in episodes that occupy about 25% of the sleep time in young adults; each episode normally recurs about every 90 minutes. This type of sleep is not so restful, and it is often associated with vivid dreaming. Most sleep during each night is of the slow-wave (NREM) variety, which is the deep, restful sleep that the person experiences during the first hour of sleep after having been awake for many hours. REM (Paradoxical, Desynchronized) Sleep In a normal night of sleep, bouts of REM sleep lasting 5 to 30 minutes usually appear on average every 90 minutes in young adults. When a person is extremely sleepy, each bout of REM sleep is short and may even be absent. As the person becomes more rested through the night, the durations of the REM bouts increase. REM sleep has several important characteristics:
It is an active form of sleep usually associated with dreaming and active bodily muscle movements. 2. The person is even more difficult to arouse by sensory stimuli than during deep slow-wave sleep, and yet people usually awaken spontaneously in the morning during an episode of REM sleep. 3. Muscle tone throughout the body is exceedingly depressed, indicating strong inhibition of the spinal muscle control areas. 4. Heart rate and respiratory rate usually become irregular, which is characteristic of the dream state. 5. Despite the extreme inhibition of the peripheral muscles, irregular muscle movements do occur in addition to the rapid movements of the eyes. 6. The brain is highly active in REM sleep, and overall brain metabolism may be increased as much as 20%. An electroencephalogram (EEG) shows a pattern of brain waves similar to those that occur during wakefulness. This type of sleep is also called paradoxical sleep because it is a paradox that a person can still be asleep, despite the presence of marked activity in the brain. In summary, REM sleep is a type of sleep in which the brain is quite active. However, the person is not fully aware of the surroundings and therefore is truly asleep. SlowWave Sleep We can understand the characteristics of deep slow-wave sleep by remembering the last time we were kept awake for more than 24 hours and the deep sleep that occurred during the first hour after going to sleep. This sleep is exceedingly restful and is associated with decreases in peripheral vascular tone and many other vegetative functions of the body. For example, 10% to 30% decreases occur in blood pressure, respiratory rate, and basal metabolic rate. Although slow-wave sleep is frequently called “dreamless sleep,” dreams and sometimes even nightmares do occur during slow-wave sleep. The difference between States of Brain Activity—Sleep, Brain Waves, Epilepsy, Psychoses, and Dementia the dreams that occur in slow-wave sleep and those that occur in REM sleep is that those of REM sleep are associated with more bodily muscle activity. Also, the dreams of slow-wave sleep are usually not remembered because consolidation of the dreams in memory does not occur. ## BASIC THEORIES OF SLEEP ### Sleep Is Caused by an Active Inhibitory Process. An earlier theory of sleep was that the excitatory areas of the upper brain stem, the reticular activating system, simply became fatigued during the waking day and became inactive as a result. An important experiment changed this thinking to the current view that sleep is caused by an active inhibitory process, because it was discovered that transecting the brain stem at the level of the midpons creates a brain cortex that never goes to sleep. In other words, a center located below the midpontile level of the brain stem appears to be required to cause sleep by inhibiting other parts of the brain. Neuronal Centers, Neurohumoral Substances, and Mechanisms That Can Cause Sleep—Possible Role for Serotonin ### Stimulation of several specific areas of the brain can produce sleep with characteristics near those of natural sleep. Some of these areas are the following: 1. The raphe nuclei in the lower half of the pons and in the medulla is the most conspicuous stimulation area for causing almost natural sleep. These nuclei comprise a thin sheet of special neurons located in the midline. Nerve fibers from these nuclei spread locally in the brain stem reticular formation and also upward into the thalamus, hypothalamus, most areas of the limbic system, and even the neocortex of the cerebrum. In addition, fibers extend downward into the spinal cord, terminating in the posterior horns, where they can inhibit incoming sensory signals, including pain, as discussed in Chapter 49. Many nerve endings of fibers from these raphe neurons secrete serotonin. When a drug that blocks the formation of serotonin is administered to an animal, the animal often cannot sleep for the next several days. Therefore, it has been assumed that serotonin is a transmitter substance associated with the production of sleep. 2. Stimulation of some areas in the nucleus of the tractus solitarius can also cause sleep. This nucleus is the termination in the medulla and pons for visceral sensory signals entering by way of the vagus and glossopharyngeal nerves. 3. Sleep can be promoted by stimulation of several regions in the diencephalon, including (1) the rostral part of the hypothalamus, mainly in the suprachiasmal area, and (2) an occasional area in the diffuse nuclei of the thalamus. Lesions in Sleep-Promoting Centers Can Cause Intense Wakefulness. Discrete lesions in the raphe nuclei lead to a high state of wakefulness. This phenomenon is also true of bilateral lesions in the medial rostral suprachiasmal area in the anterior hypothalamus. In both cases, the excitatory reticular nuclei of the mesencephalon and Alert wakefulness (beta waves) Awake REM REM REM REM REM REM Stage 1 Stage 2 Stage 3 Stage 4 1 2 3 4 Time (hours) 5 6 7 8 Quiet wakefulness (alpha waves) Stage 1 sleep (low voltage and spindles) Stages 2 and 3 sleep (theta waves) Stage 4 slow-wave sleep (delta waves) REM sleep (beta waves) 1 sec 50 μV &gt; Figure 60-1. Progressive change in the characteristics of the brain waves during alert wakefulness, rapid eye movement (REM) sleep, and stages one through four of sleep. "></div><div data-title="The Liver"

                     data-content="Hepatic Blood Flow and Microcirculation Blood Supply The liver receives approximately 25% of cardiac output.
This comes from two sources:
Source Percentage Type of Blood Portal vein ~75% Venous blood (from GI tract) Hepatic artery ~25% Oxygenated arterial blood The portal vein delivers blood rich in nutrients absorbed from the gastrointestinal tract.
The hepatic artery provides oxygenated blood to meet the liver’s high metabolic demands.
Liver Lobule Structure The liver lobule is the functional unit of the liver.
Hepatocytes are arranged in plates between sinusoidal capillaries (liver sinusoids).
Blood flows from the portal triads (portal vein, hepatic artery, bile duct) toward the central vein.
Space of Disse The space of Disse (perisinusoidal space) lies between endothelial cells and hepatocytes.
This space allows free exchange of plasma proteins and macromolecules between blood and hepatocytes.
Kupffer Cells Kupffer cells are resident macrophages that line the hepatic sinusoids.
They phagocytose bacteria and particulate matter from portal blood.
This function is a key defense mechanism against gut-derived pathogens.
Bile Secretion and Transport Bile Flow Pathway Bile is secreted by hepatocytes.
The flow pathway is:
B i l e c a n a l i c u l i → B i l e d u c t s → G H a e l p l a b t l i a c d d d e u r c t ( s → t o C r o a m g m e o ) n ← b → i l D e ↓ u o d d u e c n t u m ( e n t r y ) Functions of Bile Bile serves two main functions:
Fat digestion: Bile salts emulsify fats, increasing surface area for pancreatic lipase action Waste excretion: Bilirubin, cholesterol, and xenobiotics are excreted in bile Gallbladder Storage The gallbladder stores and concentrates bile between meals.
After a fatty meal, bile is released into the duodenum via gallbladder contraction.
Metabolic Functions of the Liver Carbohydrate Metabolism The liver maintains blood glucose homeostasis.
It performs the following:
Converts glucose to glycogen for storage (glycogenesis) Breaks down glycogen to release glucose (glycogenolysis) Performs gluconeogenesis from non-carbohydrate precursors (amino acids, lactate, glycerol) The liver contains glucose-6-phosphatase, allowing it to release free glucose into blood.
This is in contrast to muscle, which lacks this enzyme.
Protein Metabolism The liver is the primary site of amino acid metabolism.
Key functions:
Transamination: Transfers amino groups between amino acids and keto acids Deamination: Removes amino groups for urea synthesis Urea synthesis: Converts toxic ammonia to urea for excretion Synthesis: Produces most plasma proteins (albumin, fibrinogen, clotting factors) Clotting Factor Synthesis The liver synthesizes all plasma albumin, fibrinogen, and most globulins.
Vitamin K-dependent clotting factors synthesized by the liver include:
Factor II (prothrombin) Factor VII Factor IX Factor X These factors require vitamin K-dependent carboxylation for biological activity.
Lipid Metabolism The liver:
Synthesizes cholesterol and phospholipids Packages lipids into lipoproteins (VLDL, HDL) Performs beta-oxidation of fatty acids Converts excess acetyl-CoA to ketone bodies (ketogenesis) Storage Functions Glycogen Storage The liver can store up to 500 grams of glycogen.
Glycogen provides a rapidly accessible source of glucose during fasting.
Vitamin and Mineral Storage The liver stores:
Substance Storage Form Vitamin A Retinyl esters Vitamin D 25-hydroxyvitamin D Vitamin E Tocopherol Vitamin K Phylloquinone Vitamin B₁₂ Transcobalamin-bound Iron Ferritin Copper Ceruloplasmin Detoxification and Biotransformation First-Pass Metabolism Drugs and toxins absorbed from the GI tract pass through the liver before entering systemic circulation.
This is called first-pass metabolism.
As a result, many drugs have reduced bioavailability when taken orally.
Phase I and Phase II Reactions The liver metabolizes drugs and toxins through two main reaction types:
Phase I reactions (Functionalization):
Oxidation, reduction, hydrolysis Primarily via cytochrome P450 enzymes May activate or inactivate compounds Phase II reactions (Conjugation):
Glucuronidation, sulfation, acetylation, glutathione conjugation Generally increases water solubility for excretion Hormone Metabolism The liver metabolizes:
Insulin (degradation) Steroid hormones (estrogen, testosterone, cortisol) Thyroid hormones Various other circulating hormones Dietary Balances and Energy Regulation Energy Balance Proteins, carbohydrates, and fats provide energy for body functions or for storage.
Stability of body weight requires energy intake to equal energy expenditure.
When overfed and energy intake persistently exceeds expenditure, excess energy is stored as fat.
Body weight increases.
Conversely, loss of body mass occurs when energy intake is insufficient.
Energy Available in Foods Substance Energy per Gram Absorption Rate Carbohydrate 4.1 Calories ~98% Fat 9.3 Calories ~95% Protein 4.35 Calories ~92% Average physiologically available energy per gram:
Foodstuff Calories per Gram Carbohydrate ~4 Fat ~9 Protein ~4 Protein Requirements Daily Protein Requirement Twenty to 30 grams of body proteins are degraded daily.
All cells must form new proteins to replace those being destroyed.
An average person can maintain normal protein stores if daily intake is greater than 30–50 grams.
Protein Quality Some proteins have inadequate quantities of certain essential amino acids.
These cannot be used to replace degraded proteins.
Such proteins are called partial proteins.
Proteins derived from animal foodstuffs are generally more complete than vegetable proteins.
Kwashiorkor Kwashiorkor is a form of severe protein malnutrition.
Example: Corn protein has inadequate amounts of tryptophan and lysine.
Individuals consuming cornmeal as their principal protein source may develop kwashiorkor.
Kwashiorkor symptoms:
Failure to grow Lethargy Depressed mentality Edema (caused by low plasma protein concentration) Complementary Proteins Food legumes provide relatively rich sources of tryptophan and lysine.
But legumes contain inadequate amounts of methionine.
The proteins of corn and legumes complement each other.
Together they provide all essential amino acids.
Protein Sparing Effect When the diet contains abundant carbohydrates and fats, almost all body energy is derived from these substances.
Little energy is derived from proteins.
Therefore, carbohydrates and fats are said to be protein sparers.
In starvation, after carbohydrates and fats are depleted, protein stores are consumed rapidly for energy.
This can approach several hundred grams per day rather than the normal 30–50 grams.
Methods for Determining Metabolic Utilization Respiratory Quotient The respiratory quotient (RQ) is the ratio of carbon dioxide production to oxygen utilization.
It estimates fat and carbohydrate utilization.
Substrate Respiratory Quotient Carbohydrate 1.0 Fat 0.70 Protein 0.80 When carbohydrates are metabolized with oxygen, exactly one CO₂ molecule is formed per O₂ molecule consumed.
When fat is oxidized, an average of 70 CO₂ molecules are formed per 100 O₂ molecules consumed.
The RQ for fats and proteins is lower because some oxygen is required to combine with excess hydrogen atoms.

SENSE OF TASTE (Content from Chapter 54 appears to be in this file)
Taste is mainly a function of the taste buds in the mouth.
The sense of smell also contributes strongly to taste perception.
Additionally, the texture of food detected by tactual senses of the mouth, and the presence of substances that stimulate pain endings (such as pepper), greatly alter the taste experience.
Importance of Taste The importance of taste lies in the fact that it allows a person to select food in accord with desires.
It also allows selection in accord with the body tissues’ metabolic need for specific substances.
PRIMARY TASTE SENSATIONS The identities of the many specific chemicals that excite different taste receptors are not all known.
For practical analysis, the primary sensations of taste have been grouped into five general categories:
Sour Salty Sweet Bitter Umami A person can perceive hundreds of different tastes. All are thought to be combinations of the elementary taste sensations, just as all colors we can see are combinations of the three primary colors.
Sour Taste The sour taste is caused by acids (hydrogen ion concentration).
The intensity of this taste sensation is approximately proportional to the logarithm of the hydrogen ion concentration.
The more acidic the food, the stronger the sour sensation becomes.
Salty Taste The salty taste is elicited by ionized salts, mainly by the sodium ion concentration.
The quality of the taste varies somewhat from one salt to another because some salts elicit other taste sensations in addition to saltiness.
The cations of the salts, especially sodium cations, are mainly responsible for the salty taste.
The anions also contribute to a lesser extent.
Sweet Taste The sweet taste is not caused by any single class of chemicals.
Some of the types of chemicals that cause this taste include:
Sugars Glycols Alcohols Aldehydes Ketones Amides Esters Some amino acids Some small proteins Sulfonic acids Halogenated acids Inorganic salts of lead and beryllium Most substances that cause a sweet taste are organic chemicals.
It is especially interesting that slight changes in chemical structure can often change the substance from sweet to bitter.
Bitter Taste The bitter taste, like the sweet taste, is not caused by any single type of chemical agent.
The substances that give the bitter taste are almost entirely organic substances.
Two particular classes of substances are especially likely to cause bitter taste sensations:
Long-chain organic substances that contain nitrogen Alkaloids The alkaloids include many drugs used in medicines, such as:
Quinine Caffeine Strychnine Nicotine Some substances that initially taste sweet have a bitter aftertaste. This is true of saccharin.
High concentrations of salts may also result in a bitter taste.
Function of bitter taste: When it occurs in high intensity, it usually causes the person or animal to reject the food.
This is an important protective function because many deadly toxins found in poisonous plants are alkaloids.
Virtually all these alkaloids cause an intensely bitter taste.
Umami Taste Umami is a Japanese word meaning “delicious.”
It designates a pleasant taste sensation that is qualitatively different from sour, salty, sweet, or bitter.
Umami is the dominant taste of food containing L-glutamate, such as meat extracts and aging cheese.
The pleasurable sensation of umami taste is thought to be important for nutrition by promoting ingestion of proteins.
THRESHOLD FOR TASTE Taste Substance Molar Threshold Sour Hydrochloric acid 0.0009 M Salty Sodium chloride 0.01 M Sweet Sucrose 0.01 M Bitter Quinine 0.000008 M The bitter taste sense is much more sensitive than all the others.
This provides an important protective function against many dangerous toxins in food.
Taste Blindness Some people are taste blind for certain substances, especially for different types of thiourea compounds.
A substance used frequently for demonstrating taste blindness is phenylthiocarbamide.
About 15% to 30% of all people exhibit taste blindness for this substance.
The exact percentage depends on the method of testing and the concentration of the substance.
TASTE BUDS AND THEIR FUNCTION Structure of Taste Buds A taste bud has:
Diameter of about 1/30 of a millimeter Length of about 1/16 of a millimeter The taste bud is composed of epithelial cells:
Supporting cells called sustentacular cells Taste cells There are about 50 taste cells in each taste bud.
The taste cells are continually being replaced by mitotic division of surrounding epithelial cells.
Life span of taste cells:
Average: about 10 days Some eliminated in only 2 days Others may survive for over 3 weeks Taste Pore and Microvilli The outer tips of the taste cells are arranged around a minute taste pore.
From the tip of each taste cell, several microvilli (taste hairs) protrude outward into the taste pore.
These microvilli provide the receptor surface for taste.
Nerve Supply Interwoven around the bodies of the taste cells is a branching terminal network of taste nerve fibers that are stimulated by the taste receptor cells.
Some fibers invaginate into folds of the taste cell membranes.
Many vesicles form beneath the cell membrane near the fibers.
These vesicles are believed to contain neurotransmitter substance that is released to excite the nerve fiber endings in response to taste stimulation.
Location of Taste Buds The taste buds are found on three types of papillae of the tongue:
Papilla Type Location Number Circumvallate papillae Walls of troughs surrounding papillae; form a V line on posterior tongue Large number Foliate papillae Folds along lateral surfaces of the tongue Moderate number Fungiform papillae Flat anterior surface of the tongue Moderate number Additional taste buds are located on the palate, and a few are found on the tonsillar pillars.
RELATIVE TASTE INDICES Table 54-1 lists the relative taste indices (reciprocals of the taste thresholds) of different substances.
The intensities of four primary sensations are referred to the intensities of:
Hydrochloric acid (sour) Quinine (bitter) Sucrose (sweet) Sodium chloride (salty) Each is arbitrarily chosen to have a taste index of 1.

                     data-permalink="/guyton/guyton/ch26_the-urinary-system---functional-anatomy-and-urine-formation-by-the-kidneys/"
                     data-content="Introduction Most people are familiar with one important function of the kidneys—to rid the body of waste materials. These waste materials are ingested or produced by metabolism.
A second function that is especially critical is to control the volume and electrolyte composition of the body fluids. For water and virtually all electrolytes in the body, the balance between intake and output is maintained largely by the kidneys.
This regulatory function maintains the stable internal environment necessary for cells to perform their various activities. The kidneys perform their most critical functions by filtering the plasma and removing substances from the filtrate at variable rates, depending on the needs of the body.
Multiple Functions of the Kidneys The kidneys serve many important homeostatic functions, including:
Excretion of metabolic waste products and foreign chemicals Regulation of water and electrolyte balances Regulation of body fluid osmolality and electrolyte concentrations Regulation of arterial pressure Regulation of acid-base balance Regulation of erythrocyte production Secretion, metabolism, and excretion of hormones Gluconeogenesis Excretion of Metabolic Waste Products The kidneys are the primary means for eliminating most of the waste products of metabolism. These products include:
Urea: from the metabolism of amino acids Creatinine: from muscle creatine Uric acid: from nucleic acids Bilirubin: end products of hemoglobin breakdown Hormone metabolites: from various hormones The kidneys also eliminate most toxins and other foreign substances, including pesticides, drugs, and food additives.
Regulation of Water and Electrolyte Balances For maintenance of homeostasis, excretion of water and electrolytes must match intake precisely. If intake exceeds excretion, the amount of that substance in the body will increase. If intake is less than excretion, the amount of that substance in the body will decrease.
Although temporary imbalances may occur, the maintenance of life depends on restoration of water and electrolyte balance. Intake of water and many electrolytes is usually governed by a person’s eating and drinking habits. This requires the kidneys to adjust their excretion rates to match the intakes.
Figure 26-1 shows the response of the kidneys to a sudden 10-fold increase in sodium intake. Sodium intake increases from a low level of 30 mEq/day to a high level of 300 mEq/day. Within 2 to 3 days after raising sodium intake, renal excretion also increases to about 300 mEq/day, and balance between intake and output is rapidly re-established.
During the 2 to 3 days of renal adaptation, there is a modest accumulation of sodium. This raises extracellular fluid volume slightly and also triggers hormonal changes and other compensatory responses that signal the kidneys to increase their sodium excretion.
The capability of the kidneys to alter sodium excretion in response to changes in sodium intake is tremendous. Sodium intake can be increased to 1500 mEq/day (more than 10 times normal) or decreased to 10 mEq/day (&lt;0.1 of normal), with relatively small changes in extracellular fluid volume or plasma sodium concentration occurring.
This phenomenon is also true for water and for most other electrolytes, including chloride, potassium, calcium, hydrogen, magnesium, and phosphate ions.
Regulation of Arterial Pressure The kidneys play a dominant role in long-term regulation of arterial pressure by excreting variable amounts of sodium and water.
The kidneys also contribute to short-term arterial pressure regulation by secreting hormones and vasoactive factors or substances (e.g., renin). This leads to the formation of vasoactive products (e.g., angiotensin II).
Regulation of Acid–Base Balance The kidneys contribute to acid–base regulation, along with the lungs and body fluid buffers, by excreting acids and by regulating the body fluid buffer stores.
The kidneys are the only means of eliminating certain types of acids from the body, including sulfuric acid and phosphoric acid, which are generated by the metabolism of proteins.
Regulation of Erythrocyte Production The kidneys secrete erythropoietin, which stimulates production of red blood cells by hematopoietic stem cells in the bone marrow. One important stimulus for erythropoietin secretion is hypoxia.
The kidneys normally account for almost all the erythropoietin secreted into the circulation. In people with severe kidney disease or who have had their kidneys removed and placed on hemodialysis, severe anemia develops as a result of decreased erythropoietin production.
Regulation of 1,25-Dihydroxyvitamin D3 Production The kidneys produce 1,25-dihydroxyvitamin D3 (calcitriol), the active form of vitamin D, by hydroxylating vitamin D at the “number 1” position. Calcitriol is essential for:
Normal calcium deposition in bone Calcium reabsorption by the gastrointestinal tract Calcitriol plays an important role in calcium and phosphate regulation.
Glucose Synthesis The kidneys synthesize glucose from amino acids and other precursors during prolonged fasting. This process is referred to as gluconeogenesis. The kidneys’ capacity to add glucose to the blood during prolonged periods of fasting rivals that of the liver.
Effects of Chronic Kidney Disease With chronic kidney disease or acute failure of the kidneys, these homeostatic functions are disrupted, and severe abnormalities of body fluid volumes and composition rapidly occur.
With complete renal failure, enough potassium, acids, fluid, and other substances accumulate in the body to cause death within a few days unless clinical interventions such as hemodialysis are initiated. These interventions restore, at least partially, the body fluid and electrolyte balances.
Physiologic Anatomy of the Kidneys General Organization of the Kidneys and Urinary Tract The two kidneys lie on the posterior wall of the abdomen, outside the peritoneal cavity. Each kidney of the adult human weighs about 150 grams and is about the size of a clenched fist.
The medial side of each kidney contains an indented region called the hilum. Through the hilum pass:
Renal artery and vein Lymphatics Nerve supply Ureter (which carries final urine from the kidney to the bladder) The kidney is surrounded by a tough fibrous capsule, which protects its delicate inner structures.
Internal Structure of the Kidney If the kidney is bisected from top to bottom, two major regions can be visualized:
Outer cortex Inner medulla The medulla is divided into 8 to 10 cone-shaped masses of tissue called renal pyramids. The base of each pyramid originates at the border between the cortex and medulla. It terminates in the papilla, which projects into the space of the renal pelvis.
The renal pelvis is a funnel-shaped continuation of the upper end of the ureter. The outer border of the pelvis is divided into open-ended pouches called major calyces, which extend downward and divide into minor calyces. The minor calyces collect urine from the tubules of each papilla.
The walls of the calyces, pelvis, and ureter contain contractile elements that propel the urine toward the bladder. Urine is stored in the bladder until it is emptied by micturition.
Urine Formation Results From Glomerular Filtration, Tubular Reabsorption, and Tubular Secretion The rates at which different substances are excreted in the urine represent the sum of three renal processes:
Glomerular filtration: of substances in the blood Reabsorption: of substances from the renal tubules into the blood Secretion: of substances from the blood into the renal tubules The urinary excretion rate is calculated as:
U r i n a r y e x c r e t i o n r a t e = F i l t r a t i o n r a t e − R e a b s o r p t i o n r a t e &#43; S e c r e t i o n r a t e Four Patterns of Renal Handling Pattern A: The substance is freely filtered by the glomerular capillaries but is neither reabsorbed nor secreted. Therefore, its excretion rate equals the rate at which it was filtered. Certain waste products, such as creatinine, are handled by the kidneys in this manner.
Pattern B: The substance is freely filtered but is also partly reabsorbed from the tubules back into the blood. Therefore, the rate of urinary excretion is less than the rate of filtration at the glomerular capillaries. This pattern is typical for many electrolytes.
Pattern C: The substance is freely filtered at the glomerular capillaries but is not excreted into the urine. All the filtered substance is reabsorbed from the tubules back into the blood. This pattern occurs for some nutritional substances, such as amino acids and glucose.
Pattern D: The substance is freely filtered at the glomerular capillaries and is not reabsorbed. Additional quantities of this substance are secreted from the peritubular capillary blood into the renal tubules. This pattern often occurs for organic acids and bases.
Filtration, Reabsorption, and Secretion of Different Substances In general, tubular reabsorption is quantitatively more important than tubular secretion in the formation of urine. However, secretion plays an important role in determining the amounts of potassium and hydrogen ions that are excreted.
Most waste products are poorly reabsorbed and are therefore excreted in large amounts in the urine. Conversely, electrolytes such as sodium ions, chloride ions, and bicarbonate ions are highly reabsorbed, with only small amounts appearing in the urine.
Each of the processes—glomerular filtration, tubular reabsorption, and tubular secretion—is regulated according to the needs of the body.
Why Are Large Amounts of Solutes Filtered and Then Reabsorbed? One advantage of a high GFR is that it allows the kidneys to remove waste products rapidly from the body.
A second advantage is that it allows all the body fluids to be filtered and processed by the kidneys many times each day. Because the entire plasma volume is only about 3 liters, whereas the GFR is about 180 L/day, the entire plasma can be filtered and processed about 60 times each day.
Summary of Renal Processes Process Description Glomerular filtration Blood pressure forces fluid and solutes through glomerular capillaries into Bowman’s capsule Tubular reabsorption Selected substances move from tubule lumen through tubular cells into peritubular capillaries Tubular secretion Selected substances move from peritubular capillaries into tubular lumen Urinary Excretion Equation U r i n a r y e x c r e t i o n = G l o m e r u l a r f i l t r a t i o n − T u b u l a r r e a b s o r p t i o n &#43; T u b u l a r s e c r e t i o n "></div><div data-title="Thyroid Metabolic Hormones"

                     data-content="THYROID HORMONE EFFECTS ON BODY SYSTEMS Effects on Carbohydrate Metabolism Thyroid hormones stimulate almost all aspects of carbohydrate metabolism.
This includes:
Increased glucose uptake from the intestine Enhanced glycolysis and gluconeogenesis Increased insulin secretion Increased glucose storage as glycogen Effects on Lipid Metabolism Thyroid hormones stimulate fat mobilization and oxidation in adipose tissue.
This leads to increased fatty acid levels in the plasma.
They also stimulate cholesterol synthesis and excretion, resulting in decreased plasma cholesterol levels.
Protein Metabolism and Growth Thyroid hormones are necessary for normal growth and skeletal development.
They stimulate protein synthesis and skeletal growth.
However, excess thyroid hormones cause muscle wasting and weakness.
HYPOTHYROIDISM Hypothyroidism is the condition of thyroid hormone deficiency.
In areas of the world with adequate iodine, the most common cause is autoimmune thyroiditis (Hashimoto disease).
Myxedema In the adult, severe hypothyroidism leads to myxedema, characterized by:
Thickened, nonpitting edema of the skin Weight gain Cold intolerance Decreased heart rate Decreased cardiac output Lethargy and mental slowing Dry, coarse skin and hair Constipation Treatment of Hypothyroidism The treatment of hypothyroidism is straightforward: administration of thyroxine (T4).
Because thyroxine has a long half-life (about 7 days), it need be given only once a day.
The time for achieving a steady state of thyroid hormone concentration in the blood is more than 1 month.
Consequently, a steady level of thyroid hormone activity is easily maintained in the body via daily oral ingestion of one or more tablets containing thyroxine.
Furthermore, proper treatment of hypothyroidism results in such complete normality that formerly myxedematous patients have lived into their 90s after undergoing treatment for more than 50 years.
CRETINISM Cretinism is caused by extreme hypothyroidism during fetal life, infancy, or childhood.
This condition is characterized especially by failure of body growth and by mental retardation.
It results from:
Congenital lack of a thyroid gland (congenital cretinism) Failure of the thyroid gland to produce thyroid hormone because of a genetic defect of the gland Lack of iodine in the diet (endemic cretinism) Clinical Features of Cretinism A neonate without a thyroid gland may have a normal appearance and function because she or he was supplied with some (but usually not enough) thyroid hormone by the mother while in utero.
A few weeks after birth, however, the neonate’s movements become sluggish and both physical and mental growth begin to be greatly retarded.
Treatment of the neonate with cretinism at any time with adequate iodine or thyroxine usually causes normal return of physical growth.
Unless the cretinism is treated within a few weeks after birth, mental growth remains permanently retarded.
This state results from retardation of the growth, branching, and myelination of the neuronal cells of the central nervous system at this critical time in the normal development of the mental powers.
Skeletal Growth in Cretinism Skeletal growth in a child with cretinism is characteristically more inhibited than is soft tissue growth.
As a result of this disproportionate rate of growth, the soft tissues are likely to enlarge excessively, giving the child with cretinism an obese, stocky, and short appearance.
Occasionally the tongue becomes so large in relation to the skeletal growth that it obstructs swallowing and breathing, inducing a characteristic guttural breathing that sometimes chokes the child.
HYPERTHYROIDISM Hyperthyroidism is the condition of excess thyroid hormone secretion.
The most common cause is Graves disease, an autoimmune condition in which thyroid-stimulating immunoglobulins (TSI) activate TSH receptors on thyroid follicular cells.
Symptoms and Signs Hyperthyroidism causes:
Heat intolerance and sweating Weight loss despite increased appetite Tachycardia and palpitations Tremor Anxiety and irritability Frequent bowel movements Warm, moist skin Eyelid retraction and stare (Graves ophthalmopathy) Thyrotoxic Heart Disease Prolonged thyrotoxicosis can lead to cardiac arrhythmias, especially atrial fibrillation, and high-output heart failure.
THYROID GLAND DYSFUNCTION COMPARISON Feature Hypothyroidism Hyperthyroidism BMR Decreased Increased Heart Rate Slow (bradycardia) Fast (tachycardia) Body Temperature Cold intolerance Heat intolerance Weight Gain Loss Skin Dry, cool Warm, moist Mental Status Lethargy Anxiety, irritability Myxedema Present (adult) Absent Associated Condition Hashimoto disease Graves disease MECHANISMS OF THYROID HORMONE ACTION Genomic Mechanism Thyroid hormones act primarily through nuclear receptors.
T3 binds to thyroid hormone receptors (TRα and TRβ) with higher affinity than T4.
The hormone-receptor complex then binds to thyroid hormone response elements (TREs) in the promoters of target genes, regulating transcription.
Effects on Mitochondria Thyroid hormones increase mitochondrial activity and biogenesis.
This leads to increased ATP production and heat generation (non-shivering thermogenesis).
Effects on Na&#43;/K&#43; ATPase Thyroid hormones stimulate Na&#43;/K&#43; ATPase activity in cell membranes.
This increases energy expenditure and contributes to the increased basal metabolic rate.
Effects on Uncoupling Proteins Thyroid hormones increase expression of uncoupling proteins (UCPs), particularly UCP1 in brown adipose tissue.
This causes proton leak across the inner mitochondrial membrane, converting energy into heat.
"></div><div data-title="Transport of Oxygen and Carbon Dioxide in Blood and Tissue Fluids" 
                     data-book=""
                     data-category=""
                     data-permalink="/guyton/guyton/ch41_transport-of-oxygen-and-carbon-dioxide-in-blood-and-tissue-fluids/"
                     data-content="CARBON DIOXIDE DISSOCIATION CURVE The CO2 dissociation curve (Figure 41-14) depicts the dependence of total blood CO2 in all its forms on PCO2.
The normal blood PCO2 is within a narrow range:
Arterial blood: 40 mm Hg Venous blood: 45 mm Hg The normal concentration of CO2 in the blood in all its different forms is about 50 volume percent.
During normal transport of CO2 from tissues to lungs, only 4 volume percent is exchanged:
Concentration rises to ~52 volume percent as blood passes through tissues Concentration falls to ~48 volume percent as blood passes through lungs WHEN OXYGEN BINDS WITH HEMOGLOBIN, CO2 IS RELEASED (THE HALDANE EFFECT) An increase in CO2 in the blood causes O2 to be displaced from hemoglobin (the Bohr effect), which is an important factor in increasing O2 transport.
The reverse is also true: binding of O2 with hemoglobin tends to displace CO2 from the blood.
This effect is called the Haldane effect, and it is quantitatively far more important in promoting CO2 transport than the Bohr effect is in promoting O2 transport.
Mechanism of the Haldane Effect The Haldane effect results from the simple fact that the combination of O2 with hemoglobin in the lungs causes the hemoglobin to become a stronger acid.
This displaces CO2 from the blood into the alveoli in two ways:
Mechanism Description Carbaminohemoglobin displacement The more highly acidic hemoglobin has less tendency to combine with CO2, displacing CO2 from the carbamino form Bicarbonate conversion Increased acidity causes hemoglobin to release excess H&#43;, which binds with HCO3− to form carbonic acid, dissociating into water and CO2 The CO2 is then released from the blood into the alveoli and finally into the air.
Quantitative Significance of the Haldane Effect Figure 41-15 demonstrates the significance of the Haldane effect on CO2 transport from tissues to lungs.
The figure shows two CO2 dissociation curves:
PO2 = 100 mm Hg — in the blood capillaries of the lungs PO2 = 40 mm Hg — in the tissue capillaries At point A: The normal PCO2 of 45 mm Hg in the tissues causes 52 volume percent of CO2 to combine with the blood.
On entering the lungs:
PCO2 falls to 40 mm Hg PO2 rises to 100 mm Hg Without the Haldane effect: CO2 content would fall only to 50 volume percent (loss of only 2 volume percent).
With the Haldane effect: The increase in PO2 lowers the CO2 dissociation curve, so CO2 content falls to 48 volume percent (point B).
Conclusion: The Haldane effect approximately doubles the amount of CO2 released from blood in the lungs and doubles the amount of CO2 picked up in the tissues.
CHANGE IN BLOOD ACIDITY DURING CO2 TRANSPORT The carbonic acid formed when CO2 enters the blood in peripheral tissues decreases blood pH.
Reaction of this acid with the acid-base buffers of the blood prevents H&#43; concentration from rising very much (and pH from falling very much).
Normal pH Changes Condition pH Value Arterial blood ~7.41 Venous blood (after tissue capillaries) ~7.37 The pH change during normal conditions is only 0.04 unit.
When CO2 is released from blood in the lungs, pH rises back to 7.41.
Heavy Exercise or Sluggish Blood Flow During heavy exercise or other conditions of high metabolic activity, or when blood flow through the tissues is sluggish:
The decrease in pH in tissue blood can be as much as 0.50 This is about 12 times normal This causes significant tissue acidosis RESPIRATORY EXCHANGE RATIO Normal transport from lungs to tissues by each 100 ml of blood:
O2 transported: ~5 ml CO2 transported: ~4 ml Under normal resting conditions, only about 82% as much CO2 is expired from the lungs as O2 is taken up by the lungs.
Definition The ratio of CO2 output to O2 uptake is called the respiratory exchange ratio (R):
R = R a t e o f c a r b o n d i o x i d e o u t p u t / R a t e o f o x y g e n u p t a k e R Values Under Different Metabolic Conditions Metabolic Condition R Value Carbohydrates exclusively 1.00 Fats exclusively 0.70 Normal mixed diet 0.825 Explanation of R Value Differences When O2 is metabolized with carbohydrates, one molecule of CO2 is formed for each molecule of O2 consumed.
When O2 reacts with fats, a large share of the O2 combines with hydrogen atoms from the fats to form water instead of CO2.
Thus, when fats are metabolized, the respiratory quotient of the tissue chemical reactions is about 0.70 instead of 1.00.
For a person on a normal diet consuming average amounts of carbohydrates, fats, and proteins, the average value for R is 0.825.
RESPIRATORY CENTER The nervous system normally adjusts the rate of alveolar ventilation to meet the demands of the body almost exactly.
The result is that oxygen partial pressure (PO2) and carbon dioxide partial pressure (PCO2) in arterial blood are hardly altered, even during heavy exercise and most other types of respiratory stress.
Components of the Respiratory Center The respiratory center is composed of several groups of neurons located bilaterally in the medulla oblongata and pons of the brain stem.
It is divided into three major collections of neurons:
Collection Location Primary Function Dorsal respiratory group Dorsal portion of the medulla Mainly causes inspiration Ventral respiratory group Ventrolateral part of the medulla Mainly causes expiration Pneumotaxic center Dorsally in the superior portion of the pons Controls rate and depth of breathing DORSAL RESPIRATORY GROUP OF NEURONS — CONTROLS INSPIRATION AND RESPIRATORY RHYTHM The dorsal respiratory group of neurons plays a fundamental role in the control of respiration.
It extends most of the length of the medulla.
Most of its neurons are located in the nucleus of the tractus solitarius (NTS), although additional neurons in the adjacent reticular substance of the medulla also play important roles.
The NTS is the sensory termination of both the vagal and the glossopharyngeal nerves, which transmit sensory signals into the respiratory center from:
Peripheral chemoreceptors Baroreceptors Receptors in the liver, pancreas, and multiple parts of the gastrointestinal tract Several types of receptors in the lungs Rhythmical Inspiratory Discharges The basic rhythm of respiration is generated mainly in the dorsal respiratory group of neurons.
Even when all peripheral nerves entering the medulla have been sectioned, and the brain stem has been transected above and below the medulla, this group of neurons still emits repetitive bursts of inspiratory neuronal action potentials.
The basic cause of these repetitive discharges is unknown.
In primitive animals, neural networks have been found in which:
Activity of one set of neurons excites a second set The second set inhibits the first After a period of time, the mechanism repeats itself Similar networks of neurons are present in humans, located entirely within the medulla.
These networks probably involve not only the dorsal respiratory group but adjacent areas of the medulla as well, and are responsible for the basic rhythm of respiration.
Inspiratory “Ramp” Signal The nervous signal transmitted to the inspiratory muscles (mainly the diaphragm) is not an instantaneous burst of action potentials.
Instead, it has the following characteristics:
Begins weakly Increases steadily in a ramp manner for ~2 seconds in normal respiration Then ceases abruptly for ~3 seconds The cessation turns off diaphragm excitation and allows elastic recoil of the lungs and chest wall to cause expiration.
Then the cycle repeats.
Advantage of the ramp signal: It causes a steady increase in lung volume during inspiration, rather than inspiratory gasps.
Two Controllable Qualities of the Inspiratory Ramp Quality Control Mechanism Effect Rate of increase Controls how rapidly the ramp rises During heavy respiration, the ramp increases rapidly, filling the lungs rapidly Limiting point Controls when the ramp ceases Earlier cessation → shorter inspiration → shorter expiration → increased respiratory frequency PNEUMOTAXIC CENTER — LIMITS DURATION OF INSPIRATION AND INCREASES RESPIRATORY RATE The pneumotaxic center is located dorsally in the nucleus parabrachialis of the upper pons.
It transmits signals to the inspiratory area.
Primary effect: Controls the “switch-off” point of the inspiratory ramp, thereby controlling the duration of the filling phase of the lung cycle.
Effect of Signal Strength Signal Strength Inspiration Duration Lung Fill Strong As little as 0.5 second Slight filling Weak 5 or more seconds Much greater filling Function of the Pneumotaxic Center The function of the pneumotaxic center is primarily to limit inspiration.
This has a secondary effect of increasing the rate of breathing because limitation of inspiration also shortens expiration and the entire period of each respiration.
Strong pneumotaxic signal: Can increase rate to 30–40 breaths/min Weak pneumotaxic signal: May reduce rate to only 3–5 breaths/min VENTRAL RESPIRATORY GROUP OF NEURONS — FUNCTIONS IN BOTH INSPIRATION AND EXPIRATION Located in each side of the medulla, about 5 millimeters anterior and lateral to the dorsal respiratory group of neurons, is the ventral respiratory group of neurons.
It is found in:
The nucleus ambiguus (rostrally) The nucleus retroambiguus (caudally) Differences from Dorsal Respiratory Group Function Dorsal Group Ventral Group Normal quiet respiration Active; causes inspiration via diaphragm Almost totally inactive Expiration in quiet breathing Results from elastic recoil No active participation Basic rhythmical oscillation Primary driver Does not participate During increased ventilation demand Base oscillation Receives spill-over signals; contributes extra drive Response to stimulation Causes inspiration Some cause inspiration, others cause expiration Key Points Normal quiet breathing is caused only by repetitive inspiratory signals from the dorsal respiratory group transmitted mainly to the diaphragm. Expiration results from elastic recoil.
The ventral respiratory neurons do not appear to participate in the basic rhythmical oscillation that controls respiration.
When the respiratory drive for increased pulmonary ventilation becomes greater than normal, respiratory signals spill over into the ventral respiratory neurons from the basic oscillating mechanism of the dorsal respiratory area.
Electrical stimulation of some neurons in the ventral group causes inspiration; stimulation of others causes expiration.
The ventral group provides powerful expiratory signals to the abdominal muscles during very heavy expiration. Thus, this area operates as an overdrive mechanism when high levels of pulmonary ventilation are required, especially during heavy exercise.
LUNG INFLATION SIGNALS LIMIT INSPIRATION — THE HERING-BREUER INFLATION REFLEX In addition to central nervous system respiratory control mechanisms operating within the brain stem, sensory nerve signals from the lungs also help control respiration.
Stretch Receptors Located in the muscular portions of the walls of the bronchi and bronchioles throughout the lungs are stretch receptors.
When the lungs become overstretched, these receptors transmit signals through the vagi into the dorsal respiratory group of neurons.
Effect on Inspiration These signals affect inspiration similarly to signals from the pneumotaxic center.
When the lungs become overinflated, the stretch receptors activate a feedback response that “switches off” the inspiratory ramp and stops further inspiration.
This mechanism is called the Hering-Breuer inflation reflex.
This reflex also increases the rate of respiration, as is true for signals from the pneumotaxic center.
Activation Threshold in Humans In humans, the Hering-Breuer reflex is probably not activated until the tidal volume increases to more than three times normal (&gt;1.5 L/breath).
Therefore, this reflex appears to be mainly a protective mechanism for preventing excess lung inflation rather than an important factor in normal control of ventilation.
CONTROL OF OVERALL RESPIRATORY CENTER ACTIVITY Up to this point, the basic mechanisms for causing inspiration and expiration have been discussed.
It is also important to know how the intensity of the respiratory control signals is increased or decreased to match the ventilatory needs of the body.
For example, during heavy exercise, the rates of O2 usage and CO2 production increase dramatically.
The respiratory center must adjust accordingly to maintain proper blood gas levels.
Factors Affecting Respiratory Center Activity Metabolic rate of tissues Level of physical activity Blood pH and CO2 levels Oxygen levels in arterial blood "></div><div data-title="Transport of Substances Through Cell Membranes"

                     data-content="EXTRACELLULAR AND INTRACELLULAR FLUID COMPOSITIONS Figure 4-1 lists the approximate concentrations of important electrolytes and other substances in the extracellular fluid and intracellular fluid.
Note that the extracellular fluid contains a large amount of sodium but only a small amount of potassium. The opposite is true of the intracellular fluid.
Also, the extracellular fluid contains a large amount of chloride ions, whereas the intracellular fluid contains very little of these ions.
However, the concentrations of phosphates and proteins in the intracellular fluid are considerably greater than those in the extracellular fluid.
These differences are extremely important to the life of the cell.
The purpose of this chapter is to explain how the differences are brought about by the cell membrane transport mechanisms.
THE CELL MEMBRANE: A LIPID BILAYER WITH TRANSPORT PROTEINS The structure of the membrane covering the outside of every cell of the body is discussed in Chapter 2 and illustrated in Figure 2-3 and Figure 4-2.
This membrane consists almost entirely of a lipid bilayer with large numbers of protein molecules in the lipid, many of which penetrate all the way through the membrane.
The lipid bilayer is not miscible with the extracellular fluid or the intracellular fluid. Therefore, it constitutes a barrier against movement of water molecules and water-soluble substances between the extracellular and intracellular fluid compartments.
However, lipid-soluble substances can diffuse directly through the lipid substance, as shown in Figure 4-2.
TRANSPORT PROTEINS The membrane protein molecules interrupt the continuity of the lipid bilayer. They constitute an alternative pathway through the cell membrane.
Many of these penetrating proteins can function as transport proteins.
Channel Proteins Some proteins have watery spaces all the way through the molecule. They allow free movement of water, as well as selected ions or molecules. These proteins are called channel proteins.
Carrier Proteins Other proteins, called carrier proteins, bind with molecules or ions that are to be transported.
Conformational changes in the protein molecules then move the substances through the interstices of the protein to the other side of the membrane.
Channel proteins and carrier proteins are usually selective for the types of molecules or ions that are allowed to cross the membrane.
DIFFUSION VERSUS ACTIVE TRANSPORT Transport through the cell membrane occurs via one of two basic processes:
Diffusion (passive) Active transport (energy-dependent) Diffusion Diffusion means random molecular movement of substances molecule by molecule, either through intermolecular spaces in the membrane or in combination with a carrier protein.
The energy that causes diffusion is the energy of the normal kinetic motion of matter.
Active Transport Active transport means movement of ions or other substances across the membrane in combination with a carrier protein.
This movement causes the substance to move against an energy gradient, such as from a low-concentration state to a high-concentration state.
This movement requires an additional source of energy besides kinetic energy.
DIFFUSION All molecules and ions in the body fluids, including water molecules and dissolved substances, are in constant motion, with each particle moving in its separate way.
The motion of these particles is what physicists call “heat”—the greater the motion, the higher the temperature.
The motion never ceases, except at absolute zero temperature.
When a moving molecule approaches a stationary molecule, the electrostatic and other nuclear forces of the moving molecule repel the stationary one.
This transfers some of the energy of motion from the moving molecule to the stationary molecule.
Consequently, the stationary molecule gains kinetic energy of motion, whereas the moving molecule slows down.
As shown in Figure 4-3, a single molecule in a solution bounces among the other molecules—first in one direction, then another, then another, and so forth—randomly bouncing thousands of times each second.
This continual movement of molecules among one another in liquids or gases is called diffusion.
Ions diffuse in the same manner as whole molecules, and even suspended colloid particles diffuse in a similar manner.
However, colloids diffuse far less rapidly than molecular substances because of their large size.
DIFFUSION THROUGH THE CELL MEMBRANE Diffusion through the cell membrane is divided into two subtypes:
Simple diffusion Facilitated diffusion Simple Diffusion Simple diffusion means that kinetic movement of molecules or ions occurs through a membrane opening or through intermolecular spaces without interaction with carrier proteins in the membrane.
The rate of diffusion is determined by:
The amount of substance available The velocity of kinetic motion The number and sizes of openings in the membrane through which the molecules or ions can move Facilitated Diffusion Facilitated diffusion requires interaction of a carrier protein.
The carrier protein aids passage of molecules or ions through the membrane by binding chemically with them and shuttling them through the membrane in this form.
Pathways for Simple Diffusion Simple diffusion can occur through the cell membrane by two pathways:
Through the interstices of the lipid bilayer if the diffusing substance is lipid-soluble Through watery channels that penetrate all the way through some of the large transport proteins DIFFUSION OF LIPID-SOLUBLE SUBSTANCES The lipid solubility of a substance is an important factor for determining how rapidly it diffuses through the lipid bilayer.
For example, the lipid solubilities of oxygen, nitrogen, carbon dioxide, and alcohols are high.
All these substances can dissolve directly in the lipid bilayer and diffuse through the cell membrane in the same manner that diffusion of water solutes occurs in a watery solution.
The rate of diffusion of each of these substances through the membrane is directly proportional to its lipid solubility.
Especially large amounts of oxygen can be transported in this way. Therefore, oxygen can be delivered to the interior of the cell almost as though the cell membrane did not exist.
DIFFUSION OF WATER AND OTHER LIPID-INSOLUBLE MOLECULES Even though water is highly insoluble in the membrane lipids, it readily passes through channels in protein molecules that penetrate all the way through the membrane.
Many of the body’s cell membranes contain protein “pores” called aquaporins that selectively permit rapid passage of water through the membrane.
The aquaporins are highly specialized, and there are at least 13 different types in various cells of mammals.
The rapidity with which water molecules can diffuse through most cell membranes is astounding.
For example, the total amount of water that diffuses in each direction is very large.
