{{ define "main" }}
<header class="page-header">
    <h1>Guyton &amp; Hall 生理學 章節清單</h1>
</header>

<div class="chapters-wrapper">

{{ $files := sort (where (where .Site.RegularPages "Section" "guyton") "Params.chapter" "gt" "") "Params.chapter" }}

<table class="chapters-table">
<thead>
<tr>
  <th>章</th>
  <th>標題</th>
</tr>
</thead>
<tbody>
{{ range $files }}
<tr>
  <td class="ch-num">{{ .Params.chapter }}</td>
  <td class="ch-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></td>
</tr>
{{ end }}
</tbody>
</table>

</div>

<style>
.chapters-table { width: 100%; border-collapse: collapse; }
.chapters-table th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #3a86ff; color: #3a86ff; }
.chapters-table td { padding: 8px 12px; border-bottom: 1px solid #333; }
.ch-num { width: 60px; font-weight: bold; color: #aaa; white-space: nowrap; }
.ch-title a { color: inherit; text-decoration: none; }
.ch-title a:hover { color: #3a86ff; text-decoration: underline; }
</style>
{{ end }}
